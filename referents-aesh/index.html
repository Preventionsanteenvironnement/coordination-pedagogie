<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#0f766e">
<meta name="robots" content="noindex">
<title>Référents de pôle AESH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  Référents de pôle AESH (coordination-pedagogie/referents-aesh/)
  Un emploi du temps des AESH commun aux pôles PSR·MELEC, AGOrA, CAPa et Métiers d'Art.
  Firestore : coordination_referents_aesh (écriture) + coordination_estimation_aesh (lecture des besoins).
  Aucun prénom en ligne : les AESH sont des sigles. Aucune suppression : retraits datés + historique.
-->
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --card-2:#f7f9fb; --ink:#101828; --ink-2:#475467; --muted:#667085;
  --line:#e4e8ee; --line-2:#eef1f5;
  --accent:#0f766e; --accent-d:#0b5f59; --on-accent:#ffffff;
  --pole:#0f766e; --pole-l:color-mix(in srgb,var(--pole) 13%,var(--card)); --pole-b:color-mix(in srgb,var(--pole) 35%,var(--card));
  --ok:#15803d; --ok-l:#e7f6ec; --warn:#b45309; --warn-l:#fdf1e2; --err:#b42318; --err-l:#fdecea;
  --sh:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06); --sh-l:0 -10px 40px rgba(16,24,40,.18);
  --r:16px; --r-l:22px; --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
:root[data-fond="blanc"]{--bg:#ffffff;--card-2:#f6f8fa}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1016; --card:#131a23; --card-2:#18212c; --ink:#eef2f6; --ink-2:#b8c2cf; --muted:#8b97a7;
    --line:#243040; --line-2:#1c2632; --accent:#2dd4bf; --accent-d:#5eead4; --on-accent:#05201c;
    --ok:#4ade80; --ok-l:#10261a; --warn:#f5a524; --warn-l:#2a2012; --err:#f87171; --err-l:#2c1616;
    --sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark;
  }
  :root:not([data-theme="light"])[data-fond="blanc"]{--bg:#0b1016}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--pole);outline-offset:2px}
[hidden]{display:none!important}
.app{min-height:100vh;display:flex;flex-direction:column}

/* ── en-tête ── */
.tete{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.tete-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.rond{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:19px;color:var(--ink)}
.rond:hover{border-color:var(--pole)}
.marque{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.marque b{font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-pole{flex:none;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:.85rem;font-weight:700;background:var(--pole-l);color:var(--pole)}
.chip-pole i{width:8px;height:8px;border-radius:50%;background:var(--pole)}
.badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;border-radius:999px;background:var(--err);color:#fff;font-size:.72rem;font-weight:800;display:grid;place-items:center;padding:0 5px}
.rel{position:relative}
.onglets{max-width:1180px;margin:0 auto;display:flex;gap:2px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.onglets::-webkit-scrollbar{display:none}
.onglets button{flex:none;border:0;background:none;padding:10px 12px 11px;font-weight:650;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-size:.95rem}
.onglets button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--pole)}
.menu{position:absolute;right:16px;top:58px;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:6px;min-width:240px}
.menu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;border-radius:10px;padding:11px 12px;text-align:left;font-weight:600}
.menu button:hover{background:var(--card-2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}

.corps{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:20px 16px 110px;display:grid;gap:18px;align-content:start}
h1,h2,h3{margin:0;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:clamp(1.55rem,3.6vw,2.05rem);font-weight:800}
h2{font-size:1.2rem;font-weight:750}
.sous{color:var(--muted);margin:2px 0 0}
.ligne{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ecarte{justify-content:space-between}
.carte{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:16px 18px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ── boutons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:10px 18px;font-weight:700;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--pole)}
.btn.pri{background:var(--pole);border-color:var(--pole);color:#fff}
.btn.pri:hover{filter:brightness(1.06)}
.btn.valider{background:var(--ok);border-color:var(--ok);color:#fff;min-height:54px;font-size:1.05rem;box-shadow:0 6px 18px color-mix(in srgb,var(--ok) 35%,transparent)}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,var(--line))}
.btn.petit{min-height:36px;padding:6px 12px;border-radius:11px;font-size:.9rem}
.btn:disabled{opacity:.42;cursor:default;box-shadow:none}
.lien{border:0;background:none;padding:0;color:var(--pole);font-weight:650;text-decoration:underline;text-underline-offset:3px}
.puce{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:700;background:var(--card-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.puce.ok{background:var(--ok-l);color:var(--ok);border-color:transparent}
.puce.warn{background:var(--warn-l);color:var(--warn);border-color:transparent}
.puce.err{background:var(--err-l);color:var(--err);border-color:transparent}
.puce.pole{background:var(--pole-l);color:var(--pole);border-color:transparent}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font-weight:650;min-height:42px}
.choix button[aria-pressed="true"]{border-color:var(--pole);background:var(--pole-l);color:var(--pole)}

/* ── entrée : humeur et code ── */
.entree{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:28px 20px calc(28px + var(--safe-b));text-align:center;color:#fff;
  background:radial-gradient(1200px 600px at 20% -10%,#1aa392 0%,transparent 60%),linear-gradient(165deg,#0f766e 0%,#0b5f59 60%,#083f3c 100%)}
.entree h1{font-size:clamp(1.8rem,6vw,2.4rem);color:#fff}
.entree .sous{color:rgba(255,255,255,.82)}
.emos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;width:100%;max-width:440px}
.emos button{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.12);border-radius:18px;padding:12px 0 8px;color:#fff}
.emos button:hover,.emos button[aria-pressed="true"]{background:rgba(255,255,255,.28)}
.emos .e{display:block;font-size:2rem;line-height:1.2}.emos .l{display:block;font-size:.72rem;opacity:.85;margin-top:3px}
.pensee{max-width:30rem;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:18px 22px}
.pensee blockquote{margin:0;font-size:1.12rem;line-height:1.5;font-weight:500}
.pensee p{margin:8px 0 0;opacity:.8;font-size:.9rem}
.entree .btn{background:#fff;color:#0b5f59;border-color:#fff;min-width:200px}
.entree .lien{color:#fff}
.mot-humeur{min-height:1.5em;font-weight:650}
.plots{display:flex;gap:12px}
.plot{width:54px;height:64px;border-radius:15px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.26);display:grid;place-items:center;font-size:1.8rem;font-weight:800}
.plot.on{background:#fff;color:#0b5f59;border-color:#fff}
.plots.err{animation:secousse .38s}
@keyframes secousse{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}65%{transform:translateX(8px)}}
.pave{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pave button{height:62px;border-radius:17px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.16);font-size:1.45rem;font-weight:650;color:#fff}
.pave button:active{background:rgba(255,255,255,.32)}
.pave .fn{background:transparent;border-color:transparent;font-size:1.1rem}
.msg-code{min-height:1.4em;font-weight:650}

/* ── accueil ── */
.salut{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.semaine{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.semaine button{width:36px;height:36px;border-radius:50%;border:0;background:none;font-size:1.1rem;color:var(--ink)}
.semaine button:hover{background:var(--card-2)}
.semaine span{padding:0 8px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.semaine .ab{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--pole);color:#fff;font-size:.8rem;font-weight:800;margin-right:6px}
.semaine .ab.vac{background:var(--muted)}
.tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tuile{position:relative;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r-l);padding:18px 18px 16px;display:grid;gap:8px;min-height:150px;align-content:space-between;box-shadow:var(--sh);color:var(--ink)}
.tuile:hover{border-color:var(--pole);transform:translateY(-1px)}
.tuile .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--pole-l)}
.tuile b{font-size:1.2rem}
.tuile small{color:var(--muted);font-size:.9rem}
.tuile.forte{background:var(--pole);border-color:var(--pole);color:#fff}
.tuile.forte small{color:rgba(255,255,255,.85)}
.tuile.forte .ic{background:rgba(255,255,255,.18)}
.barre-p{height:8px;border-radius:999px;background:color-mix(in srgb,currentColor 18%,transparent);overflow:hidden}
.barre-p i{display:block;height:100%;background:currentColor;border-radius:999px}
.alertes{display:grid;gap:8px}
.alerte{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 14px;background:var(--err-l);color:var(--err);font-weight:650;border:0;text-align:left;width:100%}
.alerte .btn.petit{background:var(--card);color:var(--ink);border-color:transparent}
.alerte.warn{background:var(--warn-l);color:var(--warn)}

/* ── avatars ── */
.chip-av{border:0;padding:3px 12px 3px 3px;gap:8px;cursor:pointer}
.chip-av svg,.tete-av{border-radius:50%;flex:none}
.chip-av:hover{filter:brightness(1.05)}
.avatar{display:block;border-radius:50%}
.bulle{grid-template-columns:auto minmax(0,1fr);display:grid;gap:10px;align-items:start}
.bulle-av svg{width:36px;height:36px;border-radius:50%}
.bulle-corps{min-width:0}
.referents{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ref-tuile{display:grid;justify-items:center;gap:4px;border:1px solid var(--line);border-radius:16px;padding:12px 8px;background:var(--card);color:var(--ink);text-align:center}
.ref-tuile:hover{border-color:var(--pole)}
.ref-tuile svg,.ref-av{width:64px;height:64px;border-radius:50%}
.ref-tuile b{font-size:.95rem;color:var(--pole)}.ref-tuile small{color:var(--muted);font-size:.78rem}
.atelier-av{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:700px){.atelier-av{grid-template-columns:1fr}.av-grand{justify-items:center}}
.av-grand{display:grid;gap:12px;justify-items:center;position:sticky;top:110px}
.av-cadre{display:block;border:0;background:none;padding:0;border-radius:50%;box-shadow:var(--sh);cursor:pointer;width:200px;height:200px;overflow:hidden}
.av-cadre svg{width:100%;height:100%}
.av-opts{display:grid;gap:6px}
.av-opt{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.av-opt.ouvert{border-color:var(--pole)}
.av-titre{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:11px 14px;font-weight:700;color:var(--ink);text-align:left}
.av-titre .pt{display:inline-block;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);vertical-align:middle}
.av-puces{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.av-puces button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 11px;font-weight:600;font-size:.9rem;color:var(--ink)}
.av-puces button[aria-pressed="true"]{border-color:var(--pole);background:var(--pole-l);color:var(--pole)}
.av-puces .pcoul{width:34px;height:34px;padding:0;border-radius:50%;border:2px solid var(--line)}
.av-puces .pcoul[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--pole)}

/* ── mes AESH ── */
.liste{display:grid;gap:10px}
.aesh{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:12px 16px;box-shadow:var(--sh);color:var(--ink)}
.aesh:hover{border-color:var(--pole)}
.sigle{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1rem;background:var(--pole-l);color:var(--pole);letter-spacing:-.02em}
.sigle.grand{width:74px;height:74px;font-size:1.45rem}
.aesh .det{display:grid;gap:6px;min-width:0}
.jauge{height:10px;border-radius:999px;background:var(--line-2);display:flex;overflow:hidden}
.jauge i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:.8rem;color:var(--muted)}
.leg span{display:inline-flex;align-items:center;gap:5px}
.leg em{width:9px;height:9px;border-radius:3px;display:inline-block}
.aesh .droite{display:grid;justify-items:end;gap:5px}
.heures{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.heures small{font-weight:500;color:var(--muted)}
@media (max-width:560px){.aesh{grid-template-columns:46px minmax(0,1fr)}.aesh .droite{grid-column:1/-1;justify-items:start;display:flex;flex-wrap:wrap;gap:6px}.sigle{width:44px;height:44px;font-size:.9rem}}

/* ── fiche ── */
.fiche{display:grid;gap:16px;max-width:760px}
.champs{display:grid;border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden}
.champ{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line-2)}
.champ:last-child{border-bottom:0}
.champ .lib b{display:block;font-weight:650}
.champ .lib small{color:var(--muted)}
.champ.modif{background:color-mix(in srgb,var(--warn-l) 60%,var(--card))}
.pas{display:inline-flex;align-items:center;gap:6px}
.pas button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:1.2rem;font-weight:800}
.pas output,.pas input{min-width:62px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.pas input{width:70px;border:1.5px solid var(--line);border-radius:10px;padding:8px 6px;background:var(--card)}
.verrou{color:var(--muted);font-weight:650;white-space:nowrap}
input[type=text],input[type=date],select,textarea{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pole)}
.gros-champ{font-size:1.5rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;width:100%;max-width:260px}
.barre-bas{position:sticky;bottom:0;z-index:20;padding:12px 0 calc(12px + var(--safe-b));background:var(--bg);box-shadow:0 -10px 14px 6px var(--bg);display:flex;gap:10px;flex-wrap:wrap}
.barre-bas .btn{flex:1;min-width:150px}

/* ── emploi du temps ── */
.outils{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.classes{display:flex;gap:6px;flex-wrap:wrap}
.classes button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 13px;font-weight:700;min-height:42px}
.classes button[aria-pressed="true"]{background:var(--pole);border-color:var(--pole);color:#fff}
@media (max-width:560px){.classes{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}.classes::-webkit-scrollbar{display:none}.classes button{flex:none}}
.bandeau{border-radius:14px;padding:10px 14px;font-weight:650}
.bandeau.warn{background:var(--warn-l);color:var(--warn)}
.bandeau.info{background:var(--card-2);color:var(--ink-2);border:1px solid var(--line)}
.bandeau.err{background:var(--err-l);color:var(--err)}
.grille-edt{position:relative;display:grid;grid-template-columns:54px repeat(5,minmax(120px,1fr));min-width:760px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.defile{overflow-x:auto;border-radius:18px}
.g-tete{position:sticky;top:0;z-index:2;background:var(--card-2);border-bottom:1px solid var(--line);padding:9px 6px;text-align:center;font-weight:750;font-size:.9rem}
.g-tete small{display:block;color:var(--muted);font-weight:600;font-size:.78rem}
.g-heures{position:relative;border-right:1px solid var(--line-2);margin-block:12px}
.g-heures span{position:absolute;right:6px;font-size:.75rem;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.g-jour{position:relative;border-right:1px solid var(--line-2);margin-block:12px}
.g-jour:last-child{border-right:0}
.g-ligne{position:absolute;left:0;right:0;border-top:1px solid var(--line-2)}
.g-vac{position:absolute;inset:0;background:repeating-linear-gradient(135deg,var(--card-2) 0 10px,var(--bg) 10px 20px);display:grid;place-items:center;color:var(--muted);font-weight:700;text-align:center;padding:10px}
.g-vac.g-pfmp{background:repeating-linear-gradient(135deg,#FFD9A8 0 12px,#FFEBD1 12px 24px);color:#8A3F00;box-shadow:inset 0 0 0 2px #F08A24;font-size:1.05rem;letter-spacing:.02em}
.g-vac.g-pfmp small{display:block;font-weight:650;font-size:.8rem;margin-top:2px}
/* PFMP : l'emploi du temps reste visible, en filigrane (demande de Brahim, 17/09) */
.g-filigrane{position:absolute;inset:0;z-index:5;pointer-events:none;display:grid;align-content:start;justify-items:center;padding-top:10px;text-align:center;
  background:repeating-linear-gradient(135deg,rgba(255,217,168,.42) 0 12px,rgba(255,235,209,.42) 12px 24px);box-shadow:inset 0 0 0 2px rgba(240,138,36,.75)}
.g-filigrane b{display:block;font-size:1.7rem;font-weight:800;letter-spacing:.22em;color:rgba(138,63,0,.58);transform:rotate(-8deg)}
.g-filigrane small{display:block;margin-top:6px;font-weight:700;font-size:.74rem;color:rgba(138,63,0,.72)}
.leg-pfmp{display:inline-block;width:22px;height:14px;border-radius:4px;vertical-align:-2px;background:repeating-linear-gradient(135deg,#FFD9A8 0 5px,#FFEBD1 5px 10px);box-shadow:inset 0 0 0 1.5px #F08A24}
