  Un emploi du temps des AESH commun aux pôles PSR·MELEC, AGOrA, CAPa et Métiers d'Art.
  Firestore : coordination_referents_aesh (écriture) + coordination_estimation_aesh (lecture des besoins).
  Aucun prénom en ligne : les AESH sont des sigles. Aucune suppression : retraits datés + historique.

<body>
<div id="app" class="app"><p style="padding:30px;text-align:center;color:#667085">Chargement…</p></div>
<div id="annonce" class="sr" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">Cette page a besoin de JavaScript.</p></noscript>
<script type="module">
const firebaseConfig = {
  apiKey:"AIzaSyBj_GXG8ln3GAxNXxiJkT2HPSWIHJpc1lA", authDomain:"coordination-pedagogie.firebaseapp.com",
  projectId:"coordination-pedagogie", storageBucket:"coordination-pedagogie.firebasestorage.app",
  messagingSenderId:"526058585010", appId:"1:526058585010:web:ba4dd6d9c8281ba5bf02ab"
};
let FS = null, db = null, erreur = null, app = null;
try {
  FS = window.__FIRESTORE_SHIM__ || await import('https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js');

  if (!window.__FIRESTORE_SHIM__) {
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js');
    app = initializeApp(firebaseConfig, 'referents-aesh');
  }
  db = FS.getFirestore(app);
} catch (e) { erreur = e; }
try {
  const m = await import('./app.js?v=2026-09-27n');
  const {authentifierPlanning} = await import('./acces-planning.js?v=2026-09-25b');
  m.demarrer({ FS, db, erreur, modePlanning:new URLSearchParams(location.search).get('espace') === 'planning',
    ouvrirAccesPlanning:code => window.__FIRESTORE_SHIM__?.ouvrirAccesPlanning ? window.__FIRESTORE_SHIM__.ouvrirAccesPlanning(code) : authentifierPlanning(code,FS,db) });
} catch (e) {
  document.getElementById('app').innerHTML = '<p style="padding:30px;text-align:center">La page n’a pas pu se charger. Vérifiez la connexion puis rechargez.</p>';
  console.error(e);
}
</script>
