     Demande de Brahim : « un truc super simple, il clique les boutons, tac, tac, tac » ; « j'ai / il m'en faut » ; « on doit pouvoir modifier ».
     En ligne : classe, matière, jour, heure et les réponses. AUCUN nom (enseignant, élève, AESH), aucune salle.

<style>

.info h2{margin:0 0 6px;font-size:18px}.info p{margin:0;color:var(--doux);font-size:14.5px}

<body>
<header class="tete"><div class="in"><small>Lycée René Pellet · coordination</small><h1>Vos besoins en AESH</h1><p id="sous">Deux touches par cours, c’est tout.</p></div></header>
<main class="page" id="app"><div class="info"><h2>Chargement…</h2><p>Un instant.</p></div></main>
<script type="module">
const firebaseConfig={apiKey:"AIzaSyBj_GXG8ln3GAxNXxiJkT2HPSWIHJpc1lA",authDomain:"coordination-pedagogie.firebaseapp.com",projectId:"coordination-pedagogie",storageBucket:"coordination-pedagogie.firebasestorage.app",messagingSenderId:"526058585010",appId:"1:526058585010:web:ba4dd6d9c8281ba5bf02ab"};
const SONDAGE='besoins-aesh-2026';
const P=new URLSearchParams(location.search), CODE=(P.get('c')||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,''), DEMO=P.has('demo');
const JN=['Lundi','Mardi','Mercredi','Jeudi','Vendredi'], JC=['Lun','Mar','Mer','Jeu','Ven'];
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const heure=t=>{const m=/^(\d\d?):(\d\d)$/.exec(t||'');return m?(+m[1])+' h'+(m[2]==='00'?'':' '+m[2]):String(t||'');};
/* Les seules valeurs acceptées : rien d'autre n'est ni affiché ni enregistré. */
const AI=[0,'p',1,2,3], FAUT=[0,1,2,3,4], DRAPEAUX=['ponctuel','identique','termine'];
const bonAi=v=>AI.indexOf(v)>=0, bonFaut=v=>FAUT.indexOf(v)>=0;
const BON_ID=/^[A-Za-z][A-Za-z0-9]{0,30}$/;      /* (relecture de Codex) un identifiant de cours sert de nom de champ : lettres et chiffres seulement */

let F=null, ref=null, FS=null;                    // la fiche, sa référence
let jour=0, ouvert={}, vue='cours', etat={t:'',c:'att'}, animer=true;   // animer : seulement à l'arrivée et au changement de jour, jamais à chaque touche

function demo(){return {cours:[
  {i:'d0',j:0,d:'09:30',f:'10:30',m:'Maths',cls:['C2PSR'],sem:''},{i:'d1',j:0,d:'10:30',f:'11:30',m:'Maths',cls:['BTMELEC'],sem:''},
  {i:'d2',j:1,d:'08:30',f:'09:30',m:'Maths-sciences',cls:['C1CAN'],sem:''},{i:'d3',j:1,d:'10:30',f:'11:30',m:'Co-ens. maths',cls:['B1AGO1','B1AGO2'],sem:'A'},
  {i:'d4',j:1,d:'10:30',f:'11:30',m:'AP maths',cls:['B1AGO1','B1AGO2'],sem:'B'},{i:'d5',j:3,d:'14:00',f:'16:00',m:'Sciences',cls:['B2MELEC'],sem:''}],rep:{},ponctuel:false,identique:false,termine:false};}

async function empreinte(c){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('besoins-aesh:'+c));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
/* (relecture de Codex) la fiche est relue STRICTEMENT : jour entier de 0 à 4, identifiant propre et unique, oui/non vrais. Le reste est ignoré. */
function nettoyer(d){
  const vus={}, cours=[];
  (Array.isArray(d.cours)?d.cours:[]).forEach(c=>{
    if(!c||typeof c!=='object'||!BON_ID.test(String(c.i))||vus[c.i]||!Number.isInteger(c.j)||c.j<0||c.j>4)return;
    vus[c.i]=1;cours.push({i:String(c.i),j:c.j,d:String(c.d||''),f:String(c.f||''),m:String(c.m||''),cls:(Array.isArray(c.cls)?c.cls:[]).map(String),sem:c.sem==='A'||c.sem==='B'?c.sem:''});
  });
  const rep={}, brut=d.rep&&typeof d.rep==='object'?d.rep:{};
  cours.forEach(c=>{const r=brut[c.i];if(!r||typeof r!=='object')return;const o={};if(bonAi(r.ai))o.ai=r.ai;if(bonFaut(r.faut))o.faut=r.faut;if('ai' in o||'faut' in o)rep[c.i]=o;});
  return {cours,rep,ponctuel:d.ponctuel===true,identique:d.identique===true,termine:d.termine===true};
}

/* ---------- Ce qui n'est pas encore confirmé par la base ----------
   (relectures de Codex) Un seul journal, gardé dans le téléphone : champ → { v: valeur, t: instant de la touche, n: numéro unique de la touche }.
   - Une ligne n'en sort que lorsque la base a traité CETTE touche-là (même numéro).
   - La base garde, à côté de chaque valeur, l'instant de la touche (« aiLe », « fautLe »…). Un envoi n'écrit un champ que si sa touche est plus
     récente que celle déjà en base : un vieil envoi qui arrive en retard, un autre appareil, un second onglet ne peuvent plus écraser une réponse récente.
   - Le journal se modifie sous un verrou commun aux onglets (quand le navigateur le permet). */
const CLE='besoins-aesh:'+CODE;
let memoire={}, sansStockage=DEMO, db=null;
function journal(){if(sansStockage)return memoire;try{const j=JSON.parse(localStorage.getItem(CLE)||'{}');return j&&typeof j==='object'&&!Array.isArray(j)?j:{};}catch(e){sansStockage=true;return memoire;}}
function garder(j){memoire=j;if(sansStockage)return;try{if(Object.keys(j).length)localStorage.setItem(CLE,JSON.stringify(j));else localStorage.removeItem(CLE);}catch(e){sansStockage=true;}}   // stockage refusé : on continue en mémoire, pour de bon
function sousVerrou(fn){return navigator.locks&&navigator.locks.request?navigator.locks.request(CLE,fn):Promise.resolve().then(fn);}
function champValide(k,v){
  if(DRAPEAUX.indexOf(k)>=0)return typeof v==='boolean';
  const m=/^rep\.([A-Za-z][A-Za-z0-9]{0,30})\.(ai|faut)$/.exec(k);
  return !!m&&F.cours.some(c=>c.i===m[1])&&(m[2]==='ai'?bonAi(v):bonFaut(v));
}
function appliquer(k,v){if(DRAPEAUX.indexOf(k)>=0){F[k]=v;return;}const m=k.split('.');F.rep[m[1]]=Object.assign({},F.rep[m[1]],{[m[2]]:v});}
/* l'instant de la dernière touche connue de la base, pour un champ */
function instantEnBase(brut,k){let o=brut;const ch=(k+'Le').split('.');for(const x of ch){if(!o||typeof o!=='object')return '';o=o[x];}return typeof o==='string'?o:'';}
const ligneBonne=(k,x)=>!!x&&typeof x.t==='string'&&typeof x.n==='string'&&champValide(k,x.v);
const enAttente=()=>Object.keys(journal()).length>0||Object.keys(memoire).length>0;   // « memoire » couvre l'instant entre la touche et son écriture dans le journal

async function charger(){
  if(DEMO){F=demo();return 'ok';}
  if(CODE.length<8)return 'sans-code';
  try{
    if(!FS){const {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js');
      FS=await import('https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js');
      db=FS.getFirestore(initializeApp(firebaseConfig,'besoins-aesh'));
      ref=FS.doc(db,'coordination_sondages',SONDAGE,'fiches',await empreinte(CODE));}
    const d=await FS.getDocFromServer(ref);
    if(!d.exists())return 'inconnu';
    const brut=d.data();F=nettoyer(brut);
    /* ce qui n'avait pas pu partir : gardé et rejoué, sauf si la base connaît déjà une touche plus récente SUR CE CHAMP-LÀ */
    await sousVerrou(()=>{const j=journal(), garde={};
      Object.keys(j).forEach(k=>{const x=j[k];if(!ligneBonne(k,x))return;if(instantEnBase(brut,k)>=x.t)return;garde[k]=x;appliquer(k,x.v);});
      garder(garde);});
    return 'ok';
  }catch(e){console.warn(e);return 'hors-ligne';}
}

/* ---------- Enregistrement : chaque touche part tout de suite ---------- */
let enVol=false, essais=0, bloque=false, compteur=0;
function dire(t,c){etat={t,c};const e=$('#etat');if(e){e.textContent=t;e.className='etat '+c;}if(vue==='merci')rendre();}
function noter(champs){
  const t=new Date().toISOString(), lignes={};
  Object.keys(champs).forEach(k=>{lignes[k]={v:champs[k],t,n:t+'-'+(++compteur)+'-'+Math.random().toString(36).slice(2,8)};});
  memoire=Object.assign({},memoire,lignes);                       // visible tout de suite (écran « Envoi en cours »)
  sousVerrou(()=>{garder(Object.assign(journal(),lignes));}).then(envoyer,envoyer);
}
function attendre(p,ms){return Promise.race([p,new Promise((_,ko)=>setTimeout(()=>ko(Object.assign(new Error('délai'),{code:'delai'})),ms))]);}
async function envoyer(){
  if(DEMO){garder({});dire('Démonstration','att');return;}
  if(enVol||!ref||bloque)return;
  const lot=journal(), cles=Object.keys(lot).filter(k=>ligneBonne(k,lot[k]));
  if(!cles.length){if(Object.keys(lot).length)await sousVerrou(()=>{const j=journal();Object.keys(j).forEach(k=>{if(!ligneBonne(k,j[k]))delete j[k];});garder(j);});return;}
  enVol=true;dire('Enregistrement…','att');
  let gardees={};          /* (relecture de Codex) les champs où la base avait déjà une réponse plus récente : c'est ELLE qu'on affiche ensuite */
  try{
    /* Lecture puis écriture dans une même opération de la base : un champ n'est écrit que si cette touche est plus récente que celle en base. */
    await attendre(FS.runTransaction(db,async tx=>{
      const d=await tx.get(ref);if(!d.exists())throw Object.assign(new Error('fiche absente'),{code:'not-found'});
      const brut=d.data(), maj={};gardees={};
      cles.forEach(k=>{if(instantEnBase(brut,k)<lot[k].t){maj[k]=lot[k].v;maj[k+'Le']=lot[k].t;}else gardees[k]=k.split('.').reduce((o,x)=>o&&typeof o==='object'?o[x]:undefined,brut);});
      if(Object.keys(maj).length){maj.majLe=new Date().toISOString();tx.update(ref,maj);}
    }),15000);
    enVol=false;essais=0;
    await sousVerrou(()=>{const j=journal();cles.forEach(k=>{if(j[k]&&j[k].n===lot[k].n)delete j[k];});garder(j);});   // seulement les touches que la base vient de traiter
    const repris=Object.keys(gardees).filter(k=>champValide(k,gardees[k])&&!journal()[k]);
    repris.forEach(k=>appliquer(k,gardees[k]));
    if(enAttente())envoyer();else dire(repris.length?'À jour ✓ (modifié ailleurs)':'Enregistré ✓','ok');
    if(repris.length&&vue!=='merci')rendre();
  }catch(e){
    console.warn(e);enVol=false;
    if(['permission-denied','not-found','invalid-argument'].indexOf(e&&e.code)>=0){bloque=true;dire('Enregistrement impossible : rechargez la page','ko');return;}
    essais++;dire('Pas de réseau : nouvel essai…','ko');setTimeout(envoyer,Math.min(15000,1500*essais));
  }
}
window.addEventListener('online',()=>{if(F)envoyer();else demarrer();});
/* Un autre onglet a touché quelque chose : on reprend la fiche en ligne et le journal, puis on redessine (jamais d'écran en retard). */
let resync=null;
window.addEventListener('storage',e=>{if(e.key!==CLE||!F||DEMO)return;clearTimeout(resync);resync=setTimeout(async()=>{const r=await charger();if(r==='ok'){rendre();if(enAttente())envoyer();}},700);});

/* ---------- Affichage ---------- */
const fait=c=>{const r=F.rep[c.i];return !!r&&bonAi(r.ai)&&bonFaut(r.faut);};
const joursUtiles=()=>[0,1,2,3,4].filter(j=>F.cours.some(c=>c.j===j));
const duJour=j=>F.cours.filter(c=>c.j===j);
const nbFaits=l=>l.filter(fait).length;
const dit=v=>v===0?'aucune':v==='p'?'parfois':String(v);
function bilan(r){
  if(r.ai==='p')return r.faut>0?['Pas régulier','irr']:null;
  const m=r.faut-r.ai;
  if(m>0)return ['Il en manque '+m,'man'];
  if(m<0)return [(-m)+' en trop','tro'];
  return r.ai===0?null:['C’est bon','bon'];
}
function seg(c,cle,opts,cl,nom){
  const r=F.rep[c.i]||{};
  return '<div class="seg '+cl+'" role="group" aria-label="'+esc(nom+' — '+c.cls.join(' + ')+', '+heure(c.d))+'">'+opts.map(o=>'<button type="button" class="'+(o[0].length>1?'lg ':'')+(o[1]==='p'?'p ':'')+(r[cle]===o[1]?'on':'')+'" data-c="'+esc(c.i)+'" data-k="'+cle+'" data-v="'+o[1]+'" aria-pressed="'+(r[cle]===o[1])+'">'+o[0]+'</button>').join('')+'</div>';
}
function carte(c){
  const r=F.rep[c.i]||{}, titre=esc(c.cls.join(' + ')), hr=esc(heure(c.d)+' – '+heure(c.f)), ab=c.sem?'<span class="ab">Semaine '+c.sem+'</span>':'';
  if(fait(c)&&ouvert[c.i]!==true){
    const b=bilan(r);
    /* (relecture de Codex) l'heure reste visible sur la carte repliée : deux cours de la même classe le même jour se distinguent */
    return '<div class="carte repli" data-ouvrir="'+esc(c.i)+'" role="button" tabindex="0" aria-label="'+esc('Modifier '+c.cls.join(' + ')+', '+heure(c.d))+'"><div class="h"><span class="cl">'+titre+'</span>'+(b?'<span class="pil '+b[1]+'">'+b[0]+'</span>':'')+'</div>'+
      '<div class="ma">'+hr+' · '+esc(c.m)+ab+'</div><div class="res"><span>J’ai '+dit(r.ai)+' · il m’en faut '+dit(r.faut)+'</span><u>Modifier</u></div></div>';
  }
  return '<div class="carte"><div class="h"><span class="cl">'+titre+'</span><span class="hr">'+hr+'</span></div><div class="ma">'+esc(c.m)+ab+'</div>'+
    '<div class="lib">J’ai</div>'+seg(c,'ai',[['Aucune',0],['Parfois','p'],['1',1],['2',2],['3',3]],'a','J’ai')+
    '<div class="lib">Il m’en faut</div>'+seg(c,'faut',[['Aucune',0],['1',1],['2',2],['3',3],['4',4]],'f','Il m’en faut')+'</div>';
}
function rendre(retour){
  if(vue==='merci'){
    /* (relecture de Codex) « Merci » n'est affirmé qu'une fois TOUT confirmé par la base ; avant, on dit que l'envoi est en cours */
    const reste=enAttente()&&!DEMO;
    $('#sous').textContent=reste?'Encore un instant…':'Merci pour votre réponse.';
    app.innerHTML=reste&&bloque?'<div class="fin"><h2>Envoi impossible</h2><p role="status">'+(sansStockage?'Vos dernières réponses n’ont pas pu être enregistrées, et ce téléphone ne peut pas les garder. Ne fermez pas cette page : réessayez, ou notez vos réponses et prévenez le référent de votre pôle.':'Vos dernières réponses n’ont pas pu être enregistrées. Elles sont gardées dans ce téléphone : réessayez, ou rechargez la page.')+'</p><button type="button" class="gros" id="reessayer">Réessayer l’envoi</button>'+(sansStockage?'':'<button type="button" class="gros clair" id="recharger">Recharger la page</button>')+'<button type="button" class="gros clair" id="revoir">Revoir mes réponses</button></div>'+pied():reste?'<div class="fin"><h2>Envoi en cours…</h2><p role="status">'+esc(etat.c==='ko'?'Pas de réseau pour l’instant. Gardez cette page ouverte : l’envoi reprend tout seul.':'Vos réponses partent. Gardez cette page ouverte quelques secondes.')+'</p>'+
      '<button type="button" class="gros clair" id="revoir">Revoir mes réponses</button></div>'+pied():
      '<div class="fin"><div class="rond"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h2>Merci, c’est enregistré</h2>'+
      '<p role="status">Vos besoins sont transmis à la coordination.</p><p>Vous pouvez modifier vos réponses à tout moment avec ce même lien.</p>'+
      '<button type="button" class="gros clair" id="revoir">Revoir ou modifier mes réponses</button></div>'+pied();
    $('#revoir').onclick=()=>{vue='cours';animer=true;rendre();window.scrollTo(0,0);};
    const rc=$('#recharger');if(rc)rc.onclick=()=>location.reload();
    const re=$('#reessayer');if(re)re.onclick=()=>{bloque=false;essais=0;envoyer();};
    return;
  }
  $('#sous').textContent='Deux touches par cours, c’est tout.';
  const J=joursUtiles(), total=F.cours.length, n=nbFaits(F.cours), tout=n===total;
  if(J.indexOf(jour)<0)jour=J[0];
  const liste=duJour(jour), plein=nbFaits(liste)===liste.length, suivant=J.filter(j=>j!==jour&&nbFaits(duJour(j))<duJour(j).length)[0];
  let h='<div class="suivi"><div class="jauge"><div class="l"><span>'+(tout?'<b>Tout est renseigné</b>':'<b>'+n+'</b> cours sur '+total)+'</span><span id="etat" class="etat '+etat.c+'" role="status">'+esc(etat.t)+'</span></div><div class="rail"><i style="width:'+Math.round(n/total*100)+'%"></i></div></div></div>';
  h+='<div class="jours">'+J.map(j=>{const l=duJour(j),k=nbFaits(l),p=k===l.length;return '<button type="button" aria-pressed="'+(j===jour)+'" class="'+(j===jour?'on':p?'plein':'')+'" data-jour="'+j+'" aria-label="'+JN[j]+', '+k+' cours sur '+l.length+'"><b>'+JC[j]+'</b><span>'+(p?'✓':k+'/'+l.length)+'</span></button>';}).join('')+'</div>';
  h+='<h2 class="sr">'+JN[jour]+'</h2><div class="'+(animer?'anime':'')+'">'+liste.map(carte).join('')+'</div>';animer=false;
  h+='<p class="aide">« Parfois » : une AESH vient, mais pas à chaque fois. · Touchez « Aucune » si vous n’en avez pas ou n’en voulez pas.</p>';
  if(plein&&suivant!=null&&!tout)h+='<button type="button" class="gros" id="suite">'+JN[suivant]+' →</button>';
  if(tout)h+='<div class="tous"><h2>Pour tous vos cours</h2><p>Facultatif. Vous pouvez cocher les deux.</p>'+
    '<label class="coche"><input type="checkbox" id="ponctuel"'+(F.ponctuel?' checked':'')+'><span>J’accepte une AESH ponctuelle, même d’une autre filière</span></label>'+
    '<label class="coche"><input type="checkbox" id="identique"'+(F.identique?' checked':'')+'><span>De préférence toujours la même AESH</span></label></div>'+
    '<button type="button" class="gros" id="terminer">Terminer</button>';
  app.innerHTML=h+pied();
  app.querySelectorAll('[data-jour]').forEach(b=>b.onclick=()=>{jour=+b.dataset.jour;animer=true;rendre('[data-jour="'+jour+'"]');});
  app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
    const i=b.dataset.c,k=b.dataset.k,v=b.dataset.v==='p'?'p':+b.dataset.v;
    if(!F.cours.some(x=>x.i===i)||(k==='ai'&&!bonAi(v))||(k==='faut'&&!bonFaut(v))||(k!=='ai'&&k!=='faut'))return;
    F.rep[i]=Object.assign({},F.rep[i],{[k]:v});
    const c=F.cours.find(x=>x.i===i), replie=c&&fait(c);if(replie)ouvert[i]=false;
    noter({['rep.'+i+'.'+k]:v});
    /* (relecture de Codex) le clavier et les lecteurs d'écran gardent leur place après le redessin */
    rendre(replie?'[data-ouvrir="'+i+'"]':'.seg button[data-c="'+i+'"][data-k="'+k+'"][data-v="'+b.dataset.v+'"]');
  });
  app.querySelectorAll('[data-ouvrir]').forEach(d=>{const o=()=>{const i=d.dataset.ouvrir;ouvert[i]=true;rendre('.seg button[data-c="'+i+'"]');};d.onclick=o;d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();o();}};});
  const s=$('#suite');if(s)s.onclick=()=>{jour=suivant;animer=true;rendre();window.scrollTo({top:0,behavior:'smooth'});};
  DRAPEAUX.slice(0,2).forEach(k=>{const z=$('#'+k);if(z)z.onchange=()=>{F[k]=z.checked;noter({[k]:z.checked});};});
  const t=$('#terminer');if(t)t.onclick=()=>{F.termine=true;vue='merci';noter({termine:true});rendre();window.scrollTo(0,0);};
  if(retour){const e=app.querySelector(retour);if(e)try{e.focus({preventScroll:true});}catch(x){}}
}
function pied(){return '<p class="pied">Aucun nom n’est enregistré en ligne : seulement vos classes, vos horaires et vos réponses.<br>Une question ? Adressez-vous au référent de votre pôle.</p>';}
function message(t,p,bouton){$('#sous').textContent='';app.innerHTML='<div class="info"><h2>'+t+'</h2><p>'+p+'</p>'+(bouton?'<button type="button" class="gros" id="encore">Réessayer</button>':'')+'</div>';const b=$('#encore');if(b)b.onclick=demarrer;}

let enCours=false;
async function demarrer(){
  if(enCours)return;enCours=true;
  try{
    const r=await charger();
    if(r==='ok'&&F.cours.length){
      if(F.termine&&nbFaits(F.cours)===F.cours.length)vue='merci';
      const J=joursUtiles();jour=J.filter(j=>nbFaits(duJour(j))<duJour(j).length)[0];if(jour==null)jour=J[0];
      if(DEMO)etat={t:'Démonstration',c:'att'};
      rendre();if(enAttente())envoyer();
    }
    else if(r==='ok')message('Aucun cours à renseigner','Votre emploi du temps ne contient pas de cours pour cette enquête.');
    else if(r==='sans-code')message('Lien incomplet','Ouvrez le lien reçu par mail, en entier. Il est personnel.');
    else if(r==='inconnu')message('Lien inconnu','Ce lien n’est pas reconnu. Vérifiez qu’il est complet, ou demandez-le au référent de votre pôle.');
    /* (relecture de Codex) sans réseau, on peut réessayer : ce qui a déjà été touché est gardé dans le téléphone et repartira */
    else message('Pas de connexion','Impossible de charger vos cours pour l’instant. Ce que vous avez déjà répondu est gardé. La page réessaie dès que le réseau revient.',true);
  }finally{enCours=false;}
}
demarrer();
</script>
