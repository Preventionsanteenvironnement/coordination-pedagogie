<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f766e">
<title>Besoins d’accompagnement des élèves — pôle PSR / MELEC</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   Demandes AESH — pôle PSR / MELEC (page en ligne, enseignants)

   Lit   : referentiel_<année>, besoins_<année>, et toutes les demandes
           et déclarations de l'année (en direct).
   Écrit : demande_<id> (ponctuelle). Les anciennes déclarations regulier_<id> restent lues.
   Collection Firestore : coordination_demandes_aesh.
   Écran « Estimation des besoins en AESH » : module estimation.js,
   collection coordination_estimation_aesh (voir ce fichier).

   Aucun nom, nulle part : les élèves n'existent ici que par un code
   à 5 caractères. Voir LISEZMOI.md.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --bg:#f4f6f8; --card:#ffffff; --card-2:#f8fafb;
  --ink:#111827; --ink-2:#374151; --muted:#4b5563;
  --line:#c9d1da; --line-2:#e3e8ee;
  --accent:#0f766e; --accent-d:#0b5f59; --accent-l:#e3f3ef; --on-accent:#ffffff;
  --focus:#1d4ed8;
  --warn-bg:#fff4d6; --warn-ink:#6b3b00; --warn-line:#b45309;
  --err-bg:#fdecec; --err-ink:#8f1d1d; --err-line:#b91c1c;
  --ok-bg:#e5f4ea; --ok-ink:#14532d; --ok-line:#15803d;
  --info-bg:#e8f0fe; --info-ink:#1e3a8a; --info-line:#1d4ed8;
  --r:14px; --r-s:10px;
  --sh:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1217; --card:#161d25; --card-2:#1b242e;
  --ink:#f1f5f9; --ink-2:#d6dee8; --muted:#b9c4d0;
  --line:#3a4757; --line-2:#26313d;
  --accent:#2dd4bf; --accent-d:#5eead4; --accent-l:#0f2e2b; --on-accent:#04211e;
  --focus:#93c5fd;
  --warn-bg:#3a2a08; --warn-ink:#fde68a; --warn-line:#f59e0b;
  --err-bg:#3b1414; --err-ink:#fecaca; --err-line:#f87171;
  --ok-bg:#0f2e1c; --ok-ink:#bbf7d0; --ok-line:#4ade80;
  --info-bg:#132341; --info-ink:#c7d8fe; --info-line:#60a5fa;
  --sh:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{font-size:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{line-height:1.25;margin:0}
h1{font-size:1.625rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.3rem;font-weight:750}
h3{font-size:1.15rem;font-weight:700}
h4{font-size:1rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus,h3[tabindex="-1"]:focus,main:focus{outline:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.evitement{position:absolute;left:8px;top:-60px;background:var(--card);color:var(--ink);padding:10px 14px;border-radius:var(--r-s);z-index:50;border:2px solid var(--focus)}
.evitement:focus{top:8px}
code,.code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.06em;font-weight:700}

/* ───────── barre ───────── */
.barre{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;box-shadow:var(--sh)}
.barre-in{max-width:1180px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.retour{color:var(--accent-d);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:10px 4px;min-height:44px;display:inline-flex;align-items:center}
.barre nav{display:flex;gap:8px;flex-wrap:wrap}
.lien-nav{min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:700}
.lien-nav[aria-current="page"]{background:var(--accent-l);border-color:var(--accent);color:var(--accent-d)}

main{max-width:1180px;margin:0 auto;padding:20px 16px calc(48px + env(safe-area-inset-bottom,0px))}
main:focus{outline:none}
.pile>*+*{margin-top:18px}

/* ───────── blocs ───────── */
.carte-bloc{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.rgpd{border-left:5px solid var(--accent);background:var(--accent-l);color:var(--ink);padding:12px 14px;border-radius:var(--r-s)}
.message{border:2px solid;border-radius:var(--r-s);padding:12px 14px}
.message>*+*{margin-top:8px}
.message.err{background:var(--err-bg);color:var(--err-ink);border-color:var(--err-line)}
.message.warn{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn-line)}
.message.ok{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-line)}
.message.info{background:var(--info-bg);color:var(--info-ink);border-color:var(--info-line)}
.message a{color:inherit;font-weight:700}
.avert{color:var(--warn-ink);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:var(--r-s);padding:8px 12px}
.discret{color:var(--muted)}

/* ───────── cartes d'accueil ───────── */
.cartes{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.cartes{grid-template-columns:repeat(2,1fr)}}
@media(min-width:980px){.cartes{grid-template-columns:repeat(3,1fr)}}
.carte{width:100%;min-height:92px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--sh)}
.carte:hover:not(:disabled){border-color:var(--accent)}
.carte:disabled{cursor:not-allowed;opacity:.65}
.carte-t{font-size:1.15rem;font-weight:800;color:var(--ink)}
.carte-s{color:var(--muted)}
.carte.large{background:var(--accent-l);border-color:var(--accent)}

/* ───────── boutons ───────── */
.btn{min-height:48px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primaire{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primaire:hover:not(:disabled){background:var(--accent-d);border-color:var(--accent-d)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.petit{min-height:44px;padding:8px 14px}
.lien{background:none;border:0;padding:8px 2px;min-height:44px;color:var(--accent-d);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:22px}
.actions .droite{margin-left:auto}

/* ───────── étapes ───────── */
.etapes{list-style:none;margin:12px 0 0;padding:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.etapes li{flex:none;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);white-space:nowrap}
.etapes li.faite{color:var(--ink-2)}
.etapes li.faite::before{content:"✓ "}
.etapes li[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}

/* ───────── formulaires ───────── */
fieldset{border:1px solid var(--line-2);border-radius:var(--r);padding:12px 14px 14px;margin:0;min-width:0}
legend{font-weight:750;padding:0 6px;font-size:1.05rem}
.champ{display:flex;flex-direction:column;gap:4px;min-width:0}
.champ>label,.label{font-weight:650}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r-s);background:var(--card);font-size:1rem}
textarea{min-height:110px;resize:vertical}
input[aria-invalid="true"],textarea[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--err-line);border-width:2.5px}
.err-champ{color:var(--err-ink);font-weight:650}
.err-champ::before{content:"⚠ "}
.options{display:grid;gap:8px;grid-template-columns:1fr}
@media(min-width:640px){.options.deux{grid-template-columns:repeat(2,1fr)}}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r-s);background:var(--card);min-height:48px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-l)}
.opt input{width:1.3rem;height:1.3rem;margin:.1rem 0 0;flex:none;accent-color:var(--accent)}
.opt .sous{display:block;color:var(--muted)}
.grille-ligne{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.grille-ligne .large2{grid-column:1 / -1}
@media(min-width:760px){.grille-ligne{grid-template-columns:1.4fr 1fr 1fr 1fr 1fr}.grille-ligne .large2{grid-column:auto}}
.ligne+.ligne{margin-top:12px}

/* ───────── élèves ───────── */
.eleves{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:760px){.eleves{grid-template-columns:repeat(2,1fr)}}
.eleve{border:1.5px solid var(--line);border-radius:var(--r-s);padding:10px 12px;background:var(--card)}
.eleve.coche{border-color:var(--accent);background:var(--accent-l)}
.eleve-tete{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.eleve-tete label{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.eleve-tete input{width:1.35rem;height:1.35rem;accent-color:var(--accent)}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;border:1.5px solid var(--ink-2);color:var(--ink);background:var(--card);font-weight:700;white-space:nowrap}
.badge.notif{border-color:var(--info-line);background:var(--info-bg);color:var(--info-ink)}
.badge.plan{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn-ink)}
.puces{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.puce{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);cursor:pointer}
.puce:has(input:checked){border-color:var(--accent);background:var(--accent-l);font-weight:700}
.puce input{width:1.2rem;height:1.2rem;accent-color:var(--accent);margin:0}
.indice{color:var(--muted);margin-top:6px}

/* ───────── emploi du temps ───────── */
.semaine-nav{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;margin:8px 0 12px}
.semaine-nav h3{flex:1 1 220px;text-align:center}
.semaine{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:700px){.semaine{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1100px){.semaine{grid-template-columns:repeat(5,minmax(0,1fr))}}
.jour-col{background:var(--card-2);border:1px solid var(--line-2);border-radius:var(--r);padding:10px}
.jour-col h4{padding:2px 2px 8px;border-bottom:1px solid var(--line-2);margin-bottom:8px}
.jour-col h4::first-letter,.cr legend::first-letter,.grille-jour::first-letter{text-transform:uppercase}
.jour-col ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.cren{border:1.5px solid var(--line);border-radius:var(--r-s);background:var(--card);padding:8px 10px}
.cren .h{font-weight:800;font-variant-numeric:tabular-nums}
.cren.mien{border:3px solid var(--accent);background:var(--accent-l)}
.cren.mien .etiq{display:inline-block;font-weight:800;color:var(--accent-d)}
.cren.chev{border:3px dashed var(--warn-line);background:var(--warn-bg);color:var(--warn-ink)}
.cren .alerte-chev{display:block;font-weight:800;margin-top:4px}
.jour-vide{color:var(--muted);padding:4px 2px}
.statut{display:inline-block;font-weight:700}
.cren{overflow-wrap:anywhere;min-width:0}
.statut::before{content:attr(data-icone) " "}

/* ───────── régulier ───────── */
.grille-cr{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:900px){.grille-cr{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cr{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r)}
.cr.besoin-pos{border-color:var(--accent);border-width:2.5px}
.cr legend{font-size:1.05rem}
.places{margin:2px 0 8px;font-weight:650}
.radios-besoin{display:flex;flex-wrap:wrap;gap:8px}
.radios-besoin label{display:inline-flex;align-items:center;gap:8px;min-height:44px;min-width:64px;padding:6px 14px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer;background:var(--card)}
.radios-besoin label:has(input:checked){border-color:var(--accent);background:var(--accent-l);font-weight:800}
.radios-besoin input{width:1.2rem;height:1.2rem;accent-color:var(--accent);margin:0}
.sous-bloc{margin-top:12px}

/* ───────── liste du pôle ───────── */
.filtres{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:760px){.filtres{grid-template-columns:repeat(3,1fr)}}
.liste-pole{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:12px}
.dem{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.dem-tete{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between}
.dem ul{margin:8px 0 0;padding-left:1.2rem}
.dem .rep{margin-top:8px;border-left:4px solid var(--ok-line);padding-left:10px}
.pastille-statut{padding:2px 10px;border-radius:999px;border:1.5px solid var(--line);font-weight:750;white-space:nowrap}
.pastille-statut[data-statut="accordee"]{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok-ink)}
.pastille-statut[data-statut="refusee"]{border-color:var(--err-line);background:var(--err-bg);color:var(--err-ink)}
.pastille-statut[data-statut="partielle"],.pastille-statut[data-statut="a-revoir"]{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn-ink)}
.pastille-statut[data-statut="nouvelle"],.pastille-statut[data-statut="vue"]{border-color:var(--info-line);background:var(--info-bg);color:var(--info-ink)}
dl.recap{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0}
dl.recap dt{font-weight:700}
dl.recap dd{margin:0}
.tableau-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{border-bottom:1px solid var(--line-2);padding:8px 10px;text-align:left;vertical-align:top}
th{font-weight:750}

/* ═══════════ Habillage 2026-09 : plus sobre, plus lisible ═══════════ */
:root{
  --bg:#f2f4f7; --card:#ffffff; --card-2:#f7f9fb;
  --ink:#0f172a; --ink-2:#334155; --muted:#5b6878;
  --line:#d3dae3; --line-2:#e5eaf0;
  --accent:#0d5c61; --accent-d:#09474b; --accent-l:#e6f1f0; --on-accent:#ffffff;
  --r:16px; --r-s:12px;
  --sh:0 1px 2px rgba(15,23,42,.05),0 10px 28px -16px rgba(15,23,42,.18);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1016; --card:#131a22; --card-2:#18212b;
  --ink:#f1f5f9; --ink-2:#d3dbe5; --muted:#a8b4c2;
  --line:#344150; --line-2:#222c37;
  --accent:#5ec8c1; --accent-d:#8ad9d3; --accent-l:#10302e; --on-accent:#04201e;
  --sh:0 1px 2px rgba(0,0,0,.45);
}}
body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;letter-spacing:-.003em}
h1{font-size:clamp(1.55rem,3.4vw,2.15rem);font-weight:760;letter-spacing:-.022em}
h2{font-size:1.2rem;font-weight:720;letter-spacing:-.012em}
.barre{background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line-2);box-shadow:none}
@media (prefers-color-scheme:dark){.barre{background:rgba(19,26,34,.92)}}
.barre-in{padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:6px}
.marque{display:flex;flex-direction:column;line-height:1.15}
.marque b{font-size:.98rem;font-weight:760;letter-spacing:-.01em;color:var(--ink)}
.marque .retour{padding:2px 0;min-height:0;font-size:.85rem;font-weight:600;text-decoration:none;color:var(--muted)}
.marque .retour:hover{color:var(--accent-d);text-decoration:underline}
.lien-nav{border:1px solid transparent;background:transparent;font-weight:650;color:var(--ink-2)}
.lien-nav:hover{background:var(--card-2)}
.lien-nav[aria-current="page"]{background:var(--accent-l);border-color:transparent;color:var(--accent-d)}
.carte-bloc{border-radius:var(--r)}
.rgpd{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line-2);border-left:4px solid var(--accent);border-radius:12px;box-shadow:var(--sh)}
.btn{border-radius:12px;border:1px solid var(--line);box-shadow:0 1px 1px rgba(15,23,42,.04);font-weight:650}
.btn.primaire{box-shadow:0 6px 16px -8px rgba(13,92,97,.55)}
/* ── accueil v3 « Besoins d'accompagnement des élèves » (15/09/2026) ── */
.hero .sur{font-size:1rem;font-weight:720;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-d)}
.hero h1{font-size:clamp(1.75rem,4vw,2.5rem);line-height:1.15;letter-spacing:-.02em;margin-top:6px;max-width:24ch}
.hero p.chapo{color:var(--ink-2);font-size:1.1rem;max-width:64ch;margin-top:12px}
.hero p.public{color:var(--muted);font-size:1rem;margin-top:8px}
.hero p.public strong{color:var(--ink-2)}
section[aria-labelledby="h-estimation"],section[aria-labelledby="h-ponctuel"]{margin-top:18px}
.bloc-t{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px}
.bloc-t h2{font-size:1.3rem;margin:0}
.bloc-t .n{font-size:1rem;color:var(--muted);font-weight:600}
.est-acc{margin-top:14px;display:grid;grid-template-columns:1fr;background:var(--card);border:1px solid var(--line-2);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
@media(min-width:760px){.est-acc{grid-template-columns:1.35fr 1fr}}
.est-acc .g{padding:22px}
.est-acc .d{padding:22px;background:var(--accent-l);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:10px;border-top:1px solid var(--line-2)}
@media(min-width:760px){.est-acc .d{border-top:0;border-left:1px solid var(--line-2)}}
.est-acc h3{font-size:1.25rem;margin:0}
.est-acc .puces{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--ink-2);font-size:1rem}
.est-acc .puces li::before{content:"✓ ";color:var(--accent-d);font-weight:800}
.est-acc .etat{font-size:1rem;color:var(--ink-2);margin:0}
.est-acc .etat strong{color:var(--ink)}
@media(max-width:520px){.est-acc .d .btn{width:100%}}
.cartes{gap:12px;margin-top:14px}
@media(min-width:560px){.cartes{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.cartes{grid-template-columns:repeat(3,1fr)}}
.carte,.carte-info{height:100%;border:1px solid var(--line-2);border-radius:14px;padding:16px;display:flex;flex-direction:row;align-items:flex-start;gap:12px;text-align:left}
.carte{transition:transform .15s,box-shadow .15s,border-color .15s}
.carte:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px);box-shadow:0 14px 28px -18px rgba(15,23,42,.35)}

<script type="module">
/* ═══════════════ Firebase ═══════════════ */
const firebaseConfig = {
  apiKey:"AIzaSyAWdCMvOiAJln3eT9LIAQD3RWJUD0lQcLI", authDomain:"devoirs-pse.firebaseapp.com",
  projectId:"devoirs-pse", storageBucket:"devoirs-pse.firebasestorage.app",
  messagingSenderId:"614730413904", appId:"1:614730413904:web:a5dd478af5de30f6bede55"
};
const COL = 'coordination_demandes_aesh';
const SOURCE = 'demandes-aesh';
const DELAI_MS = 15000;
const K_BROUILLONS = 'demandes-aesh-brouillons-v1';
const K_CACHE = 'demandes-aesh-cache-v1';

function anneeScolaire(d = new Date()){
  const y = d.getFullYear();
  return d.getMonth() >= 7 ? `${y}-${y+1}` : `${y-1}-${y}`;
}
const ANNEE = anneeScolaire();

let FS = null, db = null, erreurChargement = null;
try {
  FS = window.__FIRESTORE_SHIM__ || await import('https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js');
  let app = null;
  if (!window.__FIRESTORE_SHIM__){
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js');
    app = initializeApp(firebaseConfig, 'demandes-aesh');
  }
  db = FS.getFirestore(app);
} catch(e){ erreurChargement = e; }

/* ═══════════════ outils ═══════════════ */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RE_CODE = /^[A-HJKMNP-Z2-9]{5}$/;
const RE_DATE = /^\d{4}-\d{2}-\d{2}$/;
const RE_HEURE = /^([01]\d|2[0-3]):[0-5]\d$/;
const JOURS = ['lun','mar','mer','jeu','ven'];
const JOURS_LONG = {lun:'lundi',mar:'mardi',mer:'mercredi',jeu:'jeudi',ven:'vendredi'};
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

const PARITE = {A:'Semaine A', B:'Semaine B', '':'Toutes les semaines'};
const STATUTS = {
  'nouvelle':{label:'Nouvelle', icone:'●'},
  'vue':{label:'Vue par la coordination', icone:'👁'},
  'accordee':{label:'Accordée', icone:'✓'},
  'partielle':{label:'Accordée en partie', icone:'◐'},
  'refusee':{label:'Non accordée', icone:'✗'},
  'a-revoir':{label:'À revoir', icone:'↺'}
};
const NATURES_DEFAUT = [
  {id:'positionnement',label:'Test de positionnement'},{id:'ccf',label:'CCF'},{id:'bacblanc',label:'Bac blanc'},
  {id:'evaluation',label:'Évaluation'},{id:'sortie',label:'Sortie'},{id:'autre',label:'Autre'}
];
/* Les tests de positionnement passent par RESANA (décision du 14/09/2026) : plus proposés ici. */
const NATURES_RETIREES = ['positionnement'];
/* « Bac blanc » (15/09/2026) : ajouté même si le référentiel publié plus tôt ne le contient pas encore, à sa place par défaut. */
const naturesProposees = liste => {
  const l = (liste || []).filter(n => !NATURES_RETIREES.includes(n.id));
  NATURES_DEFAUT.forEach((n, i) => {
    if (NATURES_RETIREES.includes(n.id) || l.some(x => x.id === n.id)) return;
    const avant = NATURES_DEFAUT.slice(0, i).map(x => x.id).reverse().find(id => l.some(x => x.id === id));
    l.splice(avant ? l.findIndex(x => x.id === avant) + 1 : 0, 0, n);
  });
  return l;
};
const NATURE_ICONES = {ccf:'📝', bacblanc:'🎓', evaluation:'✏️', sortie:'🧭', autre:'➕'};
const NATURE_SOUS = {
  positionnement:'Tests de début d’année ou de formation',
  ccf:'Contrôle en cours de formation',
  bacblanc:'Épreuves blanches',
  evaluation:'Devoir, évaluation écrite ou pratique',
  sortie:'Sortie, visite, activité hors de la classe',
  autre:'Tout autre besoin ponctuel'
};
const BESOINS_DEFAUT = [
  {id:'tiersTemps',label:'1/3 temps'},{id:'lecteur',label:'Lecteur'},{id:'scripteur',label:'Scripteur'},
  {id:'assistant',label:'Assistant'},{id:'ordinateur',label:'Ordinateur'},{id:'sujetAgrandi',label:'Sujet agrandi'}
];
const AIDES_DEFAUT = [
  {id:'ecrit',label:'Écrit / prise de notes'},{id:'lecture',label:'Lecture'},
  {id:'consignes',label:'Compréhension des consignes'},{id:'attention',label:'Attention / concentration'},
  {id:'manipulation',label:'Manipulation / TP'},{id:'deplacements',label:'Déplacements'},{id:'autre',label:'Autre'}
];
const AVERT_NOM = '⚠ N’écrivez aucun nom : ni élève, ni enseignant, ni AESH. Utilisez les codes.';

const z2 = n => String(n).padStart(2,'0');
const isoLocal = (d = new Date()) => `${d.getFullYear()}-${z2(d.getMonth()+1)}-${z2(d.getDate())}`;
function dateValide(s){
  if (!RE_DATE.test(s || '')) return false;
  const [y,m,d] = s.split('-').map(Number);
  const dt = new Date(Date.UTC(y,m-1,d));
  return dt.getUTCFullYear() === y && dt.getUTCMonth() === m-1 && dt.getUTCDate() === d;
}
const ajouteJours = (iso, n) => { const [y,m,d] = iso.split('-').map(Number); return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10); };
const joursemaine = iso => { const [y,m,d] = iso.split('-').map(Number); return (new Date(Date.UTC(y,m-1,d)).getUTCDay() + 6) % 7; }; // lundi = 0
const lundiDe = iso => ajouteJours(iso, -joursemaine(iso));
const minutes = h => { const [a,b] = h.split(':').map(Number); return a*60 + b; };
const NOMS_JOURS = ['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
function dateLongue(iso){ if (!dateValide(iso)) return iso || ''; const [y,m,d] = iso.split('-').map(Number); return `${NOMS_JOURS[joursemaine(iso)]} ${d} ${MOIS[m-1]} ${y}`; }
function dateSansAn(iso){ if (!dateValide(iso)) return iso || ''; const [,m,d] = iso.split('-').map(Number); return `${NOMS_JOURS[joursemaine(iso)]} ${d} ${MOIS[m-1]}`; }
function dateHeure(isoComplet){ const d = new Date(isoComplet); if (isNaN(d)) return ''; return `${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()} à ${z2(d.getHours())} h ${z2(d.getMinutes())}`; }
function titreSemaine(lundi){
  const ven = ajouteJours(lundi, 4);
  const [y1,m1,d1] = lundi.split('-').map(Number), [y2,m2,d2] = ven.split('-').map(Number);
  if (m1 === m2) return `Semaine du lundi ${d1} au vendredi ${d2} ${MOIS[m2-1]} ${y2}`;
  if (y1 === y2) return `Semaine du lundi ${d1} ${MOIS[m1-1]} au vendredi ${d2} ${MOIS[m2-1]} ${y2}`;
  return `Semaine du lundi ${d1} ${MOIS[m1-1]} ${y1} au vendredi ${d2} ${MOIS[m2-1]} ${y2}`;
}
const nettoie = (v, max) => String(v ?? '').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g,'').trim().slice(0, max);
function nouvelId(prefixe){
  const a = 'abcdefghijklmnopqrstuvwxyz0123456789';
  const r = crypto.getRandomValues(new Uint8Array(4));
  return `${prefixe}_${Date.now().toString(36)}${[...r].map(x => a[x % 36]).join('')}`;
}
const pluriel = (n, un, plusieurs) => `${n} ${n > 1 ? plusieurs : un}`;
function annonce(t){ const a = $('#annonce'); a.textContent = ''; setTimeout(() => { a.textContent = t; }, 30); }
function avecDelai(promesse, ms){
  let t;
  return Promise.race([
    promesse,
    new Promise((_, rej) => { t = setTimeout(() => { const e = new Error('Délai dépassé : pas de réponse du serveur.'); e.code = 'delai'; rej(e); }, ms); })
  ]).finally(() => clearTimeout(t));
}
function typeErreur(e){
  const t = `${(e && e.code) || ''} ${(e && e.message) || ''}`;
  if (/permission|PERMISSION_DENIED|insufficient/i.test(t)) return 'refus';
  if (navigator.onLine === false || /unavailable|offline|network|delai|fetch|dynamically imported/i.test(t)) return 'horsligne';
  return 'autre';
}
const lsLit = (k, def) => { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v ?? def; } catch(e){ return def; } };
const lsEcrit = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } };

/* ═══════════════ état ═══════════════ */
const S = {
  ecran:'accueil',
  refEtat:'chargement', ref:null, refCache:false,
  besoins:{}, besoinsEtat:'chargement',
  docs:[], docsEtat:'chargement', unsub:null,
  p:null, r:null, envoye:null, envoi:null,
  filtre:{type:'', classe:'', statut:''},
  focus:null, reessaiEnCours:false, messageReessai:''
};
let uidLigne = 0;

/* ═══════════════ référentiel ═══════════════ */
function normaliserReferentiel(d){
  if (!d || !Array.isArray(d.classes)) return null;
  const liste = (v, def) => Array.isArray(v) && v.length ? v.filter(x => x && typeof x.id === 'string').map(x => ({id:x.id, label:String(x.label || x.id)})) : def;
  const classes = d.classes.filter(c => c && typeof c.nom === 'string').map(c => {
    const creneaux = (Array.isArray(c.creneaux) ? c.creneaux : []).filter(x => x && JOURS.includes(x.jour) && RE_HEURE.test(x.debut) && RE_HEURE.test(x.fin) && typeof x.matiere === 'string')
      .map(x => {
        const parite = ['A','B'].includes(x.parite) ? x.parite : '';
        return { cle: x.cle || [x.jour,x.debut,x.fin,x.matiere,parite].join('|'), jour:x.jour, debut:x.debut, fin:x.fin, matiere:x.matiere, parite,
                 aeshPlaces: Number.isInteger(x.aeshPlaces) && x.aeshPlaces >= 0 ? x.aeshPlaces : 0 };
      })
      .sort((a,b) => JOURS.indexOf(a.jour) - JOURS.indexOf(b.jour) || a.debut.localeCompare(b.debut) || a.parite.localeCompare(b.parite));
    const matieres = [...new Set([...(Array.isArray(c.matieres) ? c.matieres.filter(m => typeof m === 'string') : []), ...creneaux.map(x => x.matiere)])];
    return { nom:c.nom, label:String(c.label || c.nom), pole:String(c.pole || ''), matieres,
             codes:[...new Set((Array.isArray(c.codes) ? c.codes : []).filter(x => RE_CODE.test(x)))], creneaux };
  }).sort((a,b) => (ORDRE_CLASSES.indexOf(a.nom) + 99) % 99 - (ORDRE_CLASSES.indexOf(b.nom) + 99) % 99);
  if (!classes.length) return null;
  return { annee:d.annee, majLe:d.majLe || '', placementsSemaine:d.placementsSemaine || '',
           natures:liste(d.natures, NATURES_DEFAUT), besoinsExamen:liste(d.besoinsExamen, BESOINS_DEFAUT), aides:liste(d.aides, AIDES_DEFAUT), classes };
}
const classe = nom => (S.ref && S.ref.classes.find(c => c.nom === nom)) || null;
const natureLabel = id => ((S.ref ? S.ref.natures : NATURES_DEFAUT).find(n => n.id === id) || {label:id || '—'}).label;
const besoinsListe = () => S.ref ? S.ref.besoinsExamen : BESOINS_DEFAUT;
const aidesListe = () => S.ref ? S.ref.aides : AIDES_DEFAUT;
const besoinLabel = id => (besoinsListe().find(b => b.id === id) || {label:id}).label;
const aideLabel = id => (aidesListe().find(b => b.id === id) || {label:id}).label;
const toutesMatieres = () => {
  const s = []; (S.ref ? S.ref.classes : []).forEach(c => c.matieres.forEach(m => { if (!s.includes(m)) s.push(m); }));
  return s.sort((a,b) => a.localeCompare(b,'fr'));
};
const infoBesoins = code => { const b = S.besoins[code]; return b && typeof b === 'object' ? b : null; };

async function chargerReference(){
  S.refEtat = 'chargement'; S.besoinsEtat = 'chargement';
  if (S.ecran === 'accueil') rendre();
  const cache = lsLit(K_CACHE, null);
  try {
    const snap = await avecDelai(FS.getDoc(FS.doc(db, COL, `referentiel_${ANNEE}`)), DELAI_MS);
    if (!snap.exists()){ S.ref = null; S.refEtat = 'absent'; }
    else {
      const r = normaliserReferentiel(snap.data());
      S.ref = r; S.refEtat = r ? 'ok' : 'invalide'; S.refCache = false;
      if (r) lsEcrit(K_CACHE, {...(lsLit(K_CACHE, {}) || {}), annee:ANNEE, ref:snap.data()});
    }
  } catch(e){
    const t = typeErreur(e);
    if (t !== 'refus' && cache && cache.annee === ANNEE && cache.ref && normaliserReferentiel(cache.ref)){
      S.ref = normaliserReferentiel(cache.ref); S.refEtat = 'ok'; S.refCache = true;
    } else { S.ref = null; S.refEtat = t === 'refus' ? 'refus' : 'horsligne'; }
  }
  try {
    const snap = await avecDelai(FS.getDoc(FS.doc(db, COL, `besoins_${ANNEE}`)), DELAI_MS);
    if (snap.exists()){
      const d = snap.data(); S.besoins = d && d.eleves && typeof d.eleves === 'object' ? d.eleves : {}; S.besoinsEtat = 'ok';
      lsEcrit(K_CACHE, {...(lsLit(K_CACHE, {}) || {}), annee:ANNEE, besoins:S.besoins});
    } else { S.besoins = {}; S.besoinsEtat = 'absent'; }
  } catch(e){
    const c = lsLit(K_CACHE, null);
    if (typeErreur(e) !== 'refus' && c && c.annee === ANNEE && c.besoins){ S.besoins = c.besoins; S.besoinsEtat = 'ok'; }
    else { S.besoins = {}; S.besoinsEtat = typeErreur(e) === 'refus' ? 'refus' : 'horsligne'; }
  }
  await chargerPeriodeEstimation();
  rendre();
}
/* Période de l'estimation (nom, début, fin) affichée sur l'accueil ; silencieuse en cas d'échec. */
async function chargerPeriodeEstimation(){
  try {
    const snap = await avecDelai(FS.getDoc(FS.doc(db, 'coordination_estimation_aesh', `cadre_${ANNEE}`)), DELAI_MS);
    const p = snap.exists() && snap.data() && snap.data().periode;
    S.cadreEst = p && RE_DATE.test(p.debut || '') && RE_DATE.test(p.fin || '') ? { label: String(p.label || 'Période').slice(0, 40), debut: p.debut, fin: p.fin } : null;
  } catch(e){ S.cadreEst = null; }
}

/* ═══════════════ demandes du pôle (en direct) ═══════════════ */
function ecouterDemandes(){
  if (S.unsub) return;
  S.docsEtat = 'chargement';
  try {
    const q = FS.query(FS.collection(db, COL), FS.where('type', 'in', ['demande','regulier']));
    S.unsub = FS.onSnapshot(q, snap => {
      const l = [];
      snap.forEach(d => { const x = d.data(); if (x && x.annee === ANNEE) l.push({...x, id: x.id || d.id}); });
      S.docs = l; S.docsEtat = 'ok';
      majVuesDocs();
    }, err => {
      S.unsub = null; S.docsEtat = typeErreur(err) === 'refus' ? 'refus' : 'horsligne';
      majVuesDocs();
    });
  } catch(e){ S.unsub = null; S.docsEtat = typeErreur(e) === 'refus' ? 'refus' : 'horsligne'; }
}
function majVuesDocs(){
  if (S.ecran === 'pole'){ const z = $('#zone-liste'); if (z){ z.innerHTML = htmlListePole(); return; } }
  if (S.ecran === 'ponctuel' && S.p && S.p.etape === 5){ const z = $('#zone-pole'); if (z){ remplaceEnGardantFocus(z, htmlZonePole()); return; } }
  if (S.ecran === 'regulier' && S.r && S.r.etape === 3 && !S.r.precedente && !S.r.modifie){
    if (appliquerPrecedente(S.r)){ rendre(); annonce('Votre dernière déclaration a été retrouvée : le formulaire est prérempli.'); return; }
  }
  if (S.ecran === 'accueil'){ const z = $('#compte-pole'); if (z) z.textContent = texteComptePole(); }
}
function remplaceEnGardantFocus(zone, html){
  const a = document.activeElement, id = a && zone.contains(a) ? a.id : null;
  zone.innerHTML = html;
  if (id){ const el = document.getElementById(id); if (el) el.focus({preventScroll:true}); }
}
function texteComptePole(){
  if (S.docsEtat !== 'ok') return S.docsEtat === 'chargement' ? 'Chargement…' : 'Liste indisponible pour le moment';
  const n = S.docs.length;
  return n ? `${pluriel(n,'demande ou déclaration','demandes et déclarations')} cette année` : 'Aucune demande pour l’instant';
}

/* ═══════════════ brouillons (envois en attente) ═══════════════ */
const brouillons = () => { const l = lsLit(K_BROUILLONS, []); return Array.isArray(l) ? l.filter(d => d && d.id && d.type) : []; };
function garderBrouillon(d){ const l = brouillons().filter(x => x.id !== d.id); l.push(d); return lsEcrit(K_BROUILLONS, l); }
function retirerBrouillon(id){ lsEcrit(K_BROUILLONS, brouillons().filter(x => x.id !== id)); }

function messageErreurEnvoi(type, garde){
  const g = garde ? ' Votre saisie est gardée sur cet appareil (brouillon) : elle n’est pas encore envoyée.' : ' Attention : l’appareil n’a pas pu garder la saisie (mémoire pleine ou navigation privée). Ne quittez pas cette page.';
  if (type === 'refus') return 'Espace en cours d’ouverture par la coordination : l’envoi n’est pas encore autorisé.' + g + ' Réessayez plus tard.';
  if (type === 'horsligne') return 'Pas de connexion au serveur.' + g + ' Appuyez sur « Réessayer » quand le réseau revient.';
  return 'L’envoi n’a pas abouti.' + g + ' Réessayez dans un instant.';
}

async function envoyer(d){
  const ancien = S.envoi && S.envoi.docId;
  if (ancien && ancien !== d.id) retirerBrouillon(ancien);   // une nouvelle version remplace l'essai précédent
  S.envoi = {etat:'encours', docId:d.id};
  majEnvoiEtat();
  if (navigator.onLine === false){
    const g = garderBrouillon(d);
    S.envoi = {etat:'horsligne', docId:d.id, message:messageErreurEnvoi('horsligne', g)};
    majEnvoiEtat(true); return;
  }
  try {
    await avecDelai(FS.setDoc(FS.doc(db, COL, d.id), d), DELAI_MS);
    retirerBrouillon(d.id);
    succes(d);
  } catch(e){
    const t = typeErreur(e), g = garderBrouillon(d);
    S.envoi = {etat:t, docId:d.id, message:messageErreurEnvoi(t, g)};
    majEnvoiEtat(true);
  }
}
function succes(d){
  S.envoye = d; S.envoi = null;
  if (d.type === 'demande') S.p = null; else S.r = null;
  if (!S.docs.some(x => x.id === d.id)) S.docs = [...S.docs, d];
  S.ecran = 'envoye'; S.focus = 'titre-ecran';
  rendre();
  annonce(d.type === 'demande' ? 'Demande envoyée.' : 'Déclaration envoyée.');
}
function htmlEnvoiEtat(){
  const e = S.envoi;
  if (!e) return '';
  if (e.etat === 'encours') return `<p class="message info">Envoi en cours…</p>`;

async function reessayer(){
  const l = brouillons();
  if (!l.length || S.reessaiEnCours) return;
  S.reessaiEnCours = true; S.messageReessai = 'Nouvel essai en cours…';
  majEnvoiEtat(); majBandeauBrouillons();
  const envoyes = []; let derniere = null;
  for (const d of l){
    try {
      const snap = await avecDelai(FS.getDoc(FS.doc(db, COL, d.id)), DELAI_MS);
      if (!snap.exists()) await avecDelai(FS.setDoc(FS.doc(db, COL, d.id), d), DELAI_MS); // déjà arrivé : on ne réécrit pas
      retirerBrouillon(d.id); envoyes.push(d);
    } catch(e){ derniere = e; }
  }
  S.reessaiEnCours = false;
  const courant = S.envoi && envoyes.find(d => d.id === S.envoi.docId);
  if (courant){ S.messageReessai = ''; succes(courant); return; }
  const reste = brouillons().length;
  if (derniere){
    const t = typeErreur(derniere);
    if (S.envoi) S.envoi = {...S.envoi, etat:t, message:messageErreurEnvoi(t, true)};
    S.messageReessai = (envoyes.length ? `${pluriel(envoyes.length,'envoi réussi','envois réussis')}. ` : '') +
      `${pluriel(reste,'envoi reste','envois restent')} en attente : ${t === 'refus' ? 'accès pas encore ouvert' : t === 'horsligne' ? 'toujours pas de connexion' : 'erreur du serveur'}.`;
  } else S.messageReessai = envoyes.length ? `${pluriel(envoyes.length,'envoi réussi','envois réussis')} : plus rien en attente.` : '';
  majEnvoiEtat(true); majBandeauBrouillons();
  annonce(S.messageReessai);
}

function ordreClassesP(p){ return (S.ref ? S.ref.classes.map(c => c.nom) : []).filter(n => p.classes.includes(n)); }

function validerP(p, etape){
  const e = [];
  if (etape === 1){
    if (!(S.ref.natures.some(n => n.id === p.nature))) e.push({id:'p-nature-0', msg:'Choisissez la nature de la demande.'});
    if (p.nature === 'autre' && !nettoie(p.natureAutre, 80)) e.push({id:'p-nature-autre', msg:'Précisez la nature de la demande.'});
    if (!p.matiereChoix) e.push({id:'p-matiere-0', msg:'Choisissez la matière.'});
    else if (p.matiereChoix === '__autre' && !nettoie(p.matiereAutre, 60)) e.push({id:'p-matiere-autre', msg:'Écrivez le nom de la matière.'});
  }
  if (etape === 2 && !p.classes.length) e.push({id:`p-classe-${S.ref.classes[0].nom}`, msg:'Choisissez au moins une classe.'});
  if (etape === 3){
    const aujourdhui = isoLocal();
    const total = ordreClassesP(p).reduce((n, nom) => n + (p.lignes[nom] || []).length, 0);
    if (total > 40) e.push({id:`p-ajout-${ordreClassesP(p)[0]}`, msg:`Une demande compte au plus 40 créneaux (ici ${total}) : faites deux demandes.`});
    for (const nom of ordreClassesP(p)){
      const lignes = p.lignes[nom] || [];
      if (!lignes.length) e.push({id:`p-ajout-${nom}`, msg:`${nom} : ajoutez au moins un créneau.`});
      lignes.forEach((l, i) => {
        const pre = `${nom}, créneau ${i+1} : `, id = k => `l-${l.uid}-${k}`;
        if (!dateValide(l.date)) e.push({id:id('date'), msg:pre + 'date manquante ou invalide (format jour/mois/année).'});
        else if (joursemaine(l.date) > 4) e.push({id:id('date'), msg:pre + 'la date tombe un samedi ou un dimanche.'});
        else if (l.date < aujourdhui) e.push({id:id('date'), msg:pre + 'la date est déjà passée.'});
        if (!RE_HEURE.test(l.debut)) e.push({id:id('debut'), msg:pre + 'heure de début manquante ou invalide.'});
        if (!RE_HEURE.test(l.fin)) e.push({id:id('fin'), msg:pre + 'heure de fin manquante ou invalide.'});
        if (RE_HEURE.test(l.debut) && RE_HEURE.test(l.fin) && minutes(l.debut) >= minutes(l.fin)) e.push({id:id('fin'), msg:pre + 'l’heure de fin doit être après l’heure de début.'});
        const n = String(l.nbAesh).trim();
        if (!/^\d+$/.test(n)) e.push({id:id('nbAesh'), msg:pre + 'le nombre d’AESH doit être un nombre entier (0, 1, 2…).'});
        else if (Number(n) > 20) e.push({id:id('nbAesh'), msg:pre + 'le nombre d’AESH ne peut pas dépasser 20.'});
        if (String(l.salle).length > 20) e.push({id:id('salle'), msg:pre + 'la salle doit tenir en 20 caractères.'});
      });
    }
  }
  if (etape === 6 && String(p.commentaire).length > 600) e.push({id:'p-commentaire', msg:'Le commentaire doit tenir en 600 caractères.'});
  return e;
}

function mesLignes(p){
  const out = [];
  for (const nom of ordreClassesP(p)){
    const nbEl = Object.values(p.eleves[nom] || {}).filter(x => x.concerne).length;
    for (const l of p.lignes[nom] || []){
      if (dateValide(l.date) && RE_HEURE.test(l.debut) && RE_HEURE.test(l.fin) && minutes(l.debut) < minutes(l.fin))
        out.push({classe:nom, date:l.date, debut:l.debut, fin:l.fin, salle:l.salle, nbAesh:l.nbAesh, nbEleves:nbEl, uid:l.uid});
    }
  }
  return out.sort((a,b) => a.date.localeCompare(b.date) || a.debut.localeCompare(b.debut));
}
function lignesExistantes(){
  const out = [];
  for (const d of S.docs){
    if (d.type !== 'demande' || !Array.isArray(d.lignes)) continue;
    d.lignes.forEach((l, i) => {
      if (l && dateValide(l.date) && RE_HEURE.test(l.debut) && RE_HEURE.test(l.fin)) out.push({doc:d, l, i});
    });
  }
  return out;
}
const chevauche = (a, b) => a.date === b.date && minutes(a.debut) < minutes(b.fin) && minutes(b.debut) < minutes(a.fin);

}

    ${semaines.length > 1 ? `<p style="margin-top:12px">Vos semaines : ${semaines.map(s => `<button type="button" class="btn petit" data-action="p-semaine" data-lundi="${s}" ${s === lundi ? 'aria-pressed="true"' : 'aria-pressed="false"'}>${esc(dateSansAn(s))}</button>`).join(' ')}</p>` : ''}

      <h3 id="titre-semaine" aria-live="polite">${esc(titreSemaine(lundi))}</h3>

    ${htmlSemaine(lundi, ex, miennes)}`;
}

function construireDemande(p){
  const now = new Date().toISOString();
  const lignes = [];
  for (const nom of ordreClassesP(p)){
    const eleves = classe(nom).codes.filter(c => p.eleves[nom][c] && p.eleves[nom][c].concerne).map(code => {
      const s = p.eleves[nom][code];
      return {code, besoins: besoinsListe().map(b => b.id).filter(id => s.besoins.includes(id)), note: nettoie(s.note, 120)};
    });
    for (const l of p.lignes[nom]){
      lignes.push({classe:nom, date:l.date, debut:l.debut, fin:l.fin, salle:nettoie(l.salle, 20), nbAesh:parseInt(String(l.nbAesh).trim(), 10),
                   eleves: eleves.map(x => ({code:x.code, besoins:[...x.besoins], note:x.note}))});
    }
  }
  lignes.sort((a,b) => a.date.localeCompare(b.date) || a.debut.localeCompare(b.debut) || ORDRE_CLASSES.indexOf(a.classe) - ORDRE_CLASSES.indexOf(b.classe));
  return {
    id:nouvelId('demande'), type:'demande', annee:ANNEE,
    nature:p.nature, natureAutre: p.nature === 'autre' ? nettoie(p.natureAutre, 80) : '',
    matiere:matiereP(p), commentaire:nettoie(p.commentaire, 600), lignes,
    statut:'nouvelle', reponse:{statut:'', texte:'', aeshConfirmes:null, majLe:''},
    creeLe:now, majLe:now, source:SOURCE
  };
}

const ETAPES_R = ['Matière','Classe','Créneaux de la semaine','Envoi'];
function nouveauRegulier(){
  S.r = { etape:1, matiere:'', classe:'', grille:'', creneaux:{}, aPartirDu:isoLocal(), commentaire:'', precedente:null, ignores:0, modifie:false, erreurs:[] };
  S.envoi = null; S.ecran = 'regulier'; S.focus = 'titre-ecran'; rendre();

const creneauxDe = (nom, matiere) => (classe(nom)?.creneaux || []).filter(c => c.matiere === matiere);
const classesAvec = matiere => (S.ref ? S.ref.classes : []).filter(c => c.creneaux.some(x => x.matiere === matiere));
function derniereDeclaration(nom, matiere){
  return S.docs.filter(d => d.type === 'regulier' && d.classe === nom && d.matiere === matiere)
    .sort((a,b) => String(b.creeLe || '').localeCompare(String(a.creeLe || '')))[0] || null;
}
function initGrille(r){
  r.grille = `${r.classe}|${r.matiere}`; r.creneaux = {}; r.precedente = null; r.ignores = 0; r.modifie = false; r.commentaire = ''; r.aPartirDu = isoLocal();
  creneauxDe(r.classe, r.matiere).forEach(c => { r.creneaux[c.cle] = {besoin:0, eleves:{}, note:''}; });
  appliquerPrecedente(r);

function appliquerPrecedente(r){
  const d = derniereDeclaration(r.classe, r.matiere);
  if (!d) return false;
  const codes = classe(r.classe).codes, aides = aidesListe().map(a => a.id);
  let ignores = 0;
  for (const c of Array.isArray(d.creneaux) ? d.creneaux : []){
    const s = c && r.creneaux[c.cle];
    if (!s){ ignores++; continue; }
    s.besoin = Number.isInteger(c.besoin) ? Math.max(0, Math.min(3, c.besoin)) : 0;
    s.eleves = {};
    (Array.isArray(c.eleves) ? c.eleves : []).forEach(e => { if (e && codes.includes(e.code)) s.eleves[e.code] = (Array.isArray(e.aides) ? e.aides : []).filter(a => aides.includes(a)); });
    s.note = nettoie(c.note, 120);
  }
  r.precedente = {id:d.id, creeLe:d.creeLe, statut:d.statut, aPartirDu:d.aPartirDu};
  r.ignores = ignores;
  r.commentaire = nettoie(d.commentaire, 600);
  r.aPartirDu = dateValide(d.aPartirDu) && d.aPartirDu > isoLocal() ? d.aPartirDu : isoLocal();
  return true;
}
function validerR(r, etape){
  const e = [];
  if (etape === 1 && !r.matiere) e.push({id:'r-matiere-0', msg:'Choisissez la matière.'});
  if (etape === 2 && !r.classe) e.push({id:'r-classe-0', msg:'Choisissez la classe.'});
  if (etape === 3){
    const l = creneauxDe(r.classe, r.matiere);
    if (!l.length) e.push({id:'titre-etape', msg:'Aucun créneau de cette matière dans l’emploi du temps publié pour cette classe.'});
    if (l.length > 60) e.push({id:'titre-etape', msg:'Plus de 60 créneaux : la déclaration ne peut pas être envoyée. Prévenez la coordination.'});
    l.forEach((c, i) => { const s = r.creneaux[c.cle]; if (!s || ![0,1,2,3].includes(s.besoin)) e.push({id:`r-${i}-b0`, msg:`${JOURS_LONG[c.jour]} ${c.debut} : choisissez le besoin.`}); });
  }
  if (etape === 4){
    if (!dateValide(r.aPartirDu)) e.push({id:'r-apartir', msg:'Date « à partir du » manquante ou invalide.'});
    if (String(r.commentaire).length > 600) e.push({id:'r-commentaire', msg:'Le commentaire doit tenir en 600 caractères.'});
  }
  return e;
}
function allerEtapeR(n){
  const r = S.r;
  if (n > r.etape){
    for (let k = r.etape; k < n; k++){
      const e = validerR(r, k);
      if (e.length){ r.etape = k; r.erreurs = e; S.focus = 'resume-erreurs'; rendre(); return; }
    }
  }
  r.erreurs = []; r.etape = n;
  if (n === 3 && r.grille !== `${r.classe}|${r.matiere}`) initGrille(r);
  S.focus = 'titre-etape'; rendre();
}

  'p-ajout-ligne': b => {
    const nom = b.dataset.classe, l = nouvelleLigne(), prec = S.p.lignes[nom].at(-1);
    if (prec){ l.date = prec.date; l.salle = prec.salle; l.nbAesh = prec.nbAesh; }
    S.p.lignes[nom].push(l); S.focus = `l-${l.uid}-date`; rendre(); annonce(`Créneau ajouté pour ${nom}.`);
  },
  'p-retire-ligne': b => {
    const nom = b.dataset.classe, uid = Number(b.dataset.uid);
    S.p.lignes[nom] = S.p.lignes[nom].filter(l => l.uid !== uid);
    S.p.erreurs = S.p.erreurs.filter(e => !e.id.startsWith(`l-${uid}-`));
    S.focus = `p-ajout-${nom}`; rendre(); annonce(`Créneau retiré pour ${nom}.`);
  },
  'p-semaine': b => { S.p.semaine = b.dataset.lundi; const z = $('#zone-pole'); if (z){ remplaceEnGardantFocus(z, htmlZonePole()); const t = $('#titre-semaine'); if (t && !z.contains(document.activeElement)){ t.tabIndex = -1; t.focus(); } } },
  'envoyer-ponctuelle': () => {
    const e = validerP(S.p, 6); if (e.length){ S.p.erreurs = e; S.focus = 'resume-erreurs'; rendre(); return; }
    for (let k = 1; k <= 5; k++){ const ek = validerP(S.p, k); if (ek.length){ S.p.etape = k; S.p.erreurs = ek; S.focus = 'resume-erreurs'; rendre(); return; } }
    envoyer(construireDemande(S.p));
  },
  'r-suivant': () => allerEtapeR(S.r.etape + 1),
  'r-precedent': () => allerEtapeR(S.r.etape - 1),
  'r-reporter': b => {
    const r = S.r, liste = creneauxDe(r.classe, r.matiere), src = r.creneaux[liste[+b.dataset.i].cle];
    let n = 0;
    liste.forEach((c, i) => { if (i === +b.dataset.i) return; const s = r.creneaux[c.cle]; s.eleves = JSON.parse(JSON.stringify(src.eleves)); n++; });
    r.modifie = true; rendre(); annonce(`Élèves et aides copiés sur ${pluriel(n,'autre créneau','autres créneaux')}. Ils ne sont envoyés que pour les créneaux avec un besoin.`);
  },
  'envoyer-regulier': () => {
    for (let k = 1; k <= 4; k++){ const ek = validerR(S.r, k); if (ek.length){ S.r.etape = k; S.r.erreurs = ek; S.focus = 'resume-erreurs'; rendre(); return; } }
    envoyer(construireRegulier(S.r));
  }
};
document.addEventListener('click', ev => {
  const lienErr = ev.target.closest('a[data-focus]');
  if (lienErr){ ev.preventDefault(); const el = document.getElementById(lienErr.dataset.focus); if (el){ el.focus(); el.scrollIntoView({block:'center'}); } return; }
  const b = ev.target.closest('button[data-action]');
  if (!b || b.disabled) return;
  const f = actions[b.dataset.action];
  if (f) f(b, ev);
});
function champ(t, type){
  const c = t.dataset && t.dataset.champ; if (!c) return;
  const p = S.p, r = S.r;
  switch (c){
    case 'p-nature': if (type === 'change' && t.checked){ p.nature = t.value; rendre(); } break;
    case 'p-nature-autre': p.natureAutre = t.value; break;
    case 'p-matiere': if (type === 'change' && t.checked){ p.matiereChoix = t.value; if (t.value === '__autre') S.focus = 'p-matiere-autre'; rendre(); } break;
    case 'p-matiere-autre': p.matiereAutre = t.value; break;
    case 'p-classe': if (type === 'change'){
      if (t.checked){ if (!p.classes.includes(t.value)) p.classes.push(t.value); initClasseP(p, t.value); }
      else p.classes = p.classes.filter(x => x !== t.value);
      rendre(); } break;
    case 'l-champ': { const l = (p.lignes[t.dataset.classe] || []).find(x => x.uid === Number(t.dataset.uid)); if (l) l[t.dataset.k] = t.value; break; }
    case 'e-concerne': if (type === 'change'){ p.eleves[t.dataset.classe][t.dataset.code].concerne = t.checked; rendre(); } break;
    case 'e-besoin': if (type === 'change'){
      const s = p.eleves[t.dataset.classe][t.dataset.code];
      s.besoins = t.checked ? [...new Set([...s.besoins, t.dataset.b])] : s.besoins.filter(x => x !== t.dataset.b); } break;
    case 'e-note': p.eleves[t.dataset.classe][t.dataset.code].note = t.value; break;
    case 'p-commentaire': p.commentaire = t.value; break;
    case 'r-matiere': if (type === 'change' && t.checked){ r.matiere = t.value; if (r.classe && !classesAvec(r.matiere).some(c => c.nom === r.classe)) r.classe = ''; if (classesAvec(r.matiere).length === 1) r.classe = classesAvec(r.matiere)[0].nom; rendre(); } break;
    case 'r-classe': if (type === 'change' && t.checked){ r.classe = t.value; rendre(); } break;
    case 'r-besoin': if (type === 'change' && t.checked){ const cr = creneauxDe(r.classe, r.matiere)[+t.dataset.i]; r.creneaux[cr.cle].besoin = Number(t.value); r.modifie = true; rendre(); } break;
    case 'r-eleve': if (type === 'change'){
      const s = r.creneaux[creneauxDe(r.classe, r.matiere)[+t.dataset.i].cle];
      if (t.checked) s.eleves[t.dataset.code] = s.eleves[t.dataset.code] || []; else delete s.eleves[t.dataset.code];
      r.modifie = true; rendre(); } break;
    case 'r-aide': if (type === 'change'){
      const s = r.creneaux[creneauxDe(r.classe, r.matiere)[+t.dataset.i].cle], code = t.dataset.code;
      s.eleves[code] = t.checked ? [...new Set([...(s.eleves[code] || []), t.dataset.a])] : (s.eleves[code] || []).filter(x => x !== t.dataset.a);
      r.modifie = true; } break;
    case 'r-note': { r.creneaux[creneauxDe(r.classe, r.matiere)[+t.dataset.i].cle].note = t.value; r.modifie = true; break; }
    case 'r-apartir': r.aPartirDu = t.value; break;
    case 'r-commentaire': r.commentaire = t.value; break;
    case 'f-type': case 'f-classe': case 'f-statut':
      if (type === 'change'){ S.filtre[c.slice(2)] = t.value; const z = $('#zone-liste'); if (z) z.innerHTML = htmlListePole(); } break;
  }
}
vue.addEventListener('input', ev => champ(ev.target, 'input'));
vue.addEventListener('change', ev => champ(ev.target, 'change'));
window.addEventListener('online', () => { if (brouillons().length) reessayer(); if (!S.unsub) { ecouterDemandes(); majVuesDocs(); } if (S.refEtat === 'horsligne') chargerReference(); });

/* ═══════════════ démarrage ═══════════════ */
if (erreurChargement) rendre();
else {
  rendre();
  ecouterDemandes();
  await chargerReference();
}
try { if (!history.state) history.replaceState({ ecran:'accueil', est:null }, ''); } catch(e){}
window.__DEMANDES_AESH_PRET__ = true;
</script>
