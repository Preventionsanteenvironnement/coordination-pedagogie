function htmlGroupe(g){

vue.addEventListener('click', ev => {

  if (a === 'valider'){ valider(+v); return; }
  if (a === 'annuler'){ annuler(+v); return; }
  if (a === 'aller'){ if (+v !== S.etape){ if (S.etape !== 6 && S.snap && JSON.stringify(S.snap) !== JSON.stringify(S.f) && S.ok[S.etape]){ /* changements non validés d'une étape déjà validée : on les garde, l'étape reste à valider */ S.ok[S.etape] = false; } ouvrir(+v); } rendre(); focusEtape(); return; }
  if (a === 'retirer-groupe'){ f.groupes = f.groupes.filter(g => g.id !== v); f.seances = f.seances.filter(s => s.classe !== v); }
  else if (a === 'ajout-autre'){ const t = nettoie(f.classeAutre, 60); if (!t) return; const id = 'autre:' + t; if (!groupe(id)) ajouterGroupe(id, [], t); f.choix = ''; f.classeAutre = ''; }
  else if (a === 'nb-oui'){ const g = groupe(v); if (g){ g.nb = String(cG(g).propose); g.nbTouche = true; f.seances.forEach(s => { if (s.classe === g.id) s.nbAesh = g.nb; }); } }
  else if (a === 'nature') f.nature = v;
  else if (a === 'forme') f.forme = v;
  else if (a === 'int-tous'){ const t = f.groupes[0] && f.groupes[0].intitule; f.groupes.forEach(g => { g.intitule = t || ''; }); }
  else if (a === 'ajout'){ const p = [...f.seances].reverse().find(s => s.classe === v), s = nouvelleSeance(v); if (p){ s.duree = p.duree; s.salle = p.salle; s.tiers = p.tiers; s.nbAesh = p.nbAesh; } s.ouvert = true; s.nbAesh = p ? p.nbAesh : s.nbAesh; f.seances.push(s); rendre(); setTimeout(() => $(`#s${s.uid}-date`)?.focus(), 0); return; }
  else if (a === 'sur-cours'){ const [gid, cid, date] = v.split('|'), c = S.edt.cours[cid] || Object.values(S.edt.cours).find(x => x.id === cid), s = nouvelleSeance(gid); s.date = date; if (c) poserCours(s, c); f.seances.push(s); }
  else if (a === 'seance-ok'){ const s = seance(v); if (s){ s.essai = true; if (!controleSeance(s).length){ s.valide = true; s.ouvert = false; s.propose = false; s.essai = false; } } }
  else if (a === 'seance-rouvrir'){ const s = seance(v); if (s){ s.valide = false; s.ouvert = true; } }
  else if (a === 'classe-finie'){ const g = groupe(v); if (g){ g.fini = true; if (!classeCourante()){ valider(4); return; } } }
  else if (a === 'classe-rouvrir'){ const g = groupe(v); if (g){ g.fini = false; S.f.groupes.forEach(x => { if (S.f.groupes.indexOf(x) < S.f.groupes.indexOf(g) && !x.fini) x.fini = true; }); } }
  else if (a === 'nb-moins' || a === 'nb-plus'){ const s = seance(v); if (s) s.nbAesh = String(Math.max(0, Math.min(12, (parseInt(s.nbAesh, 10) || 0) + (a === 'nb-plus' ? 1 : -1)))); }
  else if (a === 'date-cours'){ const [u, d, cid] = v.split('|'), s = seance(u), c = S.edt.cours[cid] || Object.values(S.edt.cours).find(x => x.id === cid); if (s){ s.date = d; if (c) poserCours(s, c); } }
  else if (a === 'deplier'){ const s = seance(v); if (s) s.ouvert = true; }
  else if (a === 'replier'){ const s = seance(v); if (s){ s.ouvert = false; s.propose = false; } }
  else if (a === 'retirer') f.seances = f.seances.filter(s => s.uid !== +v);
  else if (a === 'cours'){ const [u, j] = v.split('|'), s = seance(u), c = s && coursDuJourG(groupe(s.classe), s.date)[+j]; if (c) poserCours(s, c); }
  else if (a === 'duree'){ const [u, d] = v.split('|'), s = seance(u); if (s){ s.duree = +d; s.finManuelle = false; } }
  else if (a === 'plus30'){ const s = seance(v); if (s){ s.duree = (Number(s.duree) || 0) + 30; s.finManuelle = false; } }
  else if (a === 'fin-auto'){ const s = seance(v); if (s) s.finManuelle = false; }
  else if (a === 'envoyer'){ envoyer(); return; }
  else if (a === 'renvoyer'){ envoyer(true); return; }
  else if (a === 'nouvelle'){ S.envoye = null; S.ok = { 1: true }; S.f = { ...S.f, groupes: [], seances: [], observations: '', autreDemande: '', nature: '', natureAutre: '', forme: '', formeAutre: '' }; ouvrir(2); }
  rendre();
});
vue.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.c){ S.f[t.dataset.c] = t.value; return; }
  if (t.dataset.g){ const g = groupe(t.dataset.g); if (!g) return; if (t.dataset.gk) g[t.dataset.gk] = t.value; else { g.nb = t.value; g.nbTouche = true; S.f.seances.forEach(s => { if (s.classe === g.id) s.nbAesh = t.value; }); } return; }
  const s = t.dataset.s && seance(t.dataset.s); if (!s) return;
  const k = t.dataset.k;
  if (k === 'fin'){ s.fin = t.value; s.finManuelle = true; }
  else if (k === 'tiers') s.tiers = t.checked;
  else if (k === 'debut'){ s.debut = t.value; s.heureManuelle = true; }
  else s[k] = t.value;
});
vue.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.c === 'choix'){
    const v = t.value; S.f.choix = v === '__autre' ? '__autre' : '';
    if (v && v !== '__autre' && !groupe(v)) ajouterGroupe(v, v.split('+'));
    rendre(); return;
  }
  if (t.dataset.g && !t.dataset.gk){ rendre(); return; }
  if (t.dataset.c === 'matiere' || (t.dataset.s && ['date', 'debut', 'duree', 'tiers', 'fin'].includes(t.dataset.k))){
    const s = t.dataset.s && seance(t.dataset.s);
    /* Dès que la date est choisie, le créneau du cours de ce jour-là s'installe (sauf heure posée à la main). */
    if (s && t.dataset.k === 'date' && !s.heureManuelle){ const c = coursDuJourG(groupe(s.classe), s.date)[0]; if (c) poserCours(s, c); }
    if (s && t.dataset.k === 'duree') s.finManuelle = false;
    rendre();
  }
});

/* ═══════════════ envoi ═══════════════ */
function construire(){
  const f = S.f, now = new Date().toISOString();
  const seances = triees().map(s => {
    const g = groupe(s.classe), c = cG(g);
    return { classe: s.classe, libelle: libGroupe(g), intitule: nettoie(g && g.intitule, 120), date: s.date, debut: s.debut, fin: finS(s), duree: Number(s.duree) || 0, tiersTemps: !!s.tiers, salle: nettoie(s.salle, 20), nbAesh: parseInt(String(s.nbAesh).trim(), 10), nbPropose: c.propose || 0 };
  });
  const ints = [...new Set(f.groupes.map(g => nettoie(g.intitule, 120)))];
  return { id: nouvelId(), type: 'epreuve', annee: ANNEE, matiere: matiereF(),
    nature: f.nature, natureAutre: f.nature === 'autre' ? nettoie(f.natureAutre, 80) : '',
    forme: f.forme || '', formeAutre: f.forme === 'autre' ? nettoie(f.formeAutre, 80) : '', intitule: ints.length === 1 ? ints[0] : '',
    classes: f.groupes.map(g => ({ classe: g.id, classes: g.classes, libelle: libGroupe(g), autre: !!g.autre, intitule: nettoie(g.intitule, 120),
      diplome: nettoie(g.diplome, 60), pole: poleDe(g), nbSouhaite: Math.max(0, ...S.f.seances.filter(s => s.classe === g.id).map(s => parseInt(s.nbAesh, 10) || 0)),
      comptes: g.classes.length ? (({ amen, besoins, ...r }) => ({ ...r, ...amen, besoins: besoins.map(([n, v]) => n + ' ×' + v) }))(comptesGroupe(g.classes)) : {} })),
    seances, observations: nettoie(f.observations, 600), autreDemande: nettoie(f.autreDemande, 600),
    statut: 'nouvelle', reponse: { statut: '', texte: '', majLe: '' }, creeLe: now, majLe: now, source: SOURCE };
}
async function envoyer(renvoi){
  if (!(renvoi && S.envoi && S.envoi.doc)){
    for (let n = 1; n <= 5; n++) if (!S.ok[n] || controle(n).length){ S.ok[n] = false; ouvrir(n); S.erreurs = controle(n); rendre(); focusEtape(); return; }
  }
  const d = renvoi && S.envoi && S.envoi.doc ? S.envoi.doc : construire();
  S.envoi = { etat: 'encours', doc: d }; rendre();
  try {
    await avecDelai(FS.setDoc(FS.doc(db, COL, d.id), d), DELAI);
    try { localStorage.removeItem(K_BROUILLON); } catch (_) { }
    S.envoye = d; S.envoi = null; rendre(); $('#ok')?.focus();
  } catch (e) {
    try { localStorage.setItem(K_BROUILLON, JSON.stringify(d)); } catch (_) { }
    const t = typeErreur(e);
    S.envoi = { etat: t, doc: d, message: t === 'refus' ? 'Envoi pas encore autorisé : la coordination ouvre cet espace. Votre demande est gardée sur cet appareil.' : 'Pas de connexion au serveur : votre demande est gardée sur cet appareil.' };
    rendre();
  }
}
/* Une demande restée en attente sur cet appareil (envoi échoué) : on la propose à nouveau. */
try { const b = JSON.parse(localStorage.getItem(K_BROUILLON) || 'null'); if (b && b.id && b.type === 'epreuve') S.envoi = { etat: 'attente', doc: b, message: 'Une demande préparée sur cet appareil n’est pas encore partie.' }; } catch (_) { }
rendre(); charger();
</script>
