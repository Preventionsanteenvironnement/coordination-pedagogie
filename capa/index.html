<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4a7830">
<title>Ce que je traite en CAPa</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   Ce que je traite en CAPa — la liste à cocher
   ---------------------------------------------------------------
   Trois modules, trois bandeaux. Sous chacun, l'aperçu des thèmes et
   trois boutons : je traite / je ne traite pas / je veux voir.
   Répondre au niveau du module répond pour toutes ses séances : c'est
   ce qui fait gagner du temps. « Je veux voir » ouvre le détail, où
   l'on coche séance par séance.

   Deux réponses seulement : je le traite, je ne le traite pas.
   Rien n'est coché par défaut.

   Écrit : un document reponse_<id> par collègue.
   Collection Firestore : coordination_capa_cours.
   Le contenu vient de donnees-capa.json (generer-donnees.py).
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --bg:#f5f7f3; --card:#ffffff; --card-2:#fafbf8;
  --ink:#16200f; --ink-2:#39462f; --muted:#5b6a4e;
  --line:#ccd6c2; --line-2:#e4eade;
  --accent:#4a7830; --accent-d:#3a5f25; --accent-l:#e9f2e2; --on-accent:#ffffff;
  --focus:#1d4ed8;
  --oui:#15803d; --oui-bg:#e6f4ea; --oui-line:#15803d;
  --non:#6b7280; --non-bg:#f1f2f4; --non-line:#9aa1ab;
  --err-bg:#fdecec; --err-ink:#8f1d1d; --err-line:#b91c1c;
  --r:14px; --r-s:10px;
  --sh:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html{font-size:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 1rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:0 0 92px}
h1,h2,h3,h4{line-height:1.25;margin:0}
p{margin:.6em 0}
a{color:var(--accent-d)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.marque{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;
  padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.marque b{font-size:1rem}
.marque .retour{font-size:1rem;font-weight:600;color:var(--muted);text-decoration:none}
.marque .retour:hover{color:var(--accent-d);text-decoration:underline}
main{max-width:860px;margin:0 auto;padding:0 16px}
.entete{padding:24px 0 4px}
.entete h1{font-size:1.5rem}
.entete .sous{color:var(--muted);margin-top:8px;max-width:60ch}

.bloc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin:16px 0}
.message{border-radius:var(--r-s);padding:12px 14px;margin:14px 0;border-left:5px solid}
.message.err{background:var(--err-bg);color:var(--err-ink);border-color:var(--err-line)}

label.champ{display:block;margin:16px 0 0;font-weight:600}
label.champ .aide{display:block;font-weight:400;color:var(--muted);font-size:.92rem;margin-top:2px}
input[type=text]{width:100%;margin-top:6px;padding:11px 12px;font-size:1rem;font-family:inherit;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-s)}
textarea{width:100%;margin-top:8px;padding:10px 12px;font-size:.96rem;font-family:inherit;color:var(--ink);
  background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-s);resize:vertical;min-height:54px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:12px 20px;
  border-radius:var(--r-s);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;
  background:var(--card);color:var(--ink-2);border:1px solid var(--line)}
.btn:hover{border-color:var(--accent);color:var(--accent-d)}
.btn.primaire{background:var(--accent);color:var(--on-accent);border-color:var(--accent-d)}
.btn.primaire:hover{background:var(--accent-d)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}

/* ── choix de la filière ── */
fieldset.filiere{border:0;margin:18px 0 0;padding:0}
fieldset.filiere legend{font-weight:600;padding:0}
fieldset.filiere .choix{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
fieldset.filiere label{flex:1 1 200px;display:flex;align-items:center;gap:10px;min-height:54px;padding:12px 16px;
  border:1px solid var(--line);border-radius:var(--r-s);background:var(--card);cursor:pointer;font-weight:600}
fieldset.filiere label:hover{border-color:var(--accent)}
fieldset.filiere input{position:absolute;opacity:0;width:1px;height:1px}
fieldset.filiere label:has(input:checked){background:var(--accent-l);border-color:var(--accent-d);color:var(--accent-d);box-shadow:inset 0 0 0 1px var(--accent-d)}

/* ── le cadre réservé ── */
a.reserve{display:flex;align-items:center;gap:14px;margin:18px 0 0;padding:13px 16px;
  border:2px dashed var(--line-2);border-radius:var(--r);background:var(--card-2);
  text-decoration:none;color:var(--muted)}
a.reserve:hover{border-color:var(--accent);background:var(--accent-l)}
a.reserve b{display:block;color:var(--ink-2);font-size:.98rem}
a.reserve .fleche{margin-left:auto;color:var(--accent-d)}

/* ── les trois modules ────────────────────────────────────────────
   Couleurs validées : écart suffisant, y compris en vision des
   couleurs déficiente. Chaque bandeau porte aussi son nom écrit :
   la couleur ne porte jamais l'information seule. */
.module{margin:20px 0 0;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;
  border:1px solid var(--line);background:var(--card)}
.module > header{padding:16px 18px;color:#fff;background:var(--teinte)}
.module > header h2{font-size:1.18rem}
.module > header .compte{display:block;font-size:.9rem;opacity:.92;margin-top:2px}
.apercu{padding:13px 18px 0;color:var(--muted);font-size:.94rem}
.apercu b{color:var(--ink-2);font-weight:600}

.choix-module{display:flex;flex-wrap:wrap;gap:9px;padding:13px 18px 16px}
.choix-module button{
  flex:1 1 150px;min-height:50px;padding:12px 16px;border-radius:var(--r-s);
  font:inherit;font-weight:700;cursor:pointer;background:var(--card);color:var(--ink-2);
  border:2px solid var(--line);
}
.choix-module button:hover{border-color:var(--teinte);color:var(--teinte)}
.choix-module button[aria-pressed=true].oui{background:var(--oui-bg);border-color:var(--oui);color:var(--oui)}
.choix-module button[aria-pressed=true].non{background:var(--non-bg);border-color:var(--non-line);color:var(--non)}
.choix-module button.voir{background:var(--teinte);color:#fff;border-color:var(--teinte)}
.choix-module button.voir:hover{filter:brightness(1.12);color:#fff}

.etat-module{padding:0 18px 16px;font-size:.94rem;font-weight:600}
.etat-module.e-oui{color:var(--oui)}
.etat-module.e-non{color:var(--non)}
.etat-module.e-detail{color:var(--teinte)}

/* ── le détail ── */
.detail{border-top:1px solid var(--line-2);background:var(--card-2)}
.cours{padding:14px 18px;border-top:1px solid var(--line-2)}
.cours:first-child{border-top:0}
.cours > h3{font-size:1rem;color:var(--teinte)}
.seance{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line-2)}
.seance:first-of-type{border-top:0;padding-top:4px}
.seance .titre{display:flex;gap:9px;align-items:baseline}
.seance .num{flex:0 0 auto;min-width:24px;height:24px;border-radius:999px;background:#fff;border:1px solid var(--line);
  color:var(--ink-2);font-size:.82rem;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.seance h4{font-size:.98rem;font-weight:600}
.seance .obj{margin:4px 0 0 33px;font-size:.92rem;color:var(--muted)}
details.notions{margin:7px 0 0 33px}
details.notions > summary{cursor:pointer;min-height:34px;display:flex;align-items:center;gap:7px;
  font-size:.9rem;font-weight:600;color:var(--teinte);list-style:none}
details.notions > summary::-webkit-details-marker{display:none}
details.notions > summary::before{content:"";flex:0 0 auto;width:0;height:0;
  border-left:6px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;
  transition:transform .15s;transform-origin:30% 50%}
details.notions[open] > summary::before{transform:rotate(90deg)}
details.notions dl{margin:6px 0 0;padding:10px 12px;background:#fff;border:1px solid var(--line-2);border-radius:var(--r-s)}
details.notions dt{font-weight:700;font-size:.92rem}
details.notions dd{margin:1px 0 8px;color:var(--ink-2);font-size:.92rem}
details.notions dd:last-child{margin-bottom:0}

fieldset.rep{border:0;margin:9px 0 0 33px;padding:0;display:flex;flex-wrap:wrap;gap:8px}
fieldset.rep legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
fieldset.rep label{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:7px 15px;
  border:1px solid var(--line);border-radius:999px;background:#fff;
  font-size:.94rem;font-weight:600;color:var(--ink-2);cursor:pointer}
fieldset.rep input{position:absolute;opacity:0;width:1px;height:1px}
fieldset.rep label:hover{border-color:var(--teinte)}
fieldset.rep input:focus-visible + span{outline:3px solid var(--focus);outline-offset:4px;border-radius:4px}
fieldset.rep label.c-oui:has(input:checked){background:var(--oui-bg);border-color:var(--oui-line);color:var(--oui);box-shadow:inset 0 0 0 1px var(--oui-line)}
fieldset.rep label.c-non:has(input:checked){background:var(--non-bg);border-color:var(--non-line);color:var(--non);box-shadow:inset 0 0 0 1px var(--non-line)}
.aussi{margin:7px 0 0 33px;font-size:.88rem;color:var(--muted)}
.replier{margin:0 18px 16px}

/* ── barre du bas ── */
.barre{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);
  box-shadow:0 -6px 20px rgba(16,24,40,.08);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.barre .dedans{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.jauge{flex:1 1 200px;min-width:170px}
.jauge .piste{height:8px;border-radius:999px;background:var(--line-2);overflow:hidden}
.jauge .part{height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s}
.jauge .txt{font-size:.88rem;color:var(--muted);margin-top:4px}
.etat{font-size:.86rem;color:var(--muted)}
.etat.souci{color:var(--err-ink);font-weight:600}

.fin h2{font-size:1.2rem}
.recap{margin:12px 0 0;padding:0;list-style:none}
.recap li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line-2)}
.recap li b{font-size:1.15rem;min-width:2.4em;text-align:right}

@media (max-width:560px){
  .entete h1{font-size:1.3rem}
  .module > header,.apercu,.choix-module,.etat-module,.cours,.replier{padding-left:14px;padding-right:14px}
  .seance .obj,details.notions,fieldset.rep,.aussi{margin-left:0}
}

@media print{
  body{padding:0;font-size:10.5pt}
  .marque,.barre,.actions,.choix-module,.replier,.no-print{display:none !important}
  main{max-width:none;padding:0}
  .module{break-inside:auto;box-shadow:none}
  .module > header{background:#eee !important;color:#000}
  .detail{display:block !important;background:#fff}
  .cours,.seance{break-inside:avoid}
  details.notions{display:block}
  details.notions > summary{display:none}
  fieldset.rep label{border:1px solid #333;box-shadow:none !important;background:#fff !important;color:#000 !important;min-height:0;padding:2px 8px}
  fieldset.rep label::before{content:"☐ "}
  fieldset.rep label:has(input:checked)::before{content:"☒ "}
}
</style>
</head>
<body>

<div class="marque">
  <b>Ce que je traite en CAPa</b>
  <a class="retour" href="../">← Portail coordination &amp; pédagogie</a>
</div>

<main>
  <div id="ecran"></div>
  <p id="chargement">Chargement…</p>
  <noscript><p class="message err">Cette page a besoin de JavaScript pour fonctionner.</p></noscript>
</main>

<div id="barre" class="barre" hidden>
  <div class="dedans">
    <div class="jauge">
      <div class="piste"><div class="part" id="jauge-part"></div></div>
      <div class="txt" id="jauge-txt"></div>
    </div>
    <span class="etat" id="etat"></span>
    <button type="button" class="btn primaire" id="btn-terminer">J’ai terminé</button>
  </div>
</div>
<div id="annonce" class="sr" role="status" aria-live="polite"></div>

<script type="module">
const firebaseConfig = {
  apiKey:"AIzaSyAWdCMvOiAJln3eT9LIAQD3RWJUD0lQcLI", authDomain:"devoirs-pse.firebaseapp.com",
  projectId:"devoirs-pse", storageBucket:"devoirs-pse.firebasestorage.app",
  messagingSenderId:"614730413904", appId:"1:614730413904:web:a5dd478af5de30f6bede55"
};
const COL = 'coordination_capa_cours';
const DELAI_MS = 15000;
const K_REPONSE = 'capa-cours-reponse-v1';

function anneeScolaire(d = new Date()){
  const y = d.getFullYear();
  return d.getMonth() >= 7 ? `${y}-${y+1}` : `${y-1}-${y}`;
}
const ANNEE = anneeScolaire();

let FS = null, db = null, firebaseKO = null;
try {
  FS = window.__FIRESTORE_SHIM__ || await import('https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js');
  let app = null;
  if (!window.__FIRESTORE_SHIM__){
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js');
    app = initializeApp(firebaseConfig, 'capa-cours');
  }
  db = FS.getFirestore(app);
} catch(e){ firebaseKO = e; }

const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const annonce = t => { const n = $('#annonce'); if (n) n.textContent = t; };
function avecDelai(p, ms = DELAI_MS){
  let t;
  return Promise.race([p, new Promise((_, rej) => { t = setTimeout(() => { const e = new Error('Délai dépassé.'); e.code='delai'; rej(e); }, ms); })]).finally(() => clearTimeout(t));
}
const estRefus = e => `${(e && e.code) || ''} ${(e && e.message) || ''}`.includes('permission');
function lsLit(k, def){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e){ return def; } }
function lsEcrit(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

/* ═══════════════ état ═══════════════ */
const LIBELLES = { oui:'Je le traite', non:'Je ne le traite pas' };
const FILIERES = {
  jp:   { sigle:'JP',   nom:'Jardinier paysagiste' },
  hort: { sigle:'Hort', nom:'Horticulture' },
};
/* une teinte par module, dans l'ordre de la liste */
const TEINTES = ['#2563eb', '#c2410c', '#15803d'];

const S = {
  donnees: null,
  moi: lsLit(K_REPONSE, null),   // { id, nom, filiere, reponses:{}, mot, termine }
  seances: [],
  gens: [],
  ouverts: new Set(),            // modules dépliés (jamais enregistré : c'est de l'affichage)
  envoi: 'attente',
};

function nouvelId(){
  const a = new Uint8Array(8); crypto.getRandomValues(a);
  return Array.from(a, b => b.toString(16).padStart(2, '0')).join('');
}
const cle = (c, s) => `${c.code}/${s.num}`;
const reponse = k => (S.moi && S.moi.reponses && S.moi.reponses[k]) || null;
const nbRepondues = () => S.seances.filter(({k}) => reponse(k)).length;
const clesModule = m => m.cours.flatMap(c => c.seances.map(s => cle(c, s)));

function texteEtat(e){
  if (e.etat === 'oui') return 'Vous traitez tout ce bloc.';
  if (e.etat === 'non') return 'Vous ne traitez rien de ce bloc.';
  if (e.etat === 'detail') return `${e.oui} séance${e.oui > 1 ? 's' : ''} sur ${e.total} que vous traitez.`;
  return '';
}

/* L'état d'un module se déduit de ses séances : rien à enregistrer en plus. */
function etatModule(m){
  const ks = clesModule(m);
  const rs = ks.map(k => reponse(k)).filter(Boolean);
  if (!rs.length) return { etat:'vide', oui:0, total:ks.length };
  const oui = rs.filter(r => r.r === 'oui').length;
  const non = rs.filter(r => r.r === 'non').length;
  if (oui === ks.length) return { etat:'oui', oui, total:ks.length };
  if (non === ks.length) return { etat:'non', oui, total:ks.length };
  return { etat:'detail', oui, total:ks.length };
}

/* ═══════════════ enregistrement ═══════════════ */
let minuteur = null;
function enregistrer({ tout_de_suite = false } = {}){
  if (!S.moi) return;
  S.moi.maj = new Date().toISOString();
  lsEcrit(K_REPONSE, S.moi);
  clearTimeout(minuteur);
  if (tout_de_suite) return envoyer();
  minuteur = setTimeout(envoyer, 1200);
}
async function envoyer(){
  if (!S.moi) return;
  if (!db){ S.envoi = 'reseau'; majEtat(); return; }
  const doc = {
    id: `reponse_${S.moi.id}`, type:'reponse', source:'capa-cours', annee:ANNEE,
    nom: S.moi.nom, filiere: S.moi.filiere || '',
    reponses: S.moi.reponses, mot: (S.moi.mot || '').slice(0, 600),
    termine: !!S.moi.termine, maj: S.moi.maj,
  };
  try { await avecDelai(FS.setDoc(FS.doc(db, COL, doc.id), doc)); S.envoi = 'ok'; }
  catch(e){ S.envoi = estRefus(e) ? 'regles' : 'reseau'; }
  majEtat();
}
function majEtat(){
  const n = $('#etat'); if (!n) return;
  if (S.envoi === 'attente'){ n.className = 'etat'; n.textContent = ''; return; }
  if (S.envoi === 'ok'){ n.className = 'etat'; n.textContent = 'Enregistré'; return; }
  n.className = 'etat souci';
  n.textContent = S.envoi === 'regles' ? 'Gardé sur cet appareil : le serveur refuse' : 'Gardé sur cet appareil : pas de réseau';
}
function majJauge(){
  const fait = nbRepondues(), total = S.seances.length;
  const p = $('#jauge-part'), t = $('#jauge-txt');
  if (p) p.style.width = total ? `${Math.round(fait / total * 100)}%` : '0';
  if (t) t.textContent = `${fait} séance${fait > 1 ? 's' : ''} sur ${total}`;
}

/* ═══════════════ écrans ═══════════════ */
const ecranCourant = () => {
  const h = (location.hash || '').replace('#', '');
  return (h === 'liste' || h === 'fin') ? h : 'accueil';
};
function aller(nom){ if (ecranCourant() === nom) dessiner(); else location.hash = nom; }
addEventListener('hashchange', dessiner);

function dessiner(){
  const e = ecranCourant();
  if (e !== 'accueil' && !S.moi){ location.replace('#accueil'); return dessinerAccueil(); }
  if (e === 'liste') return dessinerListe();
  if (e === 'fin') return dessinerFin();
  dessinerAccueil();
}

/* ── accueil : trois lignes, pas plus ── */
function dessinerAccueil(){
  $('#barre').hidden = true;
  const repris = S.moi && nbRepondues() > 0;
  const choix = Object.entries(FILIERES).map(([id, f]) => `
    <label><input type="radio" name="filiere" value="${id}"${S.moi && S.moi.filiere === id ? ' checked' : ''}>
      <span>${f.nom}</span></label>`).join('');
  $('#ecran').innerHTML = `
    <div class="entete">
      <h1>Ce que je traite en CAPa</h1>
      <p class="sous">Voici mes cours, en trois blocs. Dites-moi ce que vous traitez déjà :
      ce que vous prenez, je le retire de mon programme.</p>
    </div>
    <div class="bloc">
      <form id="f-identite" novalidate>
        <label class="champ" for="i-nom">Votre prénom
          <input type="text" id="i-nom" name="nom" autocomplete="name" required maxlength="60" value="${esc(S.moi ? S.moi.nom : '')}">
        </label>
        <fieldset class="filiere">
          <legend>Votre filière</legend>
          <div class="choix">${choix}</div>
        </fieldset>
        <p class="message err" id="err-identite" hidden></p>
        <div class="actions">
          <button type="submit" class="btn primaire">${repris ? 'Reprendre' : 'Commencer'}</button>
        </div>
      </form>
    </div>
    <a class="reserve" href="prof.html">
      <span><b>Réservé au professeur de PSE</b>
      <span>Ce qu'il me reste à faire, une fois vos réponses prises en compte.</span></span>
      <span class="fleche" aria-hidden="true">→</span>
    </a>`;
  $('#f-identite').addEventListener('submit', ev => {
    ev.preventDefault();
    const nom = $('#i-nom').value.trim();
    const f = $('input[name=filiere]:checked');
    const err = $('#err-identite');
    if (!nom){ err.textContent = 'Écrivez votre prénom.'; err.hidden = false; $('#i-nom').focus(); return; }
    if (!f){ err.textContent = 'Choisissez votre filière.'; err.hidden = false; return; }
    if (!S.moi) S.moi = { id: nouvelId(), reponses: {}, termine: false };
    S.moi.nom = nom; S.moi.filiere = f.value;
    enregistrer();
    aller('liste');
  });
}

/* ── la liste ── */
function htmlNotions(items){
  if (!items || !items.length) return '';
  return `<details class="notions"><summary>Les notions (${items.length})</summary>
    <dl>${items.map(i => `<dt>${esc(i.n)}</dt><dd>${esc(i.d)}</dd>`).join('')}</dl></details>`;
}
function htmlSeance(cours, s){
  const k = cle(cours, s), r = reponse(k) || {};
  const aussi = S.gens.filter(g => g.reponses && g.reponses[k] && g.reponses[k].r === 'oui').map(g => g.nom);
  const radio = (v, cls) => `<label class="c-${cls}">
    <input type="radio" name="r_${esc(k)}" value="${v}" data-cle="${esc(k)}"${r.r === v ? ' checked' : ''}>
    <span>${LIBELLES[v]}</span></label>`;
  return `<section class="seance">
    <div class="titre"><span class="num" aria-hidden="true">${esc(s.num)}</span>
      <h4><span class="sr">Séance ${esc(s.num)} — </span>${esc(s.titre)}</h4></div>
    ${s.objectif ? `<p class="obj">${esc(s.objectif)}</p>` : ''}
    ${htmlNotions(s.notions)}
    <fieldset class="rep"><legend>${esc(s.titre)}</legend>${radio('oui','oui')}${radio('non','non')}</fieldset>
    ${aussi.length ? `<p class="aussi">Aussi traité par ${esc(aussi.join(', '))}.</p>` : ''}
  </section>`;
}
function htmlModule(m, i){
  const e = etatModule(m);
  const ouvert = S.ouverts.has(m.code);
  const themes = m.cours.map(c => esc(c.titre)).join(' · ');
  const etiquette = `<p class="etat-module e-${e.etat}">${texteEtat(e)}</p>`;

  return `<section class="module" style="--teinte:${TEINTES[i % TEINTES.length]}" data-module="${esc(m.code)}">
    <header>
      <h2>${esc(m.nom)}</h2>
      <span class="compte">${m.cours.length} thèmes · ${e.total} séances</span>
    </header>
    <p class="apercu"><b>Ce qu'il y a dedans :</b> ${themes}</p>
    <div class="choix-module no-print">
      <button type="button" class="oui" data-module-rep="oui" aria-pressed="${e.etat === 'oui'}">Je traite</button>
      <button type="button" class="non" data-module-rep="non" aria-pressed="${e.etat === 'non'}">Je ne traite pas</button>
      <button type="button" class="voir" data-module-voir>${ouvert ? 'Replier' : 'Je veux voir'}</button>
    </div>
    ${etiquette}
    ${ouvert ? `<div class="detail">${m.cours.map(c => `
      <article class="cours">
        <h3>${esc(c.titre)}</h3>
        ${c.notions_cours && c.notions_cours.length ? htmlNotions(c.notions_cours) : ''}
        ${c.seances.map(s => htmlSeance(c, s)).join('')}
      </article>`).join('')}
      <div class="replier no-print"><button type="button" class="btn" data-module-voir>Replier ce bloc</button></div>
    </div>` : ''}
  </section>`;
}

function dessinerListe(){
  $('#barre').hidden = false;
  $('#ecran').innerHTML = `
    <div class="entete">
      <h1>Bonjour ${esc(S.moi.nom)}</h1>
      <p class="sous">Pour chaque bloc : <b>Je traite</b>, <b>Je ne traite pas</b>, ou <b>Je veux voir</b> pour répondre séance par séance.</p>
    </div>
    ${S.donnees.modules.map(htmlModule).join('')}
    <div class="bloc no-print">
      <label class="champ" for="i-mot">Une remarque, une suggestion ?
        <span class="aide">Facultatif. Ce que vous voulez me dire sur ces cours.</span>
        <textarea id="i-mot" data-mot rows="3" maxlength="600">${esc(S.moi.mot || '')}</textarea>
      </label>
      <p>Quand c'est fait, cliquez sur <b>J'ai terminé</b> en bas.</p>
    </div>`;
  majJauge(); majEtat();
  enregistrer();
}

/* ── fin ── */
function dessinerFin(){
  $('#barre').hidden = true;
  let oui = 0, non = 0;
  S.seances.forEach(({k}) => { const r = reponse(k); if (r && r.r === 'oui') oui++; else if (r && r.r === 'non') non++; });
  const sans = S.seances.length - oui - non;
  const s_ = n => n > 1 ? 's' : '';
  $('#ecran').innerHTML = `
    <div class="entete fin">
      <h1>Merci.</h1>
      <p class="sous">${S.envoi === 'ok'
        ? 'C’est enregistré. Vous pouvez revenir modifier quand vous voulez.'
        : 'Vos réponses sont gardées sur cet appareil mais n’ont pas pu être envoyées. Téléchargez-les ci-dessous.'}</p>
    </div>
    <div class="bloc">
      <ul class="recap">
        <li><b>${oui}</b> <span>séance${s_(oui)} que vous traitez</span></li>
        <li><b>${non}</b> <span>séance${s_(non)} que vous ne traitez pas</span></li>
        ${sans ? `<li><b>${sans}</b> <span>séance${s_(sans)} sans réponse</span></li>` : ''}
      </ul>
      <div class="actions">
        <a class="btn primaire" href="#liste">Revoir mes réponses</a>
        ${S.envoi === 'ok' ? '' : '<button type="button" class="btn" id="btn-fichier">Télécharger ma réponse</button>'}
      </div>
    </div>`;
  const b = $('#btn-fichier');
  if (b) b.addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({ ...S.moi, annee:ANNEE, source:'capa-cours' }, null, 1)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `capa-${(S.moi.nom || 'reponse').normalize('NFD').replace(/[^\w]+/g, '-').toLowerCase()}.json`;
    a.click(); URL.revokeObjectURL(a.href);
  });
}

/* ═══════════════ actions ═══════════════ */
$('#ecran').addEventListener('click', ev => {
  const bloc = ev.target.closest('[data-module]');

  const rep = ev.target.closest('[data-module-rep]');
  if (rep && bloc){
    const m = S.donnees.modules.find(x => x.code === bloc.dataset.module);
    const v = rep.dataset.moduleRep;
    const deja = etatModule(m).etat === v;
    clesModule(m).forEach(k => { if (deja) delete S.moi.reponses[k]; else S.moi.reponses[k] = { r: v }; });
    if (!deja) S.ouverts.delete(m.code);          // répondu d'un bloc : on referme
    majJauge(); enregistrer(); dessinerListe();
    annonce(deja ? 'Réponse retirée.' : `${m.nom} : ${LIBELLES[v]}.`);
    return;
  }

  const voir = ev.target.closest('[data-module-voir]');
  if (voir && bloc){
    const code = bloc.dataset.module;
    if (S.ouverts.has(code)) S.ouverts.delete(code); else S.ouverts.add(code);
    dessinerListe();
    const n = document.querySelector(`[data-module="${code}"]`);
    if (n) n.scrollIntoView({ block:'start' });
    return;
  }
});
$('#ecran').addEventListener('input', ev => {
  if (!('mot' in ev.target.dataset)) return;
  S.moi.mot = ev.target.value;
  enregistrer();
});
$('#ecran').addEventListener('change', ev => {
  const k = ev.target.dataset.cle;
  if (!k) return;
  S.moi.reponses[k] = { r: ev.target.value };
  majJauge(); enregistrer();
  const bloc = ev.target.closest('[data-module]');
  if (bloc){
    const m = S.donnees.modules.find(x => x.code === bloc.dataset.module);
    const e = etatModule(m);
    const p = bloc.querySelector('.etat-module');
    if (p){ p.textContent = texteEtat(e); p.className = 'etat-module e-' + e.etat; }
    bloc.querySelectorAll('[data-module-rep]').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.moduleRep === e.etat)));
  }
});
$('#btn-terminer').addEventListener('click', () => {
  S.moi.termine = true;
  enregistrer({ tout_de_suite:true });
  aller('fin');
});

/* ═══════════════ départ ═══════════════ */
try {
  const r = await fetch('donnees-capa.json', { cache:'no-cache' });
  if (!r.ok) throw new Error(r.status);
  S.donnees = await r.json();
} catch(e){
  $('#chargement').outerHTML = '<p class="message err">La liste n’a pas pu être chargée. Rechargez la page.</p>';
  throw e;
}
S.donnees.modules.forEach(m => m.cours.forEach(c => c.seances.forEach(s => S.seances.push({ k: cle(c, s) }))));

if (db){
  try {
    const snap = await avecDelai(FS.getDocs(FS.query(FS.collection(db, COL), FS.where('type', '==', 'reponse'))));
    const moiId = S.moi ? `reponse_${S.moi.id}` : null;
    snap.forEach(d => { const v = d.data(); if (v && v.nom && d.id !== moiId) S.gens.push({ ...v, id:d.id }); });
  } catch(e){ /* la page marche sans : on n'affiche simplement pas « aussi traité par » */ }
}
$('#chargement').remove();
dessiner();
</script>
</body>
</html>
