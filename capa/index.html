<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4a7830">
<title>Ce que je traite en CAPa — comparaison entre collègues</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   Ce que je traite en CAPa — page unique
   ---------------------------------------------------------------
   Une seule page : le collègue lit ce que Brahim traite, coche pour
   lui-même, et voit au même endroit ce que les autres ont répondu.

   Le contenu affiché vient de donnees-capa.json, fabriqué par
   generer-donnees.py depuis la bibliothèque CAPa de l'Atelier.
   Ne jamais retoucher donnees-capa.json à la main : le régénérer.

   Écrit : un document reponse_<id> par collègue.
   Lit   : tous les documents reponse_* (pour montrer qui traite quoi).
   Collection Firestore : coordination_capa_cours.

   Aucun code d'accès : prénom + filière (JP ou horticulture), rien
   d'autre. Aucun nom d'élève, nulle part. Page en clair.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --bg:#f5f7f3; --card:#ffffff; --card-2:#fafbf8;
  --ink:#16200f; --ink-2:#39462f; --muted:#5b6a4e;
  --line:#ccd6c2; --line-2:#e4eade;
  --accent:#4a7830; --accent-d:#3a5f25; --accent-l:#e9f2e2; --on-accent:#ffffff;
  --focus:#1d4ed8;
  --oui:#15803d; --oui-bg:#e6f4ea; --oui-line:#15803d;
  --aut:#b45309; --aut-bg:#fdf1de; --aut-line:#b45309;
  --non:#6b7280; --non-bg:#f1f2f4; --non-line:#9aa1ab;
  --chaud:#b91c1c; --chaud-bg:#fdecec;
  --err-bg:#fdecec; --err-ink:#8f1d1d; --err-line:#b91c1c;
  --info-bg:#eef3fb; --info-ink:#1e3a8a; --info-line:#1d4ed8;
  --r:14px; --r-s:10px;
  --sh:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html{font-size:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 1rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:0 0 88px}
h1,h2,h3{line-height:1.25;margin:0}
p{margin:.6em 0}
a{color:var(--accent-d)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── en-tête ── */
.marque{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;
  padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.marque b{font-size:1rem}
.marque .retour{font-size:1rem;font-weight:600;color:var(--muted);text-decoration:none}
.marque .retour:hover{color:var(--accent-d);text-decoration:underline}
main{max-width:900px;margin:0 auto;padding:0 16px}
.entete{padding:22px 0 8px}
.entete h1{font-size:1.5rem}
.entete .sous{color:var(--muted);margin-top:6px}

/* ── blocs ── */
.bloc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin:16px 0}
.message{border-radius:var(--r-s);padding:12px 14px;margin:14px 0;border-left:5px solid}
.message.err{background:var(--err-bg);color:var(--err-ink);border-color:var(--err-line)}
.message.info{background:var(--info-bg);color:var(--info-ink);border-color:var(--info-line)}

/* ── formulaire ── */
label.champ{display:block;margin:16px 0 0;font-weight:600}
label.champ .aide{display:block;font-weight:400;color:var(--muted);font-size:.92rem;margin-top:2px}
input[type=text]{width:100%;margin-top:6px;padding:11px 12px;font-size:1rem;font-family:inherit;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-s)}
textarea{width:100%;margin-top:8px;padding:10px 12px;font-size:.98rem;font-family:inherit;color:var(--ink);
  background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-s);resize:vertical;min-height:62px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:11px 18px;
  border-radius:var(--r-s);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;
  background:var(--card);color:var(--ink-2);border:1px solid var(--line)}
.btn:hover{border-color:var(--accent);color:var(--accent-d)}
.btn.primaire{background:var(--accent);color:var(--on-accent);border-color:var(--accent-d)}
.btn.primaire:hover{background:var(--accent-d);color:var(--on-accent)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}

/* ── choix de la filière ── */
fieldset.filiere{border:0;margin:18px 0 0;padding:0}
fieldset.filiere legend{font-weight:600;padding:0}
fieldset.filiere .aide{display:block;font-weight:400;color:var(--muted);font-size:.92rem;margin-top:2px}
fieldset.filiere .choix{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
fieldset.filiere label{flex:1 1 220px;display:flex;align-items:center;gap:10px;min-height:56px;padding:12px 16px;
  border:1px solid var(--line);border-radius:var(--r-s);background:var(--card);cursor:pointer;font-weight:600}
fieldset.filiere label:hover{border-color:var(--accent)}
fieldset.filiere input{position:absolute;opacity:0;width:1px;height:1px}
fieldset.filiere label:has(input:checked){background:var(--accent-l);border-color:var(--accent-d);color:var(--accent-d);box-shadow:inset 0 0 0 1px var(--accent-d)}
fieldset.filiere .sigle{flex:0 0 auto;min-width:34px;height:34px;border-radius:999px;background:var(--accent-l);color:var(--accent-d);
  display:inline-flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:800}
fieldset.filiere label:has(input:checked) .sigle{background:var(--accent);color:var(--on-accent)}

/* ── qui a répondu ── */
.gens{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.gens li{display:inline-flex;align-items:center;gap:9px;padding:7px 13px;border:1px solid var(--line);
  border-radius:999px;background:var(--card-2);font-size:.94rem}
.gens .nom{font-weight:600}
.gens .ou{color:var(--muted)}
.gens .encours{color:var(--aut);font-weight:600}
.gens .cestmoi{color:var(--accent-d);font-weight:700}
.gens button{border:0;background:none;color:var(--chaud);font:inherit;font-weight:700;cursor:pointer;padding:0 2px;text-decoration:underline}

/* ── filtres et sommaire ── */
.filtres{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.filtres button{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 15px;
  border:1px solid var(--line);border-radius:999px;background:var(--card);
  font:inherit;font-weight:600;color:var(--ink-2);cursor:pointer}
.filtres button:hover{border-color:var(--accent)}
.filtres button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent-d)}
.filtres .cpt{opacity:.75;font-weight:500;font-variant-numeric:tabular-nums}
.filtres button .puce{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.filtres button[aria-pressed=true] .puce{box-shadow:0 0 0 2px var(--on-accent)}
.quoi-filtre{font-size:.85rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 0}
.sommaire{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sommaire a{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 13px;
  border:1px solid var(--line);border-radius:999px;background:var(--card);
  text-decoration:none;color:var(--ink-2);font-weight:600;font-size:.94rem}
.sommaire a:hover{border-color:var(--accent);color:var(--accent-d)}
.sommaire .cpt{color:var(--muted);font-weight:500}

/* ── module / cours / séance ── */
.module{margin:28px 0 0}
.module > h2{font-size:1.2rem;padding:14px 16px;background:var(--accent-l);
  border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:var(--r)}
.module > h2 .cadre{display:block;font-size:.9rem;font-weight:500;color:var(--ink-2);margin-top:3px}
.cours{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin:14px 0;overflow:hidden}
.cours > h3{font-size:1.06rem;padding:14px 16px 0}
.cours .obj{color:var(--muted);font-size:.95rem;padding:2px 16px 0;margin:0}
.notions-cours{padding:0 16px}
.seance{border-top:1px solid var(--line-2);padding:14px 16px;margin-top:12px}
.titre{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.titre .num{flex:0 0 auto;min-width:26px;height:26px;border-radius:999px;background:var(--accent-l);
  color:var(--accent-d);font-size:.85rem;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.titre h4{font-size:1rem;font-weight:700;flex:1 1 220px;margin:0}
.verdict{flex:0 0 auto;font-size:.85rem;font-weight:700;padding:4px 11px;border-radius:999px;white-space:nowrap}
.v-partout{background:var(--chaud-bg);color:var(--chaud)}
.v-partie{background:var(--aut-bg);color:var(--aut)}
.v-seul{background:var(--oui-bg);color:var(--oui)}
.v-rien{background:var(--non-bg);color:var(--non)}
.seance .obj{padding:4px 0 0;font-size:.94rem}

/* ── notions ── */
details.notions{margin-top:10px}
details.notions > summary{cursor:pointer;min-height:40px;display:flex;align-items:center;gap:7px;
  font-size:.93rem;font-weight:600;color:var(--accent-d);list-style:none}
details.notions > summary::-webkit-details-marker{display:none}
details.notions > summary::before{content:"";flex:0 0 auto;width:0;height:0;
  border-left:7px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent;
  transition:transform .15s;transform-origin:30% 50%}
details.notions[open] > summary::before{transform:rotate(90deg)}
details.notions dl{margin:8px 0 0;padding:12px 14px;background:var(--card-2);border:1px solid var(--line-2);border-radius:var(--r-s)}
details.notions dt{font-weight:700;font-size:.94rem}
details.notions dd{margin:1px 0 10px;color:var(--ink-2);font-size:.94rem}
details.notions dd:last-child{margin-bottom:0}

/* ── mes trois réponses ── */
fieldset.rep{border:0;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
fieldset.rep legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
fieldset.rep label{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;
  border:1px solid var(--line);border-radius:999px;background:var(--card);
  font-size:.95rem;font-weight:600;color:var(--ink-2);cursor:pointer}
fieldset.rep input{position:absolute;opacity:0;width:1px;height:1px}
fieldset.rep label:hover{border-color:var(--accent)}
fieldset.rep input:focus-visible + span{outline:3px solid var(--focus);outline-offset:4px;border-radius:4px}
fieldset.rep label.coche-oui:has(input:checked){background:var(--oui-bg);border-color:var(--oui-line);color:var(--oui);box-shadow:inset 0 0 0 1px var(--oui-line)}
fieldset.rep label.coche-autre:has(input:checked){background:var(--aut-bg);border-color:var(--aut-line);color:var(--aut);box-shadow:inset 0 0 0 1px var(--aut-line)}
fieldset.rep label.coche-non:has(input:checked){background:var(--non-bg);border-color:var(--non-line);color:var(--non);box-shadow:inset 0 0 0 1px var(--non-line)}
.precision{margin-top:10px}
.precision label{font-weight:600;font-size:.94rem;color:var(--ink-2)}

/* ── ce que les autres ont répondu ── */
.autres{margin-top:12px;padding:11px 13px;background:var(--card-2);border:1px solid var(--line-2);border-radius:var(--r-s)}
.autres > .quoi{display:block;font-size:.82rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.groupe{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin-top:8px}
.groupe .quoi{font-size:.85rem;font-weight:700;color:var(--muted);min-width:9.5em}
.qui{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px;flex:1 1 200px}
.qui li{font-size:.9rem;padding:4px 11px;border-radius:999px}
.qui .r-oui{background:var(--oui-bg);color:var(--oui)}
.qui .r-autre{background:var(--aut-bg);color:var(--aut)}
.qui .r-non{background:var(--non-bg);color:var(--non)}
.mots{margin-top:9px}
.mots p{margin:0 0 6px;font-size:.93rem;color:var(--ink-2)}
.mots p:last-child{margin-bottom:0}
.mots b{color:var(--aut)}
.autres .vide{color:var(--muted);font-size:.92rem;margin:6px 0 0;padding:0}

/* ── le cadre réservé, sur l'accueil ── */
a.reserve{
  display:flex;align-items:center;gap:14px;margin:18px 0 0;padding:14px 16px;
  border:2px dashed var(--line-2);border-radius:var(--r);background:var(--card-2);
  text-decoration:none;color:var(--muted);
}
a.reserve:hover{border-color:var(--accent);background:var(--accent-l)}
a.reserve .cle{font-size:1.2rem;flex:0 0 auto}
a.reserve b{display:block;color:var(--ink-2);font-size:.98rem}
a.reserve span{font-size:.9rem}
a.reserve .fleche{margin-left:auto;font-size:1.1rem;color:var(--accent-d)}

/* ── barre du bas ── */
.barre{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);
  box-shadow:0 -6px 20px rgba(16,24,40,.08);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.barre .dedans{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.jauge{flex:1 1 220px;min-width:180px}
.jauge .piste{height:9px;border-radius:999px;background:var(--line-2);overflow:hidden}
.jauge .part{height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s}
.jauge .txt{font-size:.9rem;color:var(--muted);margin-top:4px}
.etat{font-size:.88rem;color:var(--muted)}
.etat.souci{color:var(--err-ink);font-weight:600}

/* ── écran de fin ── */
.fin h2{font-size:1.25rem}
.recap{margin:14px 0 0;padding:0;list-style:none}
.recap li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line-2)}
.recap li b{font-size:1.15rem;min-width:2.4em;text-align:right}
.vide{color:var(--muted);padding:14px 0}

@media (max-width:560px){
  .entete h1{font-size:1.3rem}
  .seance{padding:14px 12px}
  .cours > h3,.cours .obj,.notions-cours{padding-left:12px;padding-right:12px}
  .groupe .quoi{min-width:0;flex:1 1 100%}
}

/* ── impression : la liste complète, cases vides à cocher au stylo ── */
@media print{
  :root{--bg:#fff}
  body{padding:0;font-size:10.5pt}
  .marque,.barre,.actions,.sommaire,.filtres,.quoi-filtre,.no-print{display:none !important}
  main{max-width:none;padding:0}
  .bloc{box-shadow:none}
  .cours{break-inside:avoid;box-shadow:none;border:1px solid #999}
  .module > h2{break-after:avoid;background:#eee}
  .seance{break-inside:avoid}
  details.notions{display:block}
  details.notions > summary{display:none}
  details.notions dl{background:#fff;border:1px solid #ccc}
  fieldset.rep label{border:1px solid #333;box-shadow:none !important;background:#fff !important;color:#000 !important;min-height:0;padding:2px 8px}
  fieldset.rep label::before{content:"☐ "}
  fieldset.rep label:has(input:checked)::before{content:"☒ "}
  .precision{border-bottom:1px solid #999;height:26px}
  .precision label{font-size:9pt;color:#444}
  .precision textarea{display:none}
  .autres{background:#fff;border:1px solid #ccc}
}
</style>
</head>
<body>

<div class="marque">
  <b>Ce que je traite en CAPa</b>
  <a class="retour" href="../">← Portail coordination &amp; pédagogie</a>
</div>

<main>
  <div id="ecran"></div>
  <p id="chargement">Chargement de la liste…</p>
  <noscript><p class="message err">Cette page a besoin de JavaScript pour fonctionner.</p></noscript>
</main>

<div id="barre" class="barre" hidden>
  <div class="dedans">
    <div class="jauge">
      <div class="piste"><div class="part" id="jauge-part"></div></div>
      <div class="txt" id="jauge-txt">0 séance sur 70</div>
    </div>
    <span class="etat" id="etat"></span>
    <button type="button" class="btn primaire" id="btn-terminer">J’ai terminé</button>
  </div>
</div>

<div id="annonce" class="sr" role="status" aria-live="polite"></div>

<script type="module">
/* ═══════════════ Firebase ═══════════════ */
const firebaseConfig = {
  apiKey:"AIzaSyAWdCMvOiAJln3eT9LIAQD3RWJUD0lQcLI", authDomain:"devoirs-pse.firebaseapp.com",
  projectId:"devoirs-pse", storageBucket:"devoirs-pse.firebasestorage.app",
  messagingSenderId:"614730413904", appId:"1:614730413904:web:a5dd478af5de30f6bede55"
};
const COL = 'coordination_capa_cours';
const DELAI_MS = 15000;
const K_REPONSE = 'capa-cours-reponse-v1';
const GESTION = new URLSearchParams(location.search).get('gestion') === '1';

function anneeScolaire(d = new Date()){
  const y = d.getFullYear();
  return d.getMonth() >= 7 ? `${y}-${y+1}` : `${y-1}-${y}`;
}
const ANNEE = anneeScolaire();

let FS = null, db = null, firebaseKO = null;
try {
  FS = window.__FIRESTORE_SHIM__ || await import('https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js');
  let app = null;
  if (!window.__FIRESTORE_SHIM__){
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js');
    app = initializeApp(firebaseConfig, 'capa-cours');
  }
  db = FS.getFirestore(app);
} catch(e){ firebaseKO = e; }

/* ═══════════════ outils ═══════════════ */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const annonce = t => { const n = $('#annonce'); if (n) n.textContent = t; };
function avecDelai(promesse, ms){
  let t;
  return Promise.race([
    promesse,
    new Promise((_, rej) => { t = setTimeout(() => { const e = new Error('Délai dépassé : pas de réponse du serveur.'); e.code = 'delai'; rej(e); }, ms); })
  ]).finally(() => clearTimeout(t));
}
const estRefus = e => `${(e && e.code) || ''} ${(e && e.message) || ''}`.includes('permission');
function lsLit(k, def){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e){ return def; } }
function lsEcrit(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function dateCourte(iso){
  const d = new Date(iso || '');
  return isNaN(d) ? '' : d.toLocaleDateString('fr-FR', { day:'numeric', month:'long' });
}

/* ═══════════════ état ═══════════════ */
const LIBELLES = {
  oui:  'Je le traite',
  non:  'Je ne le traite pas',
  autre:'Une autre discipline le traite',
};
const FILIERES = {
  jp:   { sigle:'JP',   nom:'Jardinier paysagiste' },
  hort: { sigle:'Hort', nom:'Horticulture' },
};
const VERDICTS = {
  partout: { texte:'Tous la traitent',  cls:'v-partout', filtre:'Traitées par tous' },
  partie:  { texte:'Traitée en partie', cls:'v-partie',  filtre:'Traitées en partie' },
  seul:    { texte:'Personne d’autre',  cls:'v-seul',    filtre:'Personne d’autre' },
  rien:    { texte:'Sans réponse',      cls:'v-rien',    filtre:'Sans réponse' },
};
/* « une autre discipline le traite » ne se range pas dans un verdict : une séance peut
   être traitée par tous ET signalée comme relevant d'une autre discipline. C'est donc
   un filtre à part. */
const FILTRE_DISCIPLINE = 'discipline';

const S = {
  donnees: null,
  moi: lsLit(K_REPONSE, null),   // { id, nom, filiere, reponses:{}, termine }
  seances: [],                   // à plat, pour compter
  gens: [],                      // toutes les réponses lues, la mienne comprise
  lectureKO: null,               // regles · reseau
  envoi: 'attente',              // attente · ok · regles · reseau
  filtre: 'toutes',              // toutes · partout · partie · seul · rien
  filiere: 'toutes',             // toutes · jp · hort
};

function nouvelId(){
  const a = new Uint8Array(8); crypto.getRandomValues(a);
  return Array.from(a, b => b.toString(16).padStart(2, '0')).join('');
}
const cle = (cours, seance) => `${cours.code}/${seance.num}`;
const reponse = k => (S.moi && S.moi.reponses && S.moi.reponses[k]) || null;
const nbRepondues = () => S.seances.filter(({k}) => reponse(k)).length;
const nomFiliere = f => (FILIERES[f] && FILIERES[f].nom) || '';

/* les autres : tout le monde sauf moi, dans la filière choisie */
function autres(){
  const moiId = S.moi ? `reponse_${S.moi.id}` : null;
  return S.gens.filter(g => g.id !== moiId && (S.filiere === 'toutes' || g.filiere === S.filiere));
}
function etatSeance(k, liste){
  const dedans = liste.filter(g => g.reponses && g.reponses[k] && g.reponses[k].r);
  const oui = dedans.filter(g => g.reponses[k].r === 'oui');
  const autre = dedans.filter(g => g.reponses[k].r === 'autre');
  const non = dedans.filter(g => g.reponses[k].r === 'non');
  let verdict = 'rien';
  if (liste.length && dedans.length){
    if (oui.length === liste.length) verdict = 'partout';
    else if (oui.length > 0) verdict = 'partie';
    else verdict = 'seul';        // personne d'autre ne le traite lui-même
  }
  return { oui, autre, non, dedans, verdict };
}

/* ═══════════════ enregistrement ═══════════════ */
let minuteur = null;
function enregistrer({ tout_de_suite = false } = {}){
  if (!S.moi) return;
  S.moi.maj = new Date().toISOString();
  lsEcrit(K_REPONSE, S.moi);
  clearTimeout(minuteur);
  if (tout_de_suite) return envoyer();
  minuteur = setTimeout(envoyer, 1500);
}
async function envoyer(){
  if (!S.moi) return;
  if (!db){ S.envoi = 'reseau'; majEtat(); return; }
  const doc = {
    id: `reponse_${S.moi.id}`, type: 'reponse', source: 'capa-cours', annee: ANNEE,
    nom: S.moi.nom, filiere: S.moi.filiere || '',
    reponses: S.moi.reponses, termine: !!S.moi.termine, maj: S.moi.maj,
  };
  try {
    await avecDelai(FS.setDoc(FS.doc(db, COL, doc.id), doc), DELAI_MS);
    S.envoi = 'ok';
    const i = S.gens.findIndex(g => g.id === doc.id);
    if (i >= 0) S.gens[i] = doc; else S.gens.push(doc);
  } catch(e){
    S.envoi = estRefus(e) ? 'regles' : 'reseau';
  }
  majEtat();
}
function majEtat(){
  const n = $('#etat'); if (!n) return;
  if (S.envoi === 'attente'){ n.className = 'etat'; n.textContent = ''; return; }
  if (S.envoi === 'ok'){ n.className = 'etat'; n.textContent = 'Enregistré'; return; }
  n.className = 'etat souci';
  n.textContent = S.envoi === 'regles'
    ? 'Réponses gardées sur cet appareil : le serveur les refuse'
    : 'Réponses gardées sur cet appareil : le serveur ne répond pas';
}
function majJauge(){
  const fait = nbRepondues(), total = S.seances.length;
  const p = $('#jauge-part'), t = $('#jauge-txt');
  if (p) p.style.width = total ? `${Math.round(fait / total * 100)}%` : '0';
  if (t) t.textContent = `${fait} séance${fait > 1 ? 's' : ''} sur ${total}`;
}

/* ═══════════════ écrans ═══════════════ */
function ecranCourant(){
  const h = (location.hash || '').replace('#', '');
  return (h === 'liste' || h === 'fin') ? h : 'accueil';
}
function aller(nom){
  if (ecranCourant() === nom){ dessiner(); return; }
  location.hash = nom;          // le bouton Précédent du navigateur fonctionne
}
addEventListener('hashchange', dessiner);

function dessiner(){
  const ecran = ecranCourant();
  if (ecran !== 'accueil' && !S.moi){ location.replace('#accueil'); return dessinerAccueil(); }
  if (ecran === 'liste') return dessinerListe();
  if (ecran === 'fin') return dessinerFin();
  dessinerAccueil();
}

/* ── accueil ── */

  const d = S.donnees, t = d.totaux;
  const repris = S.moi && nbRepondues() > 0;
  const dejaLa = S.gens.filter(g => g.id !== (S.moi ? `reponse_${S.moi.id}` : null)).length;
  const choix = Object.entries(FILIERES).map(([id, f]) => `
    <label><span class="sigle" aria-hidden="true">${f.sigle}</span>

      <h2>Ce que je vous demande</h2>

      <p>Trois réponses possibles : <b>${LIBELLES.oui}</b>, <b>${LIBELLES.non}</b>,
      ou <b>${LIBELLES.autre}</b> — pour les contenus qui, chez vous, reviennent à un collègue

      <p>Ce que je ferai de vos réponses : repérer ce que nous faisons deux fois, et en discuter ensemble.

      <p><b>${t.cours} cours · ${t.seances} séances · ${t.notions} notions.</b>
      Comptez une vingtaine de minutes. Vos réponses s’enregistrent au fur et à mesure :
      vous pouvez fermer la page, revenir, et modifier ce que vous avez coché.

      ${dejaLa ? `<p class="sous">${dejaLa} collègue${dejaLa > 1 ? 's ont' : ' a'} déjà répondu.</p>` : ''}
      ${firebaseKO || S.lectureKO ? '<p class="message err">La connexion au serveur n’a pas pu être établie. Vous pouvez répondre quand même : à la fin, un bouton vous permettra de télécharger votre réponse pour l’envoyer par courriel.</p>' : ''}
      <form id="f-identite" novalidate>

          <span class="aide">Pour savoir qui a répondu quoi.</span>

        <p class="message err" id="err-identite" hidden></p>

    <a class="reserve" href="prof.html">
      <span class="cle" aria-hidden="true">🔒</span>

    if (!S.moi) S.moi = { id: nouvelId(), reponses: {}, termine: false };

/* ── la liste : ce que je traite, ce que vous cochez, ce que les autres ont dit ── */
function htmlNotions(items, titre){
  if (!items || !items.length) return '';
  return `<details class="notions">
    <summary>${esc(titre)} (${items.length})</summary>
    <dl>${items.map(i => `<dt>${esc(i.n)}</dt><dd>${esc(i.d)}</dd>`).join('')}</dl>
  </details>`;
}
function htmlAutres(k, etat, combien){
  const groupe = (liste, cls, titre) => liste.length
    ? `<div class="groupe"><span class="quoi">${titre}</span>
        <ul class="qui">${liste.map(g => `<li class="r-${cls}">${esc(g.nom)}</li>`).join('')}</ul></div>`
    : '';
  const mots = etat.dedans.filter(g => (g.reponses[k].c || '').trim());
  return `<div class="autres no-print">
    <span class="quoi">Les autres collègues</span>
    ${combien === 0 ? '<p class="vide">Personne d’autre n’a encore répondu.</p>' : ''}
    ${etat.dedans.length === 0 && combien > 0 ? '<p class="vide">Aucune réponse sur cette séance.</p>' : ''}
    ${groupe(etat.oui, 'oui', 'La traitent')}
    ${groupe(etat.autre, 'autre', 'Autre discipline')}
    ${groupe(etat.non, 'non', 'Ne la traitent pas')}
    ${mots.length ? `<div class="mots">${mots.map(g => `<p><b>${esc(g.nom)}</b> — ${esc(g.reponses[k].c)}</p>`).join('')}</div>` : ''}
  </div>`;
}
function htmlSeance(cours, s, etat, combien){
  const k = cle(cours, s), r = reponse(k) || {};
  const v = VERDICTS[etat.verdict];
  const etiquette = etat.verdict === 'partie' ? `${etat.oui.length} sur ${combien} la traitent` : v.texte;
  const radio = (val, cls) => `
    <label class="coche-${cls}">
      <input type="radio" name="r_${esc(k)}" value="${val}" data-cle="${esc(k)}"${r.r === val ? ' checked' : ''}>
      <span>${LIBELLES[val]}</span>
    </label>`;
  return `<section class="seance">
    <div class="titre">
      <span class="num" aria-hidden="true">${esc(s.num)}</span>
      <h4><span class="sr">Séance ${esc(s.num)} — </span>${esc(s.titre)}</h4>
      ${combien ? `<span class="verdict ${v.cls}">${esc(etiquette)}</span>` : ''}
    </div>
    ${s.objectif ? `<p class="obj">${esc(s.objectif)}</p>` : ''}
    ${htmlNotions(s.notions, 'Les notions de cette séance')}
    <fieldset class="rep">
      <legend>${esc(cours.titre)} — séance ${esc(s.num)} : ${esc(s.titre)}</legend>
      ${radio('oui', 'oui')}${radio('non', 'non')}${radio('autre', 'autre')}
    </fieldset>
    <div class="precision">
      <label for="c_${esc(k)}">Préciser (facultatif) : la discipline concernée, le moment de l’année, ce que vous faites…</label>
      <textarea id="c_${esc(k)}" data-cle-commentaire="${esc(k)}" rows="2">${esc(r.c || '')}</textarea>
    </div>
    ${htmlAutres(k, etat, combien)}
  </section>`;
}

const COULEURS = { partout:'#b91c1c', partie:'#ca8a04', seul:'#15803d', rien:'#c4c9cd' };

function dessinerListe(){
  $('#barre').hidden = false;
  const d = S.donnees;
  const lesAutres = autres();
  const combien = lesAutres.length;

  /* le verdict de chaque séance, calculé une fois */
  const etats = new Map(), compte = { partout:0, partie:0, seul:0, rien:0, discipline:0 };
  d.modules.forEach(m => m.cours.forEach(c => c.seances.forEach(s => {
    const e = etatSeance(cle(c, s), lesAutres);
    etats.set(cle(c, s), e);
    compte[e.verdict]++;
    if (e.autre.length) compte.discipline++;
  })));

  const moiId = S.moi ? `reponse_${S.moi.id}` : null;
  /* moi d'abord, lu en direct : je me vois dès le premier clic, sans attendre l'envoi */
  const liste = [{ ...S.moi, id: moiId, reponses: S.moi.reponses, maj: S.moi.maj, termine: S.moi.termine }]
    .concat(S.gens.filter(g => g.id !== moiId));
  const gens = liste.length
    ? `<ul class="gens">${liste.map(g => {
        const n = Object.values(g.reponses || {}).filter(r => r && r.r).length;
        return `<li><span class="nom">${esc(g.nom)}</span>` +
          `${g.id === moiId ? '<span class="cestmoi">vous</span>' : ''}` +
          `${g.filiere ? `<span class="ou">${esc(nomFiliere(g.filiere))}</span>` : ''}` +
          `<span class="ou">${n} séance${n > 1 ? 's' : ''}</span>` +
          `${g.termine ? '' : '<span class="encours">en cours</span>'}` +
          `${g.maj ? `<span class="ou">${esc(dateCourte(g.maj))}</span>` : ''}` +
          `${GESTION ? `<button type="button" data-supprimer="${esc(g.id)}">supprimer</button>` : ''}</li>`;
      }).join('')}</ul>`
    : '';

  const boutonsVerdict = [['toutes', 'Toutes les séances', d.totaux.seances]]
    .concat(Object.entries(VERDICTS).map(([id, v]) => [id, v.filtre, compte[id]]))
    .concat([[FILTRE_DISCIPLINE, 'Autre discipline', compte.discipline]])
    .map(([id, t, n]) => {
      const c = COULEURS[id] || (id === FILTRE_DISCIPLINE ? COULEURS.partie : null);
      return `<button type="button" data-filtre="${id}" aria-pressed="${S.filtre === id}">` +
        (c ? `<i class="puce" style="background:${c}" aria-hidden="true"></i>` : '') +
        `${t} <span class="cpt">${n}</span></button>`;
    })
    .join('');
  const boutonsFiliere = [['toutes', 'Les deux filières']]
    .concat(Object.entries(FILIERES).map(([id, f]) => [id, f.nom]))
    .map(([id, t]) => {
      const n = id === 'toutes'
        ? S.gens.filter(g => g.id !== moiId).length
        : S.gens.filter(g => g.id !== moiId && g.filiere === id).length;
      return `<button type="button" data-filiere="${id}" aria-pressed="${S.filiere === id}">${t} <span class="cpt">${n}</span></button>`;
    }).join('');

  const sommaire = d.modules.map(m => {
    const tot = m.cours.reduce((n, c) => n + c.seances.length, 0);
    return `<a href="#m_${esc(m.code.replace(/[^\w]/g, '_'))}"><span>${esc(m.code)}</span><span class="cpt">${tot}</span></a>`;
  }).join('');

  const modules = d.modules.map(m => {
    const cours = m.cours.map(c => {
      const seances = c.seances
        .filter(s => {
          if (S.filtre === 'toutes') return true;
          const e = etats.get(cle(c, s));
          return S.filtre === FILTRE_DISCIPLINE ? e.autre.length > 0 : e.verdict === S.filtre;
        })
        .map(s => htmlSeance(c, s, etats.get(cle(c, s)), combien)).join('');
      return seances ? `<article class="cours">
          <h3>${esc(c.titre)}</h3>
          ${c.objectif ? `<p class="obj">${esc(c.objectif)}</p>` : ''}
          ${c.notions_cours.length ? `<div class="notions-cours">${htmlNotions(c.notions_cours, 'Les notions de ce cours')}</div>` : ''}
          ${seances}</article>` : '';
    }).join('');
    return cours ? `<section class="module" id="m_${esc(m.code.replace(/[^\w]/g, '_'))}">
        <h2>${esc(m.nom)}<span class="cadre">${esc(m.cadre)}</span></h2>${cours}</section>` : '';
  }).join('');

  $('#ecran').innerHTML = `
    <div class="entete">
      <h1>Séance par séance</h1>
      <p class="sous">Bonjour ${esc(S.moi.nom)}${S.moi.filiere ? ` — ${esc(nomFiliere(S.moi.filiere))}` : ''}.
      Pour chaque séance, dites si vous la traitez. Les notions s’ouvrent d’un clic si vous voulez voir exactement ce qui est abordé.</p>
      <div class="sommaire no-print">${sommaire}</div>
      <div class="actions no-print">
        <button type="button" class="btn" id="btn-imprimer">Imprimer la liste</button>
        <a class="btn" href="#accueil">Changer mon prénom ou ma filière</a>
      </div>
    </div>
    <div class="bloc no-print">
      <h2>Ont répondu</h2>
      ${gens}
      ${S.lectureKO ? `<p class="message err">${S.lectureKO === 'regles'
          ? 'Le serveur refuse la lecture : la règle Firestore de la collection coordination_capa_cours n’est pas encore publiée (voir LISEZMOI.md).'
          : 'Les réponses des autres n’ont pas pu être lues : connexion au serveur impossible.'}</p>` : ''}
      <p class="quoi-filtre">Ne montrer que</p>
      <div class="filtres" role="group" aria-label="Ne montrer que certaines séances">${boutonsVerdict}</div>
      <p class="quoi-filtre">Comparer avec</p>
      <div class="filtres" role="group" aria-label="Comparer avec une filière">${boutonsFiliere}</div>
    </div>
    ${modules || '<p class="vide">Aucune séance dans ce filtre.</p>'}
    <div class="bloc no-print">
      <p>C’est tout. Quand vous avez répondu à ce que vous pouviez, cliquez sur <b>J’ai terminé</b> en bas.
      Les séances laissées vides resteront simplement sans réponse.</p>
    </div>`;

  majJauge(); majEtat();
  enregistrer();
}

/* ── fin ── */
function dessinerFin(){
  $('#barre').hidden = true;
  /* arrivé ici sans qu'aucun envoi n'ait été tenté (lien direct) : on tente, puis on redessine */
  if (S.envoi === 'attente' && S.moi){
    envoyer().then(() => { if (ecranCourant() === 'fin') dessinerFin(); });
  }
  const compte = { oui:0, non:0, autre:0 };
  S.seances.forEach(({k}) => { const r = reponse(k); if (r && r.r) compte[r.r]++; });
  const sans = S.seances.length - (compte.oui + compte.non + compte.autre);
  const s_ = n => n > 1 ? 's' : '';
  $('#ecran').innerHTML = `
    <div class="entete fin">
      <h1>Merci.</h1>
      <p class="sous">${S.envoi === 'ok'
        ? 'Vos réponses sont enregistrées. Vous pouvez revenir les modifier à tout moment depuis cet appareil.'
        : 'Vos réponses sont gardées sur cet appareil, mais elles n’ont pas pu être envoyées. Téléchargez-les ci-dessous et envoyez le fichier à Brahim.'}</p>
    </div>
    <div class="bloc">
      <h2>Ce que vous avez répondu</h2>
      <ul class="recap">
        <li><b>${compte.oui}</b> <span>séance${s_(compte.oui)} que vous traitez comme moi</span></li>
        <li><b>${compte.non}</b> <span>séance${s_(compte.non)} que vous ne traitez pas</span></li>
        <li><b>${compte.autre}</b> <span>séance${s_(compte.autre)} traitée${s_(compte.autre)} chez vous par une autre discipline</span></li>
        <li><b>${sans}</b> <span>séance${s_(sans)} laissée${s_(sans)} sans réponse</span></li>
      </ul>
      ${S.envoi === 'ok' ? '' : `<p class="message err">Vos réponses n’ont pas pu être envoyées${S.envoi === 'regles' ? ' : le serveur les a refusées' : ' : la connexion a échoué'}.
        Téléchargez-les et envoyez le fichier à Brahim par courriel.</p>`}
      <div class="actions">
        <a class="btn primaire" href="#liste">Revoir la liste et les réponses de tous</a>
        <button type="button" class="btn" id="btn-fichier">Télécharger ma réponse</button>
      </div>
    </div>`;
  $('#btn-fichier').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({ ...S.moi, annee: ANNEE, source: 'capa-cours' }, null, 1)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `capa-${(S.moi.nom || 'reponse').normalize('NFD').replace(/[^\w]+/g, '-').toLowerCase()}.json`;
    a.click(); URL.revokeObjectURL(a.href);
  });
}

/* ═══════════════ actions ═══════════════ */
$('#ecran').addEventListener('change', ev => {
  const k = ev.target.dataset.cle;
  if (!k) return;
  const r = S.moi.reponses[k] || {};
  r.r = ev.target.value;
  S.moi.reponses[k] = r;
  majJauge(); enregistrer();
});
$('#ecran').addEventListener('input', ev => {
  const k = ev.target.dataset.cleCommentaire;
  if (!k) return;
  const r = S.moi.reponses[k] || {};
  r.c = ev.target.value;
  if (!r.r && !r.c) delete S.moi.reponses[k]; else S.moi.reponses[k] = r;
  enregistrer();
});
$('#ecran').addEventListener('click', async ev => {
  if (ev.target.id === 'btn-imprimer'){
    document.querySelectorAll('details.notions').forEach(n => n.open = true);
    print(); return;
  }
  const fv = ev.target.closest('[data-filtre]');
  if (fv){ S.filtre = fv.dataset.filtre; dessinerListe(); annonce(`Filtre : ${fv.textContent.trim()}`); return; }
  const ff = ev.target.closest('[data-filiere]');
  if (ff){ S.filiere = ff.dataset.filiere; dessinerListe(); annonce(`Comparaison : ${ff.textContent.trim()}`); return; }
  const sup = ev.target.closest('[data-supprimer]');
  if (sup){
    const g = S.gens.find(x => x.id === sup.dataset.supprimer);
    if (!g) return;
    if (!confirm(`Supprimer définitivement la réponse de ${g.nom} ? Elle ne pourra pas être récupérée.`)) return;
    try {
      await avecDelai(FS.deleteDoc(FS.doc(db, COL, g.id)), DELAI_MS);
      S.gens = S.gens.filter(x => x.id !== g.id);
      dessinerListe();
      annonce(`Réponse de ${g.nom} supprimée.`);
    } catch(e){ alert('La suppression a échoué : ' + (e && e.message ? e.message : 'erreur inconnue')); }
  }
});
$('#btn-terminer').addEventListener('click', () => {
  S.moi.termine = true;
  enregistrer({ tout_de_suite: true });
  aller('fin');
  annonce('Réponses enregistrées.');
});

/* ═══════════════ départ ═══════════════ */
try {
  const rep = await fetch('donnees-capa.json', { cache:'no-cache' });
  if (!rep.ok) throw new Error(rep.status);
  S.donnees = await rep.json();
} catch(e){
  $('#chargement').outerHTML = '<p class="message err">La liste des cours n’a pas pu être chargée. Rechargez la page ; si cela se reproduit, prévenez Brahim.</p>';
  throw e;
}
S.donnees.modules.forEach(m => m.cours.forEach(c => c.seances.forEach(s => S.seances.push({ k: cle(c, s), cours: c, seance: s }))));

if (!db) S.lectureKO = 'reseau';
else {
  try {
    const snap = await avecDelai(FS.getDocs(FS.query(FS.collection(db, COL), FS.where('type', '==', 'reponse'))), DELAI_MS);
    snap.forEach(doc => { const v = doc.data(); if (v && v.nom) S.gens.push({ ...v, id: doc.id }); });
    S.gens.sort((a, b) => String(a.nom).localeCompare(String(b.nom), 'fr'));
  } catch(e){ S.lectureKO = estRefus(e) ? 'regles' : 'reseau'; }
}
$('#chargement').remove();
dessiner();
</script>
</body>
</html>
