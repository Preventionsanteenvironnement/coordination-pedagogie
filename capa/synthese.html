<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4a7830">
<title>Qui traite quoi en CAPa — mise en commun</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   Qui traite quoi en CAPa — la mise en commun
   ---------------------------------------------------------------
   Lit tous les documents reponse_* de coordination_capa_cours,
   et la même liste de séances que index.html (donnees-capa.json).
   N'écrit rien, sauf la suppression d'une réponse, réservée à
   l'adresse synthese.html?gestion=1 (lien non affiché sur la page).

   Page ouverte : chacun peut voir ce que les autres ont répondu.
   Page en clair, sans mode sombre.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --bg:#f5f7f3; --card:#ffffff; --card-2:#fafbf8;
  --ink:#16200f; --ink-2:#39462f; --muted:#5b6a4e;
  --line:#ccd6c2; --line-2:#e4eade;
  --accent:#4a7830; --accent-d:#3a5f25; --accent-l:#e9f2e2; --on-accent:#ffffff;
  --focus:#1d4ed8;
  --oui:#15803d; --oui-bg:#e6f4ea;
  --aut:#b45309; --aut-bg:#fdf1de;
  --non:#6b7280; --non-bg:#f1f2f4;
  --chaud:#b91c1c; --chaud-bg:#fdecec;
  --err-bg:#fdecec; --err-ink:#8f1d1d; --err-line:#b91c1c;
  --info-bg:#eef3fb; --info-ink:#1e3a8a; --info-line:#1d4ed8;
  --r:14px; --r-s:10px;
  --sh:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html{font-size:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 1rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:0 0 40px}
h1,h2,h3{line-height:1.25;margin:0}
p{margin:.6em 0}
a{color:var(--accent-d)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.marque{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;
  padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.marque b{font-size:1rem}
.marque .retour{font-size:1rem;font-weight:600;color:var(--muted);text-decoration:none}
.marque .retour:hover{color:var(--accent-d);text-decoration:underline}
main{max-width:940px;margin:0 auto;padding:0 16px}
.entete{padding:22px 0 6px}
.entete h1{font-size:1.5rem}
.entete .sous{color:var(--muted);margin-top:6px}

.bloc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin:16px 0}
.message{border-radius:var(--r-s);padding:12px 14px;margin:14px 0;border-left:5px solid}
.message.err{background:var(--err-bg);color:var(--err-ink);border-color:var(--err-line)}
.message.info{background:var(--info-bg);color:var(--info-ink);border-color:var(--info-line)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:11px 18px;
  border-radius:var(--r-s);font:inherit;font-weight:600;cursor:pointer;
  background:var(--card);color:var(--ink-2);border:1px solid var(--line);text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent-d)}
.btn.primaire{background:var(--accent);color:var(--on-accent);border-color:var(--accent-d)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}

/* ── qui a répondu ── */
.gens{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.gens li{display:inline-flex;align-items:center;gap:9px;padding:7px 13px;border:1px solid var(--line);
  border-radius:999px;background:var(--card-2);font-size:.94rem}
.gens .nom{font-weight:600}
.gens .ou{color:var(--muted)}
.gens .encours{color:var(--aut);font-weight:600}
.gens button{border:0;background:none;color:var(--chaud);font:inherit;font-weight:700;cursor:pointer;padding:0 2px;text-decoration:underline}

/* ── filtres ── */
.filtres{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.filtres button{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 15px;
  border:1px solid var(--line);border-radius:999px;background:var(--card);
  font:inherit;font-weight:600;color:var(--ink-2);cursor:pointer}
.filtres button:hover{border-color:var(--accent)}
.filtres button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent-d)}
.filtres .cpt{opacity:.75;font-weight:500}

/* ── séances ── */
.module{margin:26px 0 0}
.module > h2{font-size:1.18rem;padding:13px 16px;background:var(--accent-l);
  border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:var(--r)}
.cours{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin:14px 0;overflow:hidden}
.cours > h3{font-size:1.05rem;padding:14px 16px 4px}
.seance{border-top:1px solid var(--line-2);padding:13px 16px}
.cours > h3 + .seance{border-top:0;padding-top:8px}
.titre{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.titre .num{flex:0 0 auto;min-width:26px;height:26px;border-radius:999px;background:var(--accent-l);
  color:var(--accent-d);font-size:.85rem;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.titre h4{font-size:1rem;font-weight:700;flex:1 1 240px}
.verdict{flex:0 0 auto;font-size:.85rem;font-weight:700;padding:4px 11px;border-radius:999px;white-space:nowrap}
.v-partout{background:var(--chaud-bg);color:var(--chaud)}
.v-partie{background:var(--aut-bg);color:var(--aut)}
.v-seul{background:var(--oui-bg);color:var(--oui)}
.v-rien{background:var(--non-bg);color:var(--non)}
.groupe{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin-top:8px}
.groupe .quoi{font-size:.85rem;font-weight:700;color:var(--muted);min-width:9.5em}
.qui{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px;flex:1 1 200px}
.qui li{font-size:.9rem;padding:4px 11px;border-radius:999px}
.qui .r-oui{background:var(--oui-bg);color:var(--oui)}
.qui .r-autrement{background:var(--aut-bg);color:var(--aut)}
.qui .r-non{background:var(--non-bg);color:var(--non)}
.mots{margin:10px 0 0;padding:11px 13px;background:var(--card-2);border:1px solid var(--line-2);border-radius:var(--r-s)}
.mots p{margin:0 0 7px;font-size:.94rem}
.mots p:last-child{margin-bottom:0}
.mots b{color:var(--aut)}

.vide{color:var(--muted);padding:18px 0}
@media (max-width:560px){ .entete h1{font-size:1.3rem} .seance{padding:13px 12px} .cours > h3{padding-left:12px;padding-right:12px} }

@media print{
  body{padding:0;font-size:10.5pt;background:#fff}
  .marque,.filtres,.actions,.no-print{display:none !important}
  main{max-width:none;padding:0}
  .bloc,.cours{box-shadow:none;break-inside:avoid}
  .module > h2{break-after:avoid;background:#eee}
  .seance{break-inside:avoid}
}
</style>
</head>
<body>

<div class="marque">
  <b>Qui traite quoi en CAPa</b>
  <a class="retour" href="index.html">← La liste à cocher</a>
  <a class="retour" href="../">Portail coordination &amp; pédagogie</a>
</div>

<main>
  <div class="entete">
    <h1>Qui traite quoi</h1>
    <p class="sous">Ce que chacun a répondu, séance par séance. Les séances que tout le monde traite sont celles à discuter en premier.</p>
  </div>
  <div id="ecran"><p id="chargement">Lecture des réponses…</p></div>
  <noscript><p class="message err">Cette page a besoin de JavaScript pour fonctionner.</p></noscript>
</main>

<div id="annonce" class="sr" role="status" aria-live="polite"></div>

<script type="module">
/* ═══════════════ Firebase ═══════════════ */
const firebaseConfig = {
  apiKey:"AIzaSyAWdCMvOiAJln3eT9LIAQD3RWJUD0lQcLI", authDomain:"devoirs-pse.firebaseapp.com",
  projectId:"devoirs-pse", storageBucket:"devoirs-pse.firebasestorage.app",
  messagingSenderId:"614730413904", appId:"1:614730413904:web:a5dd478af5de30f6bede55"
};
const COL = 'coordination_capa_cours';
const DELAI_MS = 15000;
const GESTION = new URLSearchParams(location.search).get('gestion') === '1';

let FS = null, db = null, firebaseKO = null;
try {
  FS = window.__FIRESTORE_SHIM__ || await import('https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js');
  let app = null;
  if (!window.__FIRESTORE_SHIM__){
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js');
    app = initializeApp(firebaseConfig, 'capa-synthese');
  }
  db = FS.getFirestore(app);
} catch(e){ firebaseKO = e; }

/* ═══════════════ outils ═══════════════ */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const annonce = t => { const n = $('#annonce'); if (n) n.textContent = t; };
function avecDelai(p, ms){
  let t;
  return Promise.race([p, new Promise((_, rej) => { t = setTimeout(() => { const e = new Error('Délai dépassé.'); e.code = 'delai'; rej(e); }, ms); })]).finally(() => clearTimeout(t));
}
function typeErreur(e){
  return `${(e && e.code) || ''} ${(e && e.message) || ''}`.includes('permission') ? 'regles' : 'reseau';
}
function dateCourte(iso){
  const d = new Date(iso || '');
  return isNaN(d) ? '' : d.toLocaleDateString('fr-FR', { day:'numeric', month:'long' });
}

/* ═══════════════ état ═══════════════ */
const VERDICTS = {
  partout: { texte:'Tous la traitent',   cls:'v-partout', filtre:'Traitées par tous' },
  partie:  { texte:'Traitée en partie',  cls:'v-partie',  filtre:'Traitées en partie' },
  seul:    { texte:'Personne d’autre',   cls:'v-seul',    filtre:'Personne d’autre' },
  rien:    { texte:'Sans réponse',       cls:'v-rien',    filtre:'Sans réponse' },
};
const S = { donnees:null, gens:[], erreur:null, filtre:'toutes' };

function etatSeance(k){
  const dedans = S.gens.filter(g => g.reponses && g.reponses[k] && g.reponses[k].r);
  const oui = dedans.filter(g => g.reponses[k].r === 'oui');
  const aut = dedans.filter(g => g.reponses[k].r === 'autrement');
  const non = dedans.filter(g => g.reponses[k].r === 'non');
  let verdict = 'rien';
  if (S.gens.length && dedans.length){
    if (oui.length === S.gens.length) verdict = 'partout';
    else if (oui.length + aut.length > 0) verdict = 'partie';
    else if (non.length === dedans.length) verdict = 'seul';
  }
  return { oui, aut, non, dedans, verdict };
}

/* ═══════════════ affichage ═══════════════ */
function htmlSeance(cours, s, etat){
  const k = `${cours.code}/${s.num}`;
  const v = VERDICTS[etat.verdict];
  const traitent = etat.oui.length + etat.aut.length;
  const etiquette = etat.verdict === 'partie'
    ? `${traitent} sur ${S.gens.length} la traitent`
    : v.texte;
  const groupe = (liste, cls, titre) => liste.length
    ? `<div class="groupe"><span class="quoi">${titre}</span>
        <ul class="qui">${liste.map(g => `<li class="r-${cls}">${esc(g.nom)}</li>`).join('')}</ul></div>`
    : '';
  const mots = etat.dedans.filter(g => (g.reponses[k].c || '').trim());
  return `<section class="seance">
    <div class="titre">
      <span class="num" aria-hidden="true">${esc(s.num)}</span>
      <h4><span class="sr">Séance ${esc(s.num)} — </span>${esc(s.titre)}</h4>
      <span class="verdict ${v.cls}">${esc(etiquette)}</span>
    </div>
    ${groupe(etat.oui, 'oui', 'La traitent')}
    ${groupe(etat.aut, 'autrement', 'La traitent autrement')}
    ${groupe(etat.non, 'non', 'Ne la traitent pas')}
    ${mots.length ? `<div class="mots">${mots.map(g => `<p><b>${esc(g.nom)}</b> — ${esc(g.reponses[k].c)}</p>`).join('')}</div>` : ''}
  </section>`;
}

function dessiner(){
  const d = S.donnees;

  /* verdict de chaque séance, calculé une fois */
  const verdicts = new Map();
  const compte = { partout:0, partie:0, seul:0, rien:0 };
  d.modules.forEach(m => m.cours.forEach(c => c.seances.forEach(s => {
    const e = etatSeance(`${c.code}/${s.num}`);
    verdicts.set(`${c.code}/${s.num}`, e);
    compte[e.verdict]++;
  })));

  const gens = S.gens.length
    ? `<ul class="gens">${S.gens.map(g => {
        const n = Object.values(g.reponses || {}).filter(r => r && r.r).length;
        return `<li><span class="nom">${esc(g.nom)}</span>${g.etablissement ? `<span class="ou">${esc(g.etablissement)}</span>` : ''}` +
          `<span class="ou">${n} séance${n > 1 ? 's' : ''}</span>` +
          `${g.termine ? '' : '<span class="encours">en cours</span>'}` +
          `${g.maj ? `<span class="ou">${esc(dateCourte(g.maj))}</span>` : ''}` +
          `${GESTION ? `<button type="button" data-supprimer="${esc(g.id)}">supprimer</button>` : ''}</li>`;
      }).join('')}</ul>`
    : '<p class="vide">Personne n’a encore répondu. Envoyez le lien de la liste à vos collègues.</p>';

  const filtres = [['toutes', 'Toutes les séances', d.totaux.seances]]
    .concat(Object.entries(VERDICTS).map(([id, v]) => [id, v.filtre, compte[id]]))
    .map(([id, texte, n]) => `<button type="button" data-filtre="${id}" aria-pressed="${S.filtre === id}">${texte} <span class="cpt">${n}</span></button>`)
    .join('');

  const modules = d.modules.map(m => {
    const cours = m.cours.map(c => {
      const seances = c.seances
        .filter(s => S.filtre === 'toutes' || verdicts.get(`${c.code}/${s.num}`).verdict === S.filtre)
        .map(s => htmlSeance(c, s, verdicts.get(`${c.code}/${s.num}`)))
        .join('');
      return seances ? `<article class="cours"><h3>${esc(c.titre)}</h3>${seances}</article>` : '';
    }).join('');
    return cours ? `<section class="module"><h2>${esc(m.nom)}</h2>${cours}</section>` : '';
  }).join('');

  $('#ecran').innerHTML = `
    <div class="bloc">
      <h2>Ont répondu</h2>
      ${gens}
      ${S.erreur ? `<p class="message err">${S.erreur === 'regles'
          ? 'Le serveur refuse la lecture : la règle Firestore de la collection coordination_capa_cours n’est pas encore publiée (voir LISEZMOI.md).'
          : 'Les réponses n’ont pas pu être lues : connexion au serveur impossible.'}</p>` : ''}
      <div class="filtres no-print" role="group" aria-label="Ne montrer que certaines séances">${filtres}</div>
    </div>
    ${modules || '<p class="vide">Aucune séance dans ce filtre.</p>'}
    <div class="actions no-print">
      <button type="button" class="btn" id="btn-imprimer">Imprimer cette page</button>
      <a class="btn" href="index.html">Répondre moi aussi</a>
    </div>`;
}

/* ═══════════════ actions ═══════════════ */
document.addEventListener('click', async ev => {
  const f = ev.target.closest('[data-filtre]');
  if (f){ S.filtre = f.dataset.filtre; dessiner(); annonce(`Filtre : ${f.textContent.trim()}`); return; }

  if (ev.target.id === 'btn-imprimer'){ print(); return; }

  const sup = ev.target.closest('[data-supprimer]');
  if (sup){
    const g = S.gens.find(x => x.id === sup.dataset.supprimer);
    if (!g) return;
    if (!confirm(`Supprimer définitivement la réponse de ${g.nom} ? Elle ne pourra pas être récupérée.`)) return;
    try {
      await avecDelai(FS.deleteDoc(FS.doc(db, COL, g.id)), DELAI_MS);
      S.gens = S.gens.filter(x => x.id !== g.id);
      dessiner();
      annonce(`Réponse de ${g.nom} supprimée.`);
    } catch(e){ alert('La suppression a échoué : ' + (e && e.message ? e.message : 'erreur inconnue')); }
  }
});

/* ═══════════════ départ ═══════════════ */
try {
  const rep = await fetch('donnees-capa.json', { cache:'no-cache' });
  if (!rep.ok) throw new Error(rep.status);
  S.donnees = await rep.json();
} catch(e){
  $('#ecran').innerHTML = '<p class="message err">La liste des cours n’a pas pu être chargée. Rechargez la page ; si cela se reproduit, prévenez Brahim.</p>';
  throw e;
}

if (!db){ S.erreur = 'reseau'; }
else {
  try {
    const snap = await avecDelai(FS.getDocs(FS.query(FS.collection(db, COL), FS.where('type', '==', 'reponse'))), DELAI_MS);
    snap.forEach(doc => { const v = doc.data(); if (v && v.nom) S.gens.push({ ...v, id: doc.id }); });
    S.gens.sort((a, b) => String(a.nom).localeCompare(String(b.nom), 'fr'));
  } catch(e){ S.erreur = typeErreur(e); }
}
dessiner();
</script>
</body>
</html>
