<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4437ad">
<title>Observation &amp; besoins des élèves — AESH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   Observation & besoins des élèves — application AESH (établissement)

   Trois axes :
     1. l'activité         → grille GEVA-Sco : cotation, Cadre 1, Cadre 2
     2. le rapport à l'aide → ce qui s'est joué, et ce qui se passe quand
        l'adulte s'éloigne (absent de la grille, décisif pour les heures)
     3. les adaptations    → ce qui est en place, et si ça suffit

   Entrée : code AESH → classe → élève → matière.
   Aucun nom, nulle part : codes seuls.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --bg:#f3f2f8; --card:#ffffff; --card-2:#f8f8fd; --card-3:#f1f0f9;
  --ink:#191533; --ink-2:#4b4568; --faint:#7d7897;
  --line:#e5e3f0; --line-2:#d5d2e6;
  --brand:#5546c8; --brand-d:#4437ad; --brand-l:#7a6ce0; --brand-soft:#edeafb;
  --A:#17804b; --B:#6c8f26; --C:#c07414; --D:#b93f33; --SO:#8b8aa0;
  --A-s:#e3f4ea; --B-s:#eef4e0; --C-s:#fbefdd; --D-s:#fae8e6; --SO-s:#eeedf3;
  --r:20px; --r-m:15px; --r-s:11px; --pill:999px; --on-brand:#ffffff;
  --sh-1:0 1px 2px rgba(25,21,51,.05);
  --sh-2:0 4px 14px rgba(25,21,51,.07),0 1px 3px rgba(25,21,51,.05);
  --sh-3:0 18px 48px rgba(25,21,51,.16);
  --sh-up:0 -14px 44px rgba(25,21,51,.2);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0c1a; --card:#191630; --card-2:#1f1b39; --card-3:#252043;
  --ink:#eceaf7; --ink-2:#b5b0cf; --faint:#837da3;
  --line:#292446; --line-2:#372f5b;
  --brand:#8c7bf0; --brand-d:#a394ff; --brand-l:#a394ff; --brand-soft:#231d46;
  --A:#3cc07c; --B:#9dc44a; --C:#e0a13f; --D:#e8695c; --SO:#8b8aa0;
  --A-s:#122c1f; --B-s:#212a12; --C-s:#2e2413; --D-s:#2f1a18; --SO-s:#221f33;
  --on-brand:#120f24;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 4px 14px rgba(0,0,0,.45);
  --sh-3:0 18px 48px rgba(0,0,0,.6);
  --sh-up:0 -14px 44px rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --bg:#0e0c1a; --card:#191630; --card-2:#1f1b39; --card-3:#252043;
  --ink:#eceaf7; --ink-2:#b5b0cf; --faint:#837da3;
  --line:#292446; --line-2:#372f5b;
  --brand:#8c7bf0; --brand-d:#a394ff; --brand-l:#a394ff; --brand-soft:#231d46;
  --A:#3cc07c; --B:#9dc44a; --C:#e0a13f; --D:#e8695c; --SO:#8b8aa0;
  --A-s:#122c1f; --B-s:#212a12; --C-s:#2e2413; --D-s:#2f1a18; --SO-s:#221f33;
  --on-brand:#120f24;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 4px 14px rgba(0,0,0,.45);
  --sh-3:0 18px 48px rgba(0,0,0,.6);
  --sh-up:0 -14px 44px rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  min-height:100dvh;overscroll-behavior-y:none}
h1,h2,h3{font-family:"Bricolage Grotesque","Inter",sans-serif;font-weight:800;letter-spacing:-.025em;line-height:1.15;margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--brand-l);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.hidden{display:none!important}

/* ───────── écran code ───────── */
#ecran-code{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:28px 22px;text-align:center;
  background:radial-gradient(130% 110% at 12% 0%,#6d5ce6 0%,#5546c8 42%,#3a2d95 100%);color:#fff}
#ecran-code .mark{width:62px;height:62px;border-radius:20px;background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:30px;margin-bottom:20px}
#ecran-code h1{font-size:clamp(1.6rem,6vw,2.05rem);color:#fff}
#ecran-code .sub{margin:11px 0 0;opacity:.86;font-size:.95rem;max-width:21rem;line-height:1.55}
.pave{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:30px;width:min(290px,84vw)}
.pave button{height:58px;border-radius:16px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:1.32rem;font-weight:600;transition:transform .12s,background .15s}
.pave button:active{transform:scale(.94);background:rgba(255,255,255,.26)}
.pave button.fn{font-size:1rem;font-weight:700}
.points{display:flex;gap:13px;margin-top:26px;justify-content:center}
.points i{width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.22);
  border:1.5px solid rgba(255,255,255,.45);transition:background .18s,transform .18s}
.points i.on{background:#fff;transform:scale(1.12)}
#msg-code{min-height:1.5em;margin:18px 0 0;font-size:.9rem;font-weight:600;opacity:.95}
#ecran-code .rgpd{margin-top:26px;font-size:.78rem;opacity:.72;max-width:23rem;line-height:1.5}

/* ───────── chrome ───────── */
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 9px) 14px 9px;
  display:flex;align-items:center;gap:11px}
.icobtn{width:42px;height:42px;flex:none;border-radius:13px;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;box-shadow:var(--sh-1);transition:transform .12s}
.icobtn:active{transform:scale(.92)}
.icobtn svg{width:19px;height:19px;stroke:var(--ink-2);stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}
.topttl{flex:1;min-width:0}
.topttl b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.02rem;
  letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topttl span{display:block;font-size:.74rem;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.moi{flex:none;display:inline-flex;align-items:center;gap:7px;background:var(--brand-soft);color:var(--brand-d);
  border:1px solid color-mix(in srgb,var(--brand) 22%,transparent);border-radius:var(--pill);
  padding:7px 12px;font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
main{max-width:960px;margin:0 auto;padding:16px 14px calc(env(safe-area-inset-bottom) + 46px)}

/* ───────── blocs ───────── */
.hero{background:linear-gradient(140deg,var(--brand-d),var(--brand) 55%,var(--brand-l));
  color:var(--on-brand);border-radius:var(--r);padding:22px 20px;box-shadow:var(--sh-2);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-56px;width:180px;height:180px;border-radius:50%;
  background:rgba(255,255,255,.09)}
.hero h2{font-size:1.28rem;color:var(--on-brand);position:relative}
.hero p{margin:8px 0 0;font-size:.89rem;opacity:.9;position:relative;max-width:34rem}
.kicker{display:inline-block;font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;font-weight:700;
  background:rgba(255,255,255,.2);padding:5px 11px;border-radius:var(--pill);position:relative}
.sect{margin:26px 0 11px;display:flex;align-items:baseline;gap:9px}
.sect h3{font-size:.76rem;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);font-weight:700}
.sect em{font-style:normal;font-size:.76rem;color:var(--faint);margin-left:auto}
.sect .plus{margin-left:11px;border:1.5px solid var(--line);background:var(--card);border-radius:var(--pill);
  padding:7px 14px;font-size:.76rem;font-weight:700;color:var(--brand-d);min-height:38px;cursor:pointer}
.sect .plus:hover{border-color:var(--brand)}
[hidden]{display:none!important}

.grid-cl{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
.cl{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 14px 13px;
  text-align:left;box-shadow:var(--sh-1);position:relative;overflow:hidden;transition:transform .13s,box-shadow .18s,border-color .18s}
.cl:hover{border-color:var(--brand);box-shadow:var(--sh-2)}
.cl:active{transform:scale(.975)}
.cl .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.cl b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.12rem;font-weight:800;letter-spacing:-.02em}
.cl span{display:block;font-size:.76rem;color:var(--faint);margin-top:2px;line-height:1.35}
.cl .n{margin-top:9px;display:inline-flex;align-items:center;gap:5px;font-size:.73rem;font-weight:700;
  color:var(--brand-d);background:var(--brand-soft);padding:3px 9px;border-radius:var(--pill)}

.grid-el{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:10px}
.el{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:13px 8px 11px;
  text-align:center;box-shadow:var(--sh-1);transition:transform .13s,box-shadow .18s,border-color .18s}
.el:hover{border-color:var(--brand);box-shadow:var(--sh-2)}
.el:active{transform:scale(.96)}
.el b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.2rem;font-weight:800;letter-spacing:.02em}
.el small{display:block;font-size:.68rem;color:var(--faint);margin-top:5px;min-height:1em}
.jauge{display:block;height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:7px}
.jauge i{display:block;height:100%;border-radius:99px;background:var(--brand)}
/* élèves notifiés */
.grid-el{row-gap:15px}
.el{position:relative}
.el.nf{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand),var(--sh-1)}
.el.gris{opacity:.5;filter:saturate(0);box-shadow:none;background:var(--card-3)}
.el.gris:hover{opacity:.8}
.nf-tag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:.58rem;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;color:var(--on-brand);background:var(--brand);padding:2px 7px;border-radius:99px;white-space:nowrap}
.nf-aide{font-size:.8rem;color:var(--faint);margin:-4px 0 14px}
.nf-aide b{color:var(--brand)}
.autre-mat{margin-top:14px}
.autre-l{display:flex;gap:8px;align-items:stretch}
.autre-l input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:12px 14px;border-radius:var(--r-m);
  border:1px solid var(--line);background:var(--card);color:var(--ink)}
.autre-l input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
.autre-l .btn{flex:none;width:auto;padding-left:18px;padding-right:18px}
.nf-mini{font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--brand);margin-left:6px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:16px;box-shadow:var(--sh-1)}
.card+.card{margin-top:11px}

.fiche{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh-2);
  display:flex;align-items:center;justify-content:space-between;gap:14px}
.fiche .gauche{flex:1;min-width:0}
.fiche .code{font-family:"Bricolage Grotesque",sans-serif;font-size:2.15rem;font-weight:800;letter-spacing:.01em;line-height:1.05}
.fiche .meta{margin-top:5px}
.fiche .meta span{display:block;font-size:.82rem;color:var(--faint);line-height:1.4}
.ring{width:74px;height:74px;flex:none;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .bgc{stroke:var(--line)}
.ring .fgc{transition:stroke-dashoffset .6s cubic-bezier(.3,.9,.3,1)}
.ring b{font-size:1.15rem;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-variant-numeric:tabular-nums}
.ring small{position:absolute;bottom:9px;font-size:.52rem;color:var(--faint);letter-spacing:.05em;text-transform:uppercase}

.actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:13px}
@media(min-width:560px){.actions{grid-template-columns:1fr 1fr}}
.act{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-m);padding:14px 15px;text-align:left;box-shadow:var(--sh-1);
  transition:transform .13s,box-shadow .18s,border-color .18s}
.act:hover{border-color:var(--brand);box-shadow:var(--sh-2)}
.act:active{transform:scale(.98)}
.act .em{width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:20px;
  background:var(--brand-soft)}
.act b{display:block;font-size:.95rem;font-weight:700}
.act span{display:block;font-size:.78rem;color:var(--faint);line-height:1.4}
.act.primary{background:linear-gradient(135deg,var(--brand-d),var(--brand));border-color:transparent;color:var(--on-brand);grid-column:1/-1}
.act.primary .em{background:rgba(255,255,255,.18)}
.act.primary span{color:var(--on-brand);opacity:.88}

.rub{width:100%;display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-m);padding:14px 15px;text-align:left;margin-bottom:9px;box-shadow:var(--sh-1);
  transition:transform .13s,border-color .18s}
.rub:hover{border-color:var(--brand)}
.rub:active{transform:scale(.985)}
.rub .em{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--card-3)}
.rub b{display:block;font-size:.94rem;font-weight:700;line-height:1.3}
.rub span{display:block;font-size:.76rem;color:var(--faint);margin-top:1px}
.rub .cnt{flex:none;font-size:.74rem;font-weight:700;color:var(--brand-d);background:var(--brand-soft);
  padding:4px 9px;border-radius:var(--pill);font-variant-numeric:tabular-nums}
.rub .cnt.vide{color:var(--faint);background:var(--card-3)}

.acti{width:100%;display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-s);padding:12px 13px;text-align:left;margin-bottom:7px;transition:border-color .18s,transform .12s}
.acti:hover{border-color:var(--brand)}
.acti:active{transform:scale(.985)}
.acti .tx{flex:1;min-width:0}
.acti b{display:block;font-size:.9rem;font-weight:650;line-height:1.35}
.acti span{display:block;font-size:.74rem;color:var(--faint);margin-top:2px;line-height:1.35}
.cotp{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  font-weight:800;font-size:.82rem;font-family:"Bricolage Grotesque",sans-serif}
.cotp.vide{background:var(--card-3);color:var(--faint);font-size:.95rem}
.cot-A{background:var(--A-s);color:var(--A)} .cot-B{background:var(--B-s);color:var(--B)}
.cot-C{background:var(--C-s);color:var(--C)} .cot-D{background:var(--D-s);color:var(--D)}
.cot-SO{background:var(--SO-s);color:var(--SO);font-size:.66rem}

.echelle{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:4px}
@media(min-width:480px){.echelle{grid-template-columns:repeat(4,1fr)}}
.ech{border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-s);padding:13px 10px;text-align:center;
  transition:transform .12s,border-color .15s,background .15s}
.ech:active{transform:scale(.95)}
.ech b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.3rem;font-weight:800}
.ech span{display:block;font-size:.73rem;font-weight:600;margin-top:3px;line-height:1.3;color:var(--ink-2)}
.ech[data-v="A"] b{color:var(--A)} .ech[data-v="B"] b{color:var(--B)}
.ech[data-v="C"] b{color:var(--C)} .ech[data-v="D"] b{color:var(--D)}
.ech[data-v="A"][aria-pressed="true"]{border-color:var(--A);background:var(--A-s)}
.ech[data-v="B"][aria-pressed="true"]{border-color:var(--B);background:var(--B-s)}
.ech[data-v="C"][aria-pressed="true"]{border-color:var(--C);background:var(--C-s)}
.ech[data-v="D"][aria-pressed="true"]{border-color:var(--D);background:var(--D-s)}
.ech-so{width:100%;margin-top:9px;border:1.5px dashed var(--line-2);background:transparent;border-radius:var(--r-s);
  padding:11px;font-size:.83rem;font-weight:600;color:var(--faint)}
.ech-so[aria-pressed="true"]{border-style:solid;border-color:var(--SO);background:var(--SO-s);color:var(--ink-2)}
.sens{margin:11px 0 0;font-size:.84rem;color:var(--ink-2);background:var(--card-3);border-radius:var(--r-s);
  padding:11px 13px;line-height:1.45}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:var(--pill);padding:8px 13px;
  font-size:.83rem;font-weight:550;line-height:1.25;transition:transform .1s,border-color .15s,background .15s}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-d);font-weight:650}
.chip.ob[aria-pressed="true"]{border-color:var(--D);background:var(--D-s);color:var(--D)}
.chip.ap[aria-pressed="true"]{border-color:var(--A);background:var(--A-s);color:var(--A)}
.chip.sm{padding:6px 11px;font-size:.78rem}

.boucle{background:var(--card-2);border:1px solid var(--line);border-left:3px solid var(--brand);
  border-radius:0 var(--r-s) var(--r-s) 0;padding:12px 14px;margin-top:9px}
.boucle .l{margin-bottom:11px}
.boucle .l:last-of-type{margin-bottom:0}
.boucle .l>b{display:block;font-size:.8rem;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.boucle .chips{margin-top:0}
.phrase{margin:11px 0 0;font-size:.87rem;color:var(--ink-2);line-height:1.5;font-style:italic}
.phrase b{color:var(--ink);font-style:normal}

label.lab{display:block;font-size:.79rem;font-weight:700;color:var(--ink-2);margin:17px 0 0;letter-spacing:.01em}
label.lab em{font-style:normal;font-weight:500;color:var(--faint);display:block;font-size:.75rem;margin-top:2px}
textarea,input[type="text"]{width:100%;margin-top:8px;padding:12px 13px;border-radius:var(--r-s);
  border:1.5px solid var(--line);background:var(--card-2);font-size:.92rem;resize:vertical}
textarea:focus,input:focus{border-color:var(--brand);outline:none;background:var(--card)}
.oblig{display:inline-block;font-size:.68rem;font-weight:700;color:var(--D);background:var(--D-s);
  padding:2px 7px;border-radius:var(--pill);margin-left:6px;vertical-align:middle}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:14px;
  background:var(--brand);color:var(--on-brand);font-weight:700;font-size:.94rem;box-shadow:0 4px 14px rgba(85,70,200,.3);
  transition:transform .12s,background .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.42;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:transparent;border:1.5px solid var(--line-2);color:var(--ink-2);box-shadow:none}
.btn.full{width:100%}
.btn.danger{background:transparent;border:1.5px solid var(--D);color:var(--D);box-shadow:none}

#voile{position:fixed;inset:0;background:rgba(16,12,38,.5);backdrop-filter:blur(3px);z-index:40;opacity:0;
  pointer-events:none;transition:opacity .26s}
#voile.on{opacity:1;pointer-events:auto}
#feuille{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
  border-radius:26px 26px 0 0;box-shadow:var(--sh-up);transform:translateY(101%);
  transition:transform .34s cubic-bezier(.22,1,.28,1);max-height:93dvh;display:flex;flex-direction:column;
  max-width:680px;margin:0 auto}
#feuille.on{transform:translateY(0)}
.poignee{width:42px;height:4.5px;border-radius:99px;background:var(--line-2);margin:10px auto 2px;flex:none}
.f-tete{padding:6px 20px 2px;display:flex;align-items:flex-start;gap:12px;flex:none}
.f-tete .t{flex:1;min-width:0}
.f-tete h2{font-size:1.1rem;line-height:1.25}
.f-tete p{margin:4px 0 0;font-size:.8rem;color:var(--faint);line-height:1.4}
.f-x{width:44px;height:44px;flex:none;border-radius:13px;background:var(--card-3);display:grid;place-items:center;
  font-size:17px;color:var(--faint);transition:transform .12s,background .15s}
.f-x:active{transform:scale(.92);background:var(--line)}
.f-corps{padding:12px 20px 4px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.f-pied{padding:13px 20px calc(env(safe-area-inset-bottom) + 15px);border-top:1px solid var(--line);
  background:var(--card);display:flex;gap:10px;align-items:center;flex:none}
.f-pied .btn{flex:1}

.jrn{list-style:none;margin:10px 0 0;padding:0}
.jrn li{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
.jrn li:first-child{border-top:none}
.jrn .p{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.75rem;
  font-weight:800;font-family:"Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums}
.jrn .c{flex:1;min-width:0;text-align:left;background:none;border:none;padding:0}
.jrn .c b{display:block;font-size:.87rem;font-weight:650;line-height:1.35}
.jrn .c span{display:block;font-size:.75rem;color:var(--faint);margin-top:2px;line-height:1.4}
.jrn .c q{display:block;font-size:.8rem;color:var(--ink-2);margin-top:4px;font-style:italic}

.kpi{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-m);padding:15px 16px;box-shadow:var(--sh-1)}
.kpi .n{font-family:"Bricolage Grotesque",sans-serif;font-size:2.5rem;font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums}
.kpi .t{font-size:.79rem;color:var(--ink-2);line-height:1.5}
.kpi .t b{display:block;font-size:.92rem;color:var(--ink);font-weight:700}
.tend{font-weight:700;font-size:.8rem}
.gr{margin-top:11px}
.gr svg{display:block;width:100%;height:auto}
.gr .ax{font-size:8.5px;fill:var(--faint)}
.gr .bl{font-size:9.5px;fill:var(--ink-2)}
.gr .bn{font-size:9.5px;fill:var(--ink-2);font-weight:600}
.verdict{background:var(--card-2);border:1px solid var(--line);border-left:3px solid var(--brand);
  border-radius:0 var(--r-s) var(--r-s) 0;padding:13px 15px;margin-top:13px;font-size:.88rem;line-height:1.55}

.vide{text-align:center;padding:34px 18px;color:var(--faint);font-size:.88rem;line-height:1.6}
.vide .em{font-size:34px;display:block;margin-bottom:10px;opacity:.55}
#etat{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,20px);
  background:var(--ink);color:var(--bg);padding:12px 19px;border-radius:var(--pill);font-size:.86rem;font-weight:600;
  z-index:70;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:var(--sh-3);max-width:88vw;text-align:center}
#etat.on{opacity:1;transform:translate(-50%,0)}
.note-rgpd{margin-top:22px;font-size:.76rem;color:var(--faint);line-height:1.6;background:var(--card-2);
  border:1px solid var(--line);border-radius:var(--r-s);padding:13px 15px}
.hors{display:none;margin-top:10px;font-size:.8rem;font-weight:600;color:var(--C);background:var(--C-s);
  border-radius:var(--r-s);padding:10px 13px}
.hors.on{display:block}

/* ───────── fiche de présentation (4 pages) ─────────
   Montrée avant la première observation d'un élève accompagné, puis à la demande.
   Texte ≥ 18 px, pages courtes, jamais de défilement horizontal. */
#fiche{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.fi-top{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) 16px 6px}
.fi-top .icobtn{width:46px;height:46px}
.fi-tt{flex:1;min-width:0}
.fi-tt b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.4rem;letter-spacing:.01em}
.fi-tt span{display:block;font-size:.88rem;color:var(--faint)}
.fi-tag{flex:none;font-size:.76rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--on-brand);background:var(--brand);padding:7px 12px;border-radius:var(--pill)}
.fi-tag.cours{color:var(--C);background:var(--C-s)}
.fi-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:8px 16px 12px}
.fi-step{display:grid;gap:7px;text-align:left;padding:2px 0;min-height:44px;align-content:end}
.fi-step i{display:block;height:7px;border-radius:99px;background:var(--line-2);transition:background .25s}
.fi-step span{font-size:.8rem;font-weight:600;color:var(--faint);white-space:nowrap}
.fi-step.fait i{background:color-mix(in srgb,var(--brand) 45%,var(--line-2))}
.fi-step.on i{background:var(--brand)}
.fi-step.on span{color:var(--ink);font-weight:800}
#fi-pages{flex:1;position:relative;overflow:hidden}
.fi-page{position:absolute;inset:0;padding:4px 16px 14px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;
  font-size:18px;line-height:1.45;transform:translateX(104%);opacity:0;transition:transform .4s cubic-bezier(.3,.8,.25,1),opacity .3s}
.fi-page.on{transform:none;opacity:1}
.fi-page.avant{transform:translateX(-104%)}
.fi-eyebrow{font-size:.82rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--brand-d)}
.fi-page h2{font-size:1.7rem;margin-top:3px}
.fi-id{background:linear-gradient(150deg,var(--brand-d),var(--brand) 60%,var(--brand-l));color:var(--on-brand);border-radius:26px;padding:20px 22px;position:relative;overflow:hidden}
.fi-id::after{content:"";position:absolute;right:-60px;top:-70px;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.08)}
.fi-kick{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.fi-code{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:3.8rem;line-height:1;letter-spacing:.02em;margin:10px 0 6px}
.fi-cls{font-size:1.15rem;font-weight:600}
.fi-acc{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.fi-h{text-align:center;padding-right:16px;border-right:1px solid var(--line);min-width:92px}
.fi-h b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:2.4rem;font-weight:800;line-height:1;color:var(--brand-d);font-variant-numeric:tabular-nums}
.fi-h span{font-size:.9em;color:var(--faint);font-weight:600}
.fi-t{display:grid;gap:8px;justify-items:start}
.fi-t strong{font-size:1.1em;line-height:1.25}
.fi-pill{display:inline-flex;align-items:center;gap:7px;font-size:.88rem;font-weight:700;padding:6px 12px;border-radius:var(--pill);color:var(--C);background:var(--C-s)}
.fi-lab{font-size:.8rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.fi-lab.w{color:var(--C)} .fi-lab.g{color:var(--A)}
.fi-glance{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.fi-glance div{background:var(--card-2);border:1px solid var(--line);border-radius:18px;padding:14px 8px 12px;display:grid;justify-items:center;gap:8px;text-align:center;color:var(--brand)}
.fi-glance div.alerte{background:var(--C-s);border-color:color-mix(in srgb,var(--C) 35%,transparent);color:var(--C)}
.fi-glance span{font-size:1em;font-weight:700;line-height:1.2;color:var(--ink)}
.fi-list{display:grid;gap:10px}
.fi-row{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 15px 12px 12px}
.fi-tile{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-d)}
.fi-row b{display:block;font-size:1.05em;line-height:1.25}
.fi-row p{margin:3px 0 0;font-size:1em;color:var(--ink-2);line-height:1.35}
.fi-row.now{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 55%,transparent)}
.fi-row.now .fi-tile{background:var(--brand);color:var(--on-brand)}
.fi-now{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-d);margin-bottom:3px}
.fi-row.w .fi-tile{background:var(--C-s);color:var(--C)}
.fi-row.g .fi-tile{background:var(--A-s);color:var(--A)}
.fi-row.fort{background:var(--C-s);border-color:color-mix(in srgb,var(--C) 45%,transparent)}
.fi-row.fort .fi-tile{background:var(--C);color:#fff}
.fi-row.slim{padding:9px 13px 9px 9px;grid-template-columns:44px 1fr}
.fi-row.slim .fi-tile{width:44px;height:44px;border-radius:13px}
.fi-row.slim b{font-size:1em;font-weight:600}
.fi-vide{display:flex;gap:10px;align-items:center;font-size:1em;color:var(--ink-2);background:var(--card-2);border:1px dashed var(--line-2);border-radius:16px;padding:12px 14px}
.fi-nav{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;padding:12px 16px calc(env(safe-area-inset-bottom) + 18px);border-top:1px solid var(--line);background:var(--bg)}
.fi-btn{min-height:58px;border-radius:18px;font-size:1.02rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;transition:transform .12s,opacity .2s}
.fi-btn:active{transform:scale(.97)}
.fi-btn.sec{background:var(--card);border:1px solid var(--line)}
.fi-btn.pri{background:var(--brand);color:var(--on-brand)}
.fi-btn[disabled]{opacity:.38}
svg.fi-i{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fi-row.slim svg.fi-i{width:22px;height:22px}
.fi-pill svg.fi-i{width:16px;height:16px}
.fi-btn svg.fi-i{width:21px;height:21px}
@media (prefers-reduced-motion:reduce){.fi-page,.fi-step i{transition:none}}
.fi-passer{flex:none;min-height:44px;padding:0 14px;border-radius:var(--pill);background:var(--card);border:1px solid var(--line);font-size:.86rem;font-weight:700;color:var(--ink-2)}
.fi-passer:active{transform:scale(.96)}
/* ───────── choix du cours : tuiles par famille ───────── */
.mfam{margin-top:18px}
.mfam-t{display:flex;gap:8px;align-items:center;font-size:.74rem;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:0 0 9px}
.mfam-t .em{font-size:1rem;letter-spacing:0}
.grid-mt{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mt{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 14px 13px;text-align:left;box-shadow:var(--sh-1);
  min-height:64px;display:grid;gap:3px;align-content:center;width:100%;transition:transform .13s,border-color .18s,box-shadow .18s}
.mt b{font-size:.98rem;font-weight:700;line-height:1.25}
.mt span{font-size:.72rem;color:var(--faint)}
.mt:hover{border-color:var(--brand);box-shadow:var(--sh-2)}
.mt:active{transform:scale(.975)}
.mt.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand),var(--sh-1)}
.mt.on span{color:var(--brand-d);font-weight:700}
.mt.maint{background:linear-gradient(140deg,var(--brand-d),var(--brand) 60%,var(--brand-l));color:var(--on-brand);border:0;padding:16px 18px;margin-top:4px}
.mt.maint b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.25rem;font-weight:800}
.mt.maint .mt-k{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--on-brand);opacity:.9}
.mt.autre{margin-top:18px;border-style:dashed;background:var(--card-2)}
.idee{margin-top:18px}
#feuille .chip{min-height:44px;display:inline-flex;align-items:center}
#feuille .chip.sm{font-size:.84rem;padding:8px 13px}
.note-rgpd.mini{margin-top:8px;padding:8px 11px;font-size:.74rem}
.brouillon-tag{display:inline-block;margin-top:8px;font-size:.74rem;font-weight:700;color:var(--brand-d);background:var(--brand-soft);padding:3px 9px;border-radius:var(--pill)}
.moi.attente{background:var(--C-s);color:var(--C);border-color:transparent}
</style>
</head>
<body>

<div id="ecran-code">
  <div class="mark">👁️</div>
  <h1>Observation &amp; besoins</h1>
  <p class="sub">Veuillez taper votre code.</p>
  <div class="points" id="points"><i></i><i></i><i></i><i></i></div>
  <p id="msg-code" role="status" aria-live="polite"></p>
  <div class="pave" id="pave"></div>
  <p class="rgpd">Aucun nom ne circule : ni le vôtre, ni celui de l'élève. Seulement des codes.<br>
    Votre code vous est remis par la coordination.</p>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <button class="icobtn" id="btn-retour" aria-label="Retour">
      <svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg>
    </button>
    <div class="topttl"><b id="t-titre">Les classes</b><span id="t-sous">Choisissez la classe où vous intervenez</span></div>
    <span class="moi attente hidden" id="attente" role="status"></span>
    <span class="moi" id="moi-code" title="Votre code">····</span>
  </div>
  <main id="vue"></main>
</div>

<div id="voile"></div>
<div id="feuille" role="dialog" aria-modal="true" aria-labelledby="f-titre">
  <div class="poignee"></div>
  <div class="f-tete">
    <div class="t"><h2 id="f-titre"></h2><p id="f-sous"></p></div>
    <button class="f-x" id="f-fermer" aria-label="Fermer">✕</button>
  </div>
  <div class="f-corps" id="f-corps"></div>
  <div class="f-pied" id="f-pied"></div>
</div>
<div id="etat" role="status" aria-live="polite"></div>

<div id="fiche" class="hidden" role="dialog" aria-modal="true" aria-labelledby="fi-code">
  <div class="fi-top">
    <button class="icobtn" id="fi-x" aria-label="Fermer la présentation"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="fi-tt"><b id="fi-code"></b><span id="fi-sous"></span></div>
    <span class="fi-tag" id="fi-tag"></span>
    <button class="fi-passer" id="fi-passer">Passer</button>
  </div>
  <nav class="fi-steps" id="fi-steps" aria-label="Pages de la présentation">
    <button class="fi-step"><i></i><span>L’élève</span></button>
    <button class="fi-step"><i></i><span>Sa classe</span></button>
    <button class="fi-step"><i></i><span>Ma mission</span></button>
    <button class="fi-step"><i></i><span>Repères</span></button>
  </nav>
  <div id="fi-pages"></div>
  <div class="fi-nav">
    <button class="fi-btn sec" id="fi-prec"><svg class="fi-i"><use href="#fi-back"/></svg><span>Précédent</span></button>
    <button class="fi-btn pri" id="fi-suiv"><span>Suivant</span><svg class="fi-i"><use href="#fi-next"/></svg></button>
  </div>

const K_NOTIF = 'obs-besoins-notifies';
let NOTIF = null;
function notifsEnCache(){
  try{ const o=JSON.parse(localStorage.getItem(K_NOTIF)||'null'); return (o&&typeof o==='object')?o:null; }
  catch(e){ return null; }
}
async function chargeNotifs(){
  try{
    const s=await getDoc(doc(db,COL,'notifications_'+ANNEE));
    NOTIF=(s.exists()&&s.data().codes)||{};
    try{ localStorage.setItem(K_NOTIF,JSON.stringify(NOTIF)); }catch(e){}
  }catch(e){ NOTIF=notifsEnCache()||NOTIF||{}; }
  return NOTIF;
}
const estNotifie=code=>!!(NOTIF&&NOTIF[code]===true);

function codesEnCache(){
  try{
    const l=JSON.parse(localStorage.getItem(K_CODES)||'null');
    return Array.isArray(l)?new Map(l.filter(p=>p&&p.code).map(p=>[p.code,p])):null;
  }catch(e){ return null; }
}
async function chargeCodes(){
  const [edt, obs]=await Promise.allSettled([
    getDocs(collection(db,COL_EDT)),
    getDocs(query(collection(db,COL),where('type','==','intervenant')))
  ]);
  /* Une des deux listes illisible : on garde la dernière version connue plutôt que
     de refuser quelqu'un à tort. */
  if(edt.status!=='fulfilled'||obs.status!=='fulfilled'){ ACCES=codesEnCache(); return ACCES; }
  const m=new Map();
  edt.value.forEach(d=>{
    const o=d.data()||{}, code=normCode(o.code); if(!code||o.actif===false) return;
    const coordo = d.id==='coordo' || o.id==='coordo' || o.role==='coordonnateur' || o.role==='coordinateur';
    m.set(code,{code, coordo, section:coordo?'':String(o.section||'').toUpperCase(), classes:null, eleves:null});
  });
  obs.value.forEach(d=>{
    const o=d.data()||{}, code=normCode(o.code); if(!code) return;
    if(o.actif===false){ m.delete(code); return; }
    const p=m.get(code)||{code, coordo:false, section:'', classes:null, eleves:null};
    if(Array.isArray(o.classes)&&o.classes.length) p.classes=o.classes.map(String);
    if(Array.isArray(o.eleves)&&o.eleves.length) p.eleves=o.eleves.map(normCode);
    m.set(code,p);
  });
  ACCES=m;
  try{ localStorage.setItem(K_CODES,JSON.stringify([...m.values()])); }catch(e){}
  return ACCES;
}
function codeAutorise(c){
  if(!ACCES) return null;              // on ne sait pas : on laisse passer, vérifié plus tard
  if(ACCES.size===0) return null;      // aucune liste : on n'enferme personne dehors
  return ACCES.has(normCode(c));
}

  return toutes;
}

const COT_PTS={A:100,B:74,C:40,D:12};
function pointsDe(o){
  if(o.type!=='activite'||!o.cotation||o.cotation==='SO') return null;

/* ═══ Revenir en arrière, toujours ═══
   Le geste « retour » du téléphone ferme d'abord ce qui est ouvert (présentation, feuille),
   puis remonte d'un écran : on ne quitte jamais l'application par erreur. */
let viaHistorique=false, retourFeuille=null, cleCourante='classes', entreesVue=0, entreeCouche=false, ignorerPop=0,
    feuilleDeclencheur=null, ficheDeclencheur=null;
/* Une entrée d'historique par écran réellement nouveau (pas à chaque rafraîchissement),
   et une seule pour ce qui s'ouvre par-dessus (présentation, feuille). */
function marque(cle){
  if(cle===cleCourante) return;
  cleCourante=cle;
  if(viaHistorique) return;
  try{ history.pushState({obs:cle},''); entreesVue++; }catch(e){}
}
const horsCouche=el=>(el&&el!==document.body&&!el.closest('#feuille,#fiche'))?el:null;
function coucheOuverte(){ return !$('#fiche').classList.contains('hidden')||$('#feuille').classList.contains('on'); }
function marqueCouche(){ if(entreeCouche||viaHistorique) return; try{ history.pushState({couche:1},''); entreeCouche=true; }catch(e){} }
function quitteCouche(){
  if(!entreeCouche) return;
  entreeCouche=false;
  if(!viaHistorique){ ignorerPop++; try{ history.back(); }catch(e){ ignorerPop--; } }
}
function remonte(){
  if(vue==='bilan') allerEleve(eleveCour);
  else if(vue==='bilan-classe') allerEleves(classeCour);
  else if(vue==='eleve') allerMatiere(eleveCour);
  else if(vue==='matiere') allerEleves(classeCour);
  else if(vue==='eleves') allerClasses();
}
window.addEventListener('popstate',()=>{
  if(ignorerPop>0){ ignorerPop--; return; }
  viaHistorique=true;
  try{
    if(coucheOuverte()){
      entreeCouche=false;
      if(!$('#fiche').classList.contains('hidden')) fermeFiche(false);
      else (retourFeuille||ferme)();
      if(coucheOuverte()){ viaHistorique=false; marqueCouche(); }
    } else if(!$('#app').classList.contains('hidden')&&vue!=='classes'){
      if(entreesVue>0) entreesVue--;
      remonte();
    }
  } finally { viaHistorique=false; }
});
$('#btn-retour').onclick=()=>{
  if(vue==='classes'){ quitte(); return; }
  if(entreesVue>0){
    const avant=vue+'|'+eleveCour;
    history.back();
    // filet : si l'historique ne répond pas, on remonte quand même
    setTimeout(()=>{ if(vue+'|'+eleveCour===avant&&!coucheOuverte()){ entreesVue=0; remonte(); } },450);
  } else remonte();
};
function quitte(){
  if(dansCadre){ dis('Pour changer de code : « Quitter cet espace » dans l\'emploi du temps.'); return; }
  if(!confirm('Quitter cet espace ? Votre code sera oublié sur ce téléphone.')) return;
  try{ localStorage.removeItem(K_CODE); localStorage.removeItem(K_CODE_EDT); }catch(e){}

async function chargeClasse(c){
  obsClasse=[];
  try{
    const snap=await getDocs(query(collection(db,COL),where('classeNom','==',c.nom)));
    obsClasse=snap.docs.map(d=>({...(d.data()||{}),_id:d.id}));
  }catch(e){ obsClasse=[]; }
  const ids=new Set(obsClasse.map(o=>o.id));
  const suppr=suppressionsEnAttente();
  obsClasse=obsClasse.filter(o=>!suppr.has(o.id)).concat(fileLocale().filter(o=>o&&!o._suppr&&o.classeNom===c.nom&&!ids.has(o.id)));
  if(vue!=='eleves'||!classeCour||classeCour.nom!==c.nom) return;
  const par={};
  obsClasse.forEach(o=>{ const k=(o.eleveCode||'').toUpperCase(); if(k)(par[k]=par[k]||[]).push(o); });
  let total=0;
  c.codes.forEach(code=>{
    const l=par[code]||[]; total+=l.length;
    const idx=indiceDe(l.filter(o=>o.type==='activite'));
    const s=document.querySelector('[data-cnt="'+code+'"]');
    if(s) s.textContent = l.length ? (idx!=null ? l.length+' obs. · '+idx : l.length+' obs.') : 'à observer';
    const j=document.querySelector('[data-j="'+code+'"]');
    if(j){ j.style.width=(idx!=null?idx:0)+'%'; j.style.background=tonIdx(idx); }
  });
  const e=$('#cnt-cl'); if(e) e.textContent = total? total+' observations' : 'aucune observation';
}

    try{ localStorage.setItem(K_FICHES,JSON.stringify(toutes)); }catch(e){}

function ficheAller(i,focus){
  const P=[...$('#fi-pages').children]; if(!P.length) return;
  fichePage=Math.max(0,Math.min(P.length-1,i));
  P.forEach((p,k)=>{ p.classList.toggle('on',k===fichePage); p.classList.toggle('avant',k<fichePage); p.inert=(k!==fichePage); });
  document.querySelectorAll('#fi-steps .fi-step').forEach((s,k)=>{ s.classList.toggle('on',k===fichePage); s.classList.toggle('fait',k<fichePage); });
  $('#fi-prec').disabled=(fichePage===0);
  $('#fi-suiv').querySelector('span').textContent=(fichePage===P.length-1)?(ficheApres?'Commencer l’observation':'Fermer'):'Suivant';
  if(focus){ const h=P[fichePage].querySelector('.fi-head'); if(h) h.focus({preventScroll:true}); }
}
function fermeFiche(lancer){
  if($('#fiche').classList.contains('hidden')) return;
  $('#fiche').classList.add('hidden');
  document.body.style.overflow='';
  $('#app').inert=false;
  const suite=ficheApres; ficheApres=null;
  const d=ficheDeclencheur; ficheDeclencheur=null;
  if(lancer&&suite&&entreeCouche&&!viaHistorique){
    // l'entrée d'historique de la présentation devient celle de l'écran suivant
    entreeCouche=false; entreesVue++; viaHistorique=true;
    try{ suite(); } finally { viaHistorique=false; }
    return;
  }
  quitteCouche();
  if(lancer&&suite) suite();
  else if(d&&document.contains(d)) try{ d.focus({preventScroll:true}); }catch(e){}
}

/* ─── 3 · la matière ───
   Des tuiles rangées par famille. En PSR et MELEC, le cours en train de se dérouler
   (emploi du temps de l'application AESH, même site) est proposé en premier. */
const FAMILLES=[
  {t:'Enseignement professionnel', em:'🛠️', re:/PSR|MELEC|R[ée]alisation|Communication technique|Enseignement pro|\bMP\d|Cannage|Vannerie|Chef-d|[ÉE]co-gestion|[ÉE]conomie|Optimisation|Projet BCP|Technique|Travaux pratiques|Maintenance|Culture [ée]co/i},
  {t:'Accompagnement', em:'🤝', re:/Accompagnement|Soutien|Co-enseignement|Vie de classe/i},
  {t:'Enseignement général', em:'📚', re:/./}
];
const normMat=v=>String(v||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
  .replace(/personnalise/g,'perso').replace(/geographie/g,'geo').replace(/[^a-z0-9]+/g,' ').split(' ')
  .filter(w=>w&&['et','de','d','la','le','l','du','des','cap'].indexOf(w)<0);
function memeMatiere(a,b){
  const A=new Set(normMat(a)), B=new Set(normMat(b)); if(!A.size||!B.size) return 0;
  let n=0; A.forEach(w=>{ if(B.has(w)) n++; }); return n/Math.max(A.size,B.size);
}
let GRILLE=null;
async function coursMaintenant(nomClasse){
  try{
    if(!GRILLE) GRILLE=await fetch('../edt-aesh/grille.json',{cache:'no-store'}).then(r=>r.json());
    const ci=GRILLE.classes.findIndex(c=>c.nom===nomClasse); if(ci<0) return null;
    const d=new Date(), jour=iso(d), mn=d.getHours()*60+d.getMinutes();
    const m=t=>{ const p=String(t).split(':'); return (+p[0])*60+(+p[1]); };
    const c=GRILLE.cours.find(x=>x[0]===ci&&x[1]===jour&&m(x[2])-10<=mn&&mn<m(x[3]));
    return c?{matiere:GRILLE.matieres[c[4]], debut:c[2], fin:c[3]}:null;
  }catch(e){ return null; }
}
const matieresDe=nom=>(MATIERES&&MATIERES[nom])?MATIERES[nom]:[];
function allerMatiere(code){

  const groupes=FAMILLES.map(f=>({f:f,l:[]}));

  const tuile=m=>'<button class="mt'+(m===matiereCour?' on':'')+'" data-m="'+esc(m)+'"><b>'+esc(m)+'</b>'+(m===matiereCour?'<span>Votre dernier choix</span>':'')+'</button>';

      +'<div class="grid-mt">'+g.l.map(tuile).join('')+'</div></div>').join('')
   +'<button class="mt autre" id="m-autre" aria-expanded="false"><b>Autre cours…</b><span>Il n\'est pas dans la liste</span></button>'
   +'<div class="autre-mat hidden" id="m-zone">'
   +'<label class="lab" for="m-txt">Quel cours ? <em>Écrivez-le comme sur l\'emploi du temps. La coordination corrigera la liste si besoin.</em></label>'
   +'<div class="autre-l"><input id="m-txt" maxlength="60" autocomplete="off" enterkeyhint="done" placeholder="Ex. : Vie de classe, Atelier…">'
   +'<button class="btn" id="m-ok" disabled>Valider</button></div></div>'
   +'<p class="note-rgpd">Ce sont les matières de l\'emploi du temps de '+esc(classeCour.affiche)+'. Le cours choisi reste en place quand vous passez à un autre élève de la même classe.</p>';
  document.querySelectorAll('#vue [data-m]').forEach(b=>b.onclick=()=>{ matiereCour=b.dataset.m; allerEleve(code); });
  const zone=$('#m-zone'), txt=$('#m-txt'), ok=$('#m-ok'), autre=$('#m-autre');
  autre.onclick=()=>{
    const ouvert=zone.classList.toggle('hidden')===false;
    autre.setAttribute('aria-expanded',String(ouvert));
    if(ouvert) setTimeout(()=>txt.focus(),60);

  txt.oninput=()=>{ ok.disabled=!txt.value.trim(); };

    const best=l.map(m=>[m,memeMatiere(m,c.matiere)]).sort((a,b)=>b[1]-a[1])[0];
    const nom=(best&&best[1]>=0.75)?best[0]:c.matiere;
    const z=$('#m-maint'); if(!z) return;
    z.innerHTML='<button class="mt maint" data-m="'+esc(nom)+'"><span class="mt-k">En ce moment · '+esc(c.debut)+' – '+esc(c.fin)+'</span><b>'+esc(nom)+'</b></button>';
    z.querySelector('[data-m]').onclick=()=>{ matiereCour=nom; allerEleve(code); };
  });
}

function stopFlux(){ try{ if(unsub) unsub(); }catch(e){} unsub=null; }
function ecouteEleve(code){
  stopFlux();
  try{
    unsub=onSnapshot(query(collection(db,COL),where('eleveCode','==',code)),snap=>{
      obsEleve=snap.docs.map(d=>({...(d.data()||{}),_id:d.id}));
      if(vue==='eleve'&&eleveCour===code) rendFiche();
      else if(vue==='bilan'&&eleveCour===code) allerBilan();

  }catch(e){}
}
function fileLocale(){ try{ const l=JSON.parse(localStorage.getItem(K_FILE)||'[]'); return Array.isArray(l)?l:[]; }catch(e){ return []; } }
const suppressionsEnAttente=()=>new Set(fileLocale().filter(x=>x&&x._suppr).map(x=>x.id));
function toutesObs(){
  const suppr=suppressionsEnAttente(), ids=new Set(obsEleve.map(o=>o.id));
  return obsEleve.filter(o=>!suppr.has(o.id))
    .concat(fileLocale().filter(o=>o&&!o._suppr&&o.eleveCode===eleveCour&&!ids.has(o.id)));
}
function rendFiche(){
  const tout=toutesObs(), act=tout.filter(o=>o.type==='activite');
  const vus=new Set(act.map(o=>o.activiteId).filter(Boolean));
  const idx=indiceDe(act);
  const rn=$('#ring-n'); if(rn) rn.textContent = idx!=null?idx:'—';
  const c=document.querySelector('#ring .fgc');
  if(c){ c.style.strokeDashoffset=String(194.8*(1-(idx||0)/100)); c.style.stroke=tonIdx(idx); }
  const cd=act.filter(o=>o.cotation==='C'||o.cotation==='D').length;
  const aesh=new Set(tout.map(o=>o.aeshCode).filter(Boolean)).size;
  const r=$('#f-resume');
  if(r) r.textContent = tout.length
    ? tout.length+' observation'+(tout.length>1?'s':'')+' · '+vus.size+'/'+NB_ACT+' activités · '+cd+' à commenter'+(aesh>1?' · '+aesh+' AESH':'')
    : "Aucune observation pour l'instant";
  const jc=$('#j-cnt'); if(jc) jc.textContent = tout.length? tout.length+(tout.length>1?' entrées':' entrée') : '';
  rendJournal(tout);
}
function libelleObs(o){
  if(o.type==='activite'){
    const a=ACT[o.activiteId], bits=[];
    if(o.cotation&&COTMAP[o.cotation]) bits.push(COTMAP[o.cotation].mot);
    if(o.jai||o.ilA||o.ensuite){
      const p=[];
      if(o.jai) p.push("j'ai "+o.jai.toLowerCase());
      if(o.ilA) p.push('il a '+o.ilA.toLowerCase());
      if(o.ensuite&&ENSMAP[o.ensuite]) p.push(ENSMAP[o.ensuite].t.toLowerCase());
      bits.push(p.join(' → '));
    }
    if((o.obstacles||[]).length) bits.push('bloque : '+o.obstacles.join(', '));
    if((o.appuis||[]).length) bits.push('appui : '+o.appuis.join(', '));
    return {p:o.cotation||'?', cls:'cot-'+(o.cotation||'SO'), ttl:a?a.t:(o.activite||'Activité'), sub:bits.join(' · '), q:o.note||''};
  }
  if(o.type==='note')    return {p:'✍', cls:'cot-SO', ttl:'Note libre', sub:'', q:o.note||''};
  if(o.type==='progres') return {p:'📈', cls:'cot-A', ttl:'Progrès observé', sub:'', q:o.note||''};
  if(o.type==='mission') return {p:'🤝', cls:'cot-B', ttl:"Missions d'aide humaine", sub:(o.missions||[]).join(' · '), q:o.note||''};
  if(o.type==='adaptations'){
    const l=(o.enPlace||[]).map(x=>x.nom+' ('+((EFFETS.find(e=>e.v===x.effet)||{t:''}).t.toLowerCase())+')');
    return {p:'🧩', cls:'cot-SO', ttl:'Ce qui est en place', sub:l.join(' · '), q:o.note||''};
  }
  return {p:'•', cls:'cot-SO', ttl:o.type||'—', sub:'', q:o.note||''};
}
function rendJournal(tout){
  const z=$('#journal'); if(!z) return;
  const l=tout.slice().sort((a,b)=>String(b.creeLe||'').localeCompare(String(a.creeLe||''))).slice(0,50);

  z.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>ouvreEdition(b.dataset.edit));
}

/* Brouillons : ce qui est commencé est gardé sur le téléphone jusqu'à l'enregistrement,
   même après un retour en arrière ou une fermeture. « Annuler » l'efface. */
const K_BROUILLONS='obs-besoins-brouillons';
function brouillons(){ try{ const o=JSON.parse(localStorage.getItem(K_BROUILLONS)||'{}'); return (o&&typeof o==='object')?o:{}; }catch(e){ return {}; } }
function litBrouillon(cle){ return brouillons()[cle]||null; }

  try{ const o=brouillons(); if(val==null) delete o[cle]; else o[cle]=Object.assign({le:new Date().toISOString()},val);
       localStorage.setItem(K_BROUILLONS,JSON.stringify(o)); }catch(e){}

function feuilleRubriques(){
  const act=toutesObs().filter(o=>o.type==='activite'), parRub={};
  act.forEach(o=>{ const r=ACT_RUB[o.activiteId]; if(r)(parRub[r.id]=parRub[r.id]||new Set()).add(o.activiteId); });

    }).join('')+'<p class="note-rgpd">Les cinq domaines sont ceux de la grille GEVA-Sco officielle. Rien n\'oblige à tout remplir : notez seulement ce que vous avez réellement vu.</p>',

  });

function feuilleActivites(rubId){

  });
  ouvre({
    titre:r.em+' '+esc(r.court), sous:"Quelle activité avez-vous observée ?",
    corps:r.items.map(it=>{
      const d=derniere[it.id], cot=d?d.cotation:null;
      return '<button class="acti" data-act="'+it.id+'">'
        +'<span class="tx"><b>'+esc(it.t)+'</b><span>'+esc(it.a)+'</span></span>'

    }).join(''),

/* ─── La saisie : les trois axes ─── */
function feuilleSaisie(actId, existante){
  const it=ACT[actId], r=ACT_RUB[actId];
  const cleS=cleB('act',actId), repris=existante?null:litBrouillon(cleS);
  const b = brouillon = existante ? {
      id:existante.id, cotation:existante.cotation||null,
      obstacles:new Set(existante.obstacles||[]), appuis:new Set(existante.appuis||[]),
      jai:existante.jai||'', ilA:existante.ilA||'', ensuite:existante.ensuite||''
    } : (repris ? { id:null, cotation:repris.cotation||null, obstacles:new Set(repris.obstacles||[]), appuis:new Set(repris.appuis||[]),
          jai:repris.jai||'', ilA:repris.ilA||'', ensuite:repris.ensuite||'' }
        : { id:null, cotation:null, obstacles:new Set(), appuis:new Set(), jai:'', ilA:'', ensuite:'' });
  const chipsOb=(OBS_RUB[r.id]||[]).concat(OBS_COMMUNS);
  const chipsAp=(APP_RUB[r.id]||[]).concat(APP_COMMUNS);
  const cd = b.cotation==='C'||b.cotation==='D';
  ouvre({
    titre:esc(it.t), sous:it.a,
    corps:'<label class="lab" style="margin-top:0">Comment ça s\'est passé ?</label>'
      +'<div class="echelle" id="ech">'
      +COT.map(c=>'<button class="ech" data-v="'+c.v+'" aria-pressed="'+(b.cotation===c.v)+'"><b>'+c.v+'</b><span>'+esc(c.mot)+'</span></button>').join('')
      +'</div>'
      +'<button class="ech-so" id="ech-so" aria-pressed="'+(b.cotation==='SO')+'">Sans objet (ne concerne pas l\'élève)</button>'
      +'<p class="sens" id="sens">'+(b.cotation?esc(COTMAP[b.cotation].sens):'Touchez une réponse — son sens officiel s\'affiche ici.')+'</p>'
      +'<label class="lab">Votre aide, et sa réaction <em>Facultatif — mais c\'est ce qui dira le besoin réel.</em></label>'
      +'<div class="boucle">'
      +'<div class="l"><b>J\'ai</b><div class="chips">'+jaiDe(r.id,b.jai).map(t=>'<button class="chip sm" data-jai="'+esc(t)+'" aria-pressed="'+(b.jai===t)+'">'+esc(t)+'</button>').join('')+'</div></div>'
      +'<div class="l"><b>il a</b><div class="chips">'+ILA.map(t=>'<button class="chip sm" data-ila="'+esc(t)+'" aria-pressed="'+(b.ilA===t)+'">'+esc(t)+'</button>').join('')+'</div></div>'
      +'<div class="l"><b>et ensuite</b><div class="chips">'+ENSUITE.map(e=>'<button class="chip sm" data-ens="'+e.v+'" aria-pressed="'+(b.ensuite===e.v)+'">'+esc(e.t)+'</button>').join('')+'</div></div>'
      +'<p class="phrase" id="phrase"></p></div>'
      +'<div id="zone-cd" class="'+(cd?'':'hidden')+'">'
      +'<label class="lab">Qu\'est-ce qui a bloqué ?<span class="oblig">demandé</span>'
      +'<em>Cadre 1 de la grille : « obstacles à la réalisation de l\'activité ».</em></label>'
      +'<div class="chips">'+chipsOb.map(t=>'<button class="chip ob" data-ob="'+esc(t)+'" aria-pressed="'+b.obstacles.has(t)+'">'+esc(t)+'</button>').join('')+'</div>'
      +'<label class="lab">Sur quoi peut-on s\'appuyer ?<span class="oblig">demandé</span>'
      +'<em>Cadre 2 de la grille : « points d\'appui ». Ce qui l\'aide, ce qu\'il réussit.</em></label>'
      +'<div class="chips">'+chipsAp.map(t=>'<button class="chip ap" data-ap="'+esc(t)+'" aria-pressed="'+b.appuis.has(t)+'">'+esc(t)+'</button>').join('')+'</div>'
      +'</div>'
      +'<label class="lab" for="s-note">Vous voulez préciser ? <em>Facultatif — mais c\'est souvent le plus utile.</em></label>'
      +'<textarea id="s-note" rows="3" placeholder="Ce qui s\'est passé, dans vos mots…">'+(existante?esc(existante.note||''):esc((repris&&repris.note)||''))+'</textarea>'
      +(repris?TAG_BROUILLON:'')+NOTE_NOMS
      +'<div style="height:6px"></div>',
    pied: existante
      ? '<button class="btn danger" id="s-del">Supprimer</button><button class="btn" id="s-ok">Enregistrer</button>'
      : '<button class="btn ghost" id="s-back">←</button><button class="btn" id="s-ok" disabled>Enregistrer</button>',
    retour: existante? ferme : function(){ feuilleActivites(r.id); }
  });

  const zone=$('#zone-cd'), ok=$('#s-ok');
  function phrase(){
    const p=[];
    if(b.jai) p.push("<b>J'ai "+esc(b.jai.toLowerCase())+"</b>");
    if(b.ilA) p.push("<b>il a "+esc(b.ilA.toLowerCase())+"</b>");
    if(b.ensuite&&ENSMAP[b.ensuite]) p.push("<b>"+esc(ENSMAP[b.ensuite].t.toLowerCase())+"</b>");
    $('#phrase').innerHTML = p.length? p.join(' → ')+'.' : '';
  }
  function sauveS(){
    if(existante) return;
    const note=($('#s-note')&&$('#s-note').value)||'';
    const vide=!b.cotation&&!b.obstacles.size&&!b.appuis.size&&!b.jai&&!b.ilA&&!b.ensuite&&!note.trim();
    ecritBrouillon(cleS, vide?null:{cotation:b.cotation,obstacles:[...b.obstacles],appuis:[...b.appuis],jai:b.jai,ilA:b.ilA,ensuite:b.ensuite,note:note});
  }
  function majOk(){
    sauveS();
    if(!b.cotation){ ok.disabled=true; return; }
    if(b.cotation==='C'||b.cotation==='D'){
      const n=$('#s-note'), txt=n?n.value.trim():'';
      ok.disabled = !((b.obstacles.size||txt)&&(b.appuis.size||txt));
    } else ok.disabled=false;
  }
  document.querySelectorAll('#ech .ech').forEach(x=>x.onclick=()=>{
    b.cotation=x.dataset.v;
    document.querySelectorAll('#ech .ech').forEach(y=>y.setAttribute('aria-pressed',String(y===x)));
    $('#ech-so').setAttribute('aria-pressed','false');
    $('#sens').textContent=COTMAP[b.cotation].sens;
    zone.classList.toggle('hidden',!(b.cotation==='C'||b.cotation==='D'));
    majOk();
  });
  $('#ech-so').onclick=()=>{
    b.cotation='SO';
    document.querySelectorAll('#ech .ech').forEach(y=>y.setAttribute('aria-pressed','false'));
    $('#ech-so').setAttribute('aria-pressed','true');
    $('#sens').textContent=COTMAP.SO.sens; zone.classList.add('hidden'); majOk();
  };
  function unique(sel,attr,champ){
    document.querySelectorAll(sel).forEach(x=>x.onclick=()=>{
      const v=x.dataset[attr];
      b[champ] = (b[champ]===v) ? '' : v;
      document.querySelectorAll(sel).forEach(y=>y.setAttribute('aria-pressed',String(b[champ]===y.dataset[attr])));
      phrase(); majOk();
    });
  }
  unique('[data-jai]','jai','jai');
  unique('[data-ila]','ila','ilA');
  unique('[data-ens]','ens','ensuite');
  document.querySelectorAll('[data-ob]').forEach(x=>x.onclick=()=>{
    const t=x.dataset.ob, on=b.obstacles.has(t);
    if(on) b.obstacles.delete(t); else b.obstacles.add(t);
    x.setAttribute('aria-pressed',String(!on)); majOk();
  });
  document.querySelectorAll('[data-ap]').forEach(x=>x.onclick=()=>{
    const t=x.dataset.ap, on=b.appuis.has(t);
    if(on) b.appuis.delete(t); else b.appuis.add(t);
    x.setAttribute('aria-pressed',String(!on)); majOk();
  });
  $('#s-note').oninput=majOk;
  if($('#s-back')) $('#s-back').onclick=()=>feuilleActivites(r.id);
  if($('#s-del')) $('#s-del').onclick=()=>supprime(existante);
  phrase(); majOk();
  ok.onclick=async()=>{
    ok.disabled=true;
    await envoie({
      type:'activite', rubrique:r.id, rubriqueTitre:r.titre,
      activiteId:actId, activite:it.t, cotation:b.cotation,
      obstacles:Array.from(b.obstacles), appuis:Array.from(b.appuis),
      jai:b.jai, ilA:b.ilA, ensuite:b.ensuite,
      note:($('#s-note').value||'').trim()
    }, b.id, existante);
    if(!existante) ecritBrouillon(cleS,null);
    if(existante) ferme(); else feuilleActivites(r.id);
  };
}

/* ─── Édition ─── */
function ouvreEdition(id){
  const o=toutesObs().find(x=>x.id===id); if(!o) return;
  if(o.aeshCode!==moi){ dis("Cette observation est celle d'un collègue — elle ne se modifie pas."); return; }
  if(o.type==='activite'){ feuilleSaisie(o.activiteId,o); return; }
  const v=libelleObs(o);
  ouvre({
    titre:esc(v.ttl), sous:joli(o.date)+(o.matiere?' · '+o.matiere:''),
    corps:(v.sub?'<p class="sens">'+esc(v.sub)+'</p>':'')
      +'<label class="lab" for="e-txt">Votre texte</label>'
      +'<textarea id="e-txt" rows="5">'+esc(o.note||'')+'</textarea>'+NOTE_NOMS,
    pied:'<button class="btn danger" id="e-del">Supprimer</button><button class="btn" id="e-ok">Enregistrer</button>'
  });
  $('#e-del').onclick=()=>supprime(o);
  $('#e-ok').onclick=async()=>{
    $('#e-ok').disabled=true;
    const maj=Object.assign({},o); delete maj._id;
    maj.note=($('#e-txt').value||'').trim(); maj.majLe=new Date().toISOString();
    await envoieBrut(maj,true); ferme();
  };
}
async function supprime(o){
  if(!o) return;
  if(!confirm('Supprimer cette entrée ? Elle ne sera plus visible par la coordination.')) return;
  let fait=false;
  if(reglesOk!==false){ try{ await deleteDoc(doc(db,COL,o.id)); fait=true; }catch(e){ reglesOk=false; } }
  const sans=fileLocale().filter(x=>x.id!==o.id);
  // Sans réseau : la suppression attend dans la file, et l'entrée n'est plus affichée.
  const ok=ecritFile(fait?sans:sans.concat([{id:o.id,_suppr:true,creeLe:new Date().toISOString()}]));
  if(!fait&&!ok){ dis('⚠ Suppression impossible pour l\'instant : réessayez quand vous aurez du réseau.'); return; }
  obsEleve=obsEleve.filter(x=>x.id!==o.id);
  ferme(); rendFiche(); majHors();
  dis(fait?'Entrée supprimée':'Suppression enregistrée : elle sera faite dès le retour du réseau.');
}

/* ═══ Suggestions pour améliorer l'application ═══
   Un document « suggestion_<code>_<horodatage> » : le texte et le code de l'AESH, rien d'autre.
   Sans réseau, la suggestion attend sur le téléphone et part toute seule. */
function feuilleSuggestion(){
  const cle=moi+':suggestion', repris=litBrouillon(cle), deja=(repris&&repris.texte)||'';
  ouvre({
    titre:'💡 Une idée, une suggestion',
    sous:"Ce qui vous aiderait, ce qui manque, ce qui gêne dans l'application. La coordination lit tout.",
    corps:'<label class="lab" style="margin-top:0" for="sg-txt">Votre idée</label>'
      +'<textarea id="sg-txt" rows="6" placeholder="Ex. : pouvoir noter la même chose pour deux élèves…">'+esc(deja)+'</textarea>'
      +(deja?TAG_BROUILLON:'')
      +'<p class="note-rgpd">Ne nommez ni un élève, ni un collègue, ni une famille, ni un établissement. Votre code accompagne la suggestion.</p>',
    pied:'<button class="btn ghost" id="sg-annule">Annuler</button><button class="btn" id="sg-ok"'+(deja.trim()?'':' disabled')+'>Envoyer</button>'
  });
  const ok=$('#sg-ok'), t=$('#sg-txt');
  t.oninput=()=>{ ok.disabled=!t.value.trim(); ecritBrouillon(cle,t.value.trim()?{texte:t.value}:null); };
  $('#sg-annule').onclick=()=>{ ecritBrouillon(cle,null); ferme(); };
  ok.onclick=async()=>{ ok.disabled=true; const parti=await envoieSuggestion(t.value.trim()); if(parti) ecritBrouillon(cle,null); ferme(); };
  setTimeout(()=>{ const x=$('#sg-txt'); if(x&&$('#feuille').classList.contains('on')) x.focus(); },330);
}
async function envoieSuggestion(texte){
  const now=new Date();
  const d={id:'suggestion_'+moi+'_'+now.getTime().toString(36)+Math.random().toString(36).slice(2,6), type:'suggestion', annee:ANNEE, aeshCode:moi,
           texte:texte, date:iso(now), creeLe:now.toISOString(), source:'observation-besoins'};
  if(reglesOk!==false){
    try{ await setDoc(doc(db,COL,d.id),d); dis('✓ Merci ! Votre idée est transmise à la coordination.'); return true; }
    catch(e){ reglesOk=false; }
  }
  if(empile(d)){ dis('✓ Merci ! Elle partira dès que vous aurez du réseau.'); return true; }
  return false;
}

/* ═══ Les bilans ═══ */
function barres(rows,max){
  if(!rows.length) return '<div class="vide" style="padding:18px">Pas encore de donnée.</div>';
  const h=rows.length*29+8;
  return '<div class="gr"><svg viewBox="0 0 300 '+h+'" role="img" aria-label="'
    +esc(rows.map(r=>r[0]+' : '+r[1]).join(', '))+'">'
    +rows.map((r,i)=>{
      const y=i*29, w=Math.max(3,Math.round((r[1]/(max||100))*204));
      return '<text class="bl" x="0" y="'+(y+11)+'">'+esc(String(r[0]).slice(0,34))+'</text>'
        +'<rect x="0" y="'+(y+16)+'" width="'+w+'" height="9" rx="4.5" fill="'+(r[2]||'var(--brand)')+'"/>'
        +'<text class="bn" x="'+(w+7)+'" y="'+(y+24)+'">'+esc(String(r[1]))+'</text>';
    }).join('')+'</svg></div>';
}
function courbe(pts){
  if(pts.length<2) return '';
  const L=26,R=292;
  const xs=i=>L+16+i*((R-L-22)/(pts.length-1));
  const ys=v=>Math.max(10,Math.min(76, 72-((v-30)/70)*58));
  const d=pts.map((p,i)=>xs(i).toFixed(1)+','+ys(p[1]).toFixed(1)).join(' ');
  return '<div class="gr"><svg viewBox="0 0 300 96" role="img" aria-label="Évolution de l\'indice d\'autonomie : '
    +esc(pts.map(p=>p[0]+' '+p[1]).join(', '))+'">'
    +'<line x1="'+L+'" y1="72" x2="'+R+'" y2="72" stroke="var(--line)" stroke-width="1"/>'
    +'<line x1="'+L+'" y1="14" x2="'+R+'" y2="14" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/>'
    +'<text class="ax" x="2" y="76">30</text><text class="ax" x="2" y="18">100</text>'
    +'<polyline points="'+d+'" fill="none" stroke="var(--brand)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>'
    +pts.map((p,i)=>'<circle cx="'+xs(i).toFixed(1)+'" cy="'+ys(p[1]).toFixed(1)+'" r="'+(i===pts.length-1?4.4:3)+'" fill="var(--brand)"/>').join('')
    +'<text class="ax" x="'+(L+8)+'" y="90">'+esc(pts[0][0])+'</text>'
    +'<text class="ax" x="'+(R-32)+'" y="90">'+esc(pts[pts.length-1][0])+'</text>'
    +'</svg></div>';
}
function allerBilan(){ marque('bilan:'+eleveCour);
  vue='bilan';
  const tout=toutesObs(), act=tout.filter(o=>o.type==='activite');
  tete(eleveCour+' · son bilan', classeCour.affiche+' · '+tout.length+' observation'+(tout.length>1?'s':''));
  if(!act.length){
    $('#vue').innerHTML='<div class="card"><div class="vide"><span class="em">📊</span>Pas encore assez d\'observations.<br>Le bilan apparaît dès la première activité notée.</div></div>';
    return;
  }
  const idx=indiceDe(act);
  const tri=act.slice().sort((a,b)=>String(a.creeLe||'').localeCompare(String(b.creeLe||'')));
  const mid=Math.floor(tri.length/2);
  const i1=indiceDe(tri.slice(0,mid||1)), i2=indiceDe(tri.slice(mid));
  const delta=(i1!=null&&i2!=null&&tri.length>=4)?i2-i1:null;

  const parSem={};
  tri.forEach(o=>{ const s=semaineDe(o.date); if(s)(parSem[s]=parSem[s]||[]).push(o); });
  const pts=Object.keys(parSem).sort().map(s=>['S'+s.split('-')[1], indiceDe(parSem[s])]).filter(p=>p[1]!=null);

  const grp=(cle)=>{
    const m={}; act.forEach(o=>{ const k=cle(o); if(k)(m[k]=m[k]||[]).push(o); });
    return Object.keys(m).map(k=>[k,indiceDe(m[k])]).filter(r=>r[1]!=null);
  };
  const mats=grp(o=>o.matiere||'—').sort((a,b)=>b[1]-a[1]).map(r=>[r[0],r[1],tonIdx(r[1])]);
  const doms=grp(o=>{const r=ACT_RUB[o.activiteId];return r?r.court:null;}).sort((a,b)=>b[1]-a[1]).map(r=>[r[0],r[1],tonIdx(r[1])]);

  const ens=compte(act.map(o=>o.ensuite).filter(v=>v&&v!=='nonelo'));
  const nEns=ens.reduce((s,e)=>s+e[1],0);
  const seul=(ens.filter(e=>e[0]==='seul')[0]||[null,0])[1];
  const pctSeul=nEns?Math.round(seul/nEns*100):null;

  const ob=compte([].concat.apply([],act.map(o=>o.obstacles||[]))).slice(0,5);
  const ap=compte([].concat.apply([],act.map(o=>o.appuis||[]))).slice(0,5);
  const jai=compte(act.map(o=>o.jai).filter(Boolean)).slice(0,4);

  let verdict='';
  if(pctSeul!=null){
    verdict = pctSeul>=65
      ? 'Besoin de <b>démarrage</b>, pas de présence continue.<br><span style="color:var(--faint)">Il repart seul dans '+pctSeul+' % des cas où l\'adulte s\'est éloigné. L\'aide est décisive à l\'entrée dans la tâche.</span>'
      : pctSeul>=35
      ? 'Besoin d\'un <b>étayage par moments</b>.<br><span style="color:var(--faint)">Il repart seul dans '+pctSeul+' % des cas : l\'aide doit revenir en cours d\'activité, sans rester en permanence.</span>'
      : 'Besoin d\'une <b>présence rapprochée</b>.<br><span style="color:var(--faint)">Il ne repart seul que dans '+pctSeul+' % des cas où l\'adulte s\'est éloigné.</span>';
  }

  $('#vue').innerHTML=
    '<div class="kpi"><span class="n" style="color:'+tonIdx(idx)+'">'+idx+'</span>'
   +'<span class="t"><b>Indice d\'autonomie</b>'+act.length+' observation'+(act.length>1?'s':'')
   +' · '+new Set(tout.map(o=>o.aeshCode).filter(Boolean)).size+' AESH'
   +(delta!=null?'<br><span class="tend" style="color:'+(delta>=0?'var(--A)':'var(--D)')+'">'+(delta>=0?'▲ +':'▼ ')+delta+' depuis le début</span>':'')
   +'</span></div>'
   +(pts.length>1?'<div class="sect"><h3>Dans le temps</h3></div><div class="card">'+courbe(pts)+'</div>':'')
   +'<div class="sect"><h3>Par matière</h3><em>où c\'est le plus dur</em></div><div class="card">'+barres(mats,100)+'</div>'
   +'<div class="sect"><h3>Par domaine</h3></div><div class="card">'+barres(doms,100)+'</div>'
   +(ens.length?'<div class="sect"><h3>Quand l\'adulte s\'éloigne</h3></div><div class="card"><div class="chips">'
      +ens.map(e=>{ const d=ENSMAP[e[0]]; if(!d) return '';
          const cls = e[0]==='seul'?'ap':(e[0]==='arret'||e[0]==='redem')?'ob':'';
          return '<span class="chip '+cls+'" aria-pressed="true">'+esc(d.t)+' · '+e[1]+'</span>'; }).join('')
      +'</div>'+(verdict?'<div class="verdict">'+verdict+'</div>':'')+'</div>':'')
   +((ob.length||ap.length||jai.length)?'<div class="sect"><h3>Ce qui revient</h3></div><div class="card">'
      +(ob.length?'<label class="lab" style="margin-top:0">Obstacles les plus fréquents</label>'+barres(ob.map(r=>[r[0],r[1],'var(--D)']),ob[0][1]):'')
      +(ap.length?'<label class="lab">Points d\'appui les plus fréquents</label>'+barres(ap.map(r=>[r[0],r[1],'var(--A)']),ap[0][1]):'')
      +(jai.length?'<label class="lab">Ce qui a été fait le plus souvent</label>'+barres(jai.map(r=>[r[0],r[1],'var(--brand)']),jai[0][1]):'')
      +'</div>':'')
   +'<p class="note-rgpd">L\'indice d\'autonomie se calcule à partir de la cotation et de ce qui se passe quand l\'adulte s\'éloigne. Il vaut pour <b>comparer l\'élève à lui-même dans le temps</b>, jamais pour comparer deux élèves.</p>';
}
function allerBilanClasse(){ marque('bilanc:'+(classeCour?classeCour.nom:''));
  vue='bilan-classe';
  tete(classeCour.affiche+' · bilan', classeCour.label);
  const par={};
  obsClasse.forEach(o=>{ const k=(o.eleveCode||'').toUpperCase(); if(k)(par[k]=par[k]||[]).push(o); });
  const rows=classeCour.codes.map(code=>{
    const l=par[code]||[], act=l.filter(o=>o.type==='activite');
    return {code:code, n:l.length, idx:indiceDe(act),
      cd:act.filter(o=>o.cotation==='C'||o.cotation==='D').length,
      vus:new Set(act.map(o=>o.activiteId).filter(Boolean)).size};
  }).filter(r=>r.n);
  if(!rows.length){
    $('#vue').innerHTML='<div class="card"><div class="vide"><span class="em">📊</span>Aucune observation dans cette classe pour l\'instant.</div></div>';
    return;
  }
  rows.sort((a,b)=>(a.idx==null?999:a.idx)-(b.idx==null?999:b.idx));
  const barsIdx=rows.filter(r=>r.idx!=null).map(r=>[r.code,r.idx,tonIdx(r.idx)]);
  const parMat={};
  obsClasse.filter(o=>o.type==='activite').forEach(o=>{ const m=o.matiere||'—'; (parMat[m]=parMat[m]||[]).push(o); });
  const mats=Object.keys(parMat).map(m=>[m,indiceDe(parMat[m])]).filter(r=>r[1]!=null)
    .sort((a,b)=>a[1]-b[1]).map(r=>[r[0],r[1],tonIdx(r[1])]);
  const ob=compte([].concat.apply([],obsClasse.map(o=>o.obstacles||[]))).slice(0,6);
  $('#vue').innerHTML=
    '<div class="sect"><h3>Élèves observés</h3><em>'+rows.length+' sur '+classeCour.codes.length+'</em></div>'
   +'<div class="card">'+barres(barsIdx,100)
   +'<p class="note-rgpd" style="margin-top:12px">Du plus accompagné au plus autonome. Ce n\'est pas un classement d\'élèves : c\'est une carte de l\'accompagnement nécessaire.</p></div>'
   +(mats.length?'<div class="sect"><h3>Matières les plus difficiles</h3><em>pour la classe</em></div><div class="card">'+barres(mats,100)+'</div>':'')
   +(ob.length?'<div class="sect"><h3>Obstacles les plus signalés</h3></div><div class="card">'+barres(ob.map(r=>[r[0],r[1],'var(--D)']),ob[0][1])+'</div>':'')
   +'<div class="sect"><h3>Le détail</h3></div><div class="card"><ul class="jrn">'
   +rows.map(r=>'<li><span class="p" style="background:var(--card-3);color:'+tonIdx(r.idx)+'">'+(r.idx==null?'—':r.idx)+'</span>'
      +'<button class="c" data-open="'+esc(r.code)+'"><b>'+esc(r.code)+'</b>'+(estNotifie(r.code)?'<span class="nf-mini">notifié</span>':'')+'<span>'+r.n+' observation'+(r.n>1?'s':'')
      +' · '+r.vus+'/'+NB_ACT+' activités'+(r.cd?' · '+r.cd+' à commenter':'')+'</span></button></li>').join('')
   +'</ul></div>';
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>allerMatiere(b.dataset.open));
}

/* ═══ Envoi ═══
   Une entrée ne quitte la file d'attente qu'une fois transmise, et seulement la version
   qui a été envoyée : ce qui est ajouté ou modifié pendant un envoi reste en attente. */
async function envoie(extra, idExistant, existante){
  const now=new Date();
  const id = idExistant || (moi+'_'+eleveCour+'_'+now.getTime().toString(36)+Math.random().toString(36).slice(2,6));
  // Modifier une entrée garde son contexte d'origine (classe, matière, date) : on ne corrige que le texte.
  const ctx = existante ? {
      classe:existante.classe||classeCour.affiche, classeNom:existante.classeNom||classeCour.nom, classeLabel:existante.classeLabel||classeCour.label,
      section:existante.section||classeCour.section, diplome:existante.diplome||classeCour.diplome,
      matiere:existante.matiere||'', matiereHorsListe:!!existante.matiereHorsListe
    } : {
      classe:classeCour.affiche, classeNom:classeCour.nom, classeLabel:classeCour.label,
      section:classeCour.section, diplome:classeCour.diplome,
      matiere:matiereCour||'', matiereHorsListe: !!matiereCour && !matieresDe(classeCour.nom).includes(matiereCour)
    };
  const donnee=Object.assign({
    id:id, annee:existante?(existante.annee||ANNEE):ANNEE, eleveCode:existante?(existante.eleveCode||eleveCour):eleveCour
  }, ctx, {
    aeshCode:moi,
    date: existante?(existante.date||iso(now)):iso(now),
    creeLe: existante?(existante.creeLe||now.toISOString()):now.toISOString(),
    majLe: now.toISOString(), source:'observation-besoins'
  }, extra);
  await envoieBrut(donnee, !!idExistant);
}
async function envoieBrut(donnee, estMaj){
  const local=()=>{
    if(!empile(donnee)) return false;
    obsEleve=obsEleve.filter(o=>o.id!==donnee.id).concat([donnee]);
    if(vue==='eleve') rendFiche();
    return true;
  };
  if(reglesOk===false){ if(local()) dis('✓ '+(estMaj?'Modifié':bravo())+' (gardé sur le téléphone)'); return; }
  try{
    await setDoc(doc(db,COL,donnee.id), donnee);
    // une ancienne version encore en attente ne doit pas écraser celle-ci plus tard
    const f=fileLocale(); if(f.some(x=>x.id===donnee.id)) ecritFile(f.filter(x=>x.id!==donnee.id));
    dis('✓ '+(estMaj?'Modifié':bravo()));
  }catch(e){
    reglesOk=false; if(local()) dis('✓ '+bravo()+' (gardé sur le téléphone)');
  }
}
function ecritFile(l){ try{ localStorage.setItem(K_FILE,JSON.stringify(l)); return true; }catch(e){ return false; } }
function empile(d){
  const l=fileLocale().filter(x=>x.id!==d.id); l.push(d);
  const ok=ecritFile(l);
  if(!ok) dis('⚠ Le téléphone n\'a pas pu garder cette entrée (mémoire pleine). Rien n\'est enregistré : réessayez avec du réseau.');
  majHors(); return ok;
}
let vidageEnCours=null;
function videFile(){
  if(!vidageEnCours) vidageEnCours=videFileMaintenant().finally(()=>{ vidageEnCours=null; });
  return vidageEnCours;
}
async function videFileMaintenant(){
  if(reglesOk===false){ majHors(); return; }
  const lot=fileLocale(); if(!lot.length){ majHors(); return; }
  let envoyes=0;
  for(const d of lot){
    try{
      if(d._suppr) await deleteDoc(doc(db,COL,d.id)); else await setDoc(doc(db,COL,d.id),d);
      const signature=JSON.stringify(d);
      ecritFile(fileLocale().filter(x=>!(x.id===d.id&&JSON.stringify(x)===signature)));
      envoyes++;
    }catch(e){ /* reste en attente */ }
  }
  if(envoyes) dis('✓ '+envoyes+' entrée'+(envoyes>1?'s':'')+' en attente transmise'+(envoyes>1?'s':'')+'.');
  majHors();
}
function majHors(){
  const n=fileLocale().length, z=$('#hors'), a=$('#attente');
  const pl=n>1;
  if(a){ a.classList.toggle('hidden',!n); a.textContent='⏳ '+n; a.title=n+' entrée'+(pl?'s':'')+' en attente d\'envoi'; }
  if(!z) return;
  const diag=new URLSearchParams(location.search).get('diag')==='1';
  let txt='';
  if(reglesOk===false){
    txt='Pas de connexion à l\'espace en ligne pour l\'instant.'+(n?' '+n+' entrée'+(pl?'s':'')+' gardée'+(pl?'s':'')+' sur ce téléphone : elle'+(pl?'s partiront':' partira')+' toute'+(pl?'s':'')+' seule'+(pl?'s':'')+' dès le retour du réseau.':'');
    if(diag) txt+=' — diagnostic : la collection « '+COL+' » est refusée ou injoignable.';
  } else if(n){ txt=n+' entrée'+(pl?'s':'')+' en attente d\'envoi : elle'+(pl?'s partiront':' partira')+' dès que vous aurez du réseau.'; }
  z.classList.toggle('on',!!txt); z.textContent=txt;
}
/* Au retour du réseau, et toutes les minutes tant que quelque chose attend : on revérifie
   l'accès en ligne, puis on renvoie. */
function relance(){ if(!moi) return; sondeRegles().then(()=>videFile()); }
window.addEventListener('online',relance);
setInterval(()=>{ if(fileLocale().length&&navigator.onLine!==false) relance(); },60000);

/* ═══ Mémoire locale ═══ */
function recents(){ try{ const l=JSON.parse(localStorage.getItem(K_VUS)||'[]'); return Array.isArray(l)?l:[]; }catch(e){ return []; } }
function memoriseRecent(code){
  try{
    const l=recents().filter(x=>x.code!==code);
    l.unshift({code:code,classe:classeCour.nom,affiche:classeCour.affiche});
    localStorage.setItem(K_VUS,JSON.stringify(l.slice(0,8)));
  }catch(e){}
}
function recentsClasses(){ try{ const l=JSON.parse(localStorage.getItem(K_CL)||'[]'); return Array.isArray(l)?l.slice(0,4):[]; }catch(e){ return []; } }
function memoriseClasse(nom){
  try{
    const l=recentsClasses().filter(x=>x!==nom); l.unshift(nom);
    localStorage.setItem(K_CL,JSON.stringify(l.slice(0,4)));
  }catch(e){}
}

/* ═══ Démarrage ═══ */
(async function boot(){
  construitPave(); majPoints();
  try{
    const r=await fetch('./roster.json',{cache:'no-store'}).then(x=>{ if(!x.ok) throw new Error(x.status); return x.json(); });
    ROSTER=r; try{ localStorage.setItem('obs-besoins-roster',JSON.stringify(r)); }catch(e){}
  }catch(e){
    try{ ROSTER=JSON.parse(localStorage.getItem('obs-besoins-roster')||'null'); }catch(e2){ ROSTER=null; }
    if(!ROSTER||!Array.isArray(ROSTER.classes)){
      $('#msg-code').textContent="Annuaire des classes introuvable. Vérifiez votre connexion.";
      return;
    }
  }
  try{
    MATIERES=await fetch('./matieres.json',{cache:'no-store'}).then(x=>{ if(!x.ok) throw new Error(x.status); return x.json(); });
    try{ localStorage.setItem('obs-besoins-matieres',JSON.stringify(MATIERES)); }catch(e){}
  }catch(e){ try{ MATIERES=JSON.parse(localStorage.getItem('obs-besoins-matieres')||'{}')||{}; }catch(e2){ MATIERES={}; } }
  ACCES=codesEnCache();
  NOTIF=notifsEnCache();
  /* Le code déjà connu sur ce téléphone : celui de l'emploi du temps d'abord quand l'application
     est ouverte depuis son onglet Observation, sinon le sien. */
  let memo=null, memoEdt=null;
  try{ memo=localStorage.getItem(K_CODE); memoEdt=normCode(localStorage.getItem(K_CODE_EDT)||''); }catch(e){}
  const trouve=(dansCadre?[memoEdt,memo]:[memo,memoEdt]).filter(c=>c&&/^\d{4}$/.test(c)).find(c=>codeAutorise(c)!==false);
  if(trouve){ moi=trouve; entre(); }
  else chargeCodes();
})();
