<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f172a">
<title>Gestion des ordinateurs — tableau de bord</title>
<!-- ═══════════════════════════════════════════════════════════════════════
     Informatique — TABLEAU DE BORD de l'enseignant informatique (10/11/2026).
     Accès par code (créé la première fois, gardé sur l'appareil).
     Tableau de bord · plan de chaque salle · fiche de chaque poste · catalogue
     des équipements et des pannes · QR codes · paramètres. Logique : referent.js.
     ═══════════════════════════════════════════════════════════════════════ -->
<link rel="stylesheet" href="commun.css?v=20261110b">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"
        integrity="sha384-mZT2gIty7ZDdOGkxfP6joZcYdMW1Jvj9dRlfpTmaJAKKXTqzygtB22k7FLe+KZC1" crossorigin="anonymous"></script>
<style>
/* ───── Structure ───── */
.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.cote{background:#0f172a;color:#cbd5e1;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.marque{display:flex;gap:10px;align-items:center;padding:0 8px 18px;color:#fff}
.marque .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#3b82f6,#06b6d4);display:flex;align-items:center;justify-content:center;flex:none}
.marque .logo .ico{color:#fff}
.marque b{display:block;font-size:1rem;line-height:1.2}.marque small{color:#94a3b8;font-size:.78rem}
.nav-titre{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#64748b;font-weight:700;padding:14px 10px 6px}
.nav{border:0;background:none;color:#cbd5e1;text-align:left;width:100%;padding:9px 10px;border-radius:10px;display:flex;align-items:center;gap:10px;font-weight:550;font-size:.93rem}
.nav:hover{background:#1e293b;color:#fff}
.nav[aria-current=page]{background:#1e3a8a;color:#fff}
.nav .ico{width:19px;height:19px;opacity:.9}
.nav .pastille{margin-left:auto;background:#be123c;color:#fff;border-radius:99px;font-size:.72rem;font-weight:800;padding:1px 7px;min-width:20px;text-align:center}
.nav .pastille.zero{background:#134e4a;color:#99f6e4}
.contenu{padding:28px 32px 80px;max-width:1280px;width:100%;min-width:0}
.tete{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.tete h1{margin:0;font-size:1.65rem;letter-spacing:-.02em;line-height:1.15}
.tete p{margin:4px 0 0;color:var(--muted)}
.carte{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px;min-width:0}
.carte h2{margin:0 0 14px;font-size:1rem;display:flex;align-items:center;gap:8px;justify-content:space-between}
.carte h2 small{font-weight:500;color:var(--muted);font-size:.85rem}
.grille2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.pile{display:flex;flex-direction:column;gap:18px}
.puces{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.puce{border:0;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line-2);border-radius:99px;padding:7px 13px;font-weight:600;font-size:.86rem;color:var(--ink-2)}
.puce[aria-pressed=true]{background:var(--ink);color:#fff;box-shadow:none}
.puce input{border:0;background:none;padding:0;font:inherit;color:inherit;width:120px}
.suivi{display:inline-flex;align-items:center;gap:4px;background:var(--bleu-l);color:var(--bleu-f);font-size:.72rem;font-weight:700;border-radius:99px;padding:2px 8px;margin:3px 0 2px;max-width:100%}
.suivi .ico{width:13px;height:13px}
.ligne .txt .suivi{margin:4px 0 2px}.ligne .txt small{display:block}
.pc .suivi{align-self:flex-start;line-height:1.2;border-radius:8px}
.puce.on{background:var(--bleu);color:#fff;box-shadow:none}
.puce .ico{width:15px;height:15px;vertical-align:-3px;margin-right:4px}
/* ───── Accueil ───── */
.accueil{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:22px;padding:22px 24px;border-radius:24px;color:#fff;
  background:radial-gradient(120% 160% at 0% 0%,#3b82f6 0%,#1d4ed8 45%,#0e7490 100%);box-shadow:0 18px 40px rgba(29,78,216,.25)}
.acc-g{display:flex;gap:18px;align-items:center;min-width:0}
.accueil .cal{width:70px;flex:none;border-radius:16px;overflow:hidden;background:#fff;color:var(--ink);text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.accueil .cal .m{background:#ef4444;color:#fff;font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:4px 0}
.accueil .cal .j{font-size:1.85rem;font-weight:800;line-height:1.15;padding-top:2px}
.accueil .cal .s{font-size:.68rem;color:var(--muted);font-weight:700;padding-bottom:5px;text-transform:capitalize}
.accueil h1{margin:0;font-size:1.7rem;letter-spacing:-.02em}
.accueil .date{margin:2px 0 0;opacity:.85}
.accueil .resume{margin:8px 0 0;font-weight:600;font-size:1.02rem}
.humeur{background:rgba(255,255,255,.14);border-radius:18px;padding:12px 14px;backdrop-filter:blur(6px)}
.humeur p{margin:0 0 8px;font-weight:600;font-size:.92rem}
.humeur div{display:flex;gap:6px}
.humeur button{border:0;background:rgba(255,255,255,.18);width:44px;height:44px;border-radius:14px;font-size:1.45rem;line-height:1;transition:transform .12s,background .12s}
.humeur button:hover{transform:translateY(-2px) scale(1.06);background:rgba(255,255,255,.3)}
.humeur button[aria-pressed=true]{background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.2);transform:scale(1.1)}
/* ───── Indicateurs ───── */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:18px}
.kpi{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:18px;display:flex;gap:14px;align-items:center;min-width:0}
.kpi .val{font-size:1.9rem;font-weight:800;line-height:1;letter-spacing:-.02em}
.kpi .val small{font-size:.95rem;color:var(--muted);font-weight:600}
.kpi .lib{color:var(--muted);font-size:.85rem;margin-top:5px}
.kpi .badge-ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.anneau{width:62px;height:62px;flex:none}
/* ───── Graphiques ───── */
.histo-zone{position:relative}
.histo-zone svg{width:100%;height:190px;display:block}
.bulle{position:absolute;pointer-events:none;background:#0f172a;color:#fff;font-size:.8rem;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);box-shadow:0 6px 18px rgba(0,0,0,.2)}
.barres{display:flex;flex-direction:column;gap:9px}
.barre{display:grid;grid-template-columns:minmax(110px,170px) 1fr 34px;gap:10px;align-items:center;font-size:.88rem}
.barre .l{display:flex;gap:7px;align-items:center;min-width:0}.barre .l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barre .l .ico{width:17px;height:17px;color:var(--muted)}
.barre .t{height:10px;background:var(--hs-l);border-radius:99px;overflow:hidden}.barre .t i{display:block;height:100%;background:var(--bleu);border-radius:99px}
.barre b{text-align:right}
/* ───── Listes ───── */
.liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ligne{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:14px;background:var(--bg)}
.ligne .pic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.ligne .pic .ico{width:20px;height:20px}
.ligne .txt{flex:1;min-width:0}.ligne .txt b{display:block;font-size:.93rem}.ligne .txt small{color:var(--muted);font-size:.8rem}
.rep{display:inline-block;background:var(--non);color:#fff;font-size:.7rem;font-weight:800;border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.etat-pb{background:var(--pb-l);color:var(--pb)}.etat-panne{background:var(--non-l);color:var(--non)}.etat-ok{background:var(--ok-l);color:var(--ok)}.etat-hs{background:var(--hs-l);color:var(--hs)}
.vide{color:var(--muted);text-align:center;padding:22px 8px}
/* ───── Cartes de salle ───── */
.salles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.salle-carte{border:0;text-align:left;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:18px;display:flex;flex-direction:column;gap:12px;transition:transform .15s,box-shadow .15s}
.salle-carte:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(15,23,42,.10)}
.salle-carte .h{display:flex;justify-content:space-between;gap:10px;align-items:center}
.salle-carte b{font-size:1.05rem}
.salle-carte small{color:var(--muted)}
.mini{display:flex;flex-wrap:wrap;gap:5px}
.mini i{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.74rem;font-weight:800;color:#fff}
.mini i.c-hs{color:var(--hs)}.mini i.c-pb{color:#78350f}
.dispo{display:flex;flex-direction:column;align-items:center;gap:2px}.dispo small{font-size:.72rem;font-weight:600}
.legende i{width:12px;height:12px;border-radius:3px}
.groupe{margin-bottom:14px}.groupe:last-child{margin-bottom:0}
.groupe-t{border:0;background:none;width:100%;display:flex;align-items:center;gap:8px;padding:4px 2px 8px;text-align:left;color:var(--ink)}
.groupe-t .ico{width:18px;height:18px;color:var(--bleu)}
.groupe-t b{font-size:.98rem}
.pastille-g{background:var(--non);color:#fff;border-radius:99px;font-size:.72rem;font-weight:800;padding:1px 8px}
.groupe-t .voir{margin-left:auto;color:var(--bleu);font-size:.84rem;font-weight:600}
.groupe-t:hover .voir{text-decoration:underline}
.c-ok{background:#34d399}.c-pb{background:#fbbf24}.c-panne{background:#f43f5e}.c-hs{background:repeating-linear-gradient(135deg,#cbd5e1 0 3px,#e2e8f0 3px 6px)}
.legende{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.8rem}
.legende span{display:inline-flex;gap:6px;align-items:center}.legende i{width:11px;height:11px;border-radius:3px;display:inline-block}
/* ───── Plan de salle ───── */
.barre-outils{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
.compteurs{display:flex;gap:8px;flex-wrap:wrap}
.compteur{display:inline-flex;gap:7px;align-items:center;border-radius:99px;padding:6px 12px;font-weight:700;font-size:.86rem}
.compteur .ico{width:16px;height:16px}
.plan{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(max(150px,calc((100% - (var(--max,6) - 1) * 12px) / var(--max,6))),1fr))}
.pc{position:relative;border:0;text-align:left;background:#fff;border-radius:16px;padding:12px 12px 11px;box-shadow:inset 0 0 0 1.5px var(--line);display:flex;flex-direction:column;gap:5px;min-height:104px;transition:box-shadow .12s,transform .12s;min-width:0}
.pc.ok{background:#fbfefc;box-shadow:inset 0 0 0 1.5px var(--ok-b)}
.pc:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 1.5px var(--line-2),0 8px 20px rgba(15,23,42,.08)}
.pc.hs{background:repeating-linear-gradient(135deg,#f8fafc 0 10px,#f1f5f9 10px 20px)}
.pc.panne{background:#fffafb;box-shadow:inset 0 0 0 2px var(--non-b)}.pc.pb{background:#fffdf7;box-shadow:inset 0 0 0 2px var(--pb-b)}
.pc .n{font-size:1.35rem;font-weight:800;line-height:1}
.pc .nom{font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .eqs{display:flex;gap:4px;flex-wrap:wrap}
.pc .eqs span{width:24px;height:24px;border-radius:7px;background:var(--bg);color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.pc .eqs span.ko{background:var(--non-l);color:var(--non)}
.pc .eqs .ico{width:15px;height:15px}
.pc .et{font-size:.76rem;font-weight:700;display:flex;gap:5px;align-items:flex-start;margin-top:auto;line-height:1.25}.pc .et .ico{margin-top:1px}
.pc .et .ico{width:14px;height:14px}
.pc.ok .et{color:var(--ok)}.pc.pb .et{color:var(--pb)}.pc.panne .et{color:var(--non)}.pc.hs .et{color:var(--hs)}
.pc .coche{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 2px var(--line-2);background:#fff;display:flex;align-items:center;justify-content:center;color:#fff}
.pc .coche .ico{width:15px;height:15px;stroke-width:3}
.pc.sel{box-shadow:inset 0 0 0 2.5px var(--bleu)}.pc.sel .coche{background:var(--bleu);box-shadow:none}
.pc .alerte{position:absolute;top:10px;right:10px;background:var(--non);color:#fff;font-size:.68rem;font-weight:800;border-radius:99px;padding:1px 7px}
/* ───── Tiroir ───── */
.voile{position:fixed;inset:0;background:rgba(15,23,42,.38);z-index:40;animation:fond .2s}
@keyframes fond{from{opacity:0}}
.tiroir{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;z-index:41;overflow:auto;box-shadow:-20px 0 50px rgba(15,23,42,.18);animation:glisse .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
@keyframes glisse{from{transform:translateX(40px);opacity:.4}}
.tiroir .th{position:sticky;top:0;background:#fff;padding:20px 22px 14px;border-bottom:1px solid var(--line);z-index:2;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.tiroir .th h2{margin:0;font-size:1.3rem}.tiroir .th p{margin:3px 0 0;color:var(--muted);font-size:.88rem}
.tiroir .tc{padding:18px 22px 30px;display:flex;flex-direction:column;gap:20px}
.tiroir .tb{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:14px 22px;display:flex;gap:10px;justify-content:space-between;margin-top:auto}
.fermer{border:0;background:var(--bg);width:36px;height:36px;border-radius:10px;font-size:1.3rem;line-height:1;flex:none}
.section-t{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:0 0 10px}
.champs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.champ{display:flex;flex-direction:column;gap:5px;min-width:0}.champ.plein{grid-column:1/-1}
.champ label,.champ .lab{font-size:.8rem;font-weight:700;color:var(--ink-2)}
.champ input,.champ select,.champ textarea{border:1.5px solid var(--line-2);border-radius:11px;padding:9px 11px;background:#fff;width:100%;min-width:0}
.champ textarea{min-height:64px;resize:vertical}
.equip{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.equip label{display:flex;gap:8px;align-items:center;border-radius:12px;padding:9px 10px;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:600;font-size:.88rem;cursor:pointer}
.equip label:has(input:checked){box-shadow:inset 0 0 0 2px var(--bleu);background:var(--bleu-l);color:var(--bleu-f)}
.equip input{position:absolute;opacity:0;pointer-events:none}
.equip label:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.equip .ico{width:18px;height:18px}
.equip select{border:0;background:none;font-size:.82rem;margin-left:auto;max-width:90px}
.bascule{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:14px;background:var(--bg);font-weight:600}
.bascule input{width:44px;height:26px;appearance:none;background:var(--line-2);border-radius:99px;position:relative;cursor:pointer;flex:none;transition:background .15s}
.bascule input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.bascule input:checked{background:var(--bleu)}.bascule input:checked::after{left:21px}
.frise{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:12px}
.frise li{position:relative;font-size:.88rem}
.frise li::before{content:"";position:absolute;left:-24px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--pb);box-shadow:0 0 0 3px #fff}
.frise li.r::before{background:var(--ok)}
.frise small{color:var(--muted);display:block}
.panne-o{border-radius:14px;background:var(--bg);padding:12px;display:flex;flex-direction:column;gap:10px}
.panne-o .h{display:flex;gap:10px;align-items:center}
.panne-o .h .txt{flex:1}
.actions-rep{display:flex;gap:6px;flex-wrap:wrap}
/* ───── Catalogue ───── */
.cat-l{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.cat-l select{border:1.5px solid var(--line-2);border-radius:10px;padding:6px;background:#fff}
.cat-l input[type=text]{border:1.5px solid var(--line-2);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
.cat-l .ic-ap{width:36px;height:36px;border-radius:10px;background:var(--bleu-l);color:var(--bleu);display:flex;align-items:center;justify-content:center}
.suppr{border:0;background:none;color:var(--muted);font-size:1.2rem;width:32px;height:32px;border-radius:9px}.suppr:hover{background:var(--non-l);color:var(--non)}
/* ───── Accès ───── */
.acces{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(120% 80% at 0% 0%,#1e3a8a 0%,#0f172a 60%)}
.acces .boite{background:#fff;border-radius:24px;padding:30px;width:min(440px,100%);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.acces h1{margin:14px 0 6px;font-size:1.5rem}.acces p{color:var(--muted);margin:0 0 18px}
.acces input{width:100%;border:1.5px solid var(--line-2);border-radius:12px;padding:13px 14px;font-size:1.15rem;letter-spacing:.08em;font-family:ui-monospace,Menlo,monospace}
.code{font-family:ui-monospace,Menlo,monospace;font-size:1.5rem;font-weight:800;letter-spacing:.08em;background:var(--bleu-l);color:var(--bleu-f);border-radius:12px;padding:10px 14px;display:inline-block}
/* ───── QR ───── */
.qr-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.qr-c{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:18px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.qr-c .qr{width:170px;height:170px}.qr-c .qr svg{width:100%;height:100%}
.qr-c small{color:var(--muted);word-break:break-all;font-size:.74rem}
#impression{display:none}
/* ───── Mobile ───── */
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grille2{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .cote{position:sticky;top:0;height:auto;z-index:30;flex-direction:row;overflow-x:auto;padding:10px 12px;gap:6px;align-items:center}
  .marque{padding:0 6px 0 0}.marque div:last-child,.nav-titre{display:none}
  .nav{width:auto;white-space:nowrap;padding:8px 11px}
  .contenu{padding:20px 14px 70px}
  .champs{grid-template-columns:1fr}
}
@media (max-width:620px){

  .kpi{flex-direction:column;align-items:flex-start;gap:10px;padding:14px}
  .kpi .anneau{width:52px;height:52px}.kpi .badge-ic{width:40px;height:40px}
  .kpi .val{font-size:1.6rem}
  .tete h1{font-size:1.4rem}
  .accueil{padding:18px}.accueil h1{font-size:1.4rem}.humeur{width:100%}.humeur div{justify-content:space-between}
  .ligne{flex-wrap:wrap}.ligne .txt{flex:1 1 calc(100% - 52px)}.ligne>.btn{margin-left:50px}
}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  body>*:not(#impression){display:none!important}
  #impression{display:block}
  .affiche{width:210mm;height:297mm;padding:22mm 18mm;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;page-break-after:always;font-family:"Inter",system-ui,Arial,sans-serif;color:#0f172a}
  .affiche .sur{font-size:13pt;letter-spacing:.16em;text-transform:uppercase;color:#2563eb;font-weight:800}
  .affiche h1{font-size:46pt;margin:4mm 0 8mm;line-height:1.05}
  .affiche .qr{width:125mm;height:125mm}.affiche .qr svg{width:100%;height:100%}
  .affiche p{font-size:20pt;margin:9mm 0 0;font-weight:700}
