<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f766e">
<title>Accompagnement PFMP</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Accompagnement PFMP — page en ligne (08/10/2026, v2)
   L'année entière, semaine par semaine ; les PFMP de chaque classe en couleur.
   Seuls les élèves choisis par la coordination (document config_<année>,
   écrit depuis l'Atelier) apparaissent. Par demi-journée : les AESH présents
   (sigle + heures facultatives), un commentaire.
   Lit et écrit : coordination_accompagnement_pfmp
     config_<année>                 { eleves:[{code, classe}] }  (lecture seule ici)
     <année>_<code>_<date>_<m|a>    { pres:[{s, de, a}], note }
   AUCUN NOM : codes de suivi des élèves et sigles des AESH seulement.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{--bg:#f3f6f6;--ink:#122224;--ink2:#3c5054;--muted:#667a7e;--line:#d9e3e3;--card:#fff;
  --teal:#0f766e;--teal-l:#e3f4f0;--teal-d:#0b5b55;--focus:#0f766e;--rouge:#b42335;
  --off:#f1f4f4;--vac:#e5eaea;--col:44px;--nom:150px;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.tete{background:linear-gradient(120deg,#0b5b55 0%,#0f766e 55%,#2a8f86 100%);color:#fff;padding:12px 16px}
.tete .in{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tete a.retour{color:#fff;text-decoration:none;font-weight:700;background:rgba(255,255,255,.16);padding:6px 12px;border-radius:10px}
.tete h1{margin:0;font-size:1.3rem;font-weight:850;letter-spacing:-.01em}
.tete .etat{margin-left:auto;font-size:.85rem;font-weight:700;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:99px;white-space:nowrap}
.tete .etat.ko{background:#fde2e4;color:var(--rouge)}

/* Code */
.porte{max-width:380px;margin:48px auto;padding:0 16px}
.porte .carte{background:#fff;border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(15,118,110,.12)}
.porte h2{margin:0 0 16px;font-size:1.5rem}
.porte input{width:100%;font-size:2rem;letter-spacing:.5em;text-align:center;padding:12px;border:2px solid var(--line);border-radius:14px}
.porte button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:14px;background:var(--teal);color:#fff;font-weight:800;font-size:1.05rem}
.porte .err{color:var(--rouge);font-weight:700;min-height:1.4em;margin-top:8px}

/* Outils */
.outils{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-weight:700;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 12px;font-weight:700;font-size:.92rem}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.sep{flex:1}
.nav{display:flex;gap:6px;align-items:center}

/* Grille */
.cadre{margin:0 16px 24px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:auto;max-height:calc(100vh - 140px);scroll-behavior:smooth;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
table.g{border-collapse:separate;border-spacing:0;font-size:.8rem}
.g th,.g td{padding:0;border-bottom:1px solid var(--line);text-align:center}
.g thead th{position:sticky;background:#fff;z-index:3;color:var(--ink2);font-weight:700}
.g thead tr.r1 th{top:0;height:24px}
.g thead tr.r2 th{top:24px;height:34px}
.g thead tr.r3 th{top:58px;height:18px;font-size:.66rem;color:var(--muted);font-weight:600}
.g .nom{position:sticky;left:0;z-index:2;background:#fff;text-align:left;padding:0 10px;min-width:var(--nom);width:var(--nom);max-width:var(--nom);border-right:1px solid var(--line)}
.g thead .nom{z-index:5}
.g th.sem{border-left:2px solid var(--ink2);text-align:left;padding-left:6px;white-space:nowrap}
.g th.sem.cour{background:var(--teal);color:#fff}
.g th.jour{line-height:1.1;white-space:nowrap}
.g th.jour b{display:block;font-size:.92rem;color:var(--ink)}
.g th.jour.auj b{color:#fff;background:var(--teal);border-radius:8px;padding:0 5px;display:inline-block}
.g th.ma,.g td.c{width:var(--col);min-width:var(--col);max-width:var(--col)}
.g .lun.m{border-left:2px solid var(--ink2)}
.g .a{border-right:1px solid var(--line)}
.g th.vac,.g td.vac{width:30px;min-width:30px;max-width:30px;background:repeating-linear-gradient(45deg,var(--vac) 0 4px,#f7f9f9 4px 8px);border-left:2px solid var(--ink2)}
.g th.vac{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.66rem;color:var(--muted);font-weight:700;letter-spacing:.04em}
tr.cl td{height:28px;background:#fbfcfc}
tr.cl td.nom{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tr.cl td.nom i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
tr.cl td.p{background:var(--cc);color:#fff;font-weight:800;font-size:.66rem}
tr.el td.nom{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:800;letter-spacing:.04em;height:46px}
td.c{height:46px;vertical-align:middle;padding:2px}
td.c.hors{background:#fff}
td.c.ferie{background:repeating-linear-gradient(45deg,var(--vac) 0 4px,#f7f9f9 4px 8px)}
td.c.st{background:var(--cl);cursor:pointer;box-shadow:inset 0 3px 0 var(--cc)}
td.c.st:hover{filter:brightness(.96)}
td.c.st.vide::after{content:"+";color:var(--cc);opacity:.55;font-weight:800;font-size:1rem}
td.c.st.sel{outline:3px solid var(--ink);outline-offset:-3px}
.s{display:block;margin:1px auto;max-width:40px;border-radius:6px;background:var(--cc);color:#fff;font-weight:800;font-size:.7rem;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s.h{background:#fff;color:var(--cc);border:1px solid var(--cc)}
.note{display:block;font-size:.62rem;color:var(--ink2);font-weight:700}
.vide-msg{padding:28px;text-align:center;color:var(--muted)}

/* Bulle */
.voile{position:fixed;inset:0;background:rgba(10,30,32,.28);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.voile{align-items:center}}
.bulle{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:18px 18px 22px;box-shadow:0 -10px 40px rgba(0,0,0,.15);max-height:92vh;overflow:auto}
@media (min-width:700px){.bulle{border-radius:20px}}
.bulle .haut{display:flex;align-items:flex-start;gap:10px}
.bulle h2{margin:0;font-size:1.12rem}
.bulle .sous{color:var(--muted);font-size:.92rem}
.croix{margin-left:auto;border:0;background:var(--off);width:36px;height:36px;border-radius:50%;font-size:1.1rem;flex:none}
.etq{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:16px 0 8px}
.pres{display:flex;align-items:center;gap:6px;padding:8px;border-radius:14px;background:var(--teal-l);margin-bottom:6px;flex-wrap:wrap}
.pres b{min-width:48px;text-align:center;background:var(--teal);color:#fff;border-radius:10px;padding:6px 8px}
.pres input{width:96px;padding:6px;border:1px solid var(--line);border-radius:10px;background:#fff}
.pres .x{margin-left:auto;border:0;background:#fff;border-radius:10px;padding:6px 10px;font-weight:800;color:var(--rouge)}
.aucun{color:var(--muted);font-weight:600;margin:4px 0}
.sigles{display:flex;flex-wrap:wrap;gap:8px}
.sigles button{min-width:60px;padding:10px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:800}
.autre{display:flex;gap:8px;margin-top:8px}
.autre input{flex:1;min-width:0;padding:10px 12px;border:2px solid var(--line);border-radius:12px;text-transform:uppercase}
textarea{width:100%;min-height:64px;padding:10px;border:2px solid var(--line);border-radius:12px;resize:vertical}
.petit{font-size:.75rem;color:var(--muted)}
.copies{display:flex;flex-wrap:wrap;gap:8px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#122224;color:#fff;border-radius:14px;padding:10px 14px;display:flex;gap:12px;align-items:center;z-index:60;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.toast button{background:none;border:0;color:#8ee3d7;font-weight:800}
.toast.err{background:#fde2e4;color:var(--rouge)}

/* Impression */
#feuille{display:none}
.doc{font-family:Arial,Helvetica,sans-serif;color:#000;font-size:11pt}
.doc h2{font-size:14pt;margin:0 0 2mm}
.doc .sous{margin:0 0 4mm;color:#333}
.doc table{width:100%;border-collapse:collapse;margin-bottom:6mm}
.doc th,.doc td{border:1px solid #000;padding:1.6mm 2mm;text-align:left;vertical-align:top}
.doc th{background:#eee}
.doc tr{page-break-inside:avoid}
@media print{
  @page{size:A4 portrait;margin:12mm}
  body.imprime>*:not(#feuille){display:none!important}
  body.imprime #feuille{display:block}
}
@media (max-width:600px){:root{--nom:84px;--col:40px}.tete h1{font-size:1.1rem}.outils{padding:10px 12px}.cadre{margin:0 8px 16px;max-height:calc(100vh - 210px)}tr.cl td.nom{font-size:.72rem}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header class="tete"><div class="in"><a class="retour" href="../">← Portail</a><h1>Accompagnement PFMP</h1><span class="etat" id="etat" hidden></span></div></header>
<div id="app"></div>
<div id="feuille"></div>
<script type="module">
const firebaseConfig = { apiKey:"AIzaSyBj_GXG8ln3GAxNXxiJkT2HPSWIHJpc1lA", authDomain:"coordination-pedagogie.firebaseapp.com",
  projectId:"coordination-pedagogie", storageBucket:"coordination-pedagogie.firebasestorage.app", messagingSenderId:"526058585010", appId:"1:526058585010:web:ba4dd6d9c8281ba5bf02ab" };
const COL = 'coordination_accompagnement_pfmp', ANNEE = '2026-2027', SOURCE = 'accompagnement-pfmp';
/* Empreinte du code d'équipe (le code lui-même n'est écrit nulle part dans le site). */
const EMPREINTE = '0aeed18246d235b14e232301e1e3972f3bc3833a4adbf4391d6eabfe779004db';
const K_OK = 'accompagnement-pfmp-ok';

/* Classes et dates de PFMP 2026-2027 (referents-aesh/edt-lycee.json). Couleur : bande / fond clair. */
const CLASSES = [
  { id:'C1PSR',   lib:'CAP 1 PSR',  cc:'#0f766e', cl:'#e0f2ef', pfmp:[['2027-01-25','2027-02-14'],['2027-06-07','2027-06-27']] },
  { id:'C2PSR',   lib:'CAP 2 PSR',  cc:'#2f8f3a', cl:'#e5f4e3', pfmp:[['2026-11-23','2026-12-20'],['2027-05-10','2027-06-06']] },
  { id:'B2MELEC', lib:'2de MELEC',  cc:'#2563c9', cl:'#e3ecfb', pfmp:[['2027-05-17','2027-06-27']] },
  { id:'B1MELEC', lib:'1re MELEC',  cc:'#5b47c9', cl:'#ebe8fb', pfmp:[['2027-01-18','2027-02-14'],['2027-05-31','2027-06-27']] },
  { id:'BTMELEC', lib:'Tle MELEC',  cc:'#a3369a', cl:'#f6e6f4', pfmp:[['2026-11-09','2026-12-20']] },
  { id:'B2GATL2', lib:'2de GATL 2', cc:'#c2560f', cl:'#fcebdc', pfmp:[['2027-01-04','2027-01-17'],['2027-05-31','2027-06-27']] },
];
/* Équipe PSR · MELEC (referents-aesh/donnees.js) ; d'autres sigles s'ajoutent par « Autre ». */
const SIGLES = ['AND','TI','FI','ST','CÉ','NA'];
/* Vacances et jours fériés 2026-2027, fin incluse (referents-aesh/edt-lycee.json). */
const FERMES = [['2026-10-17','2026-11-01','Toussaint'],['2026-11-11','2026-11-11'],['2026-12-19','2027-01-03','Noël'],['2027-02-13','2027-02-28','Hiver'],
  ['2027-03-29','2027-03-29'],['2027-04-10','2027-04-25','Printemps'],['2027-05-06','2027-05-09'],['2027-05-17','2027-05-17'],['2027-07-03','2027-08-31','Été']];
const DEBUT = '2026-08-31', FIN = '2027-06-28';

/* ─── Dates ─── */
const D = s => new Date(s + 'T12:00:00Z');
const iso = d => d.toISOString().slice(0, 10);
const plus = (s, n) => iso(new Date(D(s).getTime() + n * 864e5));
const jsem = s => (D(s).getUTCDay() + 6) % 7;
const lundi = s => plus(s, -jsem(s));
const ferme = s => FERMES.some(([a, b]) => s >= a && s <= b);
const nomVac = s => (FERMES.find(([a, b, n]) => n && s >= a && s <= b) || [])[2] || 'Vacances';
const fr = s => s.slice(8, 10) + '/' + s.slice(5, 7);
const long = s => D(s).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
const court = s => D(s).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', timeZone: 'UTC' });
const JOURS = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven'];
const MOM = { m: 'Matin', a: 'Après-midi' };
const AUJ = (() => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();
const classe = id => CLASSES.find(c => c.id === id);
const dansPfmp = (c, s) => c.pfmp.some(([a, b]) => s >= a && s <= b);
const enStage = (c, s) => jsem(s) < 5 && !ferme(s) && dansPfmp(c, s);
const periodeDe = (c, s) => c.pfmp.findIndex(([a, b]) => s >= a && s <= b);
/* Colonnes de l'année : une semaine de cours = 10 demi-journées ; des semaines de vacances qui se suivent = une bande. */
const COLONNES = (() => { const r = []; for (let m = DEBUT; m <= FIN; m = plus(m, 7)) {
  const vac = [0, 1, 2, 3, 4].every(k => ferme(plus(m, k)));
  if (vac) { const last = r[r.length - 1]; if (last && last.vac) last.fin = m; else r.push({ vac: true, m, fin: m, nom: nomVac(m) }); }
  else r.push({ vac: false, m }); } return r; })();

/* ─── Firestore ─── */
let FS = null, db = null, erreurFS = null;
try {
  FS = window.__FIRESTORE_SHIM__ || await import('https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js');
  let app = null;
  if (!window.__FIRESTORE_SHIM__) { const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js'); app = initializeApp(firebaseConfig, SOURCE); }
  db = FS.getFirestore(app);
} catch (e) { erreurFS = e; }

const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nettoieSigle = v => String(v || '').toUpperCase().normalize('NFC').replace(/[^A-ZÀ-ÖØ-Þ0-9·.\- ]/g, '').replace(/\s+/g, ' ').trim().slice(0, 8);
const nettoieNote = v => String(v || '').replace(/[\u0000-\u0009\u000b-\u001f\u007f]/g, ' ').slice(0, 300);
const heure = v => /^\d\d:\d\d$/.test(v || '') ? v : '';
const hFr = h => h ? h.replace(/^0/, '').replace(':', 'h').replace(/h00$/, 'h') : '';
const idDe = (code, date, m) => `${ANNEE}_${code}_${date}_${m}`;
const ID_CONFIG = 'config_' + ANNEE;

const S = { ok: false, docs: new Map(), config: null, filtre: 'tous', sel: null, annuler: null };

function etat(t, ko) { const e = $('#etat'); e.hidden = !t; e.textContent = t; e.classList.toggle('ko', !!ko); }
/* Une demi-journée : { pres:[{s,de,a}], note }. Les fiches de la première version (aesh:[…]) se lisent aussi. */
function creneau(code, date, m) {
  const d = S.docs.get(idDe(code, date, m));
  if (!d) return { pres: [], note: '' };
  const pres = Array.isArray(d.pres) ? d.pres : (d.aesh || []).map(s => ({ s, de: '', a: '' }));
  return { pres: pres.map(p => ({ s: p.s, de: heure(p.de), a: heure(p.a) })), note: d.note || '' };
}
const tousSigles = () => { const set = new Set(SIGLES); S.docs.forEach(d => (d.pres || []).forEach(p => set.add(p.s))); return [...set]; };
const elevesDe = c => (S.config?.eleves || []).filter(e => e.classe === c.id).map(e => e.code);

/* ─── Accès ─── */
async function empreinte(code) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('accompagnement-pfmp|' + code));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
function porte(msg) {
  $('#app').innerHTML = `<div class="porte"><form class="carte" id="f"><h2>Code d'équipe</h2>
    <input id="code" inputmode="numeric" autocomplete="off" maxlength="6" aria-label="Code d'équipe" autofocus>
    <button type="submit">Entrer</button><div class="err" role="alert">${esc(msg || '')}</div></form></div>`;
  $('#f').onsubmit = async ev => { ev.preventDefault(); const c = $('#code').value.replace(/\D/g, '');
    if (await empreinte(c) === EMPREINTE) { try { localStorage.setItem(K_OK, EMPREINTE); } catch (_) { } entrer(); }
    else porte('Code inconnu'); };
}
let premier = true;
function entrer() {
  S.ok = true; rendre();
  if (erreurFS || !db) { etat('Hors ligne', true); allerSemaine(lundi(AUJ), false); return; }
  etat('Connexion…');
  const q = FS.query(FS.collection(db, COL), FS.where('annee', '==', ANNEE));
  FS.onSnapshot(q, snap => {
    snap.docChanges().forEach(ch => {
      if (ch.doc.id === ID_CONFIG) { S.config = ch.type === 'removed' ? null : ch.doc.data(); return; }
      if (ch.type === 'removed') S.docs.delete(ch.doc.id); else S.docs.set(ch.doc.id, ch.doc.data());
    });
    etat('En direct'); rendreGrille();
    if (premier) { premier = false; allerSemaine(lundi(AUJ), false); }
  }, () => { etat('Lecture impossible', true); if (premier) { premier = false; allerSemaine(lundi(AUJ), false); } });
}

/* ─── Écran ─── */
function rendre() {
  if (!S.ok) return porte();
  const avant = $('#cadre') ? [$('#cadre').scrollLeft, $('#cadre').scrollTop] : null;
  $('#app').innerHTML = `<div class="outils">
    <div class="chips" role="group" aria-label="Classe">${[{ id: 'tous', lib: 'Toutes' }, ...CLASSES].map(c => `<button class="chip ${S.filtre === c.id ? 'on' : ''}" data-act="filtre" data-v="${c.id}" aria-pressed="${S.filtre === c.id}">${c.cc ? `<i style="background:${c.cc}"></i>` : ''}${esc(c.lib)}</button>`).join('')}</div>
    <span class="sep"></span>
    <div class="nav"><button class="btn" data-act="pas" data-v="-1" aria-label="Semaine précédente">◀</button><button class="btn" data-act="auj">Cette semaine</button><button class="btn" data-act="pas" data-v="1" aria-label="Semaine suivante">▶</button></div>
    <button class="btn pri" data-act="imprimer">Imprimer</button>
  </div><div class="cadre" id="cadre"></div>`;
  rendreGrille();
  if (avant) { $('#cadre').scrollLeft = avant[0]; $('#cadre').scrollTop = avant[1]; }
}
function rendreGrille() {
  const cadre = $('#cadre'); if (!cadre) return;
  const x = cadre.scrollLeft, y = cadre.scrollTop;
  const cls = S.filtre === 'tous' ? CLASSES : CLASSES.filter(c => c.id === S.filtre);
  const lm = lundi(AUJ);
  let r1 = '<tr class="r1"><th class="nom" rowspan="3">Élève</th>', r2 = '<tr class="r2">', r3 = '<tr class="r3">';
  COLONNES.forEach(col => {
    if (col.vac) { r1 += `<th class="vac" rowspan="3" data-sem="${col.m}" data-fin="${col.fin}" title="Vacances ${esc(col.nom)}">${esc(col.nom)}</th>`; return; }
    r1 += `<th class="sem ${col.m === lm ? 'cour' : ''}" colspan="10" data-sem="${col.m}">Semaine du ${court(col.m)}</th>`;
    [0, 1, 2, 3, 4].forEach(k => { const d = plus(col.m, k);
      r2 += `<th class="jour ${k === 0 ? 'lun m' : ''} a ${d === AUJ ? 'auj' : ''}" colspan="2">${JOURS[k]}<b>${D(d).getUTCDate()}</b></th>`;
      r3 += `<th class="ma m ${k === 0 ? 'lun' : ''}">M</th><th class="ma a">AM</th>`; });
  });
  let corps = '';
  cls.forEach(c => {
    const st = `--cc:${c.cc};--cl:${c.cl}`;
    corps += `<tr class="cl" style="${st}"><td class="nom" title="${esc(c.lib)}"><i style="background:${c.cc}"></i>${esc(c.lib)}</td>`;
    COLONNES.forEach(col => {
      if (col.vac) { corps += '<td class="vac"></td>'; return; }
      [0, 1, 2, 3, 4].forEach(k => { const d = plus(col.m, k);
        ['m', 'a'].forEach(mo => { const on = enStage(c, d), p = periodeDe(c, d), debut = on && (k === 0 && mo === 'm' || !enStage(c, plus(d, -1)) && mo === 'm');
          corps += `<td class="c ${mo} ${k === 0 ? 'lun' : ''} ${on ? 'p' : ''}">${debut ? 'PFMP' + (p + 1) : ''}</td>`; }); });
    });
    corps += '</tr>';
    const codes = elevesDe(c);
    codes.forEach(code => {
      corps += `<tr class="el" style="${st}"><td class="nom">${code}</td>`;
      COLONNES.forEach(col => {
        if (col.vac) { corps += '<td class="vac"></td>'; return; }
        [0, 1, 2, 3, 4].forEach(k => { const d = plus(col.m, k);
          ['m', 'a'].forEach(mo => {
            const cl = `c ${mo} ${k === 0 ? 'lun' : ''}`;
            if (!enStage(c, d)) { corps += `<td class="${cl} ${dansPfmp(c, d) && jsem(d) < 5 ? 'ferie' : 'hors'}"></td>`; return; }
            const cr = creneau(code, d, mo), sel = S.sel && S.sel.code === code && S.sel.date === d && S.sel.m === mo;
            const lib = cr.pres.length ? cr.pres.map(p => p.s + (p.de || p.a ? ' ' + hFr(p.de) + '–' + hFr(p.a) : '')).join(', ') : 'personne';
            corps += `<td class="${cl} st ${cr.pres.length ? '' : 'vide'} ${sel ? 'sel' : ''}" data-act="case" data-code="${code}" data-d="${d}" data-m="${mo}" tabindex="0" aria-label="${code} ${long(d)} ${MOM[mo]} : ${esc(lib)}${cr.note ? ' · commentaire' : ''}" title="${esc(lib)}${cr.note ? '\n' + esc(cr.note) : ''}">${cr.pres.map(p => `<span class="s ${p.de || p.a ? 'h' : ''}">${esc(p.s)}</span>`).join('')}${cr.note ? '<span class="note">💬</span>' : ''}</td>`;
          }); });
      });
      corps += '</tr>';
    });
    if (!codes.length) corps += `<tr class="el"><td class="nom" style="font-family:inherit;font-weight:600;color:var(--muted);letter-spacing:0;font-size:.75rem">aucun élève</td><td colspan="999"></td></tr>`;
  });
  cadre.innerHTML = `<table class="g"><thead>${r1}</tr>${r2}</tr>${r3}</tr></thead><tbody>${corps}</tbody></table>`;
  cadre.scrollLeft = x; cadre.scrollTop = y;
  cadre.onscroll = () => { clearTimeout(tScroll); tScroll = setTimeout(() => { cible = plusProche(); }, 250); };
}

/* ─── Défilement semaine par semaine ─── */
let cible = null, tScroll = null;
const semainesVisibles = () => [...document.querySelectorAll('#cadre thead th[data-sem]')].map(t => t.dataset.sem);
function posSemaine(m) {
  const cadre = $('#cadre'), th = $(`#cadre thead th[data-sem="${m}"]`); if (!cadre || !th) return null;
  const nom = cadre.querySelector('thead .nom').getBoundingClientRect().width;
  return cadre.scrollLeft + th.getBoundingClientRect().left - cadre.getBoundingClientRect().left - nom;
}
function allerA(m, doux) {
  const x = posSemaine(m); if (x == null) return;
  cible = m; $('#cadre').scrollTo({ left: Math.max(0, x), behavior: doux === false ? 'instant' : 'smooth' });
}
/* Une date → la colonne qui la contient (semaine de cours, ou bande de vacances). */
function allerSemaine(m, doux) {
  const col = COLONNES.find(c => c.vac ? m >= c.m && m <= c.fin : c.m === m) || (m < DEBUT ? COLONNES[0] : COLONNES[COLONNES.length - 1]);
  allerA(col.m, doux);
}
function plusProche() {
  const c = $('#cadre'); let best = null, e = Infinity;
  semainesVisibles().forEach(m => { const d = Math.abs(posSemaine(m) - c.scrollLeft); if (d < e) { e = d; best = m; } });
  return best;
}
function pas(n) {
  const l = semainesVisibles(); if (!l.length) return;
  const base = l.includes(cible) ? cible : plusProche();
  allerA(l[Math.min(l.length - 1, Math.max(0, l.indexOf(base) + n))]);
}
/* Une classe → son stage en cours, sinon le prochain, sinon le dernier. */
function allerStage(c) {
  const p = c.pfmp.find(([a, b]) => b >= AUJ) || c.pfmp[c.pfmp.length - 1];
  let d = p[0] < AUJ ? AUJ : p[0]; while (!enStage(c, d) && d < p[1]) d = plus(d, 1);
  allerSemaine(lundi(d));
}

/* ─── Bulle d'une demi-journée ─── */
function ouvrirBulle(code, date, m) {
  S.sel = { code, date, m }; rendreGrille();
  const c = classe((S.config?.eleves || []).find(e => e.code === code)?.classe);
  const autreM = m === 'm' ? 'a' : 'm';
  const v = document.createElement('div'); v.className = 'voile'; v.id = 'voile';
  document.body.appendChild(v);
  const peindre = () => {
    const cr = creneau(code, date, m), libres = tousSigles().filter(s => !cr.pres.some(p => p.s === s));
    v.innerHTML = `<div class="bulle" role="dialog" aria-modal="true" aria-labelledby="bt">
    <div class="haut"><div><h2 id="bt">${esc(long(date))} · ${MOM[m]}</h2><div class="sous"><b>${code}</b> · ${esc(c ? c.lib : '')}</div></div><button class="croix" data-b="fermer" aria-label="Fermer">✕</button></div>
    <div class="etq">Présents</div>
    ${cr.pres.length ? cr.pres.map((p, i) => `<div class="pres"><b>${esc(p.s)}</b><input type="time" data-h="de" data-i="${i}" value="${p.de}" aria-label="${esc(p.s)} : de"><span>à</span><input type="time" data-h="a" data-i="${i}" value="${p.a}" aria-label="${esc(p.s)} : à"><button class="x" data-b="retirer" data-i="${i}" aria-label="Retirer ${esc(p.s)}">✕</button></div>`).join('') : '<div class="aucun">Personne</div>'}
    <div class="etq">Ajouter</div>
    <div class="sigles">${libres.map(s => `<button data-b="ajouter" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    <form class="autre" id="fa"><input id="autre" maxlength="8" placeholder="Autre sigle" aria-label="Autre sigle"><button class="btn" type="submit">Ajouter</button></form>
    <div class="etq">Commentaire</div>
    <textarea id="note" maxlength="300" aria-label="Commentaire">${esc(cr.note)}</textarea><div class="petit">Sans nom d'élève</div>
    <div class="etq">Même chose</div>
    <div class="copies">
      <button class="btn" data-b="copie" data-v="autre">${m === 'm' ? "L'après-midi" : 'Le matin'}</button>
      <button class="btn" data-b="copie" data-v="semaine">La semaine · ${MOM[m].toLowerCase()}</button>
      <button class="btn" data-b="copie" data-v="stage">Tout le stage · ${MOM[m].toLowerCase()}</button>
      <button class="btn" data-b="copie" data-v="stage2">Tout le stage · journée</button>
    </div>
    <div class="copies" style="margin-top:16px"><button class="btn pri" data-b="fermer" style="margin-left:auto">OK</button></div></div>`;
    v.querySelector('#fa').onsubmit = ev => { ev.preventDefault(); const s = nettoieSigle(v.querySelector('#autre').value); if (!s) return;
      const cr2 = creneau(code, date, m); if (!cr2.pres.some(p => p.s === s)) ecrire([[code, date, m, { ...cr2, pres: [...cr2.pres, { s, de: '', a: '' }].slice(0, 6) }]], 'Ajouté'); peindre(); };
  };
  let tNote = null;
  const noteMaintenant = () => { clearTimeout(tNote); const t = v.querySelector('#note'); if (!t) return; const n = nettoieNote(t.value), cr = creneau(code, date, m); if (n !== cr.note) ecrire([[code, date, m, { ...cr, note: n }]], 'Commentaire enregistré', true); };
  v.addEventListener('input', ev => { if (ev.target.id === 'note') { clearTimeout(tNote); tNote = setTimeout(noteMaintenant, 900); } });
  v.addEventListener('change', ev => { const h = ev.target.dataset.h; if (!h) return; const cr = creneau(code, date, m), i = Number(ev.target.dataset.i);
    if (!cr.pres[i]) return; cr.pres[i] = { ...cr.pres[i], [h]: heure(ev.target.value) }; ecrire([[code, date, m, cr]], 'Heure enregistrée', true); });
  v.addEventListener('click', ev => {
    if (ev.target === v) { noteMaintenant(); return fermerBulle(); }
    const b = ev.target.closest('[data-b]'); if (!b) return;
    noteMaintenant(); /* un commentaire en cours de frappe est enregistré avant tout autre geste */
    const t = b.dataset.b, cr = creneau(code, date, m);
    if (t === 'fermer') return fermerBulle();
    if (t === 'ajouter') ecrire([[code, date, m, { ...cr, pres: [...cr.pres, { s: b.dataset.v, de: '', a: '' }].slice(0, 6) }]], 'Ajouté');
    if (t === 'retirer') ecrire([[code, date, m, { ...cr, pres: cr.pres.filter((_, i) => i !== Number(b.dataset.i)) }]], 'Retiré');
    if (t === 'copie') {
      noteMaintenant();
      const src = creneau(code, date, m), cls = c, p = periodeDe(cls, date), cibles = [];
      if (b.dataset.v === 'autre') cibles.push([date, autreM]);
      else { const [a, fin] = cls.pfmp[p];
        for (let d = a; d <= fin; d = plus(d, 1)) { if (!enStage(cls, d)) continue; if (b.dataset.v === 'semaine' && lundi(d) !== lundi(date)) continue;
          cibles.push([d, m]); if (b.dataset.v === 'stage2') cibles.push([d, autreM]); } }
      ecrire(cibles.filter(([d, mo]) => !(d === date && mo === m)).map(([d, mo]) => [code, d, mo, { pres: src.pres, note: creneau(code, d, mo).note }]), 'Recopié');
    }
    peindre();
  });
  peindre();
  v.querySelector('.sigles button, #autre')?.focus();
  S.repeindre = peindre;
}
function fermerBulle() { $('#voile')?.remove(); S.repeindre = null; const s = S.sel; S.sel = null; rendreGrille(); if (s) document.querySelector(`td[data-code="${s.code}"][data-d="${s.date}"][data-m="${s.m}"]`)?.focus({ preventScroll: true }); }

/* ─── Écriture : immédiate, avec retour arrière ─── */
async function ecrire(liste, msg, sansAnnuler) {
  if (!liste.length) return;
  const classeDe = code => (S.config?.eleves || []).find(e => e.code === code)?.classe;
  const avant = liste.map(([code, d, m]) => [code, d, m, creneau(code, d, m)]);
  const maj = new Date().toISOString();
  const docs = liste.map(([code, d, m, cr]) => {
    const vu = new Set(), pres = [];
    (cr.pres || []).forEach(p => { const s = nettoieSigle(p.s); if (s && !vu.has(s)) { vu.add(s); pres.push({ s, de: heure(p.de), a: heure(p.a) }); } });
    return { id: idDe(code, d, m), type: 'creneau', annee: ANNEE, classe: classeDe(code), eleve: code, date: d, moment: m, pres: pres.slice(0, 6), note: nettoieNote(cr.note), majLe: maj, source: SOURCE };
  });
  docs.forEach(x => S.docs.set(x.id, x)); rendreGrille();
  if (!db) { toast('Hors ligne : rien n’est enregistré', true); return; }
  etat('Enregistrement…');
  try {
    for (let i = 0; i < docs.length; i += 400) { const b = FS.writeBatch(db); docs.slice(i, i + 400).forEach(x => b.set(FS.doc(db, COL, x.id), x)); await b.commit(); }
    etat('En direct');
    if (sansAnnuler) toast(msg); else { S.annuler = avant; toast(msg + (docs.length > 1 ? ' · ' + docs.length + ' demi-journées' : ''), false, true); }
  } catch (e) {
    avant.forEach(([code, d, m, cr]) => { const id = idDe(code, d, m), x = S.docs.get(id); if (x) S.docs.set(id, { ...x, pres: cr.pres, note: cr.note, aesh: undefined }); });
    rendreGrille(); S.repeindre?.(); etat('Non enregistré', true); toast('Non enregistré : vérifiez la connexion', true);
  }
}
let tT = null;
function toast(t, err, annul) {
  if (!t) return;
  $('#toast')?.remove(); clearTimeout(tT);
  const d = document.createElement('div'); d.id = 'toast'; d.className = 'toast' + (err ? ' err' : ''); d.setAttribute('role', 'status');
  d.innerHTML = `<span>${esc(t)}</span>${annul ? '<button id="tAnn">Annuler</button>' : ''}${err ? '<button id="tX" aria-label="Fermer">✕</button>' : ''}`;
  document.body.appendChild(d);
  d.querySelector('#tAnn')?.addEventListener('click', async () => { const a = S.annuler; S.annuler = null; d.remove(); if (a) { await ecrire(a, 'Annulé', true); S.repeindre?.(); } });
  d.querySelector('#tX')?.addEventListener('click', () => d.remove());
  if (!err) tT = setTimeout(() => d.remove(), annul ? 5000 : 1600);
}

/* ─── Impression : un tableau par élève et par stage ─── */
function imprimer() {
  const cls = S.filtre === 'tous' ? CLASSES : CLASSES.filter(c => c.id === S.filtre);
  const blocs = [];
  cls.forEach(c => elevesDe(c).forEach(code => c.pfmp.forEach(([a, b], p) => {
    const jours = []; for (let d = a; d <= b; d = plus(d, 1)) if (enStage(c, d)) jours.push(d);
    const cel = (d, m) => { const cr = creneau(code, d, m); return esc(cr.pres.map(x => x.s + (x.de || x.a ? ' (' + hFr(x.de) + '–' + hFr(x.a) + ')' : '')).join(', ')) + (cr.note ? `<br><i>${esc(cr.note)}</i>` : ''); };
    blocs.push(`<div><h2>${code} · ${esc(c.lib)}</h2><p class="sous">PFMP ${p + 1} · du ${long(a)} au ${long(b)}</p>
      <table><tr><th style="width:34%">Jour</th><th>Matin</th><th>Après-midi</th></tr>${jours.map(d => `<tr><td>${esc(long(d))}</td><td>${cel(d, 'm')}</td><td>${cel(d, 'a')}</td></tr>`).join('')}</table></div>`);
  })));
  $('#feuille').innerHTML = `<div class="doc">${blocs.join('') || '<p>Aucun élève</p>'}<p style="font-size:9pt;color:#555">Accompagnement PFMP · imprimé le ${long(AUJ)}</p></div>`;
  document.body.classList.add('imprime'); setTimeout(() => { window.print(); document.body.classList.remove('imprime'); }, 60);
}

/* ─── Clics et clavier ─── */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]'); if (!t || $('#voile')) return;
  const a = t.dataset.act;
  if (a === 'case') return ouvrirBulle(t.dataset.code, t.dataset.d, t.dataset.m);
  if (a === 'filtre') { S.filtre = t.dataset.v; rendre(); const c = classe(S.filtre); if (c) allerStage(c); else allerSemaine(lundi(AUJ)); }
  if (a === 'pas') pas(Number(t.dataset.v));
  if (a === 'auj') allerSemaine(lundi(AUJ));
  if (a === 'imprimer') imprimer();
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && $('#voile')) return fermerBulle();
  const td = ev.target.closest?.('td[data-act="case"]');
  if (td && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); ouvrirBulle(td.dataset.code, td.dataset.d, td.dataset.m); }
});

/* 08/10/2026 — Code retiré pour l'instant (demande de Brahim) : remettre SANS_CODE à false pour le rétablir. */
const SANS_CODE = true;
let deja = ''; try { deja = localStorage.getItem(K_OK) || ''; } catch (_) { }
if (SANS_CODE || deja === EMPREINTE) entrer(); else porte();
</script>
