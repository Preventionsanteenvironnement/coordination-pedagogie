<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2a4d">
<title>Questionnaire AESH — 23 novembre 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --nuit:#0f2a4d;--bleu:#1d5fa8;--ciel:#3b8beb;--menthe:#2fbfa0;--violet:#7c6cf0;
  --texte:#14243a;--doux:#5b6b80;--ligne:#e3e9f2;--carte:#ffffff;--fond:#f3f6fb;
  --grad:linear-gradient(120deg,#2fbfa0 0%,#3b8beb 55%,#7c6cf0 100%);
  --ombre:0 10px 30px -12px rgba(15,42,77,.25),0 2px 6px -2px rgba(15,42,77,.08);
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--texte);background:var(--fond);
  background-image:radial-gradient(900px 500px at 110% -10%,rgba(124,108,240,.16),transparent 60%),radial-gradient(800px 500px at -20% 10%,rgba(47,191,160,.16),transparent 60%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased}
.app{max-width:640px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 16px}
.top{position:sticky;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 12px) 0 12px;background:linear-gradient(var(--fond) 70%,rgba(243,246,251,0))}
.top-ligne{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.85rem;font-weight:700;color:var(--doux)}
.top-ligne .sec{color:var(--bleu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.piste{height:8px;border-radius:99px;background:#dfe6f0;margin-top:10px;overflow:hidden}
.piste i{display:block;height:100%;width:0;border-radius:99px;background:var(--grad);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.top.cache{display:none}
main{flex:1;position:relative}
.ecran{animation:entre .45s cubic-bezier(.2,.8,.2,1) both}
.ecran.retour{animation-name:entreG}
.ecran.fixe{animation:none}
@keyframes entre{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes entreG{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.hero{margin-top:calc(env(safe-area-inset-top) + 22px);border-radius:28px;padding:30px 24px 28px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(145deg,#0f2a4d 0%,#1d4f8f 55%,#3a5fc9 100%);box-shadow:0 24px 50px -20px rgba(15,42,77,.55)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(40px);opacity:.55}
.hero::before{width:220px;height:220px;background:#2fbfa0;right:-60px;top:-70px;animation:flotte 9s ease-in-out infinite}
.hero::after{width:200px;height:200px;background:#7c6cf0;left:-70px;bottom:-90px;animation:flotte 11s ease-in-out infinite reverse}
@keyframes flotte{50%{transform:translate(20px,18px) scale(1.1)}}
.hero>*{position:relative}
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:7px 12px;border-radius:99px;font-size:.8rem;font-weight:700}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:#2fbfa0;box-shadow:0 0 0 0 rgba(47,191,160,.7);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(47,191,160,0)}100%{box-shadow:0 0 0 0 rgba(47,191,160,0)}}
.hero h1{font-size:clamp(1.55rem,6.2vw,2.15rem);line-height:1.18;margin:16px 0 10px;font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;opacity:.88;line-height:1.55}
.puces{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 0}
.puces div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:12px 6px;text-align:center;font-size:.78rem;line-height:1.3}
.puces b{display:block;font-size:1.2rem;margin-bottom:2px}
.info{background:var(--carte);border-radius:var(--r);box-shadow:var(--ombre);padding:18px;margin:16px 0 0;line-height:1.6;color:#33465e;font-size:.95rem}
.info strong{color:var(--texte)}
.q-carte{background:var(--carte);border-radius:26px;box-shadow:var(--ombre);padding:22px 18px 18px;margin-top:6px}
.q-num{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:.8rem;color:var(--bleu);background:#eaf2fd;padding:6px 11px;border-radius:99px}
.q-titre{font-size:clamp(1.2rem,4.8vw,1.45rem);line-height:1.35;margin:14px 0 6px;font-weight:800;letter-spacing:-.01em}
.q-aide{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--doux);font-size:.88rem;font-weight:600;margin-bottom:14px}
.compte{font-variant-numeric:tabular-nums;background:#f0f4fa;border-radius:99px;padding:4px 10px;color:var(--bleu)}
.compte.plein{background:#e3f7f2;color:#178a72}
.compte.secoue{animation:secoue .35s}
@keyframes secoue{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.choix{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:13px;width:100%;padding:14px;border-radius:16px;border:2px solid var(--ligne);background:#fbfcfe;cursor:pointer;
  font-weight:600;line-height:1.35;font-size:1rem;transition:border-color .2s,background .2s,transform .12s,box-shadow .2s,opacity .2s}
.opt:active{transform:scale(.985)}
.opt:focus-visible{outline:3px solid #f2a541;outline-offset:2px}
.opt .coche{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #c5d1e0;display:grid;place-items:center;transition:all .25s}
.opt.carre .coche{border-radius:8px}
.opt .coche svg{width:15px;height:15px;stroke:#fff;stroke-width:3.2;fill:none;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s .05s}
.opt[aria-pressed="true"]{border-color:transparent;background:linear-gradient(#f2fbf9,#f2fbf9) padding-box,var(--grad) border-box;box-shadow:0 8px 20px -12px rgba(29,95,168,.55)}
.opt[aria-pressed="true"] .coche{border-color:transparent;background:var(--grad);transform:scale(1.06)}
.opt[aria-pressed="true"] .coche svg{stroke-dashoffset:0}
.opt.off{opacity:.45}
.autre{width:100%;margin:2px 0 4px;border:2px solid var(--ligne);border-radius:14px;padding:12px 14px;font:inherit;font-size:1rem;background:#fff}
.autre:focus,textarea:focus{outline:none;border-color:var(--ciel);box-shadow:0 0 0 4px rgba(59,139,235,.15)}
textarea{width:100%;min-height:170px;border:2px solid var(--ligne);border-radius:16px;padding:14px;font:inherit;font-size:1.02rem;line-height:1.5;resize:vertical;background:#fbfcfe}
.rappel{font-size:.85rem;color:var(--doux);margin:10px 2px 0;line-height:1.5}
.bas{position:sticky;bottom:0;padding:14px 0 calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:10px;background:linear-gradient(rgba(243,246,251,0),var(--fond) 35%);z-index:5}
.bas:empty{display:none}
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 20px;border-radius:16px;font-weight:800;font-size:1.02rem;cursor:pointer;transition:transform .12s,box-shadow .2s,opacity .2s;text-align:center}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid #f2a541;outline-offset:2px}
.btn.prim{flex:1;color:#fff;background:var(--grad);background-size:160% 100%;box-shadow:0 12px 24px -10px rgba(29,95,168,.6);animation:glisse 6s ease infinite}
@keyframes glisse{50%{background-position:100% 0}}
.btn.sec{background:#fff;color:var(--nuit);box-shadow:var(--ombre);min-width:54px}
.btn[disabled]{opacity:.55;pointer-events:none}
.recap{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:16px 0 4px}
.recap button{all:unset;cursor:pointer;aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:.9rem;background:#eef2f8;color:var(--doux)}
.recap button.ok{background:var(--grad);color:#fff}
.recap button:focus-visible{outline:3px solid #f2a541}
.legende{display:flex;gap:16px;font-size:.82rem;color:var(--doux);margin-top:6px}
.legende span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:#eef2f8;vertical-align:-1px}
.legende span:first-child::before{background:var(--grad)}
.statut{min-height:1.4em;font-weight:700;color:#b54b26;margin:12px 2px 0}
.merci{text-align:center;padding:70px 10px 30px}
.rond{width:120px;height:120px;margin:0 auto 26px;border-radius:50%;background:var(--grad);display:grid;place-items:center;box-shadow:0 20px 40px -14px rgba(29,95,168,.6);animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
.rond svg{width:58px;height:58px;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:trait .5s .35s forwards}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes trait{to{stroke-dashoffset:0}}
.merci h2{font-size:1.9rem;margin:0 0 10px;letter-spacing:-.02em}
.merci p{color:var(--doux);line-height:1.6;max-width:420px;margin:0 auto}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.conf i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:tombe linear forwards}
@keyframes tombe{to{transform:translateY(105vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rond svg{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="app">
  <div class="top cache" id="top"><div class="top-ligne"><span class="sec" id="topSec"></span><span id="topNum"></span></div><div class="piste"><i id="barre"></i></div></div>
  <main id="ecran" class="ecran" aria-live="polite"></main>
  <div class="bas" id="bas"></div>
</div>
<script src="questions.js"></script>
<script>
/* Questionnaire AESH — une question par écran (22/11/2026).
   Envoi : Firebase coordination-pedagogie, coordination_sondages/{sondage}/reponses. Essai : ?s=essai-aesh */
const SONDAGE=(new URLSearchParams(location.search).get('s')||'aesh-2026-11-23').replace(/[^a-z0-9-]/gi,'').slice(0,40)||'aesh-2026-11-23';
const firebaseConfig={apiKey:"AIzaSyBj_GXG8ln3GAxNXxiJkT2HPSWIHJpc1lA",authDomain:"coordination-pedagogie.firebaseapp.com",projectId:"coordination-pedagogie",storageBucket:"coordination-pedagogie.firebasestorage.app",messagingSenderId:"526058585010",appId:"1:526058585010:web:ba4dd6d9c8281ba5bf02ab"};
const DEJA='questionnaire-aesh-envoye-'+SONDAGE, BROUILLON='questionnaire-aesh-brouillon-'+SONDAGE;
/* Code personnel à usage unique (?c=XXXXXX), pour les AESH absentes à la réunion.
   Firestore : coordination_sondages/{sondage}/codes/{SHA-256("aesh:"+code)} = {utilise:false}. Le lien code ↔ réponse n'est jamais gardé.
   Sans code, on peut répondre tant que coordination_sondages/{sondage}.ouvert n'est pas false (fermé depuis la page projection). */
const CODE=(new URLSearchParams(location.search).get('c')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);
let acces={ok:true,raison:''};
function fb(){if(!fb.p)fb.p=(async()=>{const {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js');const FS=await import('https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js');return {FS,db:FS.getFirestore(initializeApp(firebaseConfig,'questionnaire-aesh'))};})();return fb.p;}
async function hache(c){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('aesh:'+c));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function verifierAcces(){
  try{const {FS,db}=await fb();
    if(CODE){const d=await FS.getDoc(FS.doc(db,'coordination_sondages',SONDAGE,'codes',await hache(CODE)));
      if(!d.exists())acces={ok:false,raison:'code-inconnu'};else if(d.data().utilise)acces={ok:false,raison:'code-utilise'};}
    else{const d=await FS.getDoc(FS.doc(db,'coordination_sondages',SONDAGE));if(d.exists()&&d.data().ouvert===false)acces={ok:false,raison:'ferme'};}
  }catch(e){console.warn(e);} /* hors ligne : on laisse répondre, l’envoi tranchera */
}
const Q=[];let n=0;for(const [section,items] of window.QUESTIONNAIRE_AESH)for(const [q,mode,opts] of items)Q.push({id:++n,section,q,mode,opts});
const AIDE={single:'Une seule réponse',multi:'Plusieurs réponses possibles',max2:'Deux réponses maximum',max3:'Trois réponses maximum',text:'Réponse facultative'};
const maxi=q=>q.mode==='single'?1:q.mode.startsWith('max')?Number(q.mode.slice(3)):99;
const estAutre=o=>/^Autre/.test(o);
const L=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, S=(k,v)=>{try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};

let rep={},autres={},pos=-1,sens=1;
try{const b=JSON.parse(L(BROUILLON)||'null');if(b){rep=b.rep||{};autres=b.autres||{};}}catch(e){}
const sauver=()=>S(BROUILLON,JSON.stringify({rep,autres}));
const repondu=q=>q.mode==='text'?!!String(rep[q.id]||'').trim():(rep[q.id]||[]).length>0;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COCHE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function haut(){
  const t=$('#top');
  if(pos<0||pos>Q.length){t.classList.add('cache');return;}
  t.classList.remove('cache');
  const fait=Q.filter(repondu).length;
  $('#barre').style.width=(pos>=Q.length?100:Math.max(4,((pos+1)/Q.length)*100))+'%';
  $('#topSec').textContent=pos<Q.length?Q[pos].section:'Avant d’envoyer';
  $('#topNum').textContent=pos<Q.length?(pos+1)+' / '+Q.length:fait+' / '+Q.length+' répondues';
}
function animer(){const e=$('#ecran');e.className='ecran fixe';void e.offsetWidth;e.className='ecran'+(sens<0?' retour':'');}
function afficher(){
  animer();haut();window.scrollTo(0,0);
  if(L(DEJA)==='1')return merci(false);
  if(!acces.ok)return bloque();
  if(pos<0)return accueil();
  if(pos>=Q.length)return recap();
  question(Q[pos]);
}
function bas(html){$('#bas').innerHTML=html;}
function premiereVide(){const i=Q.findIndex(q=>!repondu(q));return i===-1?Q.length:i;}
function accueil(){
  const deja=Object.keys(rep).length>0;
  $('#ecran').innerHTML=`<section class="hero"><span class="badge">Réunion du lundi 23 novembre</span>
    <h1>Accompagner les élèves : notre organisation, nos pratiques et nos besoins</h1>
    <p>Votre expérience compte. Vos réponses serviront de support aux échanges de la réunion.</p>
    <div class="puces"><div><b>16</b>questions</div><div><b>12-15</b>minutes</div><div><b>100 %</b>anonyme</div></div></section>
    <div class="info"><strong>Ce n’est pas une évaluation professionnelle.</strong> Aucune question ne demande votre nom ou votre pôle. Vous pouvez passer une question. Dans les réponses libres, ne mentionnez aucun nom d’élève ou de personnel.</div>`;
  bas(`<button class="btn prim" id="go">${deja?'Reprendre le questionnaire':'Commencer'} →</button>`);
  $('#go').onclick=()=>aller(deja?premiereVide():0);
}
function question(q){
  let corps='';
  if(q.mode==='text'){
    corps=`<textarea id="txt" maxlength="1500" aria-label="${esc(q.q)}" placeholder="Écrivez ici, si vous le souhaitez…">${esc(rep[q.id]||'')}</textarea><p class="rappel">Ne mentionnez aucun nom d’élève ou de personnel.</p>`;
  }else{
    const sel=rep[q.id]||[];const m=maxi(q);
    corps=`<div class="choix">`+q.opts.map((o,i)=>{const on=sel.includes(o);
      return `<button type="button" class="opt ${q.mode==='single'?'':'carre'} ${!on&&sel.length>=m&&m>1?'off':''}" aria-pressed="${on}" data-i="${i}"><span class="coche">${COCHE}</span><span>${esc(o)}</span></button>`+
        (estAutre(o)&&on?`<input class="autre" id="autre" maxlength="300" aria-label="Précisez votre réponse" placeholder="Précisez…" value="${esc(autres[q.id]||'')}">`:'');}).join('')+`</div>`;
  }
  const m=maxi(q),k=(rep[q.id]||[]).length;
  $('#ecran').innerHTML=`<article class="q-carte"><span class="q-num">Question ${q.id}</span><h2 class="q-titre">${esc(q.q)}</h2>
    <div class="q-aide"><span>${AIDE[q.mode]}</span>${q.mode.startsWith('max')?`<span class="compte ${k>=m?'plein':''}" id="cpt">${k} / ${m}</span>`:''}</div>${corps}</article>`;
  majBas(q);
  if(q.mode==='text'){const t=$('#txt');t.oninput=()=>{rep[q.id]=t.value;sauver();majBas(q);};}
  else{
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>basculer(q,q.opts[+b.dataset.i]));
    const a=$('#autre');if(a){a.oninput=()=>{autres[q.id]=a.value;sauver();};}
  }
}
function majBas(q){
  const dernier=pos===Q.length-1;
  bas(`<button type="button" class="btn sec" id="prec" aria-label="Question précédente">←</button><button type="button" class="btn prim" id="suiv">${repondu(q)?(dernier?'Terminer':'Suivant'):'Passer'} →</button>`);
  $('#prec').onclick=()=>aller(pos-1);$('#suiv').onclick=()=>aller(pos+1);
}
function basculer(q,o){
  let sel=(rep[q.id]||[]).slice();const m=maxi(q);
  if(q.mode==='single')sel=sel[0]===o?[]:[o];
  else if(sel.includes(o))sel=sel.filter(x=>x!==o);
  else{if(sel.length>=m){const c=$('#cpt');if(c){c.classList.remove('secoue');void c.offsetWidth;c.classList.add('secoue');}if(navigator.vibrate)navigator.vibrate(30);return;}sel.push(o);}
  rep[q.id]=sel;if(!sel.some(estAutre))delete autres[q.id];sauver();
  const y=window.scrollY;$('#ecran').className='ecran fixe';question(q);window.scrollTo(0,y);
  const ici=document.querySelector(`.opt[data-i="${q.opts.indexOf(o)}"]`);if(ici)ici.focus({preventScroll:true});
  if(estAutre(o)&&sel.includes(o)){const a=$('#autre');if(a)a.focus();}
  if(q.mode==='single'&&sel.length&&!estAutre(o)){const p=pos;setTimeout(()=>{if(pos===p)aller(pos+1);},450);}
}
function aller(p){sens=p>=pos?1:-1;pos=Math.max(-1,Math.min(Q.length,p));afficher();}
function recap(){
  const fait=Q.filter(repondu).length;
  $('#ecran').innerHTML=`<article class="q-carte"><span class="q-num">Presque fini</span><h2 class="q-titre">Vous avez répondu à ${fait} question${fait>1?'s':''} sur ${Q.length}.</h2>
    <p class="rappel" style="margin:0">Touchez un numéro pour revenir sur une question. Les questions laissées vides ne posent aucun problème.</p>
    <div class="recap">${Q.map(q=>`<button type="button" class="${repondu(q)?'ok':''}" data-p="${q.id-1}" aria-label="Question ${q.id}${repondu(q)?', répondue':', sans réponse'}">${q.id}</button>`).join('')}</div>
    <div class="legende"><span>Répondue</span><span>Sans réponse</span></div><p class="statut" id="statut" role="status"></p></article>`;
  document.querySelectorAll('.recap button').forEach(b=>b.onclick=()=>aller(+b.dataset.p));
  bas(`<button type="button" class="btn sec" id="prec" aria-label="Question précédente">←</button><button type="button" class="btn prim" id="env" ${fait?'':'disabled'}>Envoyer mes réponses</button>`);
  $('#prec').onclick=()=>aller(pos-1);$('#env').onclick=envoyer;
}
function getAnswers(){return Q.map(q=>{const r=rep[q.id];const liste=Array.isArray(r)?r:[];
  return {question:q.id,intitule:q.q,reponses:q.mode==='text'?String(r||'').trim():liste.slice(),precision_autre:liste.some(estAutre)?String(autres[q.id]||'').trim():''};});}
async function envoyer(){
  const b=$('#env');b.disabled=true;b.textContent='Envoi en cours…';$('#statut').textContent='';
  try{
    const {FS,db}=await fb();
    const contenu={questionnaire:'AESH — 23 novembre 2026',version:3,par_code:!!CODE,cree:FS.serverTimestamp(),
      reponses:getAnswers().map(a=>({question:a.question,reponses:a.reponses,precision_autre:(a.precision_autre||'').slice(0,600)}))};
    const nouvelle=FS.doc(FS.collection(db,'coordination_sondages',SONDAGE,'reponses'));
    if(CODE){
      const ref=FS.doc(db,'coordination_sondages',SONDAGE,'codes',await hache(CODE));
      await FS.runTransaction(db,async t=>{const s=await t.get(ref);
        if(!s.exists())throw Error('code-inconnu');if(s.data().utilise)throw Error('code-utilise');
        t.update(ref,{utilise:true});t.set(nouvelle,contenu);});
    }else{
      const etat=await FS.getDoc(FS.doc(db,'coordination_sondages',SONDAGE));
      if(etat.exists()&&etat.data().ouvert===false)throw Error('ferme');
      await FS.setDoc(nouvelle,contenu);
    }
    S(DEJA,'1');S(BROUILLON,null);merci(true);
  }catch(e){console.error(e);
    if(['code-inconnu','code-utilise','ferme'].includes(e.message)){acces={ok:false,raison:e.message};return bloque();}
    $('#statut').textContent='Envoi impossible pour le moment. Vérifiez la connexion Internet, puis réessayez.';b.disabled=false;b.textContent='Réessayer l’envoi';}
}
function merci(fete){
  $('#top').classList.add('cache');bas('');animer();
  $('#ecran').innerHTML=`<section class="merci"><div class="rond"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>Merci !</h2><p>Vos réponses sont bien arrivées. Elles s’affichent avec celles de vos collègues pour lancer les échanges de la réunion.</p></section>`;
  if(fete&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const c=document.createElement('div');c.className='conf';const col=['#2fbfa0','#3b8beb','#7c6cf0','#f2a541','#ff6b8b'];
    for(let i=0;i<70;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'vw';p.style.background=col[i%col.length];p.style.animationDuration=(1.8+Math.random()*1.6)+'s';p.style.animationDelay=(Math.random()*.4)+'s';c.append(p);}
    document.body.append(c);setTimeout(()=>c.remove(),4200);}
}
function bloque(){
  $('#top').classList.add('cache');bas('');animer();
  const T={
    'code-utilise':['Ce code a déjà été utilisé','Les réponses liées à ce code ont déjà été envoyées. Merci pour votre participation !'],
    'code-inconnu':['Code non reconnu','Vérifiez que vous avez ouvert le lien exact reçu par mail. En cas de souci, contactez votre coordonnateur.'],
    'ferme':['Le questionnaire est fermé','Merci à toutes et à tous pour vos réponses. Si vous avez reçu un code personnel par mail, utilisez le lien de ce mail.']}[acces.raison]||['Accès impossible',''];
  $('#ecran').innerHTML=`<section class="merci"><div class="rond" style="background:linear-gradient(135deg,#5b6b80,#1d5fa8)"><svg viewBox="0 0 24 24" aria-hidden="true" style="stroke-dasharray:none;animation:none"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div><h2>${T[0]}</h2><p>${T[1]}</p></section>`;
}
document.addEventListener('keydown',e=>{if(e.target.matches('textarea,input'))return;if(e.key==='ArrowRight'&&pos>=0&&pos<Q.length)aller(pos+1);if(e.key==='ArrowLeft'&&pos>-1)aller(pos-1);});
$('#ecran').innerHTML='<p style="text-align:center;color:var(--doux);margin-top:40vh;font-weight:600">Chargement…</p>';
(L(DEJA)==='1'?Promise.resolve():verifierAcces()).then(afficher);
</script>
