<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#176d66">
<meta name="robots" content="noindex">
<title>PFMP — le suivi du référent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<!--
  Le suivi d'un élève en PFMP, vu par son enseignant référent (09/10/2026 ; refait le 11/10/2026 :
  « À traiter » en haut, parcours replié par grande étape, couleurs par état, une colonne sur téléphone).
  À gauche l'élève, à droite l'enseignant référent ; au milieu, en transit, ceux qui interviennent.
  Tout est tiré de la chronologie commune (pfmp-commun.js) : étapes, acteurs, consignes « Comment faire », sources.
    frise.html?f=2026-2027_K4A7_p1   la fiche réelle de l'élève (lien envoyé par le professeur principal)
    frise.html                       renvoie vers la démonstration (frise-acteurs.html)
  Firestore « coordination-pedagogie » : coordination_pfmp_suivi/{f} (+ eleve/parcours), lecture ;
  écriture des seuls gestes du référent, par le socle commun. Aucun nom d'élève.
-->
<style>
:root{--ink:#172738;--muted:#66768a;--line:#e3e9ee;--accent:#176d66;--accent-s:#e2f1ef;--el:#2d63b8;--el-s:#eaf0fb;--green:#1f9d6b;--green-s:#e8f6ef;--orange:#c46f1c;--orange-s:#fff3e6;--bg:#f5f7f9;--red:#c23b3b;--red-s:#fdecec;
  --pro:#6d4bc4;--ent:#c46f1c;--bde:#0e7490;--ddf:#475569;--chef:#9f1239;--int:#4d7c0f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.shell{max-width:1120px;margin:auto;padding:22px 20px 80px}
.haut{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.haut a{color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.demo{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.demo button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 11px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer}
.tete{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 20px}
.code{width:56px;height:56px;border-radius:16px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:.06em}
.tete h1{margin:0;font-size:20px;letter-spacing:-.02em}
.tete .info{color:var(--muted);font-size:13.5px}
.tete .j{margin-left:auto;text-align:right}.tete .j b{display:block;font-size:26px;line-height:1}.tete .j span{font-size:12px;color:var(--muted)}
/* 11/10/2026 — L'écran du référent : « À traiter » en haut, puis le parcours replié par grande étape.
   Les couleurs disent l'état, comme sur la page de l'élève : bleu à faire, orange en attente, vert fait, rouge à corriger. */
.bal{background:#fff;border:2px solid var(--el);border-radius:18px;padding:14px 16px;margin:14px 0 0}
.bal.vide{border:1px solid #c4e6d6}
.bal h2{margin:0 0 4px;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.bal h2 em{font-style:normal;font-size:12.5px;font-weight:800;background:var(--el);color:#fff;border-radius:999px;min-width:24px;padding:2px 8px;text-align:center}
.bal .l{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 0;border-top:1px solid #eef2f5;font-size:14.5px}
.bal .l:first-of-type{border-top:0}
.bal .l>i{font-size:20px;color:var(--el);flex:none}
.bal .l.sig>i{color:var(--red)}
.bal .l>span{flex:1 1 220px;min-width:0}
.bal .l .bts{display:flex;gap:8px;flex-wrap:wrap}
.bal .l.info{font-size:13.5px;color:var(--muted);padding:7px 0}.bal .l.info>i{color:#9aa8b6;font-size:17px}
.bal .l.rien{color:var(--green);font-weight:700}.bal .l.rien>i{color:var(--green)}
.bal .l.att>i{color:var(--orange)}
button.b{border:1px solid var(--el);background:var(--el);color:#fff;border-radius:10px;padding:9px 14px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;min-height:40px}
button.b.dis{background:#fff;color:var(--el);border-color:#c5d5ee}
button.b.corr{background:#fff;color:var(--red);border-color:#eec3c3}
button.b.lien{background:none;border-color:transparent;color:var(--muted);font-weight:600;padding:6px 2px;min-height:0}
button.b:disabled{opacity:.5}
.parc{margin:26px 0 10px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ph{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.ph>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:10px;padding:14px 16px;min-height:60px;background:#f7f9fb}
.ph[open]>summary{border-bottom:1px solid var(--line)}
.ph>summary::-webkit-details-marker{display:none}
.ph>summary::before{content:""}
.ph>summary .ct{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 12px;font-weight:800;font-size:18px;letter-spacing:-.01em;text-align:center}
.ph>summary .ct b{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink);font-size:14px}
.ph>summary .ct em{font-style:normal;font-size:12px;font-weight:800;letter-spacing:0;border-radius:999px;padding:4px 11px;background:#e6ebf0;color:var(--muted);white-space:nowrap}
.ph>summary>small{justify-self:end;color:var(--muted);font-size:12.5px;font-weight:600}
.ph>summary::after{content:"▾";color:var(--muted)}
.ph[open]>summary::after{content:"▴"}
.ph.fait>summary .ct b{background:var(--green);color:#fff}.ph.fait>summary .ct em{background:var(--green-s);color:var(--green)}
.ph.fait>summary .ct{color:var(--muted)}
.ph.afaire{border:2px solid var(--el)}.ph.afaire>summary .ct b,.ph.afaire>summary .ct em{background:var(--el);color:#fff}
.ph.attend>summary .ct b{background:var(--orange);color:#fff}.ph.attend>summary .ct em{background:var(--orange-s);color:var(--orange)}
.ph.corr>summary .ct b{background:var(--red);color:#fff}.ph.corr>summary .ct em{background:var(--red-s);color:var(--red)}
.ph .dedans{padding:2px 14px 16px}
.cols,.grille{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,.82fr) 34px minmax(0,1fr);gap:3px 4px}
.cols{padding:10px 0 8px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cols span:nth-child(2){grid-column:3;text-align:center}.cols span:nth-child(3){grid-column:5;text-align:right}
.et.g{grid-column:1}.et.m{grid-column:3}.et.d{grid-column:5}.et.c{grid-column:1/-1}
/* Les flèches : vers le bas quand le geste suivant est dans le même couloir, vers la droite quand ça change de main. Vertes une fois le passage fait. */
.fl{display:flex;align-items:center;justify-content:center;gap:6px;color:#a9b5c1;font-size:11.5px;font-weight:700;white-space:nowrap}
.fl .ti{font-size:22px}
.fl.on{color:var(--green)}
.fl.v{min-height:26px}
.fl .iv,.fl span{display:none}.fl.v .iv{display:inline}
.fl.long span{display:inline}
.fl .tr{flex:1;border-top:2px dashed currentColor;opacity:.7}
.et{scroll-margin-top:16px}
.carte{height:100%;background:#f7f9fb;border:1px solid var(--line);border-left:5px solid #cfd8e0;border-radius:12px;padding:10px 13px}
.et.m .carte{border-style:dashed;border-left-style:solid;padding:8px 11px}
.carte .q{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.carte .q>i{font-size:14px}
.carte .q .mini{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px}
.carte .q .pst{margin-left:auto;font-style:normal;letter-spacing:0;text-transform:none;font-size:11.5px;border-radius:999px;padding:1px 9px}
.carte .q .neuf{font-style:normal;background:var(--el);color:#fff;border-radius:6px;padding:1px 6px;font-size:10px;letter-spacing:.04em}
.carte>b{display:block;font-size:14.5px;font-weight:650;line-height:1.35;margin-top:3px}
.et.m .carte>b{font-size:13.5px}
.carte p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.carte .dt{display:inline-block;margin-top:5px;font-size:12px;font-weight:700;color:var(--muted)}
.carte .acts{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
.et.fait .carte{background:var(--green-s);border-color:#c4e6d6;border-left-color:var(--green)}.et.fait .dt{color:var(--green)}
.et.afaire .carte{background:var(--el-s);border-color:#c5d5ee;border-left-color:var(--el)}.et.afaire .pst{background:var(--el);color:#fff}
.et.attend .carte{background:var(--orange-s);border-color:#f0d2b0;border-left-color:var(--orange)}.et.attend .pst{background:var(--orange);color:#fff}
.et.corr .carte{background:var(--red-s);border-color:#eec3c3;border-left-color:var(--red)}.et.corr .pst{background:var(--red);color:#fff}
.et.avenir .carte>b{color:#4a5a6c}
.motif{display:block;margin-top:6px;font-size:13px;color:var(--red);font-weight:650}
.signe{font-size:11px}
.relais{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;font-weight:700;color:var(--muted)}
.relais .tk{letter-spacing:-2px;font-weight:800;color:#c3ccd5}
.relais .tk.un{color:var(--muted)}.relais .tk.deux{color:var(--green)}
.prop{margin:6px 0 2px;padding:8px 12px;border-radius:10px;background:#fff;color:var(--ink);font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.prop i{color:var(--el)}
.suite{margin-top:8px;padding-top:8px;border-top:1px dashed #cfd8e0;font-size:13px}
.suite small{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.suite span{display:block;margin-top:2px;color:var(--ink)}
.cf{margin-top:8px;border-top:1px dashed #cfd8e0;padding-top:6px}
.cf summary{list-style:none;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--el);display:flex;align-items:center;gap:5px}
.cf summary::-webkit-details-marker{display:none}
.cf summary::after{content:"▾";margin-left:2px}
.cf[open] summary::after{content:"▴"}
.cf ol{margin:6px 0 4px;padding-left:18px;font-size:13px;color:var(--ink);display:grid;gap:4px}
.cf small{display:block;font-size:11px;color:var(--muted)}
.leg{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:22px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:12px;height:12px;border-radius:4px;display:inline-block}
@media (max-width:700px){
  .shell{padding:14px 12px 60px}
  .tete{padding:12px 14px;gap:12px;border-radius:16px}.tete h1{font-size:17px}.tete .info{font-size:12.5px}.code{width:48px;height:48px;border-radius:13px;font-size:13px}
  .tete .j b{font-size:20px}
  .cols{display:none}
  .grille{grid-template-columns:minmax(0,1fr);gap:2px;padding-top:12px}
  .grille>*{grid-column:1!important;grid-row:auto!important}
  .fl{justify-content:flex-start;padding-left:16px;min-height:28px}
  .fl .ih,.fl .tr{display:none}.fl .iv,.fl span{display:inline}
  .et.m{margin-left:22px}
  .ph>summary{padding:12px 10px;gap:6px;grid-template-columns:0 1fr 0 auto}.ph>summary .ct{font-size:16px}.ph>summary>small{display:none}
  .ph .dedans{padding:0 10px 12px}
  .bal .l .bts{flex:1 1 100%}.bal .l .bts button{flex:1}
  .carte .acts button.b:not(.lien){flex:1}
}

[hidden]{display:none!important}
.carnet-lien{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:12px 0 0;text-decoration:none;color:var(--ink)}
.carnet-lien i{font-size:22px;color:#1d4f91}.carnet-lien span{flex:1;font-size:13.5px;color:var(--muted)}.carnet-lien b{display:block;font-size:14.5px;color:var(--ink)}
.carnet-lien em{font-style:normal;font-weight:700;font-size:13px;color:#1d4f91}
.visite-f{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.visite-f input{border:1px solid var(--line);border-radius:9px;padding:6px 8px;font:inherit;font-size:13px}
.visite-f button{border:0;background:var(--accent);color:#fff;border-radius:9px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.vide-msg{text-align:center;color:var(--muted);padding:60px 20px}
#voile:empty{display:none}
.voile{position:fixed;inset:0;background:rgba(20,30,40,.4);display:grid;place-items:center;z-index:20;padding:20px}
.fen{background:#fff;border-radius:20px;padding:22px;max-width:400px;width:100%;text-align:center}
.fen h2{margin:4px 0 6px;font-size:20px}.fen p{margin:0 0 16px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fen select,.fen input[type=text]{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;font:inherit;margin:0 0 10px;background:#fff}
.fen textarea{width:100%;min-height:80px;border:2px solid var(--line);border-radius:12px;padding:10px;font:inherit;margin:0 0 14px;resize:vertical}
.fen .b2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fen button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px;font:inherit;font-weight:700;cursor:pointer}
.fen button.oui{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<main class="shell">
 <div class="haut"><a href="../">← Coordination & Pédagogie</a> <a id="versFiche" href="./#liste" hidden style="margin-left:14px">Ma page de référent</a></div>
 <section class="tete" style="margin-bottom:0"><div class="code" id="code">—</div><div><h1 id="titre">Chargement…</h1><div class="info" id="info"></div></div><div class="j"><b id="jx"></b><span id="jxl"></span></div></section>
 <section class="bal" id="bal" hidden></section>
 <a class="carnet-lien" id="carnet" hidden target="_blank" rel="noopener"></a>
 <h2 class="parc" id="parc" hidden>Le parcours</h2>
 <section class="frise" id="frise"></section>
 <div class="leg" id="leg" hidden><span><i style="background:var(--el)"></i>à faire</span><span><i style="background:var(--orange)"></i>en attente</span><span><i style="background:var(--green)"></i>fait</span><span><i style="background:var(--red)"></i>à corriger</span></div>
</main>
<div id="voile"></div>
<script src="./pfmp-commun.js?v=2026-10-11b"></script>
<script type="module">
const P = window.PFMP_COMMUN;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const AVATARS = [['cat', '#D85A30'], ['dog', '#BA7517'], ['butterfly', '#D4537E'], ['fish', '#378ADD'], ['plant-2', '#639922'], ['rocket', '#534AB7'], ['feather', '#1D9E75'], ['planet', '#7F77DD'], ['bike', '#185FA5'], ['music', '#993556'], ['star', '#EF9F27'], ['paw', '#854F0B'], ['ball-football', '#3B6D11'], ['palette', '#A32D2D'], ['camera', '#5F5E5A'], ['bolt', '#C2410C'], ['leaf', '#0F6E56'], ['moon', '#3C3489']];
const auj = () => new Date().toLocaleDateString('sv-SE');
const fr = s => s ? new Date(s.slice(0, 10) + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) : '';
const frLong = s => s ? new Date(s.slice(0, 10) + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }) : '';
const minus = s => s ? s.charAt(0).toLowerCase() + s.slice(1) : '';
/* Les intervenants, au milieu : nom (socle commun), icône, couleur. */
const ICO = { pp: ['user-star', 'var(--ink)'], pro: ['tools', 'var(--pro)'], ent: ['building-store', 'var(--ent)'], bde: ['building-bank', 'var(--bde)'], chef: ['signature', 'var(--chef)'], ddf: ['id-badge-2', 'var(--ddf)'], int: ['tools-kitchen-2', 'var(--int)'] };
let avatar = ['user', '#9aa8b6'];

/* ── Confirmation (avec le motif, pour « À corriger ») ── */
/* 11/10/2026 — « À corriger » : un motif choisi dans une liste, avec une courte précision facultative.
   L'élève lit le motif ; il ne répond jamais par écrit (aucune messagerie libre entre l'élève et un adulte). */
const MOTIFS = {
  search: ['Entreprise hors du domaine de formation', 'Informations de l’entreprise incomplètes', 'Stage à confirmer avec l’entreprise'],
  pre_return: ['Informations de l’entreprise incomplètes', 'Horaires incomplets', 'Signature manquante', 'Cachet manquant', 'Dates à vérifier', 'Informations du tuteur incomplètes'],
  conv_return: ['Signature de l’entreprise manquante', 'Cachet manquant', 'Signature du responsable légal manquante', 'Informations à vérifier'],
  attestation: ['Nombre de jours manquant', 'Signature manquante', 'Cachet manquant']
};
const motifsDe = id => (MOTIFS[id] || ['À compléter']).concat(['Voir avec mon référent']);
function confirmer(texte, motif, oui) {
  $('voile').innerHTML = `<div class="voile"><div class="fen" role="dialog" aria-modal="true"><h2>${motif ? 'À corriger' : 'Vous confirmez ?'}</h2><p>${esc(texte)}</p>${motif ? `<label class="sr" for="motif">Motif</label><select id="motif">${motif.map(x => `<option>${esc(x)}</option>`).join('')}</select><label class="sr" for="motifPlus">Précision</label><input type="text" id="motifPlus" maxlength="120" placeholder="Précision (facultatif)">` : ''}<div class="b2"><button id="non">${motif ? 'Annuler' : 'Non'}</button><button class="oui" id="oui">${motif ? 'Envoyer' : 'Oui'}</button></div></div></div>`;
  $('non').onclick = () => { $('voile').innerHTML = ''; };
  $('oui').onclick = () => { const plus = motif ? $('motifPlus').value.trim() : '', m = motif ? $('motif').value + (plus ? ' — ' + plus : '') : ''; $('voile').innerHTML = ''; oui(m); };
  if (motif) $('motif').focus();
}
/* Les signalements de l'élève (mapse.fr › Besoin d'aide ?) : une ligne à texte fixe dans le fil du suivi. */
const SIGNAUX = { stage: 'ne trouve pas de stage', annule: 'signale que son entreprise a annulé le stage', absent: 'signale une absence ou un retard', mal: 'signale que son stage se passe mal', contact: 'souhaite être contacté par son référent',
  'perdu-neg_given': 'a perdu sa fiche de négociation', 'perdu-pre_given': 'a perdu sa pré-convention', 'perdu-conv_given': 'a perdu sa convention', 'perdu-attest_in': 'a perdu son attestation' };

const q = new URLSearchParams(location.search), f = q.get('f');
/* Arrivée depuis la page d'entrée du référent (un seul élève) : un lien pour y revenir (changer de code, documents). */
if (q.get('r')) { const v = document.getElementById('versFiche'); if (v) v.hidden = false; }
if (!f) location.replace('frise-acteurs.html');
else reel(f);

async function reel(sid) {
  if (!/^20\d{2}-20\d{2}_[A-Z0-9]{4,6}_p[1-4]$/.test(sid)) { $('frise').innerHTML = '<p class="vide-msg">Lien incomplet.</p>'; $('titre').textContent = 'PFMP'; return; }
  let F, db;
  try {
    if (window.__FIRESTORE_SHIM__) ({ F, db } = window.__FIRESTORE_SHIM__);
    else {
      const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js');
      F = await import('https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js');
      db = F.getFirestore(initializeApp({ apiKey: 'AIzaSyBj_GXG8ln3GAxNXxiJkT2HPSWIHJpc1lA', authDomain: 'coordination-pedagogie.firebaseapp.com', projectId: 'coordination-pedagogie', storageBucket: 'coordination-pedagogie.firebasestorage.app', messagingSenderId: '526058585010', appId: '1:526058585010:web:ba4dd6d9c8281ba5bf02ab' }, 'pfmp-frise'));
    }
  } catch (e) { $('frise').innerHTML = '<p class="vide-msg">Connexion impossible. Rechargez la page.</p>'; return; }
  const svc = P.service(P.depotModulaire(F, db));
  let s = null, p = null, tu = null, cb = null, pret = 0, ms = [];
  /* « Nouveau » : ce que l'élève a fait depuis la dernière visite du référent sur cet appareil. */
  const cleVu = 'pfmp-frise-vu:' + sid;

    const L = [];
    sig.filter(x => !x.vu).forEach(x => L.push(`<div class="l sig"><i class="ti ti-alert-triangle"></i><span><b>${esc(s.code)} ${esc(SIGNAUX[x.k])}</b> · ${esc(jour(x.le))}</span><div class="bts"><button class="b" data-vu="${esc(x.le)}">J’en ai pris connaissance</button></div></div>`));
    Object.keys(P.GARDE).filter(id => P.entree(s, id).e === 'perdu').forEach(id => L.push(`<div class="l sig"><i class="ti ti-file-alert"></i><span><b>${esc(s.code)} a perdu : ${esc(minus(P.GARDE[id]))}</b></span><div class="bts"><button class="b" data-geste="${id}" data-action="redonner">Remis à nouveau</button></div></div>`));
    items.filter(x => !x.phase && x.cote !== 'g' && !x.cote.startsWith('m:') && ton(x) === 'afaire').forEach(x => {
      const info = x.signe === 'i' || x.lu;
      const t = x.lieu ? x.titre.replace(/ :$/, '') + ' : ' + x.lieu : x.deEleve ? s.code + ' · ' + minus(x.titre).replace(/^contrôler (la|le|l’)/, 'a remis $1').replace(/^recevoir /, 'a remis ') : x.titre;
      const bs = (x.acts || []).filter(a => !a.lien);
      L.push(`<div class="l"><i class="ti ti-${info ? 'mail' : x.deEleve ? 'file-arrow-right' : 'checkbox'}"></i><span><b>${esc(t)}</b>${x.date ? ' · ' + esc(x.date) : ''}</span><div class="bts">`
        + (bs.length ? bs.map(a => `<button class="b ${a.action === 'corriger' ? 'corr' : ''}" data-geste="${a.id}" data-action="${a.action}">${esc(a.t)}</button>`).join('') : `<button class="b dis" data-vers="c${x.k}">Voir</button>`) + `</div></div>`);
    });
    const n = L.length;
    if (!n) {
      L.push('<div class="l rien"><i class="ti ti-circle-check"></i><span>Rien à traiter</span></div>');
      const cor = items.filter(x => !x.phase && x.motif);
      cor.forEach(x => L.push(`<div class="l sig"><i class="ti ti-pencil-exclamation"></i><span>À corriger par l’élève : ${esc(minus(mots(x.titre, true)))} · ${esc(minus(x.motif))}</span><div class="bts"><button class="b dis" data-vers="c${x.k}">Voir</button></div></div>`));
      if (!cor.length && ici && ton(ici) !== 'afaire') L.push(`<div class="l att"><i class="ti ti-hourglass"></i><span>En attente : ${esc(ici.cote === 'g' ? 'l’élève' : minus(P.ACTEURS[ici.cote.slice(2)] || ''))} · ${esc(minus(mots(ici.titre, ici.cote === 'g')))}</span><div class="bts"><button class="b dis" data-vers="c${ici.k}">Voir</button></div></div>`);
    }
    sig.filter(x => x.vu).slice(-2).forEach(x => L.push(`<div class="l info"><i class="ti ti-mail-opened"></i><span>${esc(s.code)} ${esc(SIGNAUX[x.k])} · ${esc(jour(x.le))} · ✓ pris connaissance</span></div>`));
    if (cb && cb.accueilEnvoye) L.push(`<div class="l info"><i class="ti ti-notebook"></i><span>Avis sur l’accueil envoyé par l’élève le ${esc(cb.accueilEnvoye)} (carnet de bord)</span></div>`);
    bal.className = 'bal' + (n ? '' : ' vide');
    bal.innerHTML = `<h2>À traiter${n ? ` <em>${n}</em>` : ''}</h2>` + L.join('');
  }

  /* Le rendez-vous de bilan : la date part dans le suivi (visite.le) ; l'élève la voit dans son carnet de bord. */
  document.addEventListener('submit', async ev => {
    if (ev.target.id !== 'visiteF') return; ev.preventDefault();
    const v = $('visiteLe').value; if (!v) return;
    const b = ev.target.querySelector('button'); b.disabled = true;
    try { if (P.estFaite(s, 'visit')) await svc.agir(sid, 'visit', 'annuler', 'referent'); await svc.agir(sid, 'visit', 'faire', 'referent', { v }); }
    catch (e) { alert(e.message); b.disabled = false; }
  });
  document.addEventListener('click', ev => {
    const vers = ev.target.closest('[data-vers]');
    if (vers) { const c = $(vers.dataset.vers); if (c) { const d = c.closest('details'); d.open = true; ouv[d.dataset.ph] = true; c.scrollIntoView({ behavior: 'smooth', block: 'center' }); } return; }
    const v = ev.target.closest('[data-vu]');
    if (v && s) { v.disabled = true; svc.envoyerMessage(sid, 'referent', s.refSigle || '', '§vu:' + v.dataset.vu).catch(e => { v.disabled = false; alert(e.message); }); return; }
    const b = ev.target.closest('[data-geste]'); if (!b || !s) return;
    const id = b.dataset.geste, action = b.dataset.action, et = P.PAR_ID[id];
    confirmer(action === 'redonner' ? 'Remis à nouveau : ' + (et.garde || et.t) : (action === 'annuler' ? 'Annuler : ' : '') + et.t, action === 'corriger' ? motifsDe(id) : false, motif => {
      b.disabled = true;
      svc.agir(sid, id, action, 'referent', motif ? { motif } : undefined).catch(e => { b.disabled = false; alert(e.message); });
    });
  });
}

</script>
</body>
</html>
