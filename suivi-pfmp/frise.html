<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#176d66">
<meta name="robots" content="noindex">
<title>PFMP — la frise de l’élève et du référent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<!--
  La frise d'un élève en PFMP, vue par son enseignant référent (09/10/2026, trois couloirs).
  À gauche l'élève, à droite l'enseignant référent ; au milieu, en transit, ceux qui interviennent.
  Tout est tiré de la chronologie commune (pfmp-commun.js) : étapes, acteurs, consignes « Comment faire », sources.
    frise.html?f=2026-2027_K4A7_p1   la fiche réelle de l'élève (lien envoyé par le professeur principal)
    frise.html                       renvoie vers la démonstration (frise-acteurs.html)
  Firestore « coordination-pedagogie » : coordination_pfmp_suivi/{f} (+ eleve/parcours), lecture ;
  écriture des seuls gestes du référent, par le socle commun. Aucun nom d'élève.
-->
<style>
:root{--ink:#172738;--muted:#66768a;--line:#e3e9ee;--accent:#176d66;--accent-s:#e2f1ef;--el:#2d63b8;--el-s:#eaf0fb;--green:#1f9d6b;--green-s:#e8f6ef;--orange:#c46f1c;--orange-s:#fff3e6;--bg:#f5f7f9;
  --pro:#6d4bc4;--ent:#c46f1c;--bde:#0e7490;--ddf:#475569;--chef:#9f1239;--int:#4d7c0f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.shell{max-width:1120px;margin:auto;padding:22px 20px 80px}
.haut{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.haut a{color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.demo{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.demo button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 11px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer}
.tete{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 20px}
.code{width:56px;height:56px;border-radius:16px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:.06em}
.tete h1{margin:0;font-size:20px;letter-spacing:-.02em}
.tete .info{color:var(--muted);font-size:13.5px}
.tete .j{margin-left:auto;text-align:right}.tete .j b{display:block;font-size:26px;line-height:1}.tete .j span{font-size:12px;color:var(--muted)}
.maint{display:flex;align-items:center;gap:14px;border-radius:16px;padding:13px 18px;margin:14px 0 22px;background:var(--accent);color:#fff}
.maint small{display:block;opacity:.85;font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.maint b{font-size:16px}
/* Les trois couloirs */
.couloirs{display:grid;grid-template-columns:37% 26% 37%;align-items:end;gap:10px;margin:0 0 6px;padding:8px 0 14px}
.couloirs .t{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.couloirs .g .t{color:var(--el)}.couloirs .d .t{color:var(--accent);justify-content:flex-end}
.couloirs .m{text-align:center}.couloirs .m .t{justify-content:center;color:var(--muted)}
.acteurs{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:6px}
.acteurs span{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px 3px 4px;background:#fff;border:1px solid var(--line)}
.acteurs i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-style:normal}
.av{width:38px;height:38px;border-radius:50%;background:#378ADD;color:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 0 0 4px #fff,0 4px 14px -6px rgba(0,0,0,.35)}
.av.prof{background:var(--accent)}
/* La frise */
.frise{position:relative;padding:4px 0 10px}
.frise svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.phase{position:relative;z-index:2;text-align:center;margin:24px 0 12px}
.phase span{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.phase.ok span{color:var(--green);background:var(--green-s);border-color:#c4e6d6}
.phase.ici span{color:#fff;background:var(--ink);border-color:var(--ink)}
.et{position:relative;z-index:2;display:flex;margin:9px 0}
.et.m{margin:18px 0}
.et.g{justify-content:flex-start}.et.d{justify-content:flex-end}.et.m{justify-content:center}.et.c{justify-content:center}
.carte{position:relative;width:34%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 15px}
.carte .q{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.g .q{color:var(--el)}.d .q{color:var(--accent)}
.carte b{display:block;font-size:14.5px;font-weight:650;line-height:1.35;margin-top:1px}
.carte p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.carte .dt{display:inline-block;margin-top:5px;font-size:12px;font-weight:700;color:var(--muted)}
.carte .noeud{position:absolute;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:#fff;border:3px solid #d3dbe2}
.g .noeud{right:-31px}.d .noeud{left:-31px}
/* L'intervenant, en transit sur la ligne */
.etape-m{position:relative;display:flex;align-items:center;gap:10px;max-width:30%;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 16px 6px 6px}
.etape-m .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:18px;flex:none}
.etape-m .x{min-width:0}
.etape-m small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;line-height:1.2}
.etape-m b{display:block;font-size:13.5px;font-weight:650;line-height:1.3}
.et.c .carte{width:min(460px,70%);text-align:center;border:2px solid var(--accent);background:linear-gradient(135deg,#fff,var(--accent-s))}
.et.c .noeud{display:none}
.ens{position:relative;z-index:2;display:flex;justify-content:center;gap:8px;margin-top:6px}
/* États */
.fait .carte,.fait .etape-m{background:#fbfdfc}
.fait .noeud{background:var(--green);border-color:var(--green)}
.fait .dt{color:var(--green)}
.fait .etape-m{border-color:#c4e6d6}
.ici .carte{border:2px solid var(--orange);box-shadow:0 10px 26px -14px rgba(196,111,28,.55)}
.ici .etape-m{border-color:var(--orange);box-shadow:0 0 0 6px var(--orange-s)}
.ici .noeud{border-color:var(--orange);box-shadow:0 0 0 7px var(--orange-s)}
.ici .dt{color:var(--orange)}
.avenir .carte,.avenir .etape-m{opacity:.6}
.statut{display:flex;gap:6px;margin:14px 0 0;flex-wrap:wrap}
.statut span{flex:1;min-width:110px;text-align:center;font-size:12px;font-weight:700;padding:8px 6px;border-radius:10px;background:#fff;border:1px solid var(--line);color:#9aa8b6}
.statut span.ok{color:var(--green);background:var(--green-s);border-color:#c4e6d6}
.statut span.ici{color:#fff;background:var(--accent);border-color:var(--accent)}
.bal{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:12px 0 0}
.bal h2{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);display:flex;align-items:center;gap:8px}
.bal .l{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid #eef2f5;font-size:14px}
.bal .l:first-of-type{border-top:0}
.bal .l i{font-size:18px;color:var(--el)}
.bal .l span{flex:1}
.bal .l em{font-style:normal;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--accent);color:#fff}
.bal .l em.ok{background:var(--green-s);color:var(--green)}
.signe{display:inline-flex;align-items:center;gap:4px;margin-left:6px;font-size:10.5px;letter-spacing:.04em}
.relais{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;font-weight:700;color:var(--muted)}
.relais .tk{letter-spacing:-2px;font-weight:800;color:#c3ccd5}
.relais .tk.un{color:var(--muted)}.relais .tk.deux{color:var(--green)}
.lu{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--el-s);color:var(--el)}
.lu.ok{background:var(--green-s);color:var(--green)}
.etape-m .relais{margin-top:2px;font-size:11px}
/* Les couloirs en couleur : bleu pour l'élève, vert pour le référent, le milieu reste neutre. */
.frise::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;border-radius:22px;
  background:linear-gradient(90deg,rgba(45,99,184,.07) 0 37%,transparent 37% 63%,rgba(23,109,102,.08) 63% 100%)}
.couloirs .g{background:rgba(45,99,184,.09);border-radius:14px 0 0 0;padding:10px 12px}
.couloirs .d{background:rgba(23,109,102,.10);border-radius:0 14px 0 0;padding:10px 12px}
.couloirs{gap:0}
.et.g .carte{border-left:4px solid var(--el)}
.et.d .carte{border-right:4px solid var(--accent)}
.avenir.g .carte{border-left-color:#b9cbe8}.avenir.d .carte{border-right-color:#b3d3cf}
.prop{margin:6px 0 2px;padding:8px 12px;border-radius:10px;background:var(--el-s);color:var(--ink);font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.prop i{color:var(--el)}
.suite{margin-top:8px;padding-top:8px;border-top:1px dashed #dfe6ec;font-size:13px}
.suite small{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--el)}
.suite span{display:block;margin-top:2px;color:var(--ink)}
.cf{margin-top:8px;border-top:1px dashed #dfe6ec;padding-top:6px}
.cf summary{list-style:none;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:5px}
.cf summary::-webkit-details-marker{display:none}
.cf summary::after{content:"▾";margin-left:2px}
.cf[open] summary::after{content:"▴"}
.cf ol{margin:6px 0 4px;padding-left:18px;font-size:13px;color:var(--ink);display:grid;gap:4px}
.cf small{display:block;font-size:11px;color:var(--muted)}
.d .carte{text-align:left}
/* Les grandes étapes, numérotées */
.phase span{font-size:12.5px;padding:7px 18px}
.phase span b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--ink);margin-right:8px;font-size:12px}
.phase.ok span b{background:var(--green);color:#fff}.phase.ici span b{background:#fff;color:var(--ink)}
.leg{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:28px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid #d3dbe2;background:#fff}
.leg .f{background:var(--green);border-color:var(--green)}.leg .o{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-s)}
@media (max-width:700px){
  .carte{width:40%;padding:9px 11px}.carte p{display:none}.carte b{font-size:13px}
  .g .noeud{right:-24px}.d .noeud{left:-24px}
  .etape-m{max-width:58%}.etape-m b{font-size:12.5px}
  .acteurs{display:none}.tete .info{display:none}
}

[hidden]{display:none!important}
.maint button{margin-left:auto;border:0;background:#fff;color:var(--accent);border-radius:10px;padding:9px 15px;font:inherit;font-weight:700;cursor:pointer;flex:none}
.carte .acts,.etape-m .acts{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.etape-m .acts{margin-top:4px}
.acts button{border:0;background:var(--accent);color:#fff;border-radius:9px;padding:7px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.acts button.sec{background:#fff;color:var(--orange);border:1px solid #f0d2b0}
.acts button.lien{background:none;color:var(--muted);padding:4px 2px;font-weight:600}
.etape-m .acts button{padding:4px 10px;font-size:12px}
.bal .l button{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:4px 12px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.motif{display:block;margin-top:6px;font-size:12.5px;color:var(--orange);font-weight:600}
.nouveau .carte{animation:clignote 1.6s ease-in-out infinite}
@keyframes clignote{0%,100%{box-shadow:0 0 0 0 rgba(45,99,184,0)}50%{box-shadow:0 0 0 6px rgba(45,99,184,.28)}}
.nouveau .q::after{content:"Nouveau";margin-left:8px;background:var(--el);color:#fff;border-radius:6px;padding:1px 6px;font-size:10px;letter-spacing:.06em}
.vide-msg{text-align:center;color:var(--muted);padding:60px 20px}
#voile:empty{display:none}
.voile{position:fixed;inset:0;background:rgba(20,30,40,.4);display:grid;place-items:center;z-index:20;padding:20px}
.fen{background:#fff;border-radius:20px;padding:22px;max-width:400px;width:100%;text-align:center}
.fen h2{margin:4px 0 6px;font-size:20px}.fen p{margin:0 0 16px;color:var(--muted)}
.fen textarea{width:100%;min-height:80px;border:2px solid var(--line);border-radius:12px;padding:10px;font:inherit;margin:0 0 14px;resize:vertical}
.fen .b2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fen button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px;font:inherit;font-weight:700;cursor:pointer}
.fen button.oui{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<main class="shell">
 <div class="haut"><a href="../">← Coordination & Pédagogie</a></div>
 <section class="tete" style="margin-bottom:0"><div class="code" id="code">—</div><div><h1 id="titre">Chargement…</h1><div class="info" id="info"></div></div><div class="j"><b id="jx"></b><span id="jxl"></span></div></section>
 <div class="statut" id="statut"></div>
 <section class="bal" id="bal" hidden></section>
 <div class="maint" id="maint" hidden></div>
 <div class="couloirs">
  <div class="g"><div class="t"><span class="av" id="avEl"><i class="ti ti-user"></i></span>L’élève</div></div>
  <div class="m"><div class="t">Ils interviennent</div><div class="acteurs" id="acteurs"></div></div>
  <div class="d"><div class="t">L’enseignant référent<span class="av prof"><i class="ti ti-school"></i></span></div></div>
 </div>
 <section class="frise" id="frise"></section>
 <div class="leg"><span>● action</span><span>✉ information · « Lu »</span><span><b style="color:var(--green)">✓✓</b> document remis et reçu</span><span><i class="f"></i>fait</span><span><i class="o"></i>maintenant</span><span><i></i>à venir</span></div>
</main>
<div id="voile"></div>
<script src="./pfmp-commun.js?v=2026-10-09a"></script>
<script type="module">
const P = window.PFMP_COMMUN;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const AVATARS = [['cat', '#D85A30'], ['dog', '#BA7517'], ['butterfly', '#D4537E'], ['fish', '#378ADD'], ['plant-2', '#639922'], ['rocket', '#534AB7'], ['feather', '#1D9E75'], ['planet', '#7F77DD'], ['bike', '#185FA5'], ['music', '#993556'], ['star', '#EF9F27'], ['paw', '#854F0B'], ['ball-football', '#3B6D11'], ['palette', '#A32D2D'], ['camera', '#5F5E5A'], ['bolt', '#C2410C'], ['leaf', '#0F6E56'], ['moon', '#3C3489']];
const auj = () => new Date().toLocaleDateString('sv-SE');
const fr = s => s ? new Date(s.slice(0, 10) + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) : '';
const frLong = s => s ? new Date(s.slice(0, 10) + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }) : '';
const minus = s => s ? s.charAt(0).toLowerCase() + s.slice(1) : '';
/* Les intervenants, au milieu : nom (socle commun), icône, couleur. */
const ICO = { pp: ['user-star', 'var(--ink)'], pro: ['tools', 'var(--pro)'], ent: ['building-store', 'var(--ent)'], bde: ['building-bank', 'var(--bde)'], chef: ['signature', 'var(--chef)'], ddf: ['id-badge-2', 'var(--ddf)'], int: ['tools-kitchen-2', 'var(--int)'] };
$('acteurs').innerHTML = Object.keys(ICO).map(k => `<span><i style="background:${ICO[k][1]}" class="ti ti-${ICO[k][0]}"></i>${esc(P.ACTEURS[k])}</span>`).join('');
const STATUTS = ['Recherche', 'Proposition de stage', 'Stage validé', 'Convention signée', 'En stage', 'Terminé'];
let avatar = ['user', '#9aa8b6'];

/* ── Confirmation (avec le motif, pour « À corriger ») ── */
function confirmer(texte, motif, oui) {
  $('voile').innerHTML = `<div class="voile"><div class="fen" role="dialog" aria-modal="true"><h2>${motif ? 'À corriger' : 'Vous confirmez ?'}</h2><p>${esc(texte)}</p>${motif ? '<textarea id="motif" maxlength="300" placeholder="Ce qu’il faut corriger"></textarea>' : ''}<div class="b2"><button id="non">${motif ? 'Annuler' : 'Non'}</button><button class="oui" id="oui">${motif ? 'Envoyer' : 'Oui'}</button></div></div></div>`;
  $('non').onclick = () => { $('voile').innerHTML = ''; };
  $('oui').onclick = () => { const m = motif ? $('motif').value.trim() : ''; if (motif && !m) { $('motif').focus(); return; } $('voile').innerHTML = ''; oui(m); };
  if (motif) $('motif').focus();
}

const q = new URLSearchParams(location.search), f = q.get('f');
if (!f) location.replace('frise-acteurs.html');
else reel(f);

async function reel(sid) {
  if (!/^20\d{2}-20\d{2}_[A-Z0-9]{4,6}_p[1-4]$/.test(sid)) { $('frise').innerHTML = '<p class="vide-msg">Lien incomplet.</p>'; $('titre').textContent = 'PFMP'; return; }
  let F, db;
  try {
    if (window.__FIRESTORE_SHIM__) ({ F, db } = window.__FIRESTORE_SHIM__);
    else {
      const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js');
      F = await import('https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js');
      db = F.getFirestore(initializeApp({ apiKey: 'AIzaSyBj_GXG8ln3GAxNXxiJkT2HPSWIHJpc1lA', authDomain: 'coordination-pedagogie.firebaseapp.com', projectId: 'coordination-pedagogie', storageBucket: 'coordination-pedagogie.firebasestorage.app', messagingSenderId: '526058585010', appId: '1:526058585010:web:ba4dd6d9c8281ba5bf02ab' }, 'pfmp-frise'));
    }
  } catch (e) { $('frise').innerHTML = '<p class="vide-msg">Connexion impossible. Rechargez la page.</p>'; return; }
  const svc = P.service(P.depotModulaire(F, db));
  let s = null, p = null, tu = null, pret = 0;
  /* « Nouveau » : ce que l'élève a fait depuis la dernière visite du référent sur cet appareil. */
  const cleVu = 'pfmp-frise-vu:' + sid;
  let vu = ''; try { vu = localStorage.getItem(cleVu) || ''; } catch (e) {}
  const noterVu = () => { try { localStorage.setItem(cleVu, new Date().toISOString()); } catch (e) {} };
  addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') noterVu(); });
  addEventListener('pagehide', noterVu);
  const pret3 = () => { if (pret === 3) rendre(); };
  svc.ecouterSuivi(sid, d => { s = d; pret |= 1; pret3(); }, () => { $('frise').innerHTML = '<p class="vide-msg">Lecture impossible.</p>'; });
  F.onSnapshot(F.doc(db, 'coordination_pfmp_suivi', sid, 'eleve', 'parcours'), x => { p = x.exists() ? x.data() : null; pret |= 2; pret3(); }, () => { pret |= 2; pret3(); });
  /* Les gestes du tuteur (arrivée, point d'étape, présences), si le lien porte sa clé. */
  const tk = q.get('t');
  if (tk && /^[a-z0-9]{10}$/.test(tk)) F.onSnapshot(F.doc(db, 'coordination_pfmp_tuteur', sid + '_' + tk), x => { tu = x.exists() ? x.data() : null; if (pret === 3) rendre(); }, () => {});

  function rendre() {
    if (!s) { $('titre').textContent = 'PFMP'; $('frise').innerHTML = '<p class="vide-msg">Cette fiche n’existe pas encore. L’élève l’ouvre en déclarant son stage sur mapse.fr.</p>'; return; }
    const pr = (p && p.prepa) || {}, R = (p && p.recherches) || [], ent = pr.trouveR && R.find(r => r.id === pr.trouveR);
    if (p && p.avatar != null && AVATARS[p.avatar]) avatar = AVATARS[p.avatar];
    $('avEl').style.background = avatar[1]; $('avEl').innerHTML = `<i class="ti ti-${avatar[0]}"></i>`;
    $('code').textContent = s.code; $('titre').textContent = (s.libelle || 'PFMP ' + s.periode) + (s.classe ? ' · ' + s.classe : '');
    $('info').textContent = [s.debut ? 'Du ' + frLong(s.debut) + ' au ' + frLong(s.fin) : '', s.refSigle ? 'référent : ' + s.refSigle : ''].filter(Boolean).join(' · ');
    const t = auj(), j = s.debut && s.debut > t ? Math.round((new Date(s.debut + 'T12:00:00') - new Date(t + 'T12:00:00')) / 864e5) : null;
    $('jx').textContent = j != null ? 'J-' + j : ''; $('jxl').textContent = j != null ? 'avant le départ' : '';
    const items = construire(s, pr, R, ent);
    const etapes = items.filter(x => !x.phase);
    /* Maintenant : la première étape non faite après la plus avancée (un oubli en arrière reste visible, sans bloquer). */
    let der = -1; etapes.forEach((x, k) => { if (x.etat === 'fait') der = k; });
    const ici = etapes.slice(der + 1).find(x => x.etat !== 'fait') || etapes.find(x => x.etat !== 'fait');
    if (ici) ici.etat = 'ici';
    let h = '', num = 0;
    items.forEach((x, i) => {
      if (x.phase) {
        const suite = []; for (let k = i + 1; k < items.length && !items[k].phase; k++) suite.push(items[k]);
        if (!suite.length) return;
        num++;
        const cls = suite.every(y => y.etat === 'fait') ? 'ok' : suite.some(y => y.etat === 'ici') ? 'ici' : '';
        h += `<div class="phase ${cls}"><span><b>${cls === 'ok' ? '✓' : num}</b>${esc(x.phase)}</span></div>`; return;
      }
      h += carte(x);
    });
    h += `<div class="ens"><span class="av" style="background:${avatar[1]}"><i class="ti ti-${avatar[0]}"></i></span><span class="av prof"><i class="ti ti-school"></i></span></div>`;
    $('frise').innerHTML = h + '<svg aria-hidden="true"></svg>';
    /* Le statut du stage. */
    let st = 0;
    if (P.estFaite(s, 'search') || P.entree(s, 'search').e === 'declare') st = 1;
    if (P.estFaite(s, 'neg_signed')) st = 2;
    if (P.estFaite(s, 'ddf_copies') || P.estFaite(s, 'copies')) st = 3;
    if (['fait', 'valide'].includes(P.entree(s, 'here').e) || (s.debut && t >= s.debut)) st = 4;
    if (P.estFaite(s, 'student_eval')) st = 6;
    $('statut').innerHTML = STATUTS.map((x, k) => `<span class="${k < st ? 'ok' : k === st ? 'ici' : ''}">${k < st ? '✓ ' : ''}${esc(x)}</span>`).join('');
    boite(items);
    const m = $('maint');
    if (ici) {
      const qui = ici.cote.startsWith('m:') ? P.ACTEURS[ici.cote.slice(2)] : ici.cote === 'g' ? 'L’élève' : ici.cote === 'c' ? 'Ensemble' : 'Vous';
      const b = (ici.acts || []).find(a => !a.lien);
      m.hidden = false; m.style.background = ici.cote.startsWith('m:') ? ICO[ici.cote.slice(2)][1] : ici.cote === 'g' ? 'var(--el)' : 'var(--accent)';
      m.innerHTML = `<div><small>${esc(qui)}, maintenant</small><b>${esc(ici.titre)}</b>${ici.date ? ' · ' + esc(ici.date) : ''}</div>${b ? `<button data-geste="${b.id}" data-action="${b.action}">${esc(b.t)}</button>` : ''}`;
    } else { m.hidden = false; m.style.background = 'var(--green)'; m.innerHTML = '<div><small>Parcours terminé</small><b>Stage validé, bilan fait</b></div>'; }
    requestAnimationFrame(ligne);
  }

  const quand = (en, et) => en && en.le && en.e ? fr(en.le) : ((P.echeance(et, s) || {}).date ? 'avant le ' + fr(P.echeance(et, s).date) : '');
  const neuf = en => en && en.par === 'eleve' && en.le && en.le > vu;
  const acte = (id, action, t, lien) => ({ id, action, t, lien });
  /* Les boutons du référent sur une étape, avec les mots du socle commun. */
  function gestes(et, en, lu) {
    return P.actions(et, en, 'referent').map(a => acte(et.id, a,
      a === 'valider' && lu ? 'Lu' : a === 'faire' ? 'C’est fait' : a === 'corriger' && lu ? 'Une autre entreprise' : P.libelleAction(a, 'referent', et), a === 'annuler'));
  }
  /* Ce que le référent fait, dit comme il le fait. */
  const DIT = { neg_signed: 'Vérifier, signer et garder la fiche', pre_given: 'Remettre la pré-convention en main propre', pre_return: 'Contrôler la pré-convention', pronote: 'Générer la convention dans le client Pronote',
    convention: 'Garder l’attestation de côté', pedagogy: 'Joindre l’annexe pédagogique', conv_given: 'Remettre la convention', conv_return: 'Contrôler et signer la convention', bde: 'Transmettre le dossier complet',
    copies: 'Distribuer les exemplaires', arrival: 'Appeler le tuteur', installed: 'Vérifier l’arrivée et l’installation', evaluation_sent: 'Envoyer le compte rendu d’évaluation', midpoint: 'Suivi du milieu de stage',
    att_sent: 'Envoyer l’attestation au tuteur', assessment: 'Bilan avec le tuteur', attestation: 'Recevoir l’attestation', attestation_bde: 'Transmettre l’attestation', evaluation_pro: 'Remettre le compte rendu d’évaluation',
    appreciation: 'Clôturer dans Pronote', archive: 'Archiver la convention', dossier: 'Ranger le dossier de l’élève', intendance: 'Prévenir l’intendance' };
  const A_QUI = { pre_given: 'l’élève', conv_given: 'l’élève', copies: 'la famille et l’entreprise', pre_return: 'le référent', conv_return: 'le référent', attestation: 'le référent', neg_given: 'l’élève', neg_return: 'le référent', bde: 'le bureau des entreprises', bde_ok: 'le DDF', ddf_copies: 'le référent' };
  const SUITE = { search: 'Établir sa fiche de négociation avec son enseignant professionnel.' };

  function construire(s, pr, R, ent) {
    const items = [], E = id => P.entree(s, id);
    P.PHASES.forEach((nom, ph) => {
      items.push({ phase: nom });
      if (ph === 1) {
        items.push({ cote: 'g', signe: 'a', titre: 'CV et lettre de motivation prêts', detail: 'CV : ' + (pr.cv || '—') + ' · lettre : ' + (pr.lettre || '—'), etat: (pr.cv === 'À jour' && pr.lettre === 'Prête') || !!E('search').e ? 'fait' : 'avenir' });
        const fini = R.filter(r => r.statut !== 'prevu').length;
        items.push({ cote: 'g', signe: 'a', titre: 'Démarches de recherche', detail: R.length ? R.length + ' démarche' + (R.length > 1 ? 's' : '') + ' notée' + (R.length > 1 ? 's' : '') + ' · ' + fini + ' faite' + (fini > 1 ? 's' : '') : 'Aucune démarche notée', etat: R.length || E('search').e ? 'fait' : 'avenir' });
      }
      P.ETAPES.filter(et => et.ph === ph && !et.local && et.ty !== 'journal' && (!et.opt || et.id === 'intendance')).forEach(et => {
        const en = E(et.id), e = en.e, o = { aide: et.aide, src: et.src };
        const fait = P.estFaite(s, et.id);
        if (et.id === 'referent') { items.push({ cote: 'm:pp', signe: 'a', titre: 'Désigne l’enseignant référent', detail: s.refSigle || '', etat: fait || s.refSigle ? 'fait' : 'avenir' }); return; }
        if (et.id === 'sent') { items.push(Object.assign({ cote: 'd', signe: 'i', titre: 'Vous suivez ' + s.code + (s.classe ? ' · ' + s.classe : ''), detail: (s.libelle || 'PFMP ' + s.periode) + (s.debut ? ' · du ' + fr(s.debut) + ' au ' + fr(s.fin) : ''), etat: fait ? 'fait' : 'avenir', lu: 1, date: quand(en, et), acts: gestes(et, en, true).map(a => a.action === 'recevoir' ? Object.assign(a, { t: 'Lu' }) : a), boite: 1, en }, o)); return; }
        /* Un intervenant : au milieu, en transit. */
        if (et.act) {
          const parEleve = et.coche === 'eleve';
          let detail = parEleve ? 'Coché par l’élève' : 'Coché par vous';
          if (et.id === 'arrival' && tu && tu.arrivee) detail = 'Le tuteur a confirmé en ligne';
          items.push({ cote: 'm:' + et.act, signe: A_QUI[et.id] ? 'r' : 'a', a: A_QUI[et.id], titre: et.t, detail, etat: fait || (parEleve && ['declare', 'fait', 'valide'].includes(e)) ? 'fait' : 'avenir', date: quand(en, et), nouveau: neuf(en), acts: parEleve ? [] : gestes(et, en), boite: et.id === 'ddf_copies' || et.id === 'neg_return', en });
          return;
        }
        if (et.ty === 'declare') {
          if (et.id === 'student_eval') { items.push(Object.assign({ cote: 'c', signe: 'a', titre: 'Le bilan du stage, ensemble', detail: 'L’élève remplit l’évaluation de son stage', etat: fait ? 'fait' : 'avenir', date: quand(en, et), acts: gestes(et, en), nouveau: neuf(en) }, o)); return; }
          const declare = ['declare', 'fait', 'valide'].includes(e);
          items.push({ cote: 'g', signe: 'a', titre: et.te || et.t, detail: et.id === 'midpoint' && en.v ? (en.v === 'difficulte' ? 'Difficulté signalée' : 'Tout va bien') : '', etat: declare ? 'fait' : 'avenir', date: quand(en, et), nouveau: neuf(en), motif: e === 'corriger' ? en.motif : '' });
          if (et.id === 'here' && tu && tu.arrivee) items.push({ cote: 'm:ent', signe: 'i', titre: 'Le tuteur confirme l’arrivée', detail: 'En ligne', etat: 'fait', date: fr(tu.arrivee.le || '') });
          if (et.id === 'midpoint' && tu && tu.milieu) items.push({ cote: 'm:ent', signe: 'i', titre: tu.milieu.v === 'difficulte' ? 'Le tuteur signale une difficulté' : 'Le tuteur : « tout se passe bien »', detail: 'En ligne', etat: 'fait', date: fr(tu.milieu.le || '') });
          if (!et.verif) return;
          if (et.id === 'search') items.push(Object.assign({ cote: 'd', signe: 'i', titre: s.code + ' a une proposition de stage :', lieu: ent ? ent.nom + (ent.adresse ? ', ' + ent.adresse : '') : '', suite: SUITE.search, etat: e === 'valide' ? 'fait' : 'avenir', lu: 1, date: e === 'valide' ? fr(en.le) : '', acts: e === 'valide' ? gestes(et, en, true) : e === 'declare' ? gestes(et, en, true) : [], boite: 1, en }, o));
          else items.push(Object.assign({ cote: 'd', signe: 'a', titre: DIT[et.id] || et.t, etat: e === 'valide' ? 'fait' : 'avenir', date: e === 'valide' ? fr(en.le) : quand(en, et), acts: gestes(et, en).filter(a => a.action !== 'corriger') }, o));
          return;
        }
        if (et.ty === 'remise' && et.from === 'eleve') {
          items.push({ cote: 'g', signe: 'r', a: A_QUI[et.id] || 'le référent', titre: et.te || et.t, etat: ['remis', 'valide'].includes(e) ? 'fait' : 'avenir', remis: e === 'remis', recu: e === 'valide', date: quand(en, et), nouveau: neuf(en), motif: e === 'corriger' ? en.motif : '' });
          items.push(Object.assign({ cote: 'd', signe: 'a', titre: DIT[et.id] || et.t, etat: e === 'valide' ? 'fait' : 'avenir', date: e === 'valide' ? fr(en.le) : '', acts: gestes(et, en), boite: 1, en, deEleve: 1 }, o));
          return;
        }
        if (et.ty === 'remise') {
          items.push(Object.assign({ cote: 'd', signe: 'r', a: A_QUI[et.id] || 'l’élève', titre: DIT[et.id] || et.t, detail: et.ou ? et.ou.replace('Pronote › Communication › Casier numérique', 'Casier numérique de Pronote') : '', etat: ['remis', 'valide'].includes(e) ? 'fait' : 'avenir', remis: e === 'remis', recu: e === 'valide', date: quand(en, et), acts: gestes(et, en) }, o));
          return;
        }
        /* Une tâche ou une information du référent. */
        let detail = '';
        if (et.id === 'visit') { const v = s.visite || {}; detail = v.le ? 'Visite : ' + frLong(v.le) : v.rdv ? 'Rendez-vous proposé au tuteur' : 'Le tuteur choisit un créneau en ligne'; }
        items.push(Object.assign({ cote: 'd', signe: 'a', titre: et.id === 'visit' ? 'Fixer le rendez-vous du bilan' : DIT[et.id] || et.t, detail, etat: fait || (et.id === 'visit' && (s.visite || {}).le) ? 'fait' : 'avenir', date: fait ? fr(en.le) : quand(en, et), acts: et.id === 'visit' ? [] : gestes(et, en) }, o));
        if (et.id === 'assessment' && tu && tu.presences) { const pz = tu.presences, n = Object.values(pz).filter(x => x === 'p').length, tot = Object.keys(pz).length; items.push({ cote: 'm:ent', signe: 'i', titre: 'Présences tenues en ligne', detail: n + ' jour' + (n > 1 ? 's' : '') + ' sur ' + tot, etat: 'fait' }); }
      });
    });
    return items;
  }

  function relais(x) {
    if (x.signe !== 'r') return '';
    const n = x.recu ? 2 : x.remis ? 1 : x.etat === 'fait' ? 2 : 0;
    return `<div class="relais"><span class="tk ${n === 2 ? 'deux' : n === 1 ? 'un' : ''}">${n === 2 ? '✓✓' : '✓'}</span>→ ${esc(x.a || '')}${n === 2 ? ' · reçu' : n === 1 ? ' · remis' : ''}</div>`;
  }
  const boutons = acts => acts && acts.length ? `<div class="acts">${acts.map(a => `<button class="${a.lien ? 'lien' : a.action === 'corriger' ? 'sec' : ''}" data-geste="${a.id}" data-action="${a.action}">${esc(a.t)}</button>`).join('')}</div>` : '';
  function carte(x) {
    const marque = x.signe === 'i' ? '<span class="signe">✉</span>' : '';
    if (x.cote.startsWith('m:')) {
      const k = x.cote.slice(2), [ic, c] = ICO[k];
      return `<div class="et m ${x.etat}"><div class="etape-m"><span class="ic" style="background:${c}"><i class="ti ti-${x.etat === 'fait' ? 'check' : ic}"></i></span><div class="x"><small style="color:${c}">${esc(P.ACTEURS[k])}${marque}</small><b>${esc(x.titre)}</b>${relais(x) || (x.detail ? `<div class="relais">${esc(x.detail)}</div>` : '')}${boutons(x.acts)}</div></div></div>`;
    }
    const qui = x.cote === 'g' ? `<span class="mini" style="background:${avatar[1]};width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;margin-right:6px;vertical-align:-5px"><i class="ti ti-${avatar[0]}"></i></span>Élève` : x.cote === 'c' ? 'Ensemble' : 'Enseignant référent';
    const cf = x.aide && x.aide.length ? `<details class="cf"><summary>Comment faire</summary><ol>${x.aide.map(c => `<li>${esc(c)}</li>`).join('')}</ol>${x.src ? `<small>Source : ${esc(x.src)}</small>` : ''}</details>` : '';
    return `<div class="et ${x.cote} ${x.etat}${x.nouveau ? ' nouveau' : ''}"><div class="carte"><i class="noeud"></i><div class="q">${qui}${marque}</div><b>${esc(x.titre)}</b>${x.detail ? `<p>${esc(x.detail)}</p>` : ''}`
      + (x.lieu ? `<div class="prop"><i class="ti ti-building-store"></i>${esc(x.lieu)}</div>` : '')
      + (x.suite ? `<div class="suite"><small><i class="ti ti-arrow-right"></i> Étape suivante · pour l’élève</small><span>${esc(x.suite)}</span></div>` : '')
      + relais(x) + (x.motif ? `<span class="motif">À corriger : ${esc(x.motif)}</span>` : '')
      + (x.date ? `<span class="dt">${x.etat === 'fait' ? '✓ ' : ''}${esc(x.date)}</span>` : '') + boutons(x.acts) + cf + `</div></div>`;
  }

  /* La boîte aux lettres : ce qu'on signale au référent et ce qu'on lui remet (les trois derniers). */
  function boite(items) {
    const l = items.filter(x => x.boite && x.en && x.en.e).slice(-3).reverse();
    const bal = $('bal'); bal.hidden = false;
    bal.innerHTML = `<h2><i class="ti ti-mail"></i> Boîte aux lettres du référent</h2>` + (l.length ? l.map(x => {
      const ok = x.etat === 'fait', info = x.signe === 'i' || x.lu;
      const t = x.lieu ? x.titre.replace(/ :$/, '') + ' : ' + x.lieu + ' — étape suivante pour l’élève : ' + minus(x.suite) : x.deEleve ? s.code + ' · ' + minus(x.titre).replace(/^contrôler (la|le|l’)/, 'remet $1').replace(/^recevoir /, 'remet ') : x.titre;
      const b = !ok && (x.acts || []).find(a => !a.lien && a.action !== 'corriger');
      return `<div class="l"><i class="ti ti-${info ? 'mail-opened' : 'file-arrow-right'}"></i><span>${esc(t)}</span>${b ? `<button data-geste="${b.id}" data-action="${b.action}">${esc(info ? 'Lu' : 'Reçu')}</button>` : `<em class="ok">${info ? '✓ Lu' : '✓✓ Reçu'}</em>`}</div>`;
    }).join('') : '<div class="l"><span style="color:var(--muted)">Rien pour le moment.</span></div>');
  }

  document.addEventListener('click', ev => {
    const b = ev.target.closest('[data-geste]'); if (!b || !s) return;
    const id = b.dataset.geste, action = b.dataset.action, et = P.PAR_ID[id];
    confirmer((action === 'annuler' ? 'Annuler : ' : '') + et.t, action === 'corriger', motif => {
      b.disabled = true;
      svc.agir(sid, id, action, 'referent', motif ? { motif } : undefined).catch(e => { b.disabled = false; alert(e.message); });
    });
  });
}

/* La ligne passe par chaque étape : à gauche, au milieu, à droite. */
function ligne() {
  const f = $('frise'), svg = f.querySelector('svg'); if (!svg) return;
  const b = f.getBoundingClientRect();
  const pts = [...f.querySelectorAll('.et')].map(el => {
    const v = el.classList.contains('fait') || el.classList.contains('ici');
    if (el.classList.contains('m') || el.classList.contains('c')) {
      const r = el.querySelector(el.classList.contains('m') ? '.etape-m' : '.carte').getBoundingClientRect(), x = r.left + r.width / 2 - b.left;
      return { a: { x, y: r.top - b.top }, s: { x, y: r.bottom - b.top }, v };
    }
    const r = el.querySelector('.noeud').getBoundingClientRect(), o = { x: r.left + r.width / 2 - b.left, y: r.top + r.height / 2 - b.top };
    return { a: o, s: o, v };
  });
  const seg = (a, c) => { const m = (a.y + c.y) / 2; return `M${a.x},${a.y} C${a.x},${m} ${c.x},${m} ${c.x},${c.y}`; };
  let s = '';
  for (let i = 1; i < pts.length; i++) {
    const v = pts[i].v;
    s += `<path d="${seg(pts[i - 1].s, pts[i].a)}" fill="none" stroke="${v ? '#1f9d6b' : '#d8e0e7'}" stroke-width="${v ? 4 : 3}" stroke-linecap="round" ${v ? '' : 'stroke-dasharray="1 8"'}/>`;
  }
  svg.innerHTML = s;
}
addEventListener('resize', () => requestAnimationFrame(ligne));
document.addEventListener('toggle', () => requestAnimationFrame(ligne), true);
document.fonts && document.fonts.ready.then(() => requestAnimationFrame(ligne));
</script>
</body>
