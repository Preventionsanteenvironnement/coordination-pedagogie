<!--
  Modèle (08/10/2026) : la frise à trois couloirs.
  À gauche l'élève, à droite l'enseignant référent : le suivi officiel des deux.
  Au milieu, en transit, ceux qui interviennent : enseignant professionnel, entreprise, bureau des entreprises,
  DDF, cheffe d'établissement, intendance. La ligne passe par eux puis repart à gauche ou à droite.
  Ordre : procédure R26CSRP-LP, check-list du professeur référent, fiche de négociation, précisions de Brahim.
  Démonstration : données fictives, aucune base.
-->
<style>
:root{--ink:#172738;--muted:#66768a;--line:#e3e9ee;--accent:#176d66;--accent-s:#e2f1ef;--el:#2d63b8;--el-s:#eaf0fb;--green:#1f9d6b;--green-s:#e8f6ef;--orange:#c46f1c;--orange-s:#fff3e6;--bg:#f5f7f9;
  --pro:#6d4bc4;--ent:#c46f1c;--bde:#0e7490;--ddf:#475569;--chef:#9f1239;--int:#4d7c0f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.shell{max-width:1120px;margin:auto;padding:22px 20px 80px}
.haut{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.haut a{color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.demo{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.demo button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 11px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer}
.tete{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 20px}
.code{width:56px;height:56px;border-radius:16px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:.06em}
.tete h1{margin:0;font-size:20px;letter-spacing:-.02em}
.tete .info{color:var(--muted);font-size:13.5px}
.tete .j{margin-left:auto;text-align:right}.tete .j b{display:block;font-size:26px;line-height:1}.tete .j span{font-size:12px;color:var(--muted)}
.maint{display:flex;align-items:center;gap:14px;border-radius:16px;padding:13px 18px;margin:14px 0 22px;background:var(--accent);color:#fff}
.maint small{display:block;opacity:.85;font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.maint b{font-size:16px}
/* Les trois couloirs */
.couloirs{display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:end;gap:10px;margin:0 0 6px;padding:8px 0 14px}
.couloirs .t{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.couloirs .g .t{color:var(--el)}.couloirs .d .t{color:var(--accent);justify-content:flex-end}
.couloirs .m{text-align:center}.couloirs .m .t{justify-content:center;color:var(--muted)}
.acteurs{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:6px}
.acteurs span{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px 3px 4px;background:#fff;border:1px solid var(--line)}
.acteurs i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-style:normal}
.av{width:38px;height:38px;border-radius:50%;background:#378ADD;color:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 0 0 4px #fff,0 4px 14px -6px rgba(0,0,0,.35)}
.av.prof{background:var(--accent)}
/* La frise */
.frise{position:relative;padding:4px 0 10px}
.frise svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.phase{position:relative;z-index:2;text-align:center;margin:24px 0 12px}
.phase span{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.phase.ok span{color:var(--green);background:var(--green-s);border-color:#c4e6d6}
.phase.ici span{color:#fff;background:var(--ink);border-color:var(--ink)}
.et{position:relative;z-index:2;display:flex;margin:9px 0}
.et.m{margin:18px 0}
.et.g{justify-content:flex-start}.et.d{justify-content:flex-end}.et.m{justify-content:center}.et.c{justify-content:center}
.carte{position:relative;width:34%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 15px}
.carte .q{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.g .q{color:var(--el)}.d .q{color:var(--accent)}
.carte b{display:block;font-size:14.5px;font-weight:650;line-height:1.35;margin-top:1px}
.carte p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.carte .dt{display:inline-block;margin-top:5px;font-size:12px;font-weight:700;color:var(--muted)}
.carte .noeud{position:absolute;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:#fff;border:3px solid #d3dbe2}
.g .noeud{right:-31px}.d .noeud{left:-31px}
/* L'intervenant, en transit sur la ligne */
.etape-m{position:relative;display:flex;align-items:center;gap:10px;max-width:30%;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 16px 6px 6px}
.etape-m .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:18px;flex:none}
.etape-m .x{min-width:0}
.etape-m small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;line-height:1.2}
.etape-m b{display:block;font-size:13.5px;font-weight:650;line-height:1.3}
.et.c .carte{width:min(460px,70%);text-align:center;border:2px solid var(--accent);background:linear-gradient(135deg,#fff,var(--accent-s))}
.et.c .noeud{display:none}
.ens{position:relative;z-index:2;display:flex;justify-content:center;gap:8px;margin-top:6px}
/* États */
.fait .carte,.fait .etape-m{background:#fbfdfc}
.fait .noeud{background:var(--green);border-color:var(--green)}
.fait .dt{color:var(--green)}
.fait .etape-m{border-color:#c4e6d6}
.ici .carte{border:2px solid var(--orange);box-shadow:0 10px 26px -14px rgba(196,111,28,.55)}
.ici .etape-m{border-color:var(--orange);box-shadow:0 0 0 6px var(--orange-s)}
.ici .noeud{border-color:var(--orange);box-shadow:0 0 0 7px var(--orange-s)}
.ici .dt{color:var(--orange)}
.avenir .carte,.avenir .etape-m{opacity:.6}
.statut{display:flex;gap:6px;margin:14px 0 0;flex-wrap:wrap}
.statut span{flex:1;min-width:110px;text-align:center;font-size:12px;font-weight:700;padding:8px 6px;border-radius:10px;background:#fff;border:1px solid var(--line);color:#9aa8b6}
.statut span.ok{color:var(--green);background:var(--green-s);border-color:#c4e6d6}
.statut span.ici{color:#fff;background:var(--accent);border-color:var(--accent)}
.bal{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:12px 0 0}
.bal h2{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);display:flex;align-items:center;gap:8px}
.bal .l{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid #eef2f5;font-size:14px}
.bal .l:first-of-type{border-top:0}
.bal .l i{font-size:18px;color:var(--el)}
.bal .l span{flex:1}
.bal .l em{font-style:normal;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--accent);color:#fff}
.bal .l em.ok{background:var(--green-s);color:var(--green)}
.signe{display:inline-flex;align-items:center;gap:4px;margin-left:6px;font-size:10.5px;letter-spacing:.04em}
.relais{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;font-weight:700;color:var(--muted)}
.relais .tk{letter-spacing:-2px;font-weight:800;color:#c3ccd5}
.relais .tk.un{color:var(--muted)}.relais .tk.deux{color:var(--green)}
.lu{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--el-s);color:var(--el)}
.lu.ok{background:var(--green-s);color:var(--green)}
.etape-m .relais{margin-top:2px;font-size:11px}
.cf{margin-top:8px;border-top:1px dashed #dfe6ec;padding-top:6px}
.cf summary{list-style:none;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:5px}
.cf summary::-webkit-details-marker{display:none}
.cf summary::after{content:"▾";margin-left:2px}
.cf[open] summary::after{content:"▴"}
.cf ol{margin:6px 0 4px;padding-left:18px;font-size:13px;color:var(--ink);display:grid;gap:4px}
.cf small{display:block;font-size:11px;color:var(--muted)}
.d .carte{text-align:left}
/* Les grandes étapes, numérotées */
.phase span{font-size:12.5px;padding:7px 18px}
.phase span b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--ink);margin-right:8px;font-size:12px}
.phase.ok span b{background:var(--green);color:#fff}.phase.ici span b{background:#fff;color:var(--ink)}
.leg{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:28px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid #d3dbe2;background:#fff}
.leg .f{background:var(--green);border-color:var(--green)}.leg .o{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-s)}
@media (max-width:700px){
  .carte{width:40%;padding:9px 11px}.carte p{display:none}.carte b{font-size:13px}
  .g .noeud{right:-24px}.d .noeud{left:-24px}
  .etape-m{max-width:58%}.etape-m b{font-size:12.5px}
  .acteurs{display:none}.tete .info{display:none}
}
</style>

 ['Clôture du dossier'],
 ['d', 'a', 'Archiver la convention', 'Papier et numérique', 'fin janvier', { c: ['Version papier : au bureau du DDF.', 'Version numérique : enregistrée dans Pronote.'], src: 'Procédure §1 · mémento 9' }],
 ['d', 'a', 'Ranger le dossier de l’élève', 'Fiche de négociation, échanges, comptes rendus', 'fin janvier', { c: ['Fiche de négociation signée.', 'Échanges notés dans Pronote (« Créer un suivi »).', 'Compte rendu d’évaluation remis à l’enseignant professionnel.'], src: 'Check-list · fiche de négociation' }],
 ['d', 'a', 'Vérifier le stage dans Pronote', 'Dates et jours réalisés', 'fin janvier', { c: ['Dates et jours réellement réalisés, absences éventuelles.', 'Pièces reçues : attestation, compte rendu d’évaluation.'], src: 'Rubriques du stage dans Pronote (à confirmer avec l’établissement)' }]
];
const STATUTS = ['Recherche', 'Proposition de stage', 'Stage validé', 'Convention signée', 'En stage', 'Terminé'];
const etapes = ETAPES.filter(x => x.length > 1);
let ici = etapes.findIndex(x => x[2] === 'Signe et valide la fiche');
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
$('acteurs').innerHTML = Object.values(ACT).map(([n, ic, c]) => `<span><i style="background:${c}" class="ti ti-${ic}"></i>${esc(n)}</span>`).join('');

function relais(it) {
  const [, signe, , , , o] = it.x; if (signe !== 'r') return '';
  const n = it.etat === 'fait' ? 2 : it.etat === 'ici' ? 1 : 0;
  return `<div class="relais"><span class="tk ${n === 2 ? 'deux' : n === 1 ? 'un' : ''}">${n === 2 ? '✓✓' : '✓'}</span>→ ${esc((o && o.a) || '')}${n === 2 ? ' · reçu' : n === 1 ? ' · remis' : ''}</div>`;
}
function rendre() {
  let n = -1, h = '', numPh = 0;
  const items = [];
  ETAPES.forEach(x => {
    if (x.length === 1) { items.push({ phase: x[0] }); return; }
    n++; items.push({ x, n, etat: n < ici ? 'fait' : n === ici ? 'ici' : 'avenir' });
  });
  items.forEach((it, i) => {
    if (it.phase) {
      const suite = []; for (let k = i + 1; k < items.length && !items[k].phase; k++) suite.push(items[k]);
      const cls = suite.every(y => y.etat === 'fait') ? 'ok' : suite.some(y => y.etat === 'ici') ? 'ici' : '';
      numPh++;
      h += `<div class="phase ${cls}"><span><b>${cls === 'ok' ? '✓' : numPh}</b>${esc(it.phase)}</span></div>`; return;
    }
    const [cote, signe, titre, detail, date] = it.x;
    const marque = signe === 'i' ? '<span class="signe">✉</span>' : '';
    if (cote.startsWith('m:')) {
      const [nom, ic, c] = ACT[cote.slice(2)];
      h += `<div class="et m ${it.etat}"><div class="etape-m"><span class="ic" style="background:${c}"><i class="ti ti-${it.etat === 'fait' ? 'check' : ic}"></i></span><div class="x"><small style="color:${c}">${esc(nom)}${marque}</small><b>${esc(titre)}</b>${relais(it) || (detail ? `<div class="relais">${esc(detail)}</div>` : '')}</div></div></div>`;
      return;
    }
    const qui = cote === 'g' ? 'Élève' : cote === 'c' ? 'Ensemble' : 'Enseignant référent';
    const o = it.x[5] || {};
    const consignes = o.c ? `<details class="cf"><summary>Comment faire</summary><ol>${o.c.map(c => `<li>${esc(c)}</li>`).join('')}</ol>${o.src ? `<small>Source : ${esc(o.src)}</small>` : ''}</details>` : '';
    const lu = signe === 'i' ? `<span class="lu ${it.etat === 'fait' ? 'ok' : ''}">${it.etat === 'fait' ? '✓ Lu' : 'Lu'}</span>` : '';
    h += `<div class="et ${cote} ${it.etat}"><div class="carte"><i class="noeud"></i><div class="q">${qui}${marque}</div><b>${esc(titre)}</b>${detail ? `<p>${esc(detail)}</p>` : ''}${relais(it)}${lu}${date ? `<span class="dt">${it.etat === 'fait' ? '✓ ' : ''}${esc(date)}</span>` : ''}${consignes}</div></div>`;
  });
  $('frise').innerHTML = h + '<svg aria-hidden="true"></svg>';
  /* Le statut du stage avance tout seul. */
  let st = 0; etapes.forEach((x, k) => { if (k < ici && x[5] && x[5].s) st = Math.max(st, x[5].s); });
  $('statut').innerHTML = STATUTS.map((s, k) => `<span class="${k < st ? 'ok' : k === st ? 'ici' : ''}">${k < st ? '✓ ' : ''}${esc(s)}</span>`).join('');
  /* La boîte aux lettres du référent : ce qu'on lui signale et ce qu'on lui remet. */
  const pourLui = etapes.map((x, k) => ({ x, k })).filter(({ x }) => (x[0] === 'd' && x[1] === 'i') || (x[1] === 'r' && x[5] && x[5].a === 'le référent')).filter(({ k }) => k <= ici).slice(-3).reverse();
  $('bal').innerHTML = `<h2><i class="ti ti-mail"></i> Boîte aux lettres du référent</h2>` + (pourLui.length ? pourLui.map(({ x, k }) => {
    const info = x[1] === 'i', fait = k < ici;
    const t = info ? 'K4A7 · ' + x[2].toLowerCase() + ' : ' + etapes[2][3].split(' · ')[0] + ' — ' + x[3] : 'K4A7 · ' + x[2].replace('Remettre', 'remet').replace('Rapporter', 'rapporte').replace(/\bmon\b/, 'sa').replace(/\bma\b/, 'sa').replace(/\bmes\b/, 'ses');
    return `<div class="l"><i class="ti ti-${info ? 'mail-opened' : 'file-arrow-right'}"></i><span>${esc(t)}</span><em class="${fait ? 'ok' : ''}">${fait ? (info ? '✓ Lu' : '✓✓ Reçu') : (info ? 'Lu' : 'Reçu')}</em></div>`;
  }).join('') : '<div class="l"><span style="color:var(--muted)">Rien pour le moment.</span></div>');
  const e = etapes[ici];
  if (e) {
    const m = e[0].startsWith('m:') ? ACT[e[0].slice(2)][0] : e[0] === 'g' ? 'L’élève' : e[0] === 'c' ? 'Ensemble' : 'Vous';
    $('maint').innerHTML = `<div><small>${esc(m)}, maintenant</small><b>${esc(e[2])}</b>${e[4] ? ' · ' + esc(e[4]) : ''}</div>`;
    $('maint').style.background = e[0].startsWith('m:') ? ACT[e[0].slice(2)][2] : e[0] === 'g' ? 'var(--el)' : 'var(--accent)';
  } else { $('maint').innerHTML = '<div><small>Parcours terminé</small><b>Stage validé, bilan fait</b></div>'; $('maint').style.background = 'var(--green)'; }
  requestAnimationFrame(ligne);
}
/* La ligne passe par chaque étape : à gauche, au milieu, à droite. */
function ligne() {
  const f = $('frise'), svg = f.querySelector('svg'), b = f.getBoundingClientRect();
  /* Chaque étape a un point d'entrée et un point de sortie : un intervenant est traversé de haut en bas, par le centre. */
  const pts = [...f.querySelectorAll('.et')].map(el => {
    const v = el.classList.contains('fait') || el.classList.contains('ici');
    if (el.classList.contains('m') || el.classList.contains('c')) {
      const r = el.querySelector(el.classList.contains('m') ? '.etape-m' : '.carte').getBoundingClientRect(), x = r.left + r.width / 2 - b.left;
      return { a: { x, y: r.top - b.top }, s: { x, y: r.bottom - b.top }, v };
    }
    const r = el.querySelector('.noeud').getBoundingClientRect(), o = { x: r.left + r.width / 2 - b.left, y: r.top + r.height / 2 - b.top };
    return { a: o, s: o, v };
  });
  const seg = (a, c) => { const m = (a.y + c.y) / 2; return `M${a.x},${a.y} C${a.x},${m} ${c.x},${m} ${c.x},${c.y}`; };
  let s = '';
  for (let i = 1; i < pts.length; i++) {
    const v = pts[i].v;
    s += `<path d="${seg(pts[i - 1].s, pts[i].a)}" fill="none" stroke="${v ? '#1f9d6b' : '#d8e0e7'}" stroke-width="${v ? 4 : 3}" stroke-linecap="round" ${v ? '' : 'stroke-dasharray="1 8"'}/>`;
  }
  svg.innerHTML = s;
}
$('plus').onclick = () => { ici = Math.min(ici + 1, etapes.length); rendre(); };
$('moins').onclick = () => { ici = Math.max(ici - 1, 0); rendre(); };
addEventListener('resize', () => requestAnimationFrame(ligne));
document.addEventListener('toggle', () => requestAnimationFrame(ligne), true);
document.fonts && document.fonts.ready.then(() => requestAnimationFrame(ligne));
rendre();
</script>
</body>
