<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#1d5fae">
<meta name="robots" content="noindex">
<title>PFMP — mon carnet de stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<!--
  Maquette (09/10/2026) : le carnet de stage allégé. Pendant le stage, une seule chose : « Ma journée ».
  À la fin du stage seulement : les quatre parties du rapport, puis l'impression.
  Démonstration : rien n'est enregistré.
-->
<style>
:root{--ink:#1f2733;--ink2:#445065;--muted:#6b7686;--line:#e3e8ef;--bg:#f3f6fa;--b500:#2f74c9;--b600:#1d5fae;--b700:#174a8c;--b100:#dce9f9;--ok:#1f9d4c;--ok-s:#e3f6ea}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 Outfit,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:auto;padding:12px 16px 60px}
.demo{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);align-items:center;margin-bottom:8px}
.demo a{color:var(--muted);text-decoration:none;font-weight:600}
.demo button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 10px;font:inherit;font-weight:700;cursor:pointer}
.tete{display:flex;align-items:center;gap:12px;padding:4px 0 12px}
.tete .ic{width:44px;height:44px;border-radius:14px;background:var(--b600);color:#fff;display:grid;place-items:center;font-size:22px}
.tete b{display:block;font-family:'Space Grotesk',sans-serif;font-size:19px}
.tete small{color:var(--muted);font-size:13.5px}
.jours{display:flex;gap:5px;margin:2px 0 14px}
.jours i{flex:1;height:8px;border-radius:99px;background:#dbe2ec}
.jours i.ok{background:var(--ok)}.jours i.ici{background:var(--b500)}
.jour{background:#fff;border:2px solid var(--b500);border-radius:22px;padding:16px;box-shadow:0 0 0 5px var(--b100)}
.jour small{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--b600)}
.jour h1{font-family:'Space Grotesk',sans-serif;margin:4px 0 12px;font-size:22px}
label{display:block;font-weight:600;font-size:15px;margin-top:12px}
textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:11px;font:inherit;font-size:15.5px;min-height:84px;margin-top:6px}
textarea:focus{outline:none;border-color:var(--b500)}
.seg{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.seg button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.seg button.on{border-color:var(--b600);background:var(--b600);color:#fff}
.gros{width:100%;margin-top:16px;border:0;border-radius:16px;padding:15px;font:inherit;font-size:17px;font-weight:700;background:var(--b600);color:#fff;cursor:pointer;display:flex;gap:8px;justify-content:center;align-items:center}
.gros.fait{background:var(--ok-s);color:var(--ok)}
h2{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:24px 4px 8px}
.passe{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px;font-size:14.5px}
.passe .d{flex:none;width:46px;text-align:center;font-weight:700;color:var(--b600);font-size:13px;line-height:1.2}
.passe .d b{display:block;font-size:19px}
.passe .t{flex:1;color:var(--ink2)}
.rapport{background:#fff;border:1px dashed #b9c6d8;border-radius:18px;padding:14px;margin-top:6px}
.rapport.ouvert{border-style:solid;border-color:var(--b500)}
.rapport .x{display:flex;align-items:center;gap:10px;font-weight:700}
.rapport .x i{font-size:22px;color:var(--b600)}
.rapport p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.parties{display:grid;gap:7px;margin-top:12px}
.parties button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.parties button .b{width:24px;height:24px;border-radius:50%;border:2px solid #cfd8e3;display:grid;place-items:center;font-size:12px;color:transparent;flex:none}
.parties button.ok .b{background:var(--ok);border-color:var(--ok);color:#fff}
.parties button .ch{margin-left:auto;color:var(--muted)}
</style>
</head>
<body>
<main class="app">
 <div class="demo"><a href="maquettes.html">← Les maquettes</a><span>Démonstration <button id="moment">Voir la fin du stage</button></span></div>
 <div class="tete"><span class="ic"><i class="ti ti-notebook"></i></span><div><b>Mon carnet de stage</b><small>PFMP 1 · du 4 au 15 janvier</small></div></div>
 <div class="jours" id="jours"></div>
 <section id="zone"></section>
 <h2>Mes journées</h2>
 <div id="passe"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const JOURS = ['lun. 4', 'mar. 5', 'mer. 6', 'jeu. 7', 'ven. 8', 'lun. 11', 'mar. 12', 'mer. 13', 'jeu. 14', 'ven. 15'];
const NOTES = [
  ['lun.', 4, 'Visite des locaux, présentation de l’équipe. Classement des factures fournisseurs.'],
  ['mar.', 5, 'Accueil téléphonique avec ma tutrice. Saisie de bons de commande.'],
  ['mer.', 6, 'Mise à jour du fichier clients sur le tableur. Envoi de courriers.']
];
let fin = false, enregistre = false, ressenti = '';
const parties = [['door-enter', 'Accueil et intégration'], ['messages', 'Communication et savoir-être'], ['target-arrow', 'Compétences'], ['flag', 'Bilan de mon stage']];
const faites = new Set();
function rendre() {
  const ici = fin ? 9 : 3;
  $('jours').innerHTML = JOURS.map((j, k) => `<i class="${k < ici || (k === ici && enregistre) ? 'ok' : k === ici ? 'ici' : ''}" title="${j}"></i>`).join('');
  if (!fin) {
    $('zone').innerHTML = `<div class="jour"><small>Aujourd’hui · jour 4 sur 10</small><h1>Ma journée du jeudi 7 janvier</h1>
      <label for="fait">Ce que j’ai fait</label><textarea id="fait" placeholder="En 2 ou 3 lignes"></textarea>
      <label>Ma journée</label><div class="seg">${['Facile', 'Normale', 'Difficile'].map(x => `<button data-r="${x}" class="${ressenti === x ? 'on' : ''}">${x}</button>`).join('')}</div>
      <button class="gros ${enregistre ? 'fait' : ''}" id="garder"><i class="ti ti-${enregistre ? 'circle-check' : 'device-floppy'}"></i> ${enregistre ? 'Journée enregistrée' : 'Enregistrer ma journée'}</button></div>
      <div class="rapport" style="margin-top:16px"><div class="x"><i class="ti ti-lock"></i>Mon rapport de stage</div><p>S’ouvre le dernier jour.</p></div>`;
  } else {
    const n = faites.size;
    $('zone').innerHTML = `<div class="rapport ouvert"><div class="x"><i class="ti ti-file-text"></i>Mon rapport de stage</div><p>${n} partie${n > 1 ? 's' : ''} sur 4 · mes 10 journées sont déjà dedans.</p>
      <div class="parties">${parties.map(([ic, t], k) => `<button class="${faites.has(k) ? 'ok' : ''}" data-p="${k}"><span class="b">✓</span><i class="ti ti-${ic}"></i>${t}<i class="ti ti-chevron-right ch"></i></button>`).join('')}</div>
      <button class="gros" ${n < 4 ? 'style="opacity:.55"' : ''}><i class="ti ti-printer"></i> Imprimer mon rapport</button></div>`;
  }
  $('passe').innerHTML = NOTES.slice().reverse().map(([j, d, t]) => `<div class="passe"><span class="d">${j}<b>${d}</b></span><span class="t">${esc(t)}</span></div>`).join('');
}
document.addEventListener('click', e => {
  const r = e.target.closest('[data-r]'); if (r) { ressenti = r.dataset.r; rendre(); return; }
  if (e.target.closest('#garder')) { enregistre = true; rendre(); return; }
  const p = e.target.closest('[data-p]'); if (p) { const k = +p.dataset.p; faites.has(k) ? faites.delete(k) : faites.add(k); rendre(); return; }
  if (e.target.closest('#moment')) { fin = !fin; $('moment').textContent = fin ? 'Voir un jour de stage' : 'Voir la fin du stage'; rendre(); }
});
rendre();
</script>
</body>
</html>
