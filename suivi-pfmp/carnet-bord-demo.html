<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#1d4f91">
<meta name="robots" content="noindex">
<title>Mon carnet de bord PFMP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<!--
  Maquette (09/10/2026) : Mon carnet de bord PFMP, seconde Bac Pro AGOrA.
  Chaque jour : ma journée (ressenti), les activités du référentiel cochées, quelques lignes rédigées. Enregistrer.
  Deux ou trois fois : une activité décrite en détail (modèle de compte rendu d'activité, PNF AGOrA, CERPEG 2020).
  À la fin : l'organisation d'accueil, les six compétences transversales (compte rendu PFMP AGOrA), l'avis sur l'accueil
  (annexe 4 de la convention-type), le bilan, puis le rapport mis en page.
  Activités : sous-pôles du référentiel Bac Pro AGOrA (pôles 1 à 3). Démonstration : enregistrement dans ce navigateur seulement.
-->
<style>
:root{--ink:#18233a;--ink2:#3d4a63;--muted:#69768c;--line:#e1e6ee;--bg:#f4f6f9;--card:#fff;--b:#1d4f91;--b2:#2f6fbf;--b-s:#e8f0fb;--ok:#16794c;--ok-s:#e6f4ec;--warn:#9a5b0b;--warn-s:#fdf3e1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.barre{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
.barre .in{max-width:640px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.retour{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font:inherit;font-weight:600;font-size:14.5px;color:var(--ink);cursor:pointer;text-decoration:none}
.barre h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etat{font-size:12.5px;color:var(--ok);font-weight:600;white-space:nowrap}
.etat.modif{color:var(--warn)}
main{max-width:640px;margin:auto;padding:16px 16px 120px}
.demo{font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between}
.demo a{color:var(--muted)}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 2px 8px}
.periodes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.periodes button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;text-align:left;font:inherit;cursor:pointer}
.periodes button b{display:block;font-size:15px}.periodes button span{font-size:13px;color:var(--muted)}
.periodes button.on{border-color:var(--b);box-shadow:0 0 0 3px var(--b-s)}
.aujourdhui{display:flex;align-items:center;gap:14px;background:var(--b);color:#fff;border-radius:18px;padding:16px;margin-top:14px;text-decoration:none}
.aujourdhui .x{flex:1}.aujourdhui small{opacity:.85;font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.aujourdhui b{display:block;font-size:19px;margin-top:2px}
.aujourdhui i{font-size:26px}
.jours{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.jours a{display:block;text-align:center;border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 2px;text-decoration:none;color:var(--ink);font-size:12.5px}
.jours a b{display:block;font-size:16px}
.jours a.fait{background:var(--ok-s);border-color:#b9dfc9;color:var(--ok)}
.jours a.ici{border:2px solid var(--b)}
.jours a.avenir{color:#a3adbd}
.ligne{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;text-decoration:none;color:var(--ink)}
.ligne .ic{width:36px;height:36px;border-radius:10px;background:var(--b-s);color:var(--b);display:grid;place-items:center;font-size:19px;flex:none}
.ligne .x{flex:1;min-width:0}.ligne .x b{display:block;font-size:15px;font-weight:600}.ligne .x span{font-size:13px;color:var(--muted)}
.puce{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.puce.ok{background:var(--ok-s);color:var(--ok)}.puce.att{background:#eef1f5;color:var(--muted)}
.rapport-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;font-size:16px;background:var(--ink);color:#fff;cursor:pointer;text-decoration:none}
/* Écrans de saisie */
.bloc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.bloc>h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.bloc>h3 .n{width:24px;height:24px;border-radius:50%;background:var(--b);color:#fff;display:grid;place-items:center;font-size:13px}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14.5px;cursor:pointer}
.choix button.on{background:var(--b);border-color:var(--b);color:#fff}
.pole{border:1px solid var(--line);border-radius:12px;margin-top:8px;overflow:hidden}
.pole summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;background:#fafbfd}
.pole summary::-webkit-details-marker{display:none}
.pole summary .nb{margin-left:auto;font-size:12px;color:var(--b);font-weight:700}
.pole summary::after{content:"▾";color:var(--muted)}.pole[open] summary::after{content:"▴"}
.sp{padding:4px 12px 10px}
.sp small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.act{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-top:1px solid #f0f2f6;font-size:14.5px}
.act:first-of-type{border-top:0}
.act input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--b);flex:none}
.act label{flex:1;cursor:pointer}
.aide{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid #c6cfdc;background:#fff;color:var(--muted);font:600 13px Inter,sans-serif;cursor:pointer;display:grid;place-items:center}
.explic{background:var(--b-s);border-radius:10px;padding:8px 11px;font-size:13.5px;color:var(--ink2);margin:4px 0 6px 30px}
.amorces{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.amorces button{border:1px dashed #b8c4d6;background:#fff;border-radius:8px;padding:5px 9px;font:inherit;font-size:13px;color:var(--ink2);cursor:pointer}
textarea,input[type=text],select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
textarea:focus,input[type=text]:focus,select:focus{outline:none;border-color:var(--b2)}
.champ{margin-top:10px}.champ>span{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;margin-bottom:5px}
.compte{font-size:12px;color:var(--muted);text-align:right;margin-top:3px}
.niveaux{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}
.niveaux button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 2px;font:inherit;font-size:12.5px;cursor:pointer}
.niveaux button.on{background:var(--b);border-color:var(--b);color:#fff}
/* Barre du bas : toujours revenir, toujours enregistrer */
.pied{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:10}
.pied .in{max-width:640px;margin:auto;display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.pied button{border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;font-size:15.5px;cursor:pointer}
.pied .sec{background:#eef1f5;color:var(--ink);display:flex;align-items:center;gap:4px}
.pied .pri{flex:1;background:var(--b);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.pied .pri.fait{background:var(--ok)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.vu{opacity:1}
/* Le rapport */
.feuille{background:#fff;box-shadow:0 10px 30px -18px rgba(0,0,0,.4);padding:42px 46px;font:15px/1.6 'Source Serif 4',Georgia,serif;color:#111;margin-bottom:14px}
.feuille h1{font:700 26px/1.25 'Source Serif 4',serif;margin:0 0 6px}
.feuille .garde{border-bottom:2px solid #111;padding-bottom:16px;margin-bottom:18px}
.feuille .garde small{font:600 12px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#555}
.feuille .garde p{margin:4px 0;color:#333}
.feuille h2{font:700 15px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--b);margin:24px 0 8px;border-bottom:1px solid #d8dee8;padding-bottom:4px}
.feuille table{border-collapse:collapse;width:100%;font:13.5px/1.45 Inter,sans-serif;margin:6px 0}
.feuille th,.feuille td{border:1px solid #cfd6e1;padding:6px 8px;text-align:left;vertical-align:top}
.feuille th{background:#f3f6fa}
.feuille .sign{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px;font:13px Inter,sans-serif}
.feuille .sign div{border:1px solid #cfd6e1;height:80px;padding:6px 8px;color:#555}
.actions-r{display:grid;gap:8px}
.actions-r button{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;font:inherit;font-weight:600;cursor:pointer}
.actions-r button.pri{background:var(--b);border-color:var(--b);color:#fff}
@media print{.barre,.pied,.demo,.actions-r,.toast{display:none!important}main{padding:0;max-width:none}body{background:#fff}.feuille{box-shadow:none;padding:0}@page{size:A4;margin:16mm}}
@media (max-width:480px){.feuille{padding:24px 18px}}
</style>
</head>
<body>
<header class="barre"><div class="in"><a class="retour" id="retour" href="#/"><i class="ti ti-arrow-left"></i> Retour</a><h1 id="titre">Mon carnet de bord PFMP</h1><span class="etat" id="etat"></span></div></header>
<main id="app"></main>
<footer class="pied" id="pied" hidden><div class="in"><button class="sec" id="pRetour"><i class="ti ti-arrow-left"></i></button><button class="pri" id="pEnr"><i class="ti ti-device-floppy"></i> Enregistrer</button></div></footer>
<div class="toast" id="toast"></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ── Le référentiel Bac Pro AGOrA : pôles, sous-pôles, activités (intitulés du compte rendu PFMP). ? = explication. ── */
const POLES = [
  { n: '1', t: 'Relations avec les clients, les usagers et les adhérents', sp: [
    ['1.1', 'Préparation et prise en charge de la relation', [
      ['accueil', 'Accueil et renseignement', 'Accueillir une personne en face à face ou au téléphone, la renseigner ou l’orienter.'],
      ['demande', 'Prise en charge de la demande', 'Répondre à une demande ou la transmettre à la bonne personne.'],
      ['promo', 'Organisation d’événements de promotion', 'Préparer un événement, une affiche, un dépliant ou une publication.'],
      ['prospect', 'Prospection', 'Aider à contacter de futurs clients : fichier, publipostage, courriel.']]],
    ['1.2', 'Opérations administratives liées aux clients', [
      ['devis', 'Devis, commandes, contrats', 'Préparer ou vérifier un devis, un bon de commande ou un contrat.'],
      ['facture', 'Livraison et facturation', 'Préparer un bon de livraison ou une facture.'],
      ['encaisse', 'Encaissements', 'Enregistrer un paiement reçu : chèque, virement, carte.'],
      ['reclam', 'Réclamations et litiges', 'Aider à traiter une réclamation ou une relance.']]],
    ['1.3', 'Mise à jour du système d’information', [
      ['dossiers', 'Mise à jour des dossiers', 'Mettre à jour un fichier de clients, d’usagers ou d’adhérents.'],
      ['tdbcom', 'Tableaux de bord', 'Compléter un tableau de suivi : ventes, contacts, demandes.'],
      ['web', 'Réseaux sociaux et site internet', 'Préparer ou mettre à jour une information publiée en ligne.']]]] },
  { n: '2', t: 'Organisation et suivi de l’activité de production', sp: [
    ['2.1', 'Suivi administratif', [
      ['stocks', 'Approvisionnements et stocks', 'Compter un stock, passer ou vérifier une commande de fournitures.'],
      ['fourn', 'Dossiers fournisseurs et prestataires', 'Classer ou mettre à jour le dossier d’un fournisseur.'],
      ['planning', 'Coordination d’un service ou d’un projet', 'Mettre à jour un planning, suivre l’avancement d’un projet.']]],
    ['2.2', 'Suivi financier', [
      ['decaisse', 'Décaissements', 'Enregistrer ou classer une facture d’achat, un règlement à un fournisseur.'],
      ['treso', 'Trésorerie et banques', 'Pointer un relevé bancaire, aider à un état de trésorerie.']]],
    ['2.3', 'Gestion des espaces de travail', [
      ['fournit', 'Fournitures et consommables', 'Faire un inventaire, ranger, préparer une commande de fournitures.'],
      ['reunion', 'Réunions', 'Préparer une salle, des convocations, des documents ou une visioconférence.'],
      ['interne', 'Information interne', 'Afficher une note, diffuser une information, mettre à jour un espace partagé.']]]] },
  { n: '3', t: 'Administration du personnel', sp: [
    ['3.1', 'Suivi de la carrière', [
      ['integ', 'Recrutement, intégration, départ', 'Aider à préparer l’arrivée ou le départ d’un salarié.'],
      ['dosperso', 'Dossiers du personnel', 'Classer ou mettre à jour un dossier du personnel, dans le respect de la confidentialité.']]],
    ['3.2', 'Suivi organisationnel et financier', [
      ['temps', 'Temps de travail', 'Mettre à jour un planning, des congés ou des absences.'],
      ['deplac', 'Déplacements', 'Préparer un déplacement ou vérifier une note de frais.']]],
    ['3.3', 'Activité sociale', [
      ['infosoc', 'Information sociale', 'Diffuser une information au personnel : note, affichage, courriel.']]]] }
];
const ACT = {}; POLES.forEach(p => p.sp.forEach(([c, t, l]) => l.forEach(([id, lib, ex]) => { ACT[id] = { id, lib, ex, sp: c, pole: p.n }; })));
const RESSENTI = ['Très bien', 'Bien', 'Moyen', 'Difficile'];
const AMORCES = ['Aujourd’hui, j’ai été chargé(e) de…', 'Pour cela, j’ai utilisé…', 'J’ai rencontré une difficulté : …', 'J’ai appris à…'];
const TRANSV = [
  ['oral', 'Communication orale', 'S’exprimer clairement avec les clients et les collègues, au téléphone et en face à face.'],
  ['ecrit', 'Communication écrite', 'Rédiger un message, un courriel ou un document sans fautes et dans le bon registre.'],
  ['codes', 'Codes sociaux', 'Tenue, ponctualité, politesse, discrétion : les règles de l’organisation.'],
  ['prio', 'Gestion des priorités', 'Savoir par quoi commencer quand plusieurs tâches arrivent en même temps.'],
  ['equipe', 'Travail en équipe', 'Coopérer, demander de l’aide, rendre compte de son travail.'],
  ['consignes', 'Consignes et procédures', 'Appliquer une consigne, suivre une procédure, vérifier son travail.']];
const NIVEAUX = ['Débutant', 'En progrès', 'À l’aise', 'Autonome'];
const ACCUEIL = ['L’accueil à l’arrivée', 'Les informations de début de stage, dont les consignes de sécurité', 'La santé et la sécurité au travail', 'La disponibilité et l’écoute du tuteur', 'L’accompagnement du tuteur', 'L’intégration dans l’équipe', 'L’espace de travail', 'Les contacts avec les autres salariés', 'Les relations avec les supérieurs hiérarchiques', 'L’ambiance générale de travail'];
const SATIS = ['Très insatisfait', 'Insatisfait', 'Satisfait', 'Très satisfait'];
const Q5 = [['quand', 'Quand et où ?', 'Le jour, le service, le poste de travail.'], ['comment', 'Comment l’avez-vous réalisée ?', 'Les étapes, dans l’ordre.'], ['savoirs', 'Qu’avez-vous utilisé ou appris ?', 'Les outils, les logiciels, les règles connues.'], ['but', 'Dans quel but ?', 'Ce que l’activité devait produire, pour qui.'], ['avis', 'Qu’en pensez-vous ?', 'Ce qui a réussi, ce que vous feriez autrement.']];

/* ── Les deux périodes de seconde : 2 semaines en janvier, 4 semaines en juin. ── */
const PERIODES = { p1: { lib: 'PFMP 1', quand: 'janvier · 2 semaines', debut: '2027-01-04', jours: 10 }, p2: { lib: 'PFMP 2', quand: 'juin · 4 semaines', debut: '2027-05-31', jours: 20 } };
function datesDe(p) { const l = []; for (let d = new Date(PERIODES[p].debut + 'T12:00:00'); l.length < PERIODES[p].jours; d.setDate(d.getDate() + 1)) { const w = d.getDay(); if (w && w !== 6) l.push(d.toLocaleDateString('sv-SE')); } return l; }
const frJ = s => new Date(s + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
const frC = s => new Date(s + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric' });

/* ── Mémoire (démonstration : ce navigateur ; le vrai carnet enregistre aussi en ligne). ── */
const CLE = 'carnet-bord-demo-v1';
let D; try { D = JSON.parse(localStorage.getItem(CLE)); } catch (e) {}
if (!D) D = { periode: 'p1', p1: { jours: {}, act: [], org: {}, comp: {}, accueil: {}, bilan: {} }, p2: { jours: {}, act: [], org: {}, comp: {}, accueil: {}, bilan: {}, meme: '' } };
(function exemple() { const p = D.p1; if (Object.keys(p.jours).length) return; const d = datesDe('p1');
  p.jours[d[0]] = { r: 'Bien', a: ['accueil', 'dossiers'], t: 'Aujourd’hui, j’ai été chargé(e) de l’accueil téléphonique avec ma tutrice. J’ai mis à jour le fichier des usagers sur le tableur.' };
  p.jours[d[1]] = { r: 'Très bien', a: ['accueil', 'demande', 'interne'], t: 'J’ai accueilli seul(e) deux usagers et orienté leur demande vers le bon service. J’ai affiché la note de service sur les congés.' }; })();
let brouillon = null, modifie = false;
const P = () => D[D.periode];
function garder() { try { localStorage.setItem(CLE, JSON.stringify(D)); } catch (e) {} }
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('vu'); clearTimeout(toast.m); toast.m = setTimeout(() => el.classList.remove('vu'), 2200); }
function etat() { const e = $('etat'); e.className = 'etat' + (modifie ? ' modif' : ''); e.textContent = modifie ? '● Non enregistré' : brouillon ? '✓ Enregistré' : ''; }
function marquer() { modifie = true; etat(); $('pEnr').classList.remove('fait'); $('pEnr').innerHTML = '<i class="ti ti-device-floppy"></i> Enregistrer'; }

/* ── Navigation : #/ · #/jour/AAAA-MM-JJ · #/activite/0 · #/organisation · #/competences · #/accueil · #/bilan · #/rapport ── */
function aller(h) { location.hash = h; }
$('pRetour').onclick = () => history.length > 1 ? history.back() : aller('#/');
addEventListener('hashchange', rendre);
addEventListener('beforeunload', e => { if (modifie) { e.preventDefault(); e.returnValue = ''; } });

function rendre() {
  if (modifie && !confirm('Vous n’avez pas enregistré. Quitter quand même ?')) { history.pushState(null, '', rendre.dernier || '#/'); return; }
  modifie = false; brouillon = null;
  const h = location.hash || '#/'; rendre.dernier = h;
  const [, ecran, arg] = h.split('/');
  $('pied').hidden = !ecran || ecran === 'rapport';
  /* Toujours une flèche : vers le carnet, ou depuis le carnet vers Mon espace (ici, les maquettes). */
  $('retour').href = ecran ? '#/' : 'maquettes.html'; $('retour').innerHTML = '<i class="ti ti-arrow-left"></i> ' + (ecran ? 'Mon carnet' : 'Mon espace');
  window.scrollTo(0, 0);
  if (ecran === 'jour') return ecranJour(arg);
  if (ecran === 'activite') return ecranActivite(+arg);
  if (ecran === 'organisation') return ecranOrg();
  if (ecran === 'competences') return ecranComp();
  if (ecran === 'accueil') return ecranAccueil();
  if (ecran === 'bilan') return ecranBilan();
  if (ecran === 'rapport') return ecranRapport();
  ecranCarnet();
}
function enregistrer(fn) { $('pEnr').onclick = () => { fn(); garder(); modifie = false; brouillon = true; etat(); $('pEnr').classList.add('fait'); $('pEnr').innerHTML = '<i class="ti ti-circle-check"></i> Enregistré à ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); toast('Enregistré'); }; $('pEnr').classList.remove('fait'); $('pEnr').innerHTML = '<i class="ti ti-device-floppy"></i> Enregistrer'; etat(); }
function aideBtn(texte) { return `<button class="aide" type="button" data-aide="${esc(texte)}" aria-label="Explication">?</button>`; }
document.addEventListener('click', e => { const b = e.target.closest('[data-aide]'); if (!b) return; const nx = b.parentElement.nextElementSibling; if (nx && nx.classList.contains('explic')) { nx.remove(); return; } b.parentElement.insertAdjacentHTML('afterend', `<div class="explic">${esc(b.dataset.aide)}</div>`); });

/* ── Le carnet ── */
function ecranCarnet() {
  $('titre').textContent = 'Mon carnet de bord PFMP';
  const p = P(), dates = datesDe(D.periode), faits = dates.filter(d => p.jours[d]);
  const ici = dates.find(d => !p.jours[d]) || dates[dates.length - 1];
  const nAct = p.act.filter(a => a && a.titre).length;
  const ok = x => Object.keys(x || {}).length > 0;
  $('app').innerHTML = `<div class="demo"><span>Démonstration · enregistré dans ce navigateur</span><a href="maquettes.html">Les maquettes</a></div>
    <div class="periodes">${Object.entries(PERIODES).map(([k, v]) => `<button class="${D.periode === k ? 'on' : ''}" data-periode="${k}"><b>${v.lib}</b><span>${v.quand}</span></button>`).join('')}</div>
    <a class="aujourdhui" href="#/jour/${ici}"><div class="x"><small>${faits.length < dates.length ? 'Ma journée' : 'Dernière journée'}</small><b>${esc(frJ(ici))}</b></div><i class="ti ti-chevron-right"></i></a>
    <h2>Mes journées · ${faits.length} / ${dates.length}</h2>
    <div class="jours">${dates.map(d => `<a href="#/jour/${d}" class="${p.jours[d] ? 'fait' : d === ici ? 'ici' : 'avenir'}">${frC(d).split(' ')[0]}<b>${new Date(d + 'T12:00:00').getDate()}</b></a>`).join('')}</div>
    <h2>Pendant le stage</h2>
    <a class="ligne" href="#/organisation"><span class="ic"><i class="ti ti-building"></i></span><span class="x"><b>Mon organisation d’accueil</b><span>Secteur, service, tuteur</span></span><span class="puce ${ok(p.org) ? 'ok' : 'att'}">${ok(p.org) ? '✓ Fait' : 'À faire'}</span></a>
    ${[0, 1, 2].map(i => { const a = p.act[i]; return `<a class="ligne" href="#/activite/${i}"><span class="ic"><i class="ti ti-clipboard-text"></i></span><span class="x"><b>${a && a.titre ? esc(a.titre) : 'Activité décrite n° ' + (i + 1)}</b><span>${i < 2 ? 'Une activité en détail' : 'Facultative'}</span></span><span class="puce ${a && a.titre ? 'ok' : 'att'}">${a && a.titre ? '✓ Fait' : 'À faire'}</span></a>`; }).join('')}
    <h2>À la fin du stage</h2>
    <a class="ligne" href="#/competences"><span class="ic"><i class="ti ti-chart-dots"></i></span><span class="x"><b>Mes compétences</b><span>Six compétences, comme le compte rendu du tuteur</span></span><span class="puce ${ok(p.comp) ? 'ok' : 'att'}">${ok(p.comp) ? '✓ Fait' : 'À faire'}</span></a>
    <a class="ligne" href="#/accueil"><span class="ic"><i class="ti ti-mood-smile"></i></span><span class="x"><b>Mon avis sur l’accueil</b><span>Annexe 4 de la convention</span></span><span class="puce ${ok(p.accueil) ? 'ok' : 'att'}">${ok(p.accueil) ? '✓ Fait' : 'À faire'}</span></a>
    <a class="ligne" href="#/bilan"><span class="ic"><i class="ti ti-flag"></i></span><span class="x"><b>Mon bilan</b><span>Ce que je retiens, mon projet</span></span><span class="puce ${ok(p.bilan) ? 'ok' : 'att'}">${ok(p.bilan) ? '✓ Fait' : 'À faire'}</span></a>
    <a class="rapport-btn" href="#/rapport"><i class="ti ti-file-text"></i> Mon rapport de stage</a>`;
  $('app').querySelectorAll('[data-periode]').forEach(b => b.onclick = () => { D.periode = b.dataset.periode; garder(); rendre(); });
}

/* ── Une journée : ressenti, activités, compte rendu. ── */
function ecranJour(d) {
  const dates = datesDe(D.periode), i = dates.indexOf(d); if (i < 0) return aller('#/');
  const p = P(), j = JSON.parse(JSON.stringify(p.jours[d] || { r: '', a: [], t: '' }));
  $('titre').textContent = 'Jour ' + (i + 1) + ' sur ' + dates.length;
  const coche = id => j.a.includes(id);
  const nbPole = n => j.a.filter(id => ACT[id] && ACT[id].pole === n).length;
  $('app').innerHTML = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><a class="retour" href="#/jour/${dates[i - 1] || d}" ${i ? '' : 'style="visibility:hidden"'}><i class="ti ti-chevron-left"></i></a><b style="flex:1;text-align:center;font-size:17px">${esc(frJ(d))}</b><a class="retour" href="#/jour/${dates[i + 1] || d}" ${i < dates.length - 1 ? '' : 'style="visibility:hidden"'}><i class="ti ti-chevron-right"></i></a></div>
    <section class="bloc"><h3><span class="n">1</span>Ma journée</h3><div class="choix" id="ress">${RESSENTI.map(r => `<button type="button" class="${j.r === r ? 'on' : ''}" data-r="${r}">${r}</button>`).join('')}</div></section>
    <section class="bloc"><h3><span class="n">2</span>Les activités réalisées ${aideBtn('Cochez ce que vous avez fait aujourd’hui. Les intitulés sont ceux du référentiel Bac Pro AGOrA et du compte rendu que remplit votre tuteur. Touchez ? pour un exemple.')}</h3>
      ${POLES.map(po => `<details class="pole" ${nbPole(po.n) ? 'open' : ''}><summary>Pôle ${po.n} · ${esc(po.t)}<span class="nb" data-nb="${po.n}">${nbPole(po.n) || ''}</span></summary><div class="sp">${po.sp.map(([c, t, l]) => `<small>${c} ${esc(t)}</small>${l.map(([id, lib, ex]) => `<div class="act"><input type="checkbox" id="a-${id}" data-a="${id}" ${coche(id) ? 'checked' : ''}><label for="a-${id}">${esc(lib)}</label>${aideBtn(ex)}</div>`).join('')}`).join('')}</div></details>`).join('')}
    </section>
    <section class="bloc"><h3><span class="n">3</span>Mon compte rendu ${aideBtn('Quelques phrases suffisent : ce qui vous a été confié, comment vous l’avez fait, ce que vous avez appris. Touchez un début de phrase pour l’ajouter.')}</h3>
      <div class="amorces">${AMORCES.map(a => `<button type="button" data-amorce="${esc(a)}">${esc(a)}</button>`).join('')}</div>
      <textarea id="texte" maxlength="1500" placeholder="Ce que j’ai fait aujourd’hui">${esc(j.t)}</textarea><div class="compte" id="cpt"></div></section>`;
  const cpt = () => { $('cpt').textContent = $('texte').value.length + ' / 1500'; };
  cpt();
  $('ress').onclick = e => { const b = e.target.closest('[data-r]'); if (!b) return; j.r = b.dataset.r; $('ress').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); marquer(); };
  $('app').querySelectorAll('[data-a]').forEach(c => c.onchange = () => { const id = c.dataset.a; j.a = c.checked ? j.a.concat(id) : j.a.filter(x => x !== id); const n = ACT[id].pole; $('app').querySelector(`[data-nb="${n}"]`).textContent = nbPole(n) || ''; marquer(); });
  $('app').querySelectorAll('[data-amorce]').forEach(b => b.onclick = () => { const t = $('texte'); t.value = (t.value.trim() ? t.value.trim() + '\n' : '') + b.dataset.amorce + ' '; t.focus(); t.setSelectionRange(t.value.length, t.value.length); cpt(); marquer(); });
  $('texte').oninput = () => { j.t = $('texte').value; cpt(); marquer(); };
  enregistrer(() => { j.t = $('texte').value; p.jours[d] = j; });
}

/* ── Une activité décrite en détail : le modèle de compte rendu d'activité AGOrA. ── */
function ecranActivite(i) {
  const p = P(), a = Object.assign({ titre: '', sp: '' }, p.act[i] || {});
  $('titre').textContent = 'Activité décrite n° ' + (i + 1);
  $('app').innerHTML = `<section class="bloc"><h3>L’activité ${aideBtn('Choisissez une activité importante de votre stage, celle que vous savez le mieux expliquer.')}</h3>
      <label class="champ"><span>Intitulé</span><input type="text" id="f-titre" maxlength="120" value="${esc(a.titre)}" placeholder="Par exemple : traitement du courrier entrant"></label>
      <label class="champ"><span>Sous-pôle du référentiel</span><select id="f-sp"><option value="">Choisir</option>${POLES.map(po => po.sp.map(([c, t]) => `<option value="${c}" ${a.sp === c ? 'selected' : ''}>${c} ${esc(t)}</option>`).join('')).join('')}</select></label></section>
    ${Q5.map(([k, q, ex], n) => `<section class="bloc"><h3><span class="n">${n + 1}</span>${esc(q)} ${aideBtn(ex)}</h3><textarea data-k="${k}" maxlength="800" style="min-height:80px">${esc(a[k] || '')}</textarea></section>`).join('')}`;
  $('app').oninput = () => marquer(); $('app').onchange = () => marquer();
  enregistrer(() => { a.titre = $('f-titre').value.trim(); a.sp = $('f-sp').value; $('app').querySelectorAll('[data-k]').forEach(t => { a[t.dataset.k] = t.value; }); p.act[i] = a; });
}

/* ── L'organisation d'accueil (PFMP 2 : même organisation ou non). ── */
function ecranOrg() {
  const p = P(), o = Object.assign({}, p.org);
  $('titre').textContent = 'Mon organisation d’accueil';
  const meme = D.periode === 'p2' ? `<section class="bloc"><h3>Même organisation qu’en PFMP 1 ?</h3><div class="choix" id="meme">${['Oui', 'Non'].map(x => `<button type="button" class="${p.meme === x ? 'on' : ''}" data-m="${x}">${x}</button>`).join('')}</div></section>` : '';
  const C = [['nom', 'Nom de l’organisation', ''], ['secteur', 'Secteur', 'Entreprise privée, administration, association…'], ['activite', 'Activité principale', 'Ce que l’organisation produit ou propose.'], ['service', 'Mon service', 'Le service où vous travaillez : accueil, comptabilité, ressources humaines…'], ['tuteur', 'Fonction de mon tuteur', 'Le poste de votre tuteur, pas son nom.'], ['effectif', 'Nombre de salariés', 'Une estimation suffit.']];
  $('app').innerHTML = meme + `<section class="bloc">${C.map(([k, l, ex]) => `<label class="champ"><span>${esc(l)} ${ex ? aideBtn(ex) : ''}</span><input type="text" data-k="${k}" maxlength="120" value="${esc(o[k] || '')}"></label>`).join('')}</section>`;
  if ($('meme')) $('meme').onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; p.meme = b.dataset.m; if (b.dataset.m === 'Oui' && !Object.keys(o).length) { Object.assign(o, D.p1.org); ecranOrgRemplir(o); } $('meme').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); marquer(); };
  $('app').oninput = () => marquer();
  enregistrer(() => { $('app').querySelectorAll('[data-k]').forEach(t => { o[t.dataset.k] = t.value.trim(); }); p.org = o; });
}
function ecranOrgRemplir(o) { $('app').querySelectorAll('[data-k]').forEach(t => { t.value = o[t.dataset.k] || ''; }); }

/* ── Les six compétences transversales. ── */
function ecranComp() {
  const p = P(), c = Object.assign({}, p.comp);
  $('titre').textContent = 'Mes compétences';
  $('app').innerHTML = `<section class="bloc" style="font-size:14px;color:var(--muted)">Les mêmes six compétences que le compte rendu de votre tuteur. Positionnez-vous honnêtement : la comparaison avec son avis fait partie du bilan.</section>` +
    TRANSV.map(([k, t, ex]) => `<section class="bloc"><h3 style="margin-bottom:4px">${esc(t)} ${aideBtn(ex)}</h3><div class="niveaux" data-c="${k}">${NIVEAUX.map(n => `<button type="button" class="${c[k] === n ? 'on' : ''}">${n}</button>`).join('')}</div></section>`).join('');
  $('app').querySelectorAll('[data-c]').forEach(g => g.onclick = e => { const b = e.target.closest('button'); if (!b) return; c[g.dataset.c] = b.textContent; g.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); marquer(); });
  enregistrer(() => { p.comp = c; });
}

/* ── L'avis sur l'accueil (annexe 4). ── */
function ecranAccueil() {
  const p = P(), a = Object.assign({}, p.accueil);
  $('titre').textContent = 'Mon avis sur l’accueil';
  $('app').innerHTML = `<section class="bloc" style="font-size:14px;color:var(--muted)">Annexe 4 de la convention de stage. Cet avis ne compte ni dans la note ni pour le diplôme.</section>` +
    ACCUEIL.map((q, i) => `<section class="bloc"><h3 style="font-size:15px;margin-bottom:4px">${esc(q)}</h3><div class="niveaux" data-q="${i}">${SATIS.map(s => `<button type="button" class="${a[i] === s ? 'on' : ''}">${s}</button>`).join('')}</div></section>`).join('') +
    `<section class="bloc"><h3>Observations</h3><textarea id="obs" maxlength="600">${esc(a.obs || '')}</textarea></section>`;
  $('app').querySelectorAll('[data-q]').forEach(g => g.onclick = e => { const b = e.target.closest('button'); if (!b) return; a[g.dataset.q] = b.textContent; g.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); marquer(); });
  $('obs').oninput = () => marquer();
  enregistrer(() => { a.obs = $('obs').value; p.accueil = a; });
}

/* ── Le bilan. ── */
function ecranBilan() {
  const p = P(), b = Object.assign({}, p.bilan);
  $('titre').textContent = 'Mon bilan';
  const Q = [['appris', 'Ce que j’ai appris', 'Les savoir-faire et les connaissances acquis pendant le stage.'], ['reussi', 'Ce que je réussis le mieux', 'Une ou deux activités où vous êtes à l’aise.'], ['progres', 'Ce que je dois améliorer', 'Une ou deux pistes de progrès, avec un moyen d’y arriver.'], ['projet', 'Mon projet après ce stage', 'Ce que ce stage confirme ou change dans votre projet.']];
  $('app').innerHTML = Q.map(([k, q, ex], n) => `<section class="bloc"><h3><span class="n">${n + 1}</span>${esc(q)} ${aideBtn(ex)}</h3><textarea data-k="${k}" maxlength="800" style="min-height:80px">${esc(b[k] || '')}</textarea></section>`).join('');
  $('app').oninput = () => marquer();
  enregistrer(() => { $('app').querySelectorAll('[data-k]').forEach(t => { b[t.dataset.k] = t.value; }); p.bilan = b; });
}

/* ── Le rapport : une vraie feuille, prête à imprimer ou à enregistrer en PDF. ── */
function ecranRapport() {
  const p = P(), per = PERIODES[D.periode], dates = datesDe(D.periode), o = p.org || {};
  $('titre').textContent = 'Mon rapport de stage';
  const jours = dates.filter(d => p.jours[d]);
  const compte = {}; jours.forEach(d => p.jours[d].a.forEach(id => { compte[id] = (compte[id] || 0) + 1; }));
  const sec = (t, h) => `<h2>${t}</h2>${h}`;
  const vide = '<p style="color:#888">Non renseigné.</p>';
  $('app').innerHTML = `<div class="actions-r"><button class="pri" onclick="print()"><i class="ti ti-file-download"></i> Enregistrer en PDF ou imprimer</button><button onclick="alert('Version réelle : le PDF est joint à un courriel prêt à envoyer au tuteur.')"><i class="ti ti-mail"></i> Envoyer à mon tuteur</button></div>
  <article class="feuille" style="margin-top:12px">
    <div class="garde"><small>Baccalauréat professionnel AGOrA · Seconde · ${per.lib}</small><h1>Rapport de période de formation en milieu professionnel</h1>
      <p>${esc(o.nom || 'Organisation d’accueil')} · ${esc(o.service || 'service')}</p><p>Du ${esc(frJ(dates[0]))} au ${esc(frJ(dates[dates.length - 1]))} · ${jours.length} journée${jours.length > 1 ? 's' : ''} renseignée${jours.length > 1 ? 's' : ''}</p></div>
    ${sec('1. L’organisation d’accueil', Object.keys(o).length ? `<table><tr><th>Secteur</th><td>${esc(o.secteur)}</td></tr><tr><th>Activité principale</th><td>${esc(o.activite)}</td></tr><tr><th>Service</th><td>${esc(o.service)}</td></tr><tr><th>Fonction du tuteur</th><td>${esc(o.tuteur)}</td></tr><tr><th>Effectif</th><td>${esc(o.effectif)}</td></tr></table>` : vide)}
    ${sec('2. Les activités réalisées', Object.keys(compte).length ? `<table><tr><th>Référentiel</th><th>Activité</th><th>Jours</th></tr>${Object.keys(compte).sort((a, b) => ACT[a].sp.localeCompare(ACT[b].sp)).map(id => `<tr><td>${ACT[id].sp}</td><td>${esc(ACT[id].lib)}</td><td>${compte[id]}</td></tr>`).join('')}</table>` : vide)}
    ${sec('3. Le journal de bord', jours.length ? `<table><tr><th style="width:24%">Jour</th><th>Compte rendu</th></tr>${jours.map(d => `<tr><td>${esc(frJ(d))}</td><td>${esc(p.jours[d].t)}</td></tr>`).join('')}</table>` : vide)}
    ${sec('4. Activités décrites', p.act.filter(a => a && a.titre).map(a => `<p><b>${esc(a.titre)}</b>${a.sp ? ' · ' + esc(a.sp) : ''}</p><table>${Q5.map(([k, q]) => `<tr><th style="width:30%">${esc(q)}</th><td>${esc(a[k] || '')}</td></tr>`).join('')}</table>`).join('') || vide)}
    ${sec('5. Mes compétences', Object.keys(p.comp).length ? `<table><tr><th>Compétence</th><th>Mon positionnement</th></tr>${TRANSV.map(([k, t]) => `<tr><td>${esc(t)}</td><td>${esc(p.comp[k] || '—')}</td></tr>`).join('')}</table>` : vide)}
    ${sec('6. Bilan', Object.keys(p.bilan).length ? [['appris', 'Ce que j’ai appris'], ['reussi', 'Ce que je réussis le mieux'], ['progres', 'Ce que je dois améliorer'], ['projet', 'Mon projet']].map(([k, t]) => `<p><b>${t}.</b> ${esc(p.bilan[k] || '')}</p>`).join('') : vide)}
    <div class="sign"><div>Signature de l’élève</div><div>Visa de l’enseignant référent</div></div>
  </article>`;
}
rendre();
</script>
</body>
</html>
