<head>
<meta charset="utf-8">

<title>Pré-convention PFMP — à remplir et imprimer</title>
<!--
  Pré-convention PFMP (« Accord pour formation professionnelle en entreprise »), cité scolaire René Pellet.
  La page officielle sert de fond : ce que l'on saisit s'imprime sur les pointillés, à l'identique, sur une page A4.
  Rien n'est envoyé : la saisie reste dans ce navigateur (bouton « Effacer »). Aucune ressource Internet.
  Fabriqué le 08/10/2026 à partir de « R26CSRP-LP pre-convention pfmp.pdf ».
-->
<style>
:root{--ink:#1f2733;--muted:#6b7686;--line:#e6e1d8;--bg:#f6f3ee;--acc:#c46f1c;--acc-s:#fff3e6;--ok:#1f9d6b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.barre{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.barre h1{font-size:17px;margin:0;flex:1;min-width:200px}
.barre small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.btn{border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.btn.pri{background:var(--acc);color:#fff}.btn.sec{background:#f1ece4;color:var(--ink)}
.etat{font-size:12.5px;color:var(--ok);font-weight:600}
.grille{max-width:1180px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.grille{grid-template-columns:1fr}}
fieldset{border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px 14px;margin:0 0 12px}
legend{font-weight:700;font-size:14px;padding:0 6px;color:var(--acc)}
.champs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.champs label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.champs label.large{grid-column:1/-1}
input{border:2px solid #e3dbcd;border-radius:10px;padding:9px 10px;font:inherit;font-size:15px;width:100%;background:#fff;color:var(--ink)}
input:focus{outline:none;border-color:var(--acc)}
.horaires{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:6px 8px;align-items:center;font-size:13px}
.horaires b{font-size:13px}.horaires span.t{color:var(--muted);text-align:center}
.horaires input{padding:7px 6px;font-size:14px;text-align:center}
.horaires input.faux{border-color:#d8463c;background:#fdeceb}
.recopier{margin-top:10px;width:100%;font-size:14px}
.rappel{background:var(--acc-s);border:1px dashed #e6c39b;border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.apercu{position:sticky;top:76px;min-width:0;overflow:hidden}
.form{min-width:0}
.apercu h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.cadre{background:#fff;box-shadow:0 10px 30px -14px rgba(0,0,0,.35);overflow:hidden;max-width:595.3pt}
@media print{.apercu{overflow:visible}}
/* La feuille officielle (595 × 842 points) devient élastique : tout est en proportion de sa largeur,
   pour tenir sur une seule page A4 dans n'importe quel navigateur (Safari compris). */
.page{position:relative;width:100%;aspect-ratio:595.3/841.9;background:#fff;container-type:inline-size;overflow:hidden}
.page img{position:absolute;inset:0;width:100%;height:100%}
.val{position:absolute;height:calc(12cqw/5.953);font:calc(10cqw/5.953)/calc(12cqw/5.953) Arial,Helvetica,sans-serif;color:#000;white-space:nowrap;overflow:hidden}
.val.centre{text-align:center}
.effacer{display:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;font-size:14px}
@page{size:A4 portrait;margin:0}
@media print{
  html,body{background:#fff;margin:0;padding:0}
  .barre,.form,.apercu h2{display:none!important}
  .grille{display:block;padding:0;max-width:none;margin:0}
  .apercu{position:static}
  /* Une seule page : la feuille prend la plus grande taille qui tient dans la zone imprimable. */
  .cadre{box-shadow:none;max-width:none;width:min(99.5vw,calc(99.5vh * 595.3 / 841.9));margin:0 auto;break-inside:avoid}
}
</style>
</head>

<header class="barre">
 <h1>Pré-convention PFMP<small>Accord pour formation professionnelle en entreprise</small></h1>
 <span class="etat" id="etat"></span>
 <button class="btn sec" id="effacer">Effacer</button>
 <button class="btn pri" id="imprimer">Imprimer</button>
</header>

/* Ce qui s'imprime : une date en JJ/MM/AAAA, une heure en 8 h 30. */
function texte(c, v) {
  if (!v) return '';
  if (c.t === 'date') { const [a, m, j] = v.split('-'); return j && m && a ? j + '/' + m + '/' + a : ''; }

function listeHeures() {
