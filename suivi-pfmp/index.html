<!--
  Suivre mes élèves en PFMP (coordination-pedagogie/suivi-pfmp/)
  L'enseignant référent entre son code à 6 chiffres et suit ses élèves étape par étape.
  Firestore « coordination-pedagogie » : coordination_pfmp_suivi (+ messages, journal),
  coordination_pfmp_referents (lecture), coordination_rdv (lecture du rendez-vous de visite).
  Aucun nom : les élèves sont des codes. Le professeur principal relie les codes aux noms dans l'Atelier.
-->
<link rel="stylesheet" href="./styles.css?v=2026-10-06b">
</head>
<body>
<div id="app" class="app"><p class="chargement">Chargement…</p></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">Cette page a besoin de JavaScript.</p></noscript>
<script src="./pfmp-commun.js?v=2026-10-06a"></script>
<script type="module">
const firebaseConfig = {
  apiKey:"AIzaSyBj_GXG8ln3GAxNXxiJkT2HPSWIHJpc1lA", authDomain:"coordination-pedagogie.firebaseapp.com",
  projectId:"coordination-pedagogie", storageBucket:"coordination-pedagogie.firebasestorage.app",
  messagingSenderId:"526058585010", appId:"1:526058585010:web:ba4dd6d9c8281ba5bf02ab"
};
let F = null, db = null, erreur = null;
try {
  if (window.__FIRESTORE_SHIM__) { F = window.__FIRESTORE_SHIM__.F; db = window.__FIRESTORE_SHIM__.db; }
  else {
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js');
    F = await import('https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js');
    db = F.getFirestore(initializeApp(firebaseConfig, 'suivi-pfmp'));
  }
} catch (e) { erreur = e; }
try {
  const m = await import('./app.js?v=2026-10-06a');
  m.demarrer({ F, db, erreur });
} catch (e) {
  document.getElementById('app').innerHTML = '<p class="chargement">La page n’a pas pu se charger. Vérifiez la connexion puis rechargez.</p>';
  console.error(e);
}
</script>
</body>
